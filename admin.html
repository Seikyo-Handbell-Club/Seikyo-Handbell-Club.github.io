<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理者設定｜清教学園ハンドベル部</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#20242a;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

header{
  background:#fff;
  padding:20px;
  border-bottom:1px solid #e5e8ed;
}

h1{
  margin:0;
  text-align:center;
  font-size:21px;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0000000b;
}

.hidden{
  display:none!important;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 5px;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #d9dee7;
  border-radius:10px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:130px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#1f6feb;
  color:#fff;
  width:100%;
  margin-top:14px;
}

.secondary{
  background:#eef3fb;
}

.cancel{
  background:#f1f3f5;
  color:#4b5560;
  width:100%;
  margin-top:8px;
}

.danger{
  background:#fff0f0;
  color:#b22;
  border:1px solid #efbbbb;
}

.msg{
  padding:12px;
  border-radius:10px;
  background:#fff8df;
  color:#69520a;
  margin-top:10px;
  font-size:14px;
}

.error{
  background:#fff0f0;
  color:#9b1c1c;
}

.item{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.row button{
  flex:1;
}

.small{
  font-size:12px;
  color:#6f7882;
}

/* 部員一覧 */

.member-head{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.member-head strong{
  font-size:16px;
}

.member-actions{
  display:flex;
  gap:5px;
  margin-left:auto;
}

.member-actions button{
  padding:5px 9px;
  font-size:12px;
}

/* 変更中 */

.editing{
  border:2px solid #1f6feb;
}

/* OCR */

.preview{
  max-width:100%;
  max-height:300px;
  border-radius:10px;
  margin-top:10px;
}

.ocr-candidate{
  border:1px solid #dfe4eb;
  border-radius:12px;
  padding:10px;
  margin:10px 0;
  background:#fafbfc;
}

.ocr-candidate-top{
  display:grid;
  grid-template-columns:30px 1fr;
  gap:8px;
  align-items:center;
}

.ocr-candidate input{
  padding:8px;
  font-size:14px;
  margin-bottom:7px;
}

.ocr-candidate input[type="checkbox"]{
  width:20px;
  height:20px;
  margin:0;
}

.ocr-label{
  font-size:12px;
  color:#6f7882;
  margin-bottom:3px;
}

.ocr-field{
  margin-top:7px;
}

.ocr-delete{
  margin-top:5px;
  width:100%;
}

@media(max-width:600px){
  main{
    padding:12px;
  }
}
</style>
</head>

<body>

<header>
<h1>清教学園ハンドベル部 管理者設定</h1>
</header>

<main>

<section id="login" class="card">

<h2>管理者ログイン</h2>

<p class="small">
管理者として登録されたアカウントでログインしてください。
</p>

<label>パスワード</label>

<input
  id="password"
  type="password"
  autocomplete="current-password"
>

<button
  class="primary"
  onclick="adminLogin()"
>
ログイン
</button>

<div id="loginMsg"></div>

</section>


<section id="app" class="hidden">

<div class="card">

<button
  class="secondary"
  onclick="logout()"
>
ログアウト
</button>

</div>


<!-- 部員登録 -->

<div id="memberFormCard" class="card">

<h2 id="memberFormTitle">
部員登録
</h2>

<label>学校ID</label>

<input
  id="mid"
  autocomplete="off"
>

<label>名前</label>

<input id="mname">

<label>学年</label>

<select id="mgrade">
<option value="中学1年">中学1年</option>
<option value="中学2年">中学2年</option>
<option value="中学3年">中学3年</option>
<option value="高校1年">高校1年</option>
<option value="高校2年">高校2年</option>
</select>

<label>クラス</label>

<select id="mclass">
<option value="A">A組</option>
<option value="B">B組</option>
<option value="C">C組</option>
<option value="D">D組</option>
<option value="E">E組</option>
<option value="F">F組</option>
<option value="G">G組</option>
<option value="H">H組</option>
<option value="I">I組</option>
<option value="J">J組</option>
<option value="K">K組</option>
</select>

<button
  id="memberSubmit"
  class="primary"
  onclick="addMember()"
>
登録する
</button>

<button
  id="memberCancel"
  class="cancel hidden"
  onclick="cancelMemberEdit()"
>
変更をやめる
</button>

<div id="memberMsg"></div>

</div>


<!-- 部員一覧 -->

<div class="card">

<h2>部員一覧</h2>

<div id="members"></div>

</div>


<!-- 予定表 -->

<div class="card">

<h2>清教学園ハンドベル部予定表</h2>

<label>予定表の画像</label>

<input
  id="scheduleImage"
  type="file"
  accept="image/*"
  onchange="previewScheduleImage(event)"
>

<img
  id="schedulePreview"
  class="preview hidden"
>

<button
  class="secondary"
  style="margin-top:10px;width:100%"
  onclick="runOCR()"
>
画像から予定を読み取る
</button>

<div id="ocrMsg"></div>

<label>読み取った文字</label>

<textarea
  id="ocrText"
  placeholder="OCR結果がここに表示されます。"
></textarea>

<h3>予定候補</h3>

<div id="ocrCandidates">
<p class="small">
画像を読み取ると候補が表示されます。
</p>
</div>

<button
  class="primary"
  onclick="registerOCRCandidates()"
>
選択した予定を登録
</button>

<hr
  style="border:0;border-top:1px solid #e5e8ed;margin:20px 0"
>

<h3>手動で予定を登録</h3>

<label>日付</label>

<input
  id="sdate"
  type="date"
>

<label>時間</label>

<input
  id="stime"
  placeholder="例：15:45〜18:00"
>

<label>場所</label>

<input
  id="splace"
  placeholder="例：音楽練習室"
>

<button
  class="primary"
  onclick="saveSchedule()"
>
予定を保存
</button>

<div id="scheduleMsg"></div>

<div id="schedules"></div>

</div>

</section>

</main>


<script type="module">

/* =========================================================
   Firebase
========================================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const ADMIN_EMAIL =
"kazuma.cosmos@gmail.com";


const firebaseConfig = {

  apiKey:
  "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",

  authDomain:
  "seikyo-handbell-club.firebaseapp.com",

  databaseURL:
  "https://seikyo-handbell-club-default-rtdb.firebaseio.com",

  projectId:
  "seikyo-handbell-club",

  storageBucket:
  "seikyo-handbell-club.firebasestorage.app",

  messagingSenderId:
  "55435007971",

  appId:
  "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


const $ =
id =>
document.getElementById(id);


const esc =
s =>
String(s ?? "")
.replace(
  /[&<>"']/g,
  c =>
  ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);


let editingMemberId =
null;

let ocrCandidates =
[];


function msg(
  id,
  text,
  error=false
){

  const el =
  $(id);

  el.className =
  text
  ? (error ? "msg error" : "msg")
  : "";

  el.textContent =
  text;

}


/* =========================================================
   管理者確認
========================================================= */

async function isAdmin(){

  if(!auth.currentUser)
    return false;

  const s =
  await get(
    ref(
      db,
      "admins/" +
      auth.currentUser.uid
    )
  );

  return (
    s.exists() &&
    s.val() === true
  );

}


/* =========================================================
   ログイン状態
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(
      user &&
      await isAdmin()
    ){

      $("login")
      .classList
      .add("hidden");

      $("app")
      .classList
      .remove("hidden");

      loadMembers();
      loadSchedules();

    }
    else{

      $("login")
      .classList
      .remove("hidden");

      $("app")
      .classList
      .add("hidden");

    }

  }
);


/* =========================================================
   ログイン
========================================================= */

async function adminLogin(){

  try{

    await signInWithEmailAndPassword(
      auth,
      ADMIN_EMAIL,
      $("password").value
    );

    if(
      !(await isAdmin())
    ){

      await signOut(auth);

      msg(
        "loginMsg",
        "このアカウントは管理者として登録されていません。",
        true
      );

    }
    else{

      $("password").value="";

      msg(
        "loginMsg",
        ""
      );

    }

  }
  catch(e){

    msg(
      "loginMsg",
      "ログインできませんでした。パスワードを確認してください。",
      true
    );

  }

}


function logout(){
  signOut(auth);
}


/* =========================================================
   部員登録
========================================================= */

async function addMember(){

  if(!(await isAdmin()))
    return;

  const id =
  $("mid").value.trim();

  const name =
  $("mname").value.trim();

  const grade =
  $("mgrade").value;

  const cl =
  $("mclass").value;

  if(!id || !name || !grade || !cl){

    msg(
      "memberMsg",
      "すべて入力してください。",
      true
    );

    return;
  }

  const existing =
  await get(
    ref(
      db,
      "memberRegistrations/" + id
    )
  );

  if(existing.exists()){

    msg(
      "memberMsg",
      "その学校IDはすでに登録されています。",
      true
    );

    return;
  }

  await set(
    ref(
      db,
      "memberRegistrations/" + id
    ),
    {
      schoolId:id,
      name:name,
      grade:grade,
      className:cl,
      createdAt:Date.now()
    }
  );

  await set(
    ref(
      db,
      "memberIds/" + id
    ),
    {
      accountCreated:false
    }
  );

  clearMemberForm();

  msg(
    "memberMsg",
    "登録しました。"
  );

  loadMembers();
}


function clearMemberForm(){

  $("mid").value="";
  $("mname").value="";
  $("mgrade").value="中学1年";
  $("mclass").value="A";

}


/* =========================================================
   部員一覧
========================================================= */

async function loadMembers(){

  const s =
  await get(
    ref(
      db,
      "memberRegistrations"
    )
  );

  const v =
  s.exists()
  ? s.val()
  : {};

  const gradeOrder = {

    "中学1年":1,
    "中学2年":2,
    "中学3年":3,
    "高校1年":4,
    "高校2年":5

  };

  const classOrder =
  c =>
  String(c || "")
  .charCodeAt(0);

  const a =
  Object
  .entries(v)
  .sort(
    ([,x],[,y]) => {

      const g =
      (gradeOrder[x.grade] || 99) -
      (gradeOrder[y.grade] || 99);

      if(g)
        return g;

      const c =
      classOrder(x.className) -
      classOrder(y.className);

      if(c)
        return c;

      return String(
        x.name || ""
      ).localeCompare(
        String(y.name || ""),
        "ja"
      );

    }
  );

  $("members").innerHTML =

  a.length

  ?

  a.map(
    ([id,x]) => `

      <div class="item">

        <div class="member-head">

          <strong>
            ${esc(x.name)}
          </strong>

          <div class="member-actions">

            <button
              class="secondary"
              onclick="editMember('${esc(id)}')"
            >
              変更
            </button>

            <button
              class="danger"
              onclick="deleteMember('${esc(id)}')"
            >
              削除
            </button>

          </div>

        </div>

        <div class="small">

          ${esc(id)}
         　
          ${esc(x.grade)}
         　
          ${esc(x.className)}組

        </div>

      </div>

    `
  ).join("")

  :

  "<p class='small'>まだ登録されていません。</p>";

}


/* =========================================================
   部員変更
========================================================= */

async function editMember(id){

  const s =
  await get(
    ref(
      db,
      "memberRegistrations/" + id
    )
  );

  if(!s.exists())
    return;

  const x =
  s.val();

  editingMemberId =
  id;

  $("memberFormCard")
  .classList
  .add("editing");

  $("memberFormTitle")
  .textContent =
  "部員変更";

  $("mid").value =
  x.schoolId || id;

  $("mname").value =
  x.name || "";

  $("mgrade").value =
  x.grade || "中学1年";

  $("mclass").value =
  x.className || "A";

  $("memberSubmit")
  .textContent =
  "変更を保存";

  $("memberSubmit")
  .onclick =
  saveMemberEdit;

  $("memberCancel")
  .classList
  .remove("hidden");

  $("memberFormCard")
  .scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


/* =========================================================
   部員変更保存
========================================================= */

async function saveMemberEdit(){

  if(
    !(await isAdmin()) ||
    !editingMemberId
  )
    return;

  const oldId =
  editingMemberId;

  const newId =
  $("mid").value.trim();

  const name =
  $("mname").value.trim();

  const grade =
  $("mgrade").value;

  const cl =
  $("mclass").value;

  if(!newId || !name || !grade || !cl){

    msg(
      "memberMsg",
      "すべて入力してください。",
      true
    );

    return;
  }

  if(newId !== oldId){

    const exists =
    await get(
      ref(
        db,
        "memberRegistrations/" + newId
      )
    );

    if(exists.exists()){

      msg(
        "memberMsg",
        "変更後の学校IDはすでに登録されています。",
        true
      );

      return;
    }
  }

  const oldSnap =
  await get(
    ref(
      db,
      "memberRegistrations/" + oldId
    )
  );

  const oldData =
  oldSnap.val() || {};

  const newData = {

    ...oldData,

    schoolId:newId,
    name:name,
    grade:grade,
    className:cl,
    updatedAt:Date.now()

  };

  if(newId !== oldId){

    await set(
      ref(
        db,
        "memberRegistrations/" + newId
      ),
      newData
    );

    const memberIdSnap =
    await get(
      ref(
        db,
        "memberIds/" + oldId
      )
    );

    if(memberIdSnap.exists()){

      await set(
        ref(
          db,
          "memberIds/" + newId
        ),
        memberIdSnap.val()
      );

    }
    else{

      await set(
        ref(
          db,
          "memberIds/" + newId
        ),
        {
          accountCreated:false
        }
      );

    }

    await remove(
      ref(
        db,
        "memberRegistrations/" + oldId
      )
    );

    await remove(
      ref(
        db,
        "memberIds/" + oldId
      )
    );

  }
  else{

    await update(
      ref(
        db,
        "memberRegistrations/" + oldId
      ),
      newData
    );

  }

  cancelMemberEdit();

  msg(
    "memberMsg",
    "変更を保存しました。"
  );

  loadMembers();

}


function cancelMemberEdit(){

  editingMemberId =
  null;

  $("memberFormCard")
  .classList
  .remove("editing");

  $("memberFormTitle")
  .textContent =
  "部員登録";

  $("memberSubmit")
  .textContent =
  "登録する";

  $("memberSubmit")
  .onclick =
  addMember;

  $("memberCancel")
  .classList
  .add("hidden");

  clearMemberForm();

}


async function deleteMember(id){

  if(
    !confirm(
      "この部員登録を削除しますか？"
    )
  )
    return;

  await remove(
    ref(
      db,
      "memberRegistrations/" + id
    )
  );

  await remove(
    ref(
      db,
      "memberIds/" + id
    )
  );

  if(editingMemberId === id)
    cancelMemberEdit();

  loadMembers();

}


/* =========================================================
   画像プレビュー
========================================================= */

function previewScheduleImage(event){

  const file =
  event.target.files?.[0];

  if(!file)
    return;

  const url =
  URL.createObjectURL(file);

  $("schedulePreview").src =
  url;

  $("schedulePreview")
  .classList
  .remove("hidden");

}


/* =========================================================
   OCR用画像加工
========================================================= */

function prepareOCRImage(file){

  return new Promise(
    (resolve,reject)=>{

      const img =
      new Image();

      const url =
      URL.createObjectURL(file);

      img.onload = () => {

        const scale =
        Math.max(
          2,
          Math.min(
            3,
            2400 / img.width
          )
        );

        const canvas =
        document.createElement("canvas");

        canvas.width =
        Math.round(
          img.width * scale
        );

        canvas.height =
        Math.round(
          img.height * scale
        );

        const ctx =
        canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

        const data =
        imageData.data;

        for(
          let i=0;
          i<data.length;
          i+=4
        ){

          const r=data[i];
          const g=data[i+1];
          const b=data[i+2];

          const gray =
          0.299*r +
          0.587*g +
          0.114*b;

          const contrast =
          Math.max(
            0,
            Math.min(
              255,
              (gray - 128) * 1.35 + 128
            )
          );

          data[i]=contrast;
          data[i+1]=contrast;
          data[i+2]=contrast;

        }

        ctx.putImageData(
          imageData,
          0,
          0
        );

        canvas.toBlob(
          blob => {

            URL.revokeObjectURL(url);

            if(blob)
              resolve(blob);
            else
              reject(
                new Error("画像変換失敗")
              );

          },
          "image/png"
        );

      };

      img.onerror =
      reject;

      img.src =
      url;

    }
  );

}


/* =========================================================
   OCR
========================================================= */

async function runOCR(){

  const file =
  $("scheduleImage")
  .files?.[0];

  if(!file){

    msg(
      "ocrMsg",
      "先に予定表の画像を選択してください。",
      true
    );

    return;
  }

  msg(
    "ocrMsg",
    "画像を準備しています…"
  );

  try{

    const processed =
    await prepareOCRImage(file);

    msg(
      "ocrMsg",
      "予定表を読み取っています。少し待ってください。"
    );

    const result =
    await Tesseract.recognize(
      processed,
      "jpn+eng",
      {
        logger:m=>{

          if(
            m.status === "recognizing text"
          ){

            msg(
              "ocrMsg",
              "画像を読み取っています… " +
              Math.round(
                (m.progress || 0) * 100
              ) +
              "%"
            );

          }

        }
      }
    );

    const text =
    result.data.text || "";

    $("ocrText").value =
    text;

    /*
     * 表形式専用の解析
     */
    ocrCandidates =
    parseScheduleTable(
      result
    );

    /*
     * それでも取れない場合だけ
     * 通常のテキスト解析
     */
    if(
      !ocrCandidates.length
    ){

      ocrCandidates =
      parseScheduleCandidatesFromText(
        text
      );

    }

    renderOCRCandidates();

    if(
      ocrCandidates.length
    ){

      msg(
        "ocrMsg",
        "読み取り完了。候補を確認してください。"
      );

    }
    else{

      msg(
        "ocrMsg",
        "予定を自動認識できませんでした。手動登録を使ってください。",
        true
      );

    }

  }
  catch(e){

    console.error(e);

    msg(
      "ocrMsg",
      "画像を読み取れませんでした。もう一度試してください。",
      true
    );

  }

}


/* =========================================================
   日付抽出
========================================================= */

function extractDateFromText(text){

  if(!text)
    return null;

  let m;

  m =
  text.match(
    /(20\d{2})\s*[\/\-年]\s*(\d{1,2})\s*[\/\-月]\s*(\d{1,2})日?/
  );

  if(m){

    return {
      year:Number(m[1]),
      month:Number(m[2]),
      day:Number(m[3])
    };

  }

  m =
  text.match(
    /(\d{1,2})\s*月\s*(\d{1,2})\s*日/
  );

  if(m){

    return {
      year:new Date().getFullYear(),
      month:Number(m[1]),
      day:Number(m[2])
    };

  }

  m =
  text.match(
    /(\d{1,2})\s*月\s*(\d{1,2})/
  );

  if(m){

    return {
      year:new Date().getFullYear(),
      month:Number(m[1]),
      day:Number(m[2])
    };

  }

  return null;

}


/* =========================================================
   月を全体から探す
========================================================= */

function extractMonthFromWholeText(text){

  const m =
  String(text || "")
  .match(
    /(\d{1,2})\s*月/
  );

  if(m){

    const month =
    Number(m[1]);

    if(
      month >= 1 &&
      month <= 12
    )
      return month;

  }

  return new Date().getMonth()+1;

}


/* =========================================================
   時間抽出
========================================================= */

function extractTime(text){

  if(!text)
    return "";

  let m;

  m =
  text.match(
    /(\d{1,2})\s*[:：]\s*(\d{2})\s*[〜~～\-－ー]\s*(\d{1,2})\s*[:：]\s*(\d{2})/
  );

  if(m){

    return (
      String(Number(m[1])).padStart(2,"0") +
      ":" +
      m[2] +
      "〜" +
      String(Number(m[3])).padStart(2,"0") +
      ":" +
      m[4]
    );

  }

  m =
  text.match(
    /(\d{1,2})\s*[:：]\s*(\d{2}).{0,15}?(\d{1,2})\s*[:：]\s*(\d{2})/
  );

  if(m){

    return (
      String(Number(m[1])).padStart(2,"0") +
      ":" +
      m[2] +
      "〜" +
      String(Number(m[3])).padStart(2,"0") +
      ":" +
      m[4]
    );

  }

  return "";

}


/* =========================================================
   場所
========================================================= */

function normalizePlace(place){

  if(!place)
    return "";

  const s =
  place
  .replace(/\s+/g,"");

  if(
    /音楽.*練習室/.test(s) ||
    /音楽練習室/.test(s) ||
    /練習室/.test(s)
  ){

    return "音楽練習室";

  }

  if(
    /文化祭/.test(s)
  ){

    return "文化祭";

  }

  return place.trim();

}


/* =========================================================
   数字だけから日付の日を取得
========================================================= */

function extractDayNumber(text){

  if(!text)
    return null;

  const s =
  String(text)
  .replace(
    /[^\d]/g,
    " "
  )
  .trim();

  if(!s)
    return null;

  const nums =
  s
  .split(/\s+/)
  .map(Number)
  .filter(
    n =>
    n >= 1 &&
    n <= 31
  );

  if(
    nums.length === 1
  )
    return nums[0];

  return null;

}


/* =========================================================
   OCRの単語から表を解析
========================================================= */

function parseScheduleTable(result){

  const words =
  result?.data?.words || [];

  if(!words.length)
    return [];

  const allText =
  words
  .map(w => w.text || "")
  .join(" ");

  const month =
  extractMonthFromWholeText(
    allText
  );

  const usable =
  words
  .filter(
    w =>
      w.text &&
      w.text.trim() &&
      Number(w.confidence ?? 100) > 15
  )
  .map(w => {

    const b =
    w.bbox || {};

    const left =
    Number(b.x0 || 0);

    const right =
    Number(b.x1 || 0);

    const top =
    Number(b.y0 || 0);

    const bottom =
    Number(b.y1 || 0);

    return {

      text:
      w.text.trim(),

      left,
      right,
      top,
      bottom,

      centerX:
      (left + right) / 2,

      centerY:
      (top + bottom) / 2

    };

  });

  if(!usable.length)
    return [];

  /*
   * 文字の高さを基準に行を作る
   */
  const heights =
  usable
  .map(
    w =>
    Math.max(
      5,
      w.bottom-w.top
    )
  )
  .sort(
    (a,b)=>a-b
  );

  const medianHeight =
  heights[
    Math.floor(
      heights.length/2
    )
  ] || 30;

  const rowTolerance =
  Math.max(
    12,
    medianHeight * 0.9
  );

  usable.sort(
    (a,b) =>
    a.centerY-b.centerY
  );

  const rows=[];

  for(
    const word of usable
  ){

    let best=null;

    let bestDiff=Infinity;

    for(
      const row of rows
    ){

      const diff =
      Math.abs(
        row.centerY-word.centerY
      );

      if(
        diff <= rowTolerance &&
        diff < bestDiff
      ){

        best=row;
        bestDiff=diff;

      }

    }

    if(!best){

      best={
        centerY:word.centerY,
        words:[]
      };

      rows.push(best);

    }

    best.words.push(word);

    best.centerY =
    best.words.reduce(
      (sum,w)=>
      sum+w.centerY,
      0
    ) /
    best.words.length;

  }


  const candidates=[];

  /*
   * 表の横幅を推定
   */
  const minX =
  Math.min(
    ...usable.map(w=>w.left)
  );

  const maxX =
  Math.max(
    ...usable.map(w=>w.right)
  );

  const width =
  maxX-minX;

  /*
   * 左側約25%を日付列として扱う
   */
  const dateColumnEnd =
  minX + width*0.27;


  for(
    const row of rows
  ){

    const sorted =
    row.words.sort(
      (a,b)=>
      a.left-b.left
    );

    const rowText =
    sorted
    .map(w=>w.text)
    .join(" ");


    /*
     * 表の見出し行を除外
     */
    if(
      /活動時間|場所|練習曲|その他|備考/.test(
        rowText
      )
    )
      continue;


    /*
     * まず「9月1日」などが直接読めた場合
     */
    let date =
    extractDateFromText(
      rowText
    );


    /*
     * 読めなかった場合、
     * 左端の日付列から「1」「2」…を探す
     */
    if(!date){

      const dateWords =
      sorted.filter(
        w =>
        w.left <= dateColumnEnd
      );

      for(
        const w of dateWords
      ){

        const day =
        extractDayNumber(
          w.text
        );

        if(
          day !== null
        ){

          date={
            year:new Date().getFullYear(),
            month:month,
            day:day
          };

          break;

        }

      }

    }


    if(!date)
      continue;


    /*
     * 日付としてあり得ないものを除外
     */
    if(
      date.month < 1 ||
      date.month > 12 ||
      date.day < 1 ||
      date.day > 31
    )
      continue;


    /*
     * 時間を行全体から探す
     */
    const time =
    extractTime(
      rowText.replace(/\s+/g,"")
    );


    /*
     * 場所を探す。
     *
     * 今回の予定表で特に重要な
     * 「音楽練習室」を直接探す。
     */
    let place="";


    if(
      /音楽.{0,4}練習室/.test(
        rowText.replace(/\s/g,"")
      )
    ){

      place="音楽練習室";

    }
    else if(
      /練習室/.test(
        rowText.replace(/\s/g,"")
      )
    ){

      place="音楽練習室";

    }
    else{

      /*
       * 時間の右側にある文字を
       * 場所候補として使う
       */
      let timeIndex=-1;

      for(
        let i=0;
        i<sorted.length;
        i++
      ){

        const combined =
        sorted
        .slice(i,i+5)
        .map(w=>w.text)
        .join("");

        if(
          extractTime(combined)
        ){

          timeIndex=i;
          break;

        }

      }

      if(
        timeIndex>=0
      ){

        const afterTime =
        sorted
        .slice(timeIndex+1)
        .map(w=>w.text)
        .join(" ");

        place =
        normalizePlace(
          afterTime
        );

      }

    }


    /*
     * 文化祭などの文字は場所ではないので、
     * 今は場所欄には入れない。
     */
    if(
      /文化祭/.test(place)
    ){

      place="";

    }


    candidates.push({

      selected:true,

      date:
      formatDate(
        date.year,
        date.month,
        date.day
      ),

      time:
      time,

      place:
      place

    });

  }


  return uniqueCandidates(
    candidates
  );

}


/* =========================================================
   テキスト解析（予備）
========================================================= */

function parseScheduleCandidatesFromText(text){

  const lines =
  text
  .split(/\r?\n/)
  .map(
    x=>x.trim()
  )
  .filter(Boolean);

  const found=[];

  const month =
  extractMonthFromWholeText(
    text
  );

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
    lines[i];

    let date =
    extractDateFromText(
      line
    );

    /*
     * 「1 火」のような表の場合
     */
    if(!date){

      const day =
      extractDayNumber(
        line
      );

      if(
        day !== null
      ){

        date={
          year:new Date().getFullYear(),
          month:month,
          day:day
        };

      }

    }

    if(!date)
      continue;

    let combined =
    line;

    for(
      let j=1;
      j<=3;
      j++
    ){

      if(lines[i+j]){

        combined +=
        " " +
        lines[i+j];

      }

    }

    const time =
    extractTime(
      combined.replace(/\s/g,"")
    );

    let place="";

    if(
      /音楽.{0,4}練習室/.test(
        combined.replace(/\s/g,"")
      )
    ){

      place="音楽練習室";

    }
    else if(
      /練習室/.test(
        combined.replace(/\s/g,"")
      )
    ){

      place="音楽練習室";

    }

    found.push({

      selected:true,

      date:
      formatDate(
        date.year,
        date.month,
        date.day
      ),

      time:
      time,

      place:
      place

    });

  }

  return uniqueCandidates(
    found
  );

}


/* =========================================================
   日付フォーマット
========================================================= */

function formatDate(
  year,
  month,
  day
){

  return (
    String(year) +
    "-" +
    String(month).padStart(2,"0") +
    "-" +
    String(day).padStart(2,"0")
  );

}


/* =========================================================
   重複削除
========================================================= */

function uniqueCandidates(list){

  const result=[];

  const seen =
  new Set();

  for(
    const x of list
  ){

    const key =
    x.date +
    "|" +
    x.time +
    "|" +
    x.place;

    if(
      seen.has(key)
    )
      continue;

    seen.add(key);

    result.push(x);

  }

  result.sort(
    (a,b)=>
    a.date.localeCompare(
      b.date
    )
  );

  return result;

}


/* =========================================================
   OCR候補表示
========================================================= */

function renderOCRCandidates(){

  const el =
  $("ocrCandidates");

  if(
    !ocrCandidates.length
  ){

    el.innerHTML =
    "<p class='small'>予定を自動認識できませんでした。手動登録を使ってください。</p>";

    return;

  }

  el.innerHTML =
  ocrCandidates
  .map(
    (x,i)=>`

      <div class="ocr-candidate">

        <div class="ocr-candidate-top">

          <input
            type="checkbox"
            ${x.selected ? "checked" : ""}
            onchange="updateOCRCandidate(${i},'selected',this.checked)"
          >

          <strong>
            ${esc(x.date)}
          </strong>

        </div>

        <div class="ocr-field">

          <div class="ocr-label">
            日付
          </div>

          <input
            type="date"
            value="${esc(x.date)}"
            onchange="updateOCRCandidate(${i},'date',this.value)"
          >

        </div>

        <div class="ocr-field">

          <div class="ocr-label">
            部活の時間
          </div>

          <input
            placeholder="例：15:45〜18:00"
            value="${esc(x.time)}"
            onchange="updateOCRCandidate(${i},'time',this.value)"
          >

        </div>

        <div class="ocr-field">

          <div class="ocr-label">
            場所
          </div>

          <input
            placeholder="例：音楽練習室"
            value="${esc(x.place)}"
            onchange="updateOCRCandidate(${i},'place',this.value)"
          >

        </div>

        <button
          class="danger ocr-delete"
          onclick="removeOCRCandidate(${i})"
        >
          この予定を削除
        </button>

      </div>

    `
  )
  .join("");

}


function updateOCRCandidate(
  index,
  field,
  value
){

  if(!ocrCandidates[index])
    return;

  ocrCandidates[index][field]=
  value;

}


function removeOCRCandidate(i){

  ocrCandidates.splice(
    i,
    1
  );

  renderOCRCandidates();

}


/* =========================================================
   OCR予定登録
========================================================= */

async function registerOCRCandidates(){

  if(!(await isAdmin()))
    return;

  const selected =
  ocrCandidates.filter(
    x =>
      x.selected &&
      x.date
  );

  if(!selected.length){

    msg(
      "ocrMsg",
      "登録する予定を選択してください。",
      true
    );

    return;
  }

  for(
    const x of selected
  ){

    await set(
      ref(
        db,
        "schedules/" +
        x.date
      ),
      {

        time:
        x.time || "",

        place:
        x.place || "",

        updatedAt:
        Date.now()

      }
    );

  }

  msg(
    "ocrMsg",
    selected.length +
    "件の予定を登録しました。"
  );

  loadSchedules();

}


/* =========================================================
   手動予定登録
========================================================= */

async function saveSchedule(){

  if(!(await isAdmin()))
    return;

  const d =
  $("sdate").value;

  const t =
  $("stime").value.trim();

  const p =
  $("splace").value.trim();

  if(!d){

    msg(
      "scheduleMsg",
      "日付を入力してください。",
      true
    );

    return;
  }

  await set(
    ref(
      db,
      "schedules/" + d
    ),
    {

      time:t,

      place:p,

      updatedAt:
      Date.now()

    }
  );

  msg(
    "scheduleMsg",
    "保存しました。"
  );

  loadSchedules();

}


/* =========================================================
   予定一覧
========================================================= */

async function loadSchedules(){

  const s =
  await get(
    ref(
      db,
      "schedules"
    )
  );

  const v =
  s.exists()
  ? s.val()
  : {};

  const a =
  Object
  .entries(v)
  .sort();

  $("schedules").innerHTML =

  a.length

  ?

  a.map(
    ([d,x]) => `

      <div class="item">

        <strong>
          ${esc(d)}
        </strong>

        <br>

        ${esc(x.time || "")}

        <br>

        ${esc(x.place || "")}

        <div class="row">

          <button
            onclick="editSchedule('${esc(d)}')"
          >
            変更
          </button>

          <button
            class="danger"
            onclick="deleteSchedule('${esc(d)}')"
          >
            削除
          </button>

        </div>

      </div>

    `
  ).join("")

  :

  "<p class='small'>予定はありません。</p>";

}


/* =========================================================
   予定変更
========================================================= */

async function editSchedule(d){

  const s =
  await get(
    ref(
      db,
      "schedules/" + d
    )
  );

  if(!s.exists())
    return;

  const x =
  s.val();

  $("sdate").value=d;

  $("stime").value =
  x.time || "";

  $("splace").value =
  x.place || "";

  $("sdate")
  .scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* =========================================================
   予定削除
========================================================= */

async function deleteSchedule(d){

  if(
    confirm(
      d +
      "の予定を削除しますか？"
    )
  ){

    await remove(
      ref(
        db,
        "schedules/" + d
      )
    );

    loadSchedules();

  }

}
