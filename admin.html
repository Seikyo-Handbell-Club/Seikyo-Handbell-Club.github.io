<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>管理者設定｜清教学園ハンドベル部</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#20242a;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

header{
  background:#fff;
  padding:20px;
  border-bottom:1px solid #e5e8ed;
}

h1{
  margin:0;
  text-align:center;
  font-size:21px;
}

main{
  max-width:850px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0000000b;
}

.hidden{
  display:none!important;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 5px;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #d9dee7;
  border-radius:10px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:80px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
  font-size:14px;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.primary{
  background:#1f6feb;
  color:#fff;
  width:100%;
  margin-top:14px;
}

.secondary{
  background:#eef3fb;
  color:#20242a;
}

.danger{
  background:#fff0f0;
  color:#b22;
  border:1px solid #efbbbb;
}

.msg{
  padding:12px;
  border-radius:10px;
  background:#fff8df;
  color:#69520a;
  margin-top:10px;
  font-size:14px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.error{
  background:#fff0f0;
  color:#9b1c1c;
}

.success{
  background:#effaf1;
  color:#176b2c;
}

.item{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.row button{
  flex:1;
}

.small{
  font-size:12px;
  color:#6f7882;
}

.section-title{
  margin-top:0;
  margin-bottom:4px;
}

.sub-title{
  margin-top:0;
  color:#68717d;
  font-size:13px;
}

.pdf-box{
  border:2px dashed #cfd7e3;
  border-radius:14px;
  padding:16px;
  background:#fafbfd;
  margin-top:10px;
}

.pdf-box input{
  background:#fff;
}

.candidate{
  border:1px solid #dfe4eb;
  border-radius:14px;
  padding:14px;
  margin-top:12px;
  background:#fff;
}

.candidate-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.candidate-head input[type="checkbox"]{
  width:20px;
  height:20px;
  flex:none;
}

.candidate-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.candidate-grid label{
  margin:0;
  font-size:12px;
  color:#66717e;
}

.candidate-grid input,
.candidate-grid textarea{
  margin-top:4px;
  font-size:14px;
}

.pdf-status{
  margin-top:10px;
  white-space:pre-wrap;
}

.loading{
  opacity:.7;
  pointer-events:none;
}

.divider{
  height:1px;
  background:#e5e8ed;
  margin:20px 0;
}

/* =========================
   追加：ログアウト右上
========================= */

.app-topbar{
  display:flex;
  justify-content:flex-end;
  margin-bottom:16px;
}

.logout-button{
  background:#f5f7fa;
  color:#68717d;
  border:1px solid #dfe4eb;
  padding:7px 11px;
  border-radius:8px;
  font-size:13px;
}

/* =========================
   追加：一覧の右側ボタン
========================= */

.item-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.item-name{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
  min-width:0;
}

.item-actions{
  display:flex;
  align-items:center;
  gap:5px;
  flex-shrink:0;
}

.item-actions button{
  flex:none;
  padding:5px 8px;
  font-size:12px;
  font-weight:600;
  border-radius:7px;
  background:#f7f8fa;
  color:#68717d;
  border:1px solid #e1e5ea;
}

.item-actions button:hover{
  background:#eef1f5;
}

.item-actions .delete-button{
  background:transparent;
  color:#a06a6a;
  border-color:#ead6d6;
}

.item-actions .delete-button:hover{
  background:#fff4f4;
}

/* =========================
   特殊予定
========================= */

.special-note{
  padding:10px 12px;
  border-radius:10px;
  background:#f5f7fb;
  margin-top:10px;
  font-size:13px;
  color:#59636e;
}

@media(max-width:600px){

  .candidate-grid{
    grid-template-columns:1fr;
  }

  .item-main{
    align-items:flex-start;
  }

  .item-actions{
    margin-left:auto;
  }

  .item-actions button{
    padding:5px 7px;
  }

}
</style>
</head>

<body>

<header>
  <h1>清教学園ハンドベル部 管理者設定</h1>
</header>

<main>

<!-- =========================
     ログイン
========================= -->

<section id="login" class="card">

  <h2 class="section-title">
    管理者ログイン
  </h2>

  <p class="small">
    管理者用パスワードを入力してください。
  </p>

  <label for="password">
    パスワード
  </label>

    id="password"
    type="password"

  >

    id="loginButton"
    class="primary"
    type="button"

    ログイン
  </button>

  <div id="loginMsg"></div>

</section>

<!-- =========================
     管理画面
========================= -->

<section id="app" class="hidden">

  <!-- ログアウト -->

  <div class="app-topbar">

    <button
      id="logoutButton"
      class="logout-button"
      type="button"
    >
      ログアウト
    </button>

  </div>


  <!-- =========================
       清教学園ハンドベル部予定表
  ========================== -->

  <div class="card">

    <h2 class="section-title">
      清教学園ハンドベル部予定表
    </h2>

    <p class="sub-title">
      PDFから予定を読み込み、確認して登録できます。
    </p>

    <div class="pdf-box">

      <label for="schedulePdf">
        予定表PDF

        id="schedulePdf"

      >

      <button

      </button>

      <div

    </div>

    <div
      id="pdfCandidates"
      class="hidden"
    >

      <div class="divider"></div>

      <h3>
        読み取った予定
      </h3>

      <p class="small">

        「練習曲の目安」は読み取りません。

      <div id="candidateList"></div>

      <button

        type="button"
      >
        選択した予定を登録

      <div id="candidateMsg"></div>

  </div>


  <!-- =========================
       手動予定登録
  ========================== -->

  <div class="card">

    <h2 class="section-title">
      予定を手動で登録
    </h2>

    <label for="stype">
      予定の種類
    </label>

    <select id="stype">

      <option value="normal">
        通常の部活予定
      </option>

      <option value="exam">
        試験期間
      </option>

      <option value="concert">
        演奏会
      </option>

      <option value="club">
        部活がある日
      </option>

      <option value="schoolHoliday">
        学校が休みの日
      </option>

      <option value="event">
        その他のイベント
      </option>

    <!-- 通常の予定 -->

    <div id="normalScheduleFields">

      <label for="sdate">
        日付
      </label>

      >

        時間
      </label>

      <input
        id="stime"
        type="text"
        placeholder="例：15:45〜18:00"
      >

      <label for="splace">
        場所
      </label>

      <input
        id="splace"

        placeholder="例：音楽練習室"

    <!-- 試験期間 -->

      <label for="examStartDate">

      <input

      <label for="examEndDate">

      <input
        id="examEndDate"
        type="date"
      >

    <!-- 演奏会 -->

    <div

      class="hidden"
    >

      <label for="concertDate">
        日付
      </label>

        id="concertDate"
        type="date"

      <label for="concertTime">

      </label>

      <input
        id="concertTime"
        type="text"

      <input

      <label for="concertPlace">
        場所
      </label>

      <input
        id="concertPlace"
        type="text"
        placeholder="例：講堂"
      >

      <label for="concertNote">
        その他・備考
      </label>

      <textarea

        placeholder="必要な場合のみ入力"

    </div>


    <!-- 部活がある日 -->

    <div
      id="clubScheduleFields"
      class="hidden"
    >

      <label for="clubDate">

      </label>

      <input
        id="clubDate"
        type="date"
      >

    </div>


    <!-- 学校が休みの日 -->

    <div
      id="schoolHolidayScheduleFields"
      class="hidden"
    >

      <label for="schoolHolidayStartDate">
        開始日
      </label>

      <input
        id="schoolHolidayStartDate"
        type="date"
      >

      <label for="schoolHolidayEndDate">
        終了日
      </label>

      <input
        id="schoolHolidayEndDate"
        type="date"
      >

    </div>


    <!-- その他のイベント -->

    <div

      class="hidden"
    >

      <label for="eventDate">
        日付
      </label>

      <input
        id="eventDate"
        type="date"
      >

      <label for="eventTime">
        時間
      </label>

      <input
        id="eventTime"
        type="text"
        placeholder="例：10:00〜12:00"
      >

      <label for="eventTitle">
        イベント名
      </label>

      <input
        id="eventTitle"
        type="text"
        placeholder="例：部活動説明会"
      >

      <label for="eventPlace">
        場所
      </label>

      <input
        id="eventPlace"
        type="text"
        placeholder="例：講堂"
      >

      <label for="eventNote">
        その他・備考
      </label>

      <textarea
        id="eventNote"
        placeholder="必要な場合のみ入力"
      ></textarea>

    </div>


    <button
      id="saveScheduleButton"

    >
      予定を保存

    <div id="scheduleMsg"></div>

  </div>


  <!-- =========================
       部員登録
  ========================== -->

  <div class="card">

    <h2 class="section-title">
      部員登録
    </h2>

    <p class="sub-title">

    </p>

        読み込み中...

    </div>

  <!-- =========================
       登録済み予定
  ========================== -->

    <h2 class="section-title">
      登録済みの予定

    <div id="schedules">

        読み込み中...

</main>

<script type="module">

/* =========================================
   Firebase
========================================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================================
   Firebase設定
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",

  authDomain:
    "seikyo-handbell-club.firebaseapp.com",

  databaseURL:
    "https://seikyo-handbell-club-default-rtdb.firebaseio.com",

  projectId:
    "seikyo-handbell-club",

  storageBucket:
    "seikyo-handbell-club.firebasestorage.app",

  messagingSenderId:
    "55435007971",

  appId:
    "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"

};


/* =========================================
   管理者アカウント
========================================= */

const ADMIN_EMAIL =
  "kazuma.cosmos@gmail.com";


/* =========================================
   Firebase初期化
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);


/* =========================================
   DOM
========================================= */

const $ =
  id => document.getElementById(id);


/* =========================================
   HTMLエスケープ
========================================= */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


/* =========================================
   メッセージ
========================================= */

function message(
  id,
  text,
  type = ""
){

  const el =
    $(id);

  if(!el){
    return;
  }

  el.className =
    text
      ? `msg ${type}`
      : "";

  el.textContent =
    text || "";

}


/* =========================================
   管理者権限確認
========================================= */

async function isAdmin(){

  if(!auth.currentUser){
    return false;
  }

  const snapshot =
    await get(
      ref(
        db,
        "admins/" +
        auth.currentUser.uid
      )
    );

  return (
    snapshot.exists() &&
    snapshot.val() === true
  );

}


/* =========================================
   認証状態
========================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      $("login")
        .classList
        .remove("hidden");

      $("app")
        .classList
        .add("hidden");

      return;

    }

    try{

      const admin =
        await isAdmin();

      if(!admin){

        $("login")
          .classList
          .remove("hidden");

        $("app")
          .classList
          .add("hidden");

        return;

      }

      $("login")
        .classList
        .add("hidden");

      $("app")
        .classList
        .remove("hidden");

      $("password").value = "";

      await loadMembers();

      await loadSchedules();

    }catch(error){

      console.error(
        "認証状態確認エラー:",
        error
      );

      $("login")
        .classList
        .remove("hidden");

      $("app")
        .classList
        .add("hidden");

      message(
        "loginMsg",
        "管理者権限の確認に失敗しました。\n\n" +
        "エラーコード: " +
        (error.code || "不明") +
        "\n" +
        "詳細: " +
        (error.message || "不明"),
        "error"
      );

    }

  }
);


/* =========================================
   管理者ログイン
========================================= */

async function adminLogin(){

  const password =
    $("password").value;

  message(
    "loginMsg",
    ""
  );

  if(!password){

    message(
      "loginMsg",
      "パスワードを入力してください。",
      "error"
    );

    return;

  }

  const button =
    $("loginButton");

  button.disabled = true;

  button.textContent =
    "ログイン中...";

  try{

    const credential =
      await signInWithEmailAndPassword(
        auth,
        ADMIN_EMAIL,
        password
      );

    console.log(
      "Authentication成功",
      credential.user.uid,
      credential.user.email
    );

    let adminSnapshot;

    try{

      adminSnapshot =
        await get(
          ref(
            db,
            "admins/" +
            credential.user.uid
          )
        );

    }catch(error){

      console.error(
        "admins読み込みエラー:",
        error
      );

      await signOut(auth);

      message(
        "loginMsg",
        "パスワードは正しい可能性がありますが、\n" +
        "管理者権限の確認に失敗しました。\n\n" +
        "エラーコード: " +
        (error.code || "不明") +
        "\n" +
        "詳細: " +
        (error.message || "不明"),
        "error"
      );

      return;

    }

    if(
      !adminSnapshot.exists() ||
      adminSnapshot.val() !== true
    ){

      await signOut(auth);

      message(
        "loginMsg",
        "ログインは成功しましたが、\n" +
        "このアカウントは管理者として登録されていません。\n\n" +
        "UID:\n" +
        credential.user.uid +
        "\n\n" +
        "Firebase Realtime Database の\n" +
        "admins/" +
        credential.user.uid +
        "\n" +
        "を確認してください。",
        "error"
      );

      return;

    }

    $("login")
      .classList
      .add("hidden");

    $("app")
      .classList
      .remove("hidden");

    $("password").value = "";

    message(
      "loginMsg",
      "ログインしました。",
      "success"
    );

    await loadMembers();

    await loadSchedules();

  }catch(error){

    console.error(
      "Firebase Authenticationログインエラー:",
      error
    );

    let text =
      "ログインできませんでした。\n\n";

    text +=
      "エラーコード: " +
      (error.code || "不明") +
      "\n";

    text +=
      "詳細: " +
      (error.message || "不明");

    message(
      "loginMsg",
      text,
      "error"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "ログイン";

  }

}


/* =========================================
   ログアウト
========================================= */

async function logout(){

  try{

    await signOut(auth);

  }catch(error){

    console.error(
      "ログアウトエラー:",
      error
    );

  }

}


/* =========================================
   部員登録
========================================= */

async function addMember(){

  if(!(await isAdmin())){
    return;
  }

  const id =
    $("mid")
      .value
      .trim();

  "中学3年":2,
  "高校1年":3,
  "高校2年":4

};


/* =========================================

const classOrder = {

  A:0,
  B:1,
  C:2,
  D:3,
  E:4,
  F:5,
  G:6,
  H:7,
  I:8,

   部員一覧
========================================= */

async function loadMembers(){

  const snapshot =
    await get(
      ref(
        db,
        "memberRegistrations"
      )
    );

  const data =
    snapshot.exists()
      ? snapshot.val()
      : {};

  const members =
    Object.entries(data);

  members.sort(
    ([,a],[,b]) => {

      const gradeDiff =
        (
          gradeOrder[a.grade] ?? 99
        ) -
        (
          gradeOrder[b.grade] ?? 99
        );

      if(gradeDiff !== 0){
        return gradeDiff;
      }

      const classDiff =
        (
          classOrder[a.className] ?? 99
        ) -
        (
          classOrder[b.className] ?? 99
        );

      if(classDiff !== 0){
        return classDiff;
      }

      return String(
        a.name || ""
      ).localeCompare(
        String(
          b.name || ""
        ),
        "ja"
      );

    }
  );

  if(!members.length){

    $("members").innerHTML =
      "<p class='small'>まだ登録されていません。</p>";

    return;

  }

  $("members").innerHTML =
    members
      .map(
        ([id,x]) => `

          <div class="item">

            <div class="item-main">

              <div class="item-name">

                <strong>
                  ${esc(x.name)}
                </strong>

                <span class="small">
                  （${esc(id)}）
                </span>

              </div>

              <div class="item-actions">

                <button
                  onclick="editMember('${esc(id)}')"
                >
                  変更
                </button>

                <button
                  class="delete-button"
                  onclick="deleteMember('${esc(id)}')"
                >
                  削除
                </button>

              </div>

            </div>

            <div class="small">

              ${esc(x.grade)}
              ・
              ${esc(x.className)}組

            </div>

          </div>

        `
      )
      .join("");

}

async function editMember(id){

  if(!(await isAdmin())){
    return;
  }

  const snapshot =
    await get(
      ref(
        db,
        "memberRegistrations/" +
        id
      )
    );

  if(!snapshot.exists()){
    return;
  }

  const data =
    snapshot.val();

  const name =
    prompt(
      "名前",
      data.name || ""
    );

  if(name === null){
    return;
  }

  const grade =
    prompt(
      "学年\n\n中学1年\n中学2年\n中学3年\n高校1年\n高校2年",
      data.grade || ""
    );

  if(grade === null){
    return;
  }

  const className =
    prompt(
      "クラス（A〜K）",
      data.className || ""
    );

  if(className === null){
    return;
  }

  const normalizedClass =
    className
      .replace("組","")
      .trim()
      .toUpperCase();

  if(
    !Object.prototype.hasOwnProperty.call(
      gradeOrder,
      grade
    )
  ){

    alert(
      "学年は「中学1年」〜「高校2年」で入力してください。"
    );

    return;

  }

  if(
    !Object.prototype.hasOwnProperty.call(
      classOrder,
      normalizedClass
    )
  ){

    alert(
      "クラスはA〜Kで入力してください。"
    );

    return;

  }

  await update(
    ref(
      db,
      "memberRegistrations/" +
      id
    ),
    {
      name:name.trim(),
      grade:grade,
      className:normalizedClass
    }
  );

  await loadMembers();

========================================= */

let pdfjsLib = null;

async function getPdfJs(){

  if(pdfjsLib){
    return pdfjsLib;
  }

  const module =
    await import(
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    );

  module.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

  pdfjsLib =
    module;

  return pdfjsLib;

}


/* =========================================
   PDFテキスト抽出
========================================= */

async function extractPdfLines(file){

  const pdf =
    await getPdfJs();

  const buffer =
    await file.arrayBuffer();

  const document =
    await pdf.getDocument({
      data:buffer
    }).promise;

  const allLines = [];

  for(
    let pageNumber = 1;
    pageNumber <= document.numPages;
    pageNumber++
  ){

    const page =
      await document.getPage(
        pageNumber
      );

    const content =
      await page.getTextContent();

    const items =
      content.items
        .filter(
          item =>
            item.str &&
            item.str.trim()
        )
        .map(
          item => {

            const transform =
              item.transform || [];

            return {

              text:
                item.str.trim(),

              x:
                Number(
                  transform[4] || 0
                ),

              y:
                Number(
                  transform[5] || 0
                ),

              width:
                Number(
                  item.width || 0
                )

            };

          }
        );

    items.sort(
      (a,b) => {

        if(
          Math.abs(
            a.y - b.y
          ) > 3
        ){

          return b.y - a.y;

        }

        return a.x - b.x;

      }
    );

    const rows = [];

    for(const item of items){

      let row =
        rows.find(
          r =>
            Math.abs(
              r.y - item.y
            ) < 4
        );

      if(!row){

        row = {

          y:item.y,
          items:[]

        };

        rows.push(row);

      }

      row.items.push(item);

    }

    rows.sort(
      (a,b) =>
        b.y - a.y
    );

    for(const row of rows){

      row.items.sort(
        (a,b) =>
          a.x - b.x
      );

      const text =
        row.items
          .map(
            item =>
              item.text
          )
          .join(" ")
          .replace(
            /\s+/g,
            " "
          )
          .trim();

      if(text){

        allLines.push({

          page:pageNumber,
          y:row.y,
          items:row.items,
          text:text

        });

      }

    }

  }

  return allLines;

}


/* =========================================
   PDF予定解析
========================================= */

function parseScheduleLines(lines){

  let month = null;

  for(const line of lines){

    if(
      line.text.includes("練習曲")
    ){
      continue;
    }

    const match =
      line.text.match(
        /(\d{1,2})月/
      );

    if(match){

      const m =
        Number(match[1]);

      if(
        m >= 1 &&
        m <= 12
      ){

        month = m;

        break;

      }

    }

  }

  if(!month){

    month =
      new Date()
        .getMonth() + 1;

  }

  const year =
    new Date()
      .getFullYear();

  const candidates = [];

  let currentDate = null;

  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const raw =
      lines[i].text;

    if(
      raw.includes("練習曲")
    ){

      continue;

    }

    let dateMatch =
      raw.match(
        /(\d{1,2})月\s*(\d{1,2})日?/
      );

    if(!dateMatch){

      dateMatch =
        raw.match(
          /(\d{1,2})[\/／](\d{1,2})/
        );

    }

    if(dateMatch){

      const m =
        Number(
          dateMatch[1]
        );

      const d =
        Number(
          dateMatch[2]
        );

      if(
        m >= 1 &&
        m <= 12 &&
        d >= 1 &&
        d <= 31
      ){

        month = m;

        currentDate = {

          year:year,
          month:m,
          day:d

        };

        const rest =
          raw
            .replace(
              dateMatch[0],
              ""
            )
            .trim();

        if(rest){

          const candidate =
            makeCandidate(
              currentDate,
              rest
            );

          if(candidate){

            candidates.push(
              candidate
            );

          }

        }

        continue;

      }

    }

    if(currentDate){

      const candidate =
        makeCandidate(
          currentDate,
          raw
        );

      if(candidate){

        if(
          containsScheduleInformation(
            raw
          )
        ){

          candidates.push(
            candidate
          );

        }

      }

    }

  }

  const unique =
    new Map();

  for(const item of candidates){

    const key =
      [
        item.date,
        item.time,
        item.place,
        item.note
      ].join("|");

    if(!unique.has(key)){

      unique.set(
        key,
        item
      );

    }

  }

  return Array.from(
    unique.values()
  );

}


/* =========================================
   予定情報判定
========================================= */

function containsScheduleInformation(text){

  return (

    /\d{1,2}:\d{2}/.test(text) ||

    /音楽練習室/.test(text) ||

    /不在/.test(text) ||

    /文化祭/.test(text) ||

    /リハーサル/.test(text) ||

    /準備/.test(text) ||

    /休み/.test(text)

  );

}


/* =========================================
   予定候補作成
========================================= */

function makeCandidate(
  dateObj,
  text
){

  if(!text){
    return null;
  }

  if(
    text.includes("練習曲")
  ){

    return null;

  }

  const yyyy =
    String(
      dateObj.year
    );

  const mm =
    String(
      dateObj.month
    ).padStart(
      2,
      "0"
    );

  const dd =
    String(
      dateObj.day
    ).padStart(
      2,
      "0"
    );

  const date =
    `${yyyy}-${mm}-${dd}`;

  const timeMatches =
    text.match(
      /\d{1,2}:\d{2}\s*[〜~\-－]\s*\d{1,2}:\d{2}/g
    );

  let time =
    timeMatches
      ? timeMatches[0]
      : "";

  time =
    time.replace(
      /\s+/g,
      ""
    );

  let place = "";

  if(
    text.includes("音楽練習室")
  ){

    place =
      "音楽練習室";

  }

  let note =
    text;

  if(
    time &&
    timeMatches
  ){

    note =
      note.replace(
        timeMatches[0],
        ""
      );

  }

  if(place){

    note =
      note.replace(
        place,
        ""
      );

  }

  note =
    note
      .replace(
        /練習曲の目安/g,
        ""
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();

  if(
    !time &&
    !place &&
    !/不在|文化祭|リハーサル|準備|休み/.test(note)
  ){

    return null;

  }

  return {

    date:date,
    time:time,
    place:place,
    note:note

  };

}


/* =========================================
   PDF読み込み
========================================= */

async function readSchedulePDF(){

  if(!(await isAdmin())){
    return;
  }

  const file =
    $("schedulePdf")
      .files[0];

  if(!file){

    message(
      "pdfStatus",
      "PDFファイルを選択してください。",
      "error"
    );

    return;

  }

  const button =
    $("readPdfButton");

  button.disabled = true;

  button.textContent =
    "PDFを読み込んでいます...";

  $("pdfCandidates")
    .classList
    .add("hidden");

  message(
    "pdfStatus",
    "PDFを解析しています..."
  );

  try{

    const lines =
      await extractPdfLines(
        file
      );

    if(!lines.length){

      throw new Error(
        "PDFから文字を読み取れませんでした。"
      );

    }

    const candidates =
      parseScheduleLines(
        lines
      );

    if(!candidates.length){

      message(
        "pdfStatus",
        "PDFから予定を見つけられませんでした。\n\n" +
        "このPDFが画像として保存されている場合は、文字情報を読み取れない可能性があります。",
        "error"
      );

      return;

    }

    renderCandidates(
      candidates
    );

    message(
      "pdfStatus",
      `${candidates.length}件の予定候補を読み取りました。`
    );

    $("pdfCandidates")
      .classList
      .remove("hidden");

  }catch(error){

    console.error(
      "PDF読み込みエラー:",
      error
    );

    message(
      "pdfStatus",
      "PDFの読み込みに失敗しました。\n\n" +
      "エラー：" +
      (error.message || "不明"),
      "error"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "PDFを読み込む";

  }

}

async function registerCandidates(){

  if(!(await isAdmin())){
    return;
  }

  const boxes =
    document.querySelectorAll(
      ".candidate"
    );

  const selected = [];

  boxes.forEach(
    box => {

      const check =
        box.querySelector(
          ".candidate-check"
        );

      if(!check.checked){
        return;
      }

      const date =
        box.querySelector(
          ".candidate-date"
        ).value;

      const time =
        box.querySelector(
          ".candidate-time"
        ).value
        .trim();

      const place =
        box.querySelector(
          ".candidate-place"
        ).value
        .trim();

      const note =
        box.querySelector(
          ".candidate-note"
        ).value
        .trim();

      if(!date){
        return;
      }

      selected.push({

        date,
        time,
        place,
        note

      });

    }
  );

  if(!selected.length){

    message(
      "candidateMsg",
      "登録する予定を1つ以上選択してください。",
      "error"
    );

    return;

  }

  const button =
    $("registerCandidatesButton");

  button.disabled = true;

  button.textContent =
    "登録しています...";

  try{

    for(const item of selected){

      await set(
        ref(
          db,
          "schedules/" +
          item.date
        ),
        {

          type:"normal",
          time:item.time,
          place:item.place,
          note:item.note,
          updatedAt:Date.now()

      );

    }

    message(
      "candidateMsg",
      `${selected.length}件の予定を登録しました。`,

    console.error(

      "candidateMsg",

      (error.code || "不明") +

async function saveSchedule(){

  }

  /* =========================
     通常の予定
  ========================== */

  if(type === "normal"){

    const date =
      $("sdate").value;

    const time =
      $("stime")
        .value
        .trim();

    const place =
      $("splace")
        .value
        .trim();

        .value
        .trim();

      message(
        "scheduleMsg",
        "日付を入力してください。",
        "error"
      );

      return;

    }

    try{

      await set(
        ref(
          db,
          "schedules/" +
          date
        ),
        {

          type:"normal",
          time:time,
          place:place,
          note:note,
          updatedAt:Date.now()

      );

        "scheduleMsg",
        "予定を保存しました。",
        "success"
      );

      $("stime").value = "";
      $("splace").value = "";
      $("snote").value = "";

        "scheduleMsg",

        "詳細: " +
        (error.message || "不明"),

      );

      return;

          db,
          "schedules/" +
          key
        ),

          type:"exam",
          startDate:startDate,

        "scheduleMsg",

        "success"
      );

        error
      );

      message(
        "scheduleMsg",
        "試験期間の保存に失敗しました。\n\n" +
        "エラーコード: " +
        (error.code || "不明") +
        "\n" +
        "詳細: " +
        (error.message || "不明"),
        "error"
      );

    }

    return;

  }


  /* =========================
     演奏会
  ========================== */

  if(type === "concert"){

    const date =
      $("concertDate").value;

    const time =
      $("concertTime")
        .value
        .trim();

    const title =
      $("concertTitle")
        .value
        .trim();

    const place =
      $("concertPlace")
        .value
        .trim();

    const note =
      $("concertNote")
        .value
        .trim();

    if(!date){

      message(
        "scheduleMsg",
        "日付を入力してください。",
        "error"
      );

      return;

    }

    if(!title){

      message(
        "scheduleMsg",
        "演奏会名を入力してください。",
        "error"
      );

      return;

    }

    try{

      const key =
        "special_" +
        Date.now();

      await set(
        ref(
          db,
          "schedules/" +
          key
        ),
        {

          type:"concert",
          date:date,
          time:time,
          title:title,
          place:place,
          note:note,
          updatedAt:Date.now()

        }
      );

      message(
        "scheduleMsg",
        "演奏会を保存しました。",
        "success"
      );

      $("concertDate").value = "";
      $("concertTime").value = "";
      $("concertTitle").value = "";
      $("concertPlace").value = "";
      $("concertNote").value = "";

      await loadSchedules();

    }catch(error){

      console.error(
        "演奏会保存エラー:",
        error
      );

      message(
        "scheduleMsg",
        "演奏会の保存に失敗しました。\n\n" +
        "エラーコード: " +
        (error.code || "不明") +
        "\n" +
        "詳細: " +
        (error.message || "不明"),
        "error"
      );

    }

    return;

  }


  /* =========================
     部活がある日
  ========================== */

  if(type === "club"){

    const date =
      $("clubDate").value;

    if(!date){

      message(
        "scheduleMsg",
        "日付を入力してください。",
        "error"
      );

      return;

    }

    try{

      await set(
        ref(
          db,
          "schedules/" +
          date
        ),
        {

          type:"club",
          date:date,
          updatedAt:Date.now()

        }
      );

      message(
        "scheduleMsg",
        "部活がある日として保存しました。",
        "success"
      );

      $("clubDate").value = "";

      await loadSchedules();

    }catch(error){

      console.error(
        "部活予定保存エラー:",
        error
      );

      message(
        "scheduleMsg",
        "部活予定の保存に失敗しました。\n\n" +
        "エラーコード: " +
        (error.code || "不明") +
        "\n" +
        "詳細: " +
        (error.message || "不明"),
        "error"
      );

    }

    return;

  }


  /* =========================
     学校が休みの日
  ========================== */

  if(type === "schoolHoliday"){

    const startDate =
      $("schoolHolidayStartDate").value;

    const endDate =
      $("schoolHolidayEndDate").value;

    if(!startDate || !endDate){

      message(
        "scheduleMsg",
        "開始日と終了日を入力してください。",
        "error"
      );

      return;

    }

    if(startDate > endDate){

      message(
        "scheduleMsg",
        "終了日は開始日以降の日付にしてください。",
        "error"
      );

      return;

    }

    try{

      const key =
        "special_" +
        Date.now();

      await set(
        ref(
          db,
          "schedules/" +
          key
        ),
        {

          type:"schoolHoliday",
          startDate:startDate,
          endDate:endDate,
          title:"学校が休みの日",
          updatedAt:Date.now()

        }
      );

      message(
        "scheduleMsg",
        "学校が休みの日を保存しました。",
        "success"
      );

      $("schoolHolidayStartDate").value = "";
      $("schoolHolidayEndDate").value = "";

      await loadSchedules();

    }catch(error){

      console.error(
        "学校休日保存エラー:",
        error
      );

      message(
        "scheduleMsg",
        "学校が休みの日の保存に失敗しました。\n\n" +
        "エラーコード: " +
        (error.code || "不明") +
        "\n" +
        "詳細: " +
        (error.message || "不明"),
        "error"
      );

    }

    return;

  }


  /* =========================
     その他のイベント
  ========================== */

  if(type === "event"){

    const date =
      $("eventDate").value;

    const time =
      $("eventTime")
        .value
        .trim();

    const title =
      $("eventTitle")
        .value
        .trim();

    const place =
      $("eventPlace")
        .value
        .trim();

    const note =
      $("eventNote")
        .value
        .trim();

    if(!date){

      message(
        "scheduleMsg",
        "日付を入力してください。",
        "error"
      );

      return;

    }

    if(!title){

      message(
        "scheduleMsg",
        "イベント名を入力してください。",
        "error"
      );

      return;

    }

    try{

      const key =
        "special_" +
        Date.now();

      await set(
        ref(
          db,
          "schedules/" +
          key
        ),
        {

          type:"event",
          date:date,
          time:time,
          title:title,
          place:place,
          note:note,
          updatedAt:Date.now()

        }
      );

      message(
        "scheduleMsg",
        "イベントを保存しました。",
        "success"
      );

      $("eventDate").value = "";
      $("eventTime").value = "";
      $("eventTitle").value = "";
      $("eventPlace").value = "";
      $("eventNote").value = "";

      await loadSchedules();

    }catch(error){

      console.error(
        "イベント保存エラー:",
        error
      );

      message(
        "scheduleMsg",
        "イベントの保存に失敗しました。\n\n" +
        "エラーコード: " +
        (error.code || "不明") +
        "\n" +
        "詳細: " +
        (error.message || "不明"),
        "error"
      );

    }

  }

}


/* =========================================
   登録済み予定
========================================= */

async function loadSchedules(){

  const snapshot =
    await get(
      ref(
        db,
        "schedules"
      )
    );

  const data =
    snapshot.exists()
      ? snapshot.val()
      : {};

  const schedules =
    Object.entries(data)
      .sort(
        ([a],[b]) =>
          a.localeCompare(b)
      );

  if(!schedules.length){

    $("schedules").innerHTML =
      "<p class='small'>予定はありません。</p>";

    return;

  }

  $("schedules").innerHTML =
    schedules
      .map(
        ([date,x]) => {

          const type =
            x.type || "normal";

          let typeLabel = "";

          if(type === "exam"){
            typeLabel = "試験期間";
          }else if(type === "concert"){
            typeLabel = "演奏会";
          }else if(type === "club"){
            typeLabel = "部活がある日";
          }else if(type === "schoolHoliday"){
            typeLabel = "学校が休みの日";
          }else if(type === "event"){
            typeLabel = "その他のイベント";
          }else{
            typeLabel = "通常の部活予定";
          }

          let mainDate = date;

          if(
            type === "exam" ||
            type === "schoolHoliday"
          ){

            mainDate =
              `${x.startDate || ""} 〜 ${x.endDate || ""}`;

          }else if(
            type === "concert" ||
            type === "event"
          ){

            mainDate =
              x.date || date;

          }

          return `

          <div class="item">

            <div class="item-main">

              <div>

                <strong>
                  ${esc(typeLabel)}
                </strong>

                <div class="small">
                  ${esc(mainDate)}
                </div>

              </div>

              <div class="item-actions">

                <button
                  onclick="editSchedule('${esc(date)}')"
                >
                  変更
                </button>

                <button
                  class="delete-button"
                  onclick="deleteSchedule('${esc(date)}')"
                >
                  削除
                </button>

              </div>

            </div>

            ${
              x.title
                ? `<div>${esc(x.title)}</div>`
                : ""
            }

            ${
              x.time
                ? `<div>${esc(x.time)}</div>`
                : ""
            }

            ${
              x.place
                ? `<div>${esc(x.place)}</div>`
                : ""
            }

            ${
              x.note
                ? `<div class="small">
                    備考：${esc(x.note)}
                   </div>`
                : ""
            }

          </div>

        `;

        }
      )
      .join("");

}


/* =========================================
   予定変更
========================================= */

async function editSchedule(key){

  if(!(await isAdmin())){
    return;
  }

  const snapshot =
    await get(
      ref(
        db,
        "schedules/" +
        key
      )
    );

  if(!snapshot.exists()){
    return;
  }

  const data =
    snapshot.val();

  const type =
    data.type || "normal";

  $("stype").value =
    type;

  updateScheduleFields();


  /* =========================
     通常
  ========================== */

  if(type === "normal"){

    $("sdate").value =
      key;

    $("stime").value =
      data.time || "";

    $("splace").value =
      data.place || "";

    $("snote").value =
      data.note || "";

  }


  /* =========================
     試験期間
  ========================== */

  if(type === "exam"){

    $("examStartDate").value =
      data.startDate || "";

    $("examEndDate").value =
      data.endDate || "";

  }


  /* =========================
     演奏会
  ========================== */

  if(type === "concert"){

    $("concertDate").value =
      data.date || "";

    $("concertTime").value =
      data.time || "";

    $("concertTitle").value =
      data.title || "";

    $("concertPlace").value =
      data.place || "";

    $("concertNote").value =
      data.note || "";

  }


  /* =========================
     部活がある日
  ========================== */

  if(type === "club"){

    $("clubDate").value =
      data.date || key;

  }


  /* =========================
     学校が休みの日
  ========================== */

  if(type === "schoolHoliday"){

    $("schoolHolidayStartDate").value =
      data.startDate || "";

    $("schoolHolidayEndDate").value =
      data.endDate || "";

  }


  /* =========================
     その他イベント
  ========================== */

  if(type === "event"){

    $("eventDate").value =
      data.date || "";

    $("eventTime").value =
      data.time || "";

    $("eventTitle").value =
      data.title || "";

    $("eventPlace").value =
      data.place || "";

    $("eventNote").value =
      data.note || "";

  }


  $("stype").scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* =========================================
   予定削除
========================================= */

async function deleteSchedule(key){

  if(!(await isAdmin())){
    return;
  }

  const snapshot =
    await get(
      ref(
        db,
        "schedules/" +
        key
      )
    );

  if(!snapshot.exists()){
    return;
  }

  const data =
    snapshot.val();

  let text =
    "この予定を削除しますか？";

  if(data.type === "exam"){

    text =
      `試験期間\n${data.startDate || ""}〜${data.endDate || ""}\n\n` +
      "この予定を削除しますか？";

  }else if(data.type === "schoolHoliday"){

    text =
      `学校が休みの日\n${data.startDate || ""}〜${data.endDate || ""}\n\n` +
      "この予定を削除しますか？";

  }else if(data.type === "concert"){

    text =
      `演奏会\n${data.title || ""}\n${data.date || ""}\n\n` +
      "この予定を削除しますか？";

  }else if(data.type === "event"){

    text =
      `その他のイベント\n${data.title || ""}\n${data.date || ""}\n\n` +
      "この予定を削除しますか？";

  }else if(data.type === "club"){

    text =
      `部活がある日\n${data.date || key}\n\n` +
      "この予定を削除しますか？";

  }else{

    text =
      `${key}の予定を削除しますか？`;

  }

  const ok =
    confirm(
      text
    );

  if(!ok){
    return;
  }

  try{

    await remove(
      ref(
        db,
        "schedules/" +
        key
      )
    );

    await loadSchedules();

  }catch(error){

    console.error(
      "予定削除エラー:",
      error
    );

    message(
      "scheduleMsg",
      "予定の削除に失敗しました。\n\n" +
      "エラーコード: " +
      (error.code || "不明") +
      "\n" +
      "詳細: " +
      (error.message || "不明"),
      "error"
    );

  }

}
