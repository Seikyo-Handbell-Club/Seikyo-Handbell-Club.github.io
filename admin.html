<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理者設定｜清教学園ハンドベル部</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#20242a;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

header{
  background:#fff;
  padding:20px;
  border-bottom:1px solid #e5e8ed;
}

h1{
  margin:0;
  text-align:center;
  font-size:21px;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0000000b;
}

.hidden{
  display:none!important;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 5px;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #d9dee7;
  border-radius:10px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:130px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#1f6feb;
  color:#fff;
  width:100%;
  margin-top:14px;
}

.secondary{
  background:#eef3fb;
}

.cancel{
  background:#f1f3f5;
  color:#4b5560;
  width:100%;
  margin-top:8px;
}

.danger{
  background:#fff0f0;
  color:#b22;
  border:1px solid #efbbbb;
}

.msg{
  padding:12px;
  border-radius:10px;
  background:#fff8df;
  color:#69520a;
  margin-top:10px;
  font-size:14px;
}

.error{
  background:#fff0f0;
  color:#9b1c1c;
}

.item{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.row button{
  flex:1;
}

.small{
  font-size:12px;
  color:#6f7882;
}

/* 部員一覧 */
.member-head{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.member-head strong{
  font-size:16px;
}

.member-actions{
  display:flex;
  gap:5px;
  margin-left:auto;
}

.member-actions button{
  padding:5px 9px;
  font-size:12px;
}

/* 変更中のフォーム */
.editing{
  border:2px solid #1f6feb;
}

/* OCR */
.preview{
  max-width:100%;
  max-height:240px;
  border-radius:10px;
  margin-top:10px;
}

.ocr-candidate{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:7px;
  align-items:center;
  margin:8px 0;
}

.ocr-candidate input{
  padding:8px;
  font-size:14px;
}

@media(max-width:600px){

  .ocr-candidate{
    grid-template-columns:1fr 1fr;
  }

  .ocr-candidate button{
    grid-column:span 2;
  }

}
</style>
</head>

<body>

<header>
<h1>清教学園ハンドベル部 管理者設定</h1>
</header>

<main>

<!-- ========================= -->
<!-- ログイン -->
<!-- ========================= -->

<section id="login" class="card">

<h2>管理者ログイン</h2>

<p class="small">
管理者として登録されたアカウントでログインしてください。
</p>

<label>パスワード</label>

<input
  id="password"
  type="password"
  autocomplete="current-password"
>

<button
  class="primary"
  onclick="adminLogin()"
>
ログイン
</button>

<div id="loginMsg"></div>

</section>


<!-- ========================= -->
<!-- 管理画面 -->
<!-- ========================= -->

<section id="app" class="hidden">

<div class="card">

<button
  class="secondary"
  onclick="logout()"
>
ログアウト
</button>

</div>


<!-- ========================= -->
<!-- 部員登録・変更 -->
<!-- ========================= -->

<div
  id="memberFormCard"
  class="card"
>

<h2 id="memberFormTitle">
部員登録
</h2>


<label>学校ID</label>

<input
  id="mid"
  autocomplete="off"
>


<label>名前</label>

<input
  id="mname"
>


<label>学年</label>

<select id="mgrade">

<option value="中学1年">
中学1年
</option>

<option value="中学2年">
中学2年
</option>

<option value="中学3年">
中学3年
</option>

<option value="高校1年">
高校1年
</option>

<option value="高校2年">
高校2年
</option>

</select>


<label>クラス</label>

<select id="mclass">

<option value="A">A組</option>
<option value="B">B組</option>
<option value="C">C組</option>
<option value="D">D組</option>
<option value="E">E組</option>
<option value="F">F組</option>
<option value="G">G組</option>
<option value="H">H組</option>
<option value="I">I組</option>
<option value="J">J組</option>
<option value="K">K組</option>

</select>


<button
  id="memberSubmit"
  class="primary"
  onclick="addMember()"
>
登録する
</button>


<button
  id="memberCancel"
  class="cancel hidden"
  onclick="cancelMemberEdit()"
>
変更をやめる
</button>


<div id="memberMsg"></div>

</div>


<!-- ========================= -->
<!-- 部員一覧 -->
<!-- ========================= -->

<div class="card">

<h2>部員一覧</h2>

<div id="members"></div>

</div>


<!-- ========================= -->
<!-- 予定表 -->
<!-- ========================= -->

<div class="card">

<h2>
清教学園ハンドベル部予定表
</h2>


<label>
予定表の画像
</label>

<input
  id="scheduleImage"
  type="file"
  accept="image/*"
  onchange="previewScheduleImage(event)"
>


<img
  id="schedulePreview"
  class="preview hidden"
>


<button
  class="secondary"
  style="margin-top:10px;width:100%"
  onclick="runOCR()"
>
画像から予定を読み取る
</button>


<div id="ocrMsg"></div>


<label>
読み取った文字
</label>

<textarea
  id="ocrText"
  placeholder="OCR結果がここに表示されます。必要なら修正できます。"
></textarea>


<h3>
予定候補
</h3>

<div id="ocrCandidates">

<p class="small">
画像を読み取ると候補が表示されます。
</p>

</div>


<button
  class="primary"
  onclick="registerOCRCandidates()"
>
選択した予定を登録
</button>


<hr
  style="border:0;border-top:1px solid #e5e8ed;margin:20px 0"
>


<h3>
手動で予定を登録
</h3>


<label>日付</label>

<input
  id="sdate"
  type="date"
>


<label>時間</label>

<input
  id="stime"
  placeholder="例：17:00〜19:00"
>


<label>場所</label>

<input
  id="splace"
>


<button
  class="primary"
  onclick="saveSchedule()"
>
予定を保存
</button>


<div id="scheduleMsg"></div>

<div id="schedules"></div>

</div>

</section>

</main>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
   管理者アカウント
========================= */

const ADMIN_EMAIL =
"kazuma.cosmos@gmail.com";


/* =========================
   Firebase
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",

  authDomain:
  "seikyo-handbell-club.firebaseapp.com",

  databaseURL:
  "https://seikyo-handbell-club-default-rtdb.firebaseio.com",

  projectId:
  "seikyo-handbell-club",

  storageBucket:
  "seikyo-handbell-club.firebasestorage.app",

  messagingSenderId:
  "55435007971",

  appId:
  "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getDatabase(app);


const $ =
id => document.getElementById(id);


const esc =
s =>
String(s ?? "")
.replace(
  /[&<>"']/g,
  c =>
  ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);


/* =========================
   状態
========================= */

let editingMemberId = null;

let ocrCandidates = [];


/* =========================
   メッセージ
========================= */

function msg(
  id,
  text,
  error=false
){

  const el =
  $(id);

  el.className =
  text
  ? (error ? "msg error" : "msg")
  : "";

  el.textContent =
  text;

}


/* =========================
   管理者確認
========================= */

async function isAdmin(){

  if(!auth.currentUser)
    return false;

  const s =
  await get(
    ref(
      db,
      "admins/" +
      auth.currentUser.uid
    )
  );

  return (
    s.exists() &&
    s.val() === true
  );

}


/* =========================
   ログイン状態
========================= */

onAuthStateChanged(
  auth,
  async user => {

    if(
      user &&
      await isAdmin()
    ){

      $("login")
      .classList
      .add("hidden");

      $("app")
      .classList
      .remove("hidden");

      loadMembers();

      loadSchedules();

    }
    else{

      $("login")
      .classList
      .remove("hidden");

      $("app")
      .classList
      .add("hidden");

    }

  }
);


/* =========================
   ログイン
========================= */

async function adminLogin(){

  try{

    await signInWithEmailAndPassword(
      auth,
      ADMIN_EMAIL,
      $("password").value
    );


    if(
      !(await isAdmin())
    ){

      await signOut(auth);

      msg(
        "loginMsg",
        "このアカウントは管理者として登録されていません。",
        true
      );

    }
    else{

      $("password").value="";

      msg(
        "loginMsg",
        ""
      );

    }

  }
  catch(e){

    msg(
      "loginMsg",
      "ログインできませんでした。パスワードを確認してください。",
      true
    );

  }

}


function logout(){

  signOut(auth);

}


/* =========================
   部員登録
========================= */

async function addMember(){

  if(
    !(await isAdmin())
  )
    return;


  const id =
  $("mid").value.trim();

  const name =
  $("mname").value.trim();

  const grade =
  $("mgrade").value;

  const cl =
  $("mclass").value;


  if(
    !id ||
    !name ||
    !grade ||
    !cl
  ){

    msg(
      "memberMsg",
      "すべて入力してください。",
      true
    );

    return;

  }


  const existing =
  await get(
    ref(
      db,
      "memberRegistrations/" +
      id
    )
  );


  if(existing.exists()){

    msg(
      "memberMsg",
      "その学校IDはすでに登録されています。",
      true
    );

    return;

  }


  await set(
    ref(
      db,
      "memberRegistrations/" +
      id
    ),
    {

      schoolId:id,

      name:name,

      grade:grade,

      className:cl,

      createdAt:Date.now()

    }
  );


  await set(
    ref(
      db,
      "memberIds/" +
      id
    ),
    {
      accountCreated:false
    }
  );


  clearMemberForm();


  msg(
    "memberMsg",
    "登録しました。"
  );


  loadMembers();

}


/* =========================
   登録フォームを空に戻す
========================= */

function clearMemberForm(){

  $("mid").value="";

  $("mname").value="";

  $("mgrade").value="中学1年";

  $("mclass").value="A";

}


/* =========================
   部員一覧
========================= */

async function loadMembers(){

  const s =
  await get(
    ref(
      db,
      "memberRegistrations"
    )
  );


  const v =
  s.exists()
  ? s.val()
  : {};


  const gradeOrder = {

    "中学1年":1,

    "中学2年":2,

    "中学3年":3,

    "高校1年":4,

    "高校2年":5

  };


  const classOrder =
  c =>
  String(c || "")
  .charCodeAt(0);


  const a =
  Object
  .entries(v)
  .sort(
    ([,x],[,y]) => {

      const g =
      (gradeOrder[x.grade] || 99) -
      (gradeOrder[y.grade] || 99);

      if(g)
        return g;


      const c =
      classOrder(x.className) -
      classOrder(y.className);

      if(c)
        return c;


      return String(
        x.name || ""
      ).localeCompare(
        String(y.name || ""),
        "ja"
      );

    }
  );


  $("members").innerHTML =

  a.length

  ?

  a.map(
    ([id,x]) => `

      <div class="item">

        <div class="member-head">

          <strong>
            ${esc(x.name)}
          </strong>

          <div class="member-actions">

            <button
              class="secondary"
              onclick="editMember('${esc(id)}')"
            >
              変更
            </button>

            <button
              class="danger"
              onclick="deleteMember('${esc(id)}')"
            >
              削除
            </button>

          </div>

        </div>

        <div class="small">

          ${esc(id)}
          　
          ${esc(x.grade)}
          　
          ${esc(x.className)}組

        </div>

      </div>

    `
  ).join("")

  :

  "<p class='small'>まだ登録されていません。</p>";

}


/* =========================
   ★変更ボタン
========================= */

async function editMember(id){

  const s =
  await get(
    ref(
      db,
      "memberRegistrations/" +
      id
    )
  );


  if(!s.exists())
    return;


  const x =
  s.val();


  /* 編集中のIDを保存 */

  editingMemberId =
  id;


  /* フォームを変更モードへ */

  $("memberFormCard")
  .classList
  .add("editing");


  $("memberFormTitle")
  .textContent =
  "部員変更";


  /* 現在の情報を入力 */

  $("mid").value =
  x.schoolId || id;


  $("mname").value =
  x.name || "";


  $("mgrade").value =
  x.grade || "中学1年";


  $("mclass").value =
  x.className || "A";


  /* ボタン変更 */

  $("memberSubmit")
  .textContent =
  "変更を保存";


  $("memberSubmit")
  .onclick =
  saveMemberEdit;


  /* キャンセル表示 */

  $("memberCancel")
  .classList
  .remove("hidden");


  /* フォームまでスクロール */

  $("memberFormCard")
  .scrollIntoView({

    behavior:"smooth",

    block:"start"

  });

}


/* =========================
   ★変更を保存
========================= */

async function saveMemberEdit(){

  if(
    !(await isAdmin()) ||
    !editingMemberId
  )
    return;


  const oldId =
  editingMemberId;


  const newId =
  $("mid").value.trim();


  const name =
  $("mname").value.trim();


  const grade =
  $("mgrade").value;


  const cl =
  $("mclass").value;


  if(
    !newId ||
    !name ||
    !grade ||
    !cl
  ){

    msg(
      "memberMsg",
      "すべて入力してください。",
      true
    );

    return;

  }


  /* IDを変更する場合 */

  if(newId !== oldId){

    const exists =
    await get(
      ref(
        db,
        "memberRegistrations/" +
        newId
      )
    );


    if(exists.exists()){

      msg(
        "memberMsg",
        "変更後の学校IDはすでに登録されています。",
        true
      );

      return;

    }

  }


  const oldSnap =
  await get(
    ref(
      db,
      "memberRegistrations/" +
      oldId
    )
  );


  const oldData =
  oldSnap.val() || {};


  const newData = {

    ...oldData,

    schoolId:newId,

    name:name,

    grade:grade,

    className:cl,

    updatedAt:Date.now()

  };


  /* 学校IDまで変更された場合 */

  if(newId !== oldId){

    await set(
      ref(
        db,
        "memberRegistrations/" +
        newId
      ),
      newData
    );


    const memberIdSnap =
    await get(
      ref(
        db,
        "memberIds/" +
        oldId
      )
    );


    if(
      memberIdSnap.exists()
    ){

      await set(
        ref(
          db,
          "memberIds/" +
          newId
        ),
        memberIdSnap.val()
      );

    }
    else{

      await set(
        ref(
          db,
          "memberIds/" +
          newId
        ),
        {
          accountCreated:false
        }
      );

    }


    await remove(
      ref(
        db,
        "memberRegistrations/" +
        oldId
      )
    );


    await remove(
      ref(
        db,
        "memberIds/" +
        oldId
      )
    );

  }

  /* IDが同じならそのまま更新 */

  else{

    await update(
      ref(
        db,
        "memberRegistrations/" +
        oldId
      ),
      newData
    );

  }


  /* 登録モードに戻す */

  cancelMemberEdit();


  msg(
    "memberMsg",
    "変更を保存しました。"
  );


  loadMembers();

}


/* =========================
   変更をやめる
========================= */

function cancelMemberEdit(){

  editingMemberId =
  null;


  $("memberFormCard")
  .classList
  .remove("editing");


  $("memberFormTitle")
  .textContent =
  "部員登録";


  $("memberSubmit")
  .textContent =
  "登録する";


  $("memberSubmit")
  .onclick =
  addMember;


  $("memberCancel")
  .classList
  .add("hidden");


  clearMemberForm();

}


/* =========================
   部員削除
========================= */

async function deleteMember(id){

  if(
    !confirm(
      "この部員登録を削除しますか？"
    )
  )
    return;


  await remove(
    ref(
      db,
      "memberRegistrations/" +
      id
    )
  );


  await remove(
    ref(
      db,
      "memberIds/" +
      id
    )
  );


  if(
    editingMemberId === id
  ){

    cancelMemberEdit();

  }


  loadMembers();

}


/* =========================
   予定表画像
========================= */

function previewScheduleImage(event){

  const file =
  event.target.files?.[0];


  if(!file)
    return;


  const url =
  URL.createObjectURL(file);


  $("schedulePreview").src =
  url;


  $("schedulePreview")
  .classList
  .remove("hidden");

}


/* =========================
   OCR
========================= */

async function runOCR(){

  const file =
  $("scheduleImage")
  .files?.[0];


  if(!file){

    msg(
      "ocrMsg",
      "先に予定表の画像を選択してください。",
      true
    );

    return;

  }


  msg(
    "ocrMsg",
    "画像を読み取っています。少し待ってください。"
  );


  try{

    const result =
    await Tesseract.recognize(
      file,
      "jpn+eng",
      {

        logger:m=>{

          if(
            m.status ===
            "recognizing text"
          ){

            msg(
              "ocrMsg",
              "画像を読み取っています… " +
              Math.round(
                (m.progress || 0) * 100
              ) +
              "%"
            );

          }

        }

      }
    );


    $("ocrText").value =
    result.data.text || "";


    ocrCandidates =
    parseScheduleCandidates(
      result.data.text || ""
    );


    renderOCRCandidates();


    msg(
      "ocrMsg",
      "読み取り完了。候補を確認してください。"
    );

  }
  catch(e){

    msg(
      "ocrMsg",
      "画像を読み取れませんでした。別の画像でもう一度試してください。",
      true
    );

  }

}


/* =========================
   OCRの日付解析
========================= */

function parseScheduleCandidates(text){

  const lines =
  text
  .split(/\r?\n/)
  .map(x=>x.trim())
  .filter(Boolean);


  const found=[];


  const dateRe =
  /(20\d{2})[\/\-年](\d{1,2})[\/\-月](\d{1,2})日?|(\d{1,2})[\/\-月](\d{1,2})日?/;


  for(
    const line of lines
  ){

    const m =
    line.match(dateRe);


    if(!m)
      continue;


    let year =
    m[1];

    let month =
    m[2];

    let day =
    m[3];


    if(!year){

      month =
      m[4];

      day =
      m[5];

      year =
      new Date()
      .getFullYear();

    }


    const mm =
    String(
      Number(month)
    ).padStart(2,"0");


    const dd =
    String(
      Number(day)
    ).padStart(2,"0");


    let time="";


    const tm =
    line.match(
      /(\d{1,2}:\d{2}\s*[〜~\-－]\s*\d{1,2}:\d{2})/
    );


    if(tm){

      time =
      tm[1]
      .replace(/\s/g,"");

    }


    const place =
    line
    .replace(dateRe,"")
    .replace(
      /(\d{1,2}:\d{2}\s*[〜~\-－]\s*\d{1,2}:\d{2})/,
      ""
    )
    .trim();


    found.push({

      selected:true,

      date:
      `${year}-${mm}-${dd}`,

      time,

      place

    });

  }


  const unique=[];

  const seen =
  new Set();


  for(
    const x of found
  ){

    const key =
    x.date +
    "|" +
    x.time +
    "|" +
    x.place;


    if(
      !seen.has(key)
    ){

      seen.add(key);

      unique.push(x);

    }

  }


  return unique;

}


/* =========================
   OCR候補表示
========================= */

function renderOCRCandidates(){

  const el =
  $("ocrCandidates");


  if(
    !ocrCandidates.length
  ){

    el.innerHTML =
    "<p class='small'>日付を自動認識できませんでした。手動登録を使ってください。</p>";

    return;

  }


  el.innerHTML =
  ocrCandidates
  .map(
    (x,i)=>`

      <div class="ocr-candidate">

        <input
          type="checkbox"
          ${x.selected ? "checked" : ""}
          onchange="ocrCandidates[${i}].selected=this.checked"
        >

        <input
          type="date"
          value="${esc(x.date)}"
          onchange="ocrCandidates[${i}].date=this.value"
        >

        <input
          placeholder="時間"
          value="${esc(x.time)}"
          onchange="ocrCandidates[${i}].time=this.value"
        >

        <button
          class="danger"
          onclick="removeOCRCandidate(${i})"
        >
          削除
        </button>

        <input
          placeholder="場所"
          value="${esc(x.place)}"
          onchange="ocrCandidates[${i}].place=this.value"
          style="grid-column:span 3"
        >

      </div>

    `
  )
  .join("");

}


/* =========================
   OCR候補削除
========================= */

function removeOCRCandidate(i){

  ocrCandidates.splice(
    i,
    1
  );

  renderOCRCandidates();

}


/* =========================
   OCR予定登録
========================= */

async function registerOCRCandidates(){

  if(
    !(await isAdmin())
  )
    return;


  const selected =
  ocrCandidates.filter(
    x =>
    x.selected &&
    x.date
  );


  if(!selected.length){

    msg(
      "ocrMsg",
      "登録する予定を選択してください。",
      true
    );

    return;

  }


  for(
    const x of selected
  ){

    await set(
      ref(
        db,
        "schedules/" +
        x.date
      ),
      {

        time:
        x.time || "",

        place:
        x.place || "",

        updatedAt:
        Date.now()

      }
    );

  }


  msg(
    "ocrMsg",
    selected.length +
    "件の予定を登録しました。"
  );


  loadSchedules();

}


/* =========================
   手動予定登録
========================= */

async function saveSchedule(){

  if(
    !(await isAdmin())
  )
    return;


  const d =
  $("sdate").value;


  const t =
  $("stime").value.trim();


  const p =
  $("splace").value.trim();


  if(!d){

    msg(
      "scheduleMsg",
      "日付を入力してください。",
      true
    );

    return;

  }


  await set(
    ref(
      db,
      "schedules/" +
      d
    ),
    {

      time:t,

      place:p,

      updatedAt:
      Date.now()

    }
  );


  msg(
    "scheduleMsg",
    "保存しました。"
  );


  loadSchedules();

}


/* =========================
   予定一覧
========================= */

async function loadSchedules(){

  const s =
  await get(
    ref(
      db,
      "schedules"
    )
  );


  const v =
  s.exists()
  ? s.val()
  : {};


  const a =
  Object
  .entries(v)
  .sort();


  $("schedules").innerHTML =

  a.length

  ?

  a.map(
    ([d,x]) => `

      <div class="item">

        <strong>
          ${esc(d)}
        </strong>

        <br>

        ${esc(x.time || "")}

        <br>

        ${esc(x.place || "")}

        <div class="row">

          <button
            onclick="editSchedule('${esc(d)}')"
          >
            変更
          </button>

          <button
            class="danger"
            onclick="deleteSchedule('${esc(d)}')"
          >
            削除
          </button>

        </div>

      </div>

    `
  ).join("")

  :

  "<p class='small'>予定はありません。</p>";

}


/* =========================
   予定変更
========================= */

async function editSchedule(d){

  const s =
  await get(
    ref(
      db,
      "schedules/" +
      d
    )
  );


  if(!s.exists())
    return;


  const x =
  s.val();


  $("sdate").value =
  d;


  $("stime").value =
  x.time || "";


  $("splace").value =
  x.place || "";


  $("sdate")
  .scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* =========================
   予定削除
========================= */

async function deleteSchedule(d){

  if(
    confirm(
      d +
      "の予定を削除しますか？"
    )
  ){

    await remove(
      ref(
        db,
        "schedules/" +
        d
      )
    );

    loadSchedules();

  }

}
