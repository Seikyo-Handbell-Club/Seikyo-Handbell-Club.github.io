<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理者設定｜清教学園ハンドベル部</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#20242a;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

header{
  background:#fff;
  padding:20px;
  border-bottom:1px solid #e5e8ed;
}

h1{
  margin:0;
  text-align:center;
  font-size:21px;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0000000b;
}

.hidden{
  display:none!important;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 5px;
}

input,
select{
  width:100%;
  padding:11px;
  border:1px solid #d9dee7;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#1f6feb;
  color:#fff;
  width:100%;
  margin-top:14px;
}

.secondary{
  background:#eef3fb;
}

.danger{
  background:#fff0f0;
  color:#b22;
  border:1px solid #efbbbb;
}

.msg{
  padding:12px;
  border-radius:10px;
  background:#fff8df;
  color:#69520a;
  margin-top:10px;
  font-size:14px;
  white-space:pre-wrap;
}

.error{
  background:#fff0f0;
  color:#9b1c1c;
}

.item{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.row button{
  flex:1;
}

.small{
  font-size:12px;
  color:#6f7882;
}
</style>
</head>

<body>

<header>
<h1>清教学園ハンドベル部 管理者設定</h1>
</header>

<main>

<!-- 管理者ログイン -->
<section id="login" class="card">

<h2>管理者ログイン</h2>

<label>パスワード</label>

<input
  id="password"
  type="password"
  autocomplete="current-password"
  placeholder="管理者パスワード"
>

<button class="primary" onclick="adminLogin()">
ログイン
</button>

<div id="loginMsg"></div>

<p class="small">
管理者アカウントでログインします。
</p>

</section>


<!-- 管理画面 -->
<section id="app" class="hidden">

<div class="card">

<button class="secondary" onclick="logout()">
ログアウト
</button>

</div>


<!-- 部員登録 -->
<div class="card">

<h2>部員登録</h2>

<label>学校ID</label>
<input id="mid" placeholder="学校ID">

<label>名前</label>
<input id="mname" placeholder="名前">

<label>学年</label>

<select id="mgrade">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
</select>

<label>クラス</label>
<input id="mclass" placeholder="例：1">

<button class="primary" onclick="addMember()">
登録する
</button>

<div id="memberMsg"></div>

</div>


<!-- 部員一覧 -->
<div class="card">

<h2>部員一覧</h2>

<div id="members"></div>

</div>


<!-- 予定表 -->
<div class="card">

<h2>清教学園ハンドベル部予定表</h2>

<label>日付</label>
<input id="sdate" type="date">

<label>時間</label>
<input id="stime" placeholder="例：17:00〜19:00">

<label>場所</label>
<input id="splace" placeholder="例：音楽室">

<button class="primary" onclick="saveSchedule()">
予定を保存
</button>

<div id="scheduleMsg"></div>

<div id="schedules"></div>

</div>

</section>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


// ========================================
// 管理者メールアドレス
// ========================================

const ADMIN_EMAIL = "kazuma.cosmos@gmail.com";


// ========================================
// Firebase設定
// ========================================

const firebaseConfig = {
  apiKey: "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",
  authDomain: "seikyo-handbell-club.firebaseapp.com",
  databaseURL: "https://seikyo-handbell-club-default-rtdb.firebaseio.com",
  projectId: "seikyo-handbell-club",
  storageBucket: "seikyo-handbell-club.firebasestorage.app",
  messagingSenderId: "55435007971",
  appId: "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"
};


// ========================================
// Firebase初期化
// ========================================

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

const $ = id => document.getElementById(id);


// ========================================
// HTMLエスケープ
// ========================================

function esc(value){

  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


// ========================================
// メッセージ表示
// ========================================

function showMessage(id,text,error=false){

  const el = $(id);

  el.className = text
    ? (error ? "msg error" : "msg")
    : "";

  el.textContent = text;

}


// ========================================
// 管理者確認
// ========================================

async function isAdmin(){

  if(!auth.currentUser){
    return false;
  }

  const snapshot = await get(
    ref(db,"admins/" + auth.currentUser.uid)
  );

  return snapshot.exists() &&
         snapshot.val() === true;

}


// ========================================
// ログイン状態確認
// ========================================

onAuthStateChanged(auth, async user => {

  try{

    if(user){

      const admin = await isAdmin();

      if(admin){

        $("login").classList.add("hidden");

        $("app").classList.remove("hidden");

        await loadMembers();

        await loadSchedules();

      }else{

        await signOut(auth);

        $("login").classList.remove("hidden");

        $("app").classList.add("hidden");

        showMessage(
          "loginMsg",
          "このアカウントは管理者として登録されていません。",
          true
        );

      }

    }else{

      $("login").classList.remove("hidden");

      $("app").classList.add("hidden");

    }

  }catch(error){

    console.error(
      "管理者確認エラー:",
      error
    );

    $("login").classList.remove("hidden");

    $("app").classList.add("hidden");

    showMessage(
      "loginMsg",

      "管理者確認でエラーが発生しました。\n\n" +

      "code: " +
      (error?.code || "(なし)") +

      "\nmessage: " +
      (error?.message || "(なし)"),

      true
    );

  }

});


// ========================================
// 管理者ログイン
// ========================================

async function adminLogin(){

  const password =
    $("password").value;


  if(!password){

    showMessage(
      "loginMsg",
      "パスワードを入力してください。",
      true
    );

    return;
  }


  try{

    showMessage(
      "loginMsg",
      "ログインしています..."
    );


    await signInWithEmailAndPassword(
      auth,
      ADMIN_EMAIL,
      password
    );


    const admin =
      await isAdmin();


    if(!admin){

      await signOut(auth);

      showMessage(
        "loginMsg",
        "このアカウントは管理者として登録されていません。",
        true
      );

      return;
    }


    $("password").value = "";

    showMessage(
      "loginMsg",
      ""
    );


  }catch(error){

    console.error(
      "管理者ログインエラー:",
      error
    );


    const errorCode =
      String(error?.code || "");

    const errorName =
      String(error?.name || "");

    const errorMessage =
      String(error?.message || "");

    let errorString = "";

    try{

      errorString = String(error);

    }catch(_){

      errorString =
        "(取得できませんでした)";

    }


    showMessage(
      "loginMsg",

      "ログインできませんでした。\n\n" +

      "code: " +
      (errorCode || "(なし)") +

      "\nname: " +
      (errorName || "(なし)") +

      "\nmessage: " +
      (errorMessage || "(なし)") +

      "\nString(error): " +
      (errorString || "(なし)"),

      true
    );

  }

}


// ========================================
// ログアウト
// ========================================

function logout(){

  signOut(auth);

}


// ========================================
// 部員登録
// ========================================

async function addMember(){

  if(!(await isAdmin())){
    return;
  }


  const id =
    $("mid").value.trim();

  const name =
    $("mname").value.trim();

  const grade =
    $("mgrade").value;

  const className =
    $("mclass").value.trim();


  if(!id || !name || !className){

    showMessage(
      "memberMsg",
      "すべて入力してください。",
      true
    );

    return;
  }


  try{

    const existing =
      await get(
        ref(
          db,
          "memberRegistrations/" + id
        )
      );


    if(existing.exists()){

      showMessage(
        "memberMsg",
        "そのIDはすでに登録されています。",
        true
      );

      return;
    }


    await set(
      ref(
        db,
        "memberRegistrations/" + id
      ),
      {
        schoolId:id,
        name:name,
        grade:grade,
        className:className,
        createdAt:Date.now()
      }
    );


    await set(
      ref(
        db,
        "memberIds/" + id
      ),
      {
        accountCreated:false
      }
    );


    $("mid").value = "";

    $("mname").value = "";

    $("mclass").value = "";


    showMessage(
      "memberMsg",
      "登録しました。"
    );


    await loadMembers();


  }catch(error){

    console.error(error);

    showMessage(
      "memberMsg",

      "登録に失敗しました。\n\n" +

      "code: " +
      (error?.code || "(なし)") +

      "\nmessage: " +
      (error?.message || "(なし)"),

      true
    );

  }

}


// ========================================
// 部員一覧
// ========================================

async function loadMembers(){

  const snapshot =
    await get(
      ref(db,"memberRegistrations")
    );


  const data =
    snapshot.exists()
      ? snapshot.val()
      : {};


  const entries =
    Object.entries(data);


  if(!entries.length){

    $("members").innerHTML =
      "<p class='small'>まだ登録されていません。</p>";

    return;
  }


  $("members").innerHTML =
    entries.map(([id,x]) => `

      <div class="item">

        <strong>
          ${esc(id)}　${esc(x.name)}
        </strong>

        <div>
          ${esc(x.grade)}年
          ${esc(x.className)}組
        </div>

        <div class="row">

          <button
            onclick="editMember('${esc(id)}')"
          >
            変更
          </button>

          <button
            class="danger"
            onclick="deleteMember('${esc(id)}')"
          >
            削除
          </button>

        </div>

      </div>

    `).join("");

}


// ========================================
// 部員変更
// ========================================

async function editMember(id){

  const snapshot =
    await get(
      ref(
        db,
        "memberRegistrations/" + id
      )
    );


  if(!snapshot.exists()){
    return;
  }


  const data =
    snapshot.val();


  const name =
    prompt(
      "名前",
      data.name || ""
    );


  if(name === null){
    return;
  }


  const grade =
    prompt(
      "学年",
      data.grade || ""
    );


  if(grade === null){
    return;
  }


  const className =
    prompt(
      "クラス",
      data.className || ""
    );


  if(className === null){
    return;
  }


  await update(
    ref(
      db,
      "memberRegistrations/" + id
    ),
    {
      name:name.trim(),
      grade:grade.trim(),
      className:className.trim()
    }
  );


  await loadMembers();

}


// ========================================
// 部員削除
// ========================================

async function deleteMember(id){

  if(
    !confirm(
      "この部員登録を削除しますか？"
    )
  ){
    return;
  }


  await remove(
    ref(
      db,
      "memberRegistrations/" + id
    )
  );


  await remove(
    ref(
      db,
      "memberIds/" + id
    )
  );


  await loadMembers();

}


// ========================================
// 予定保存
// ========================================

async function saveSchedule(){

  if(!(await isAdmin())){
    return;
  }


  const date =
    $("sdate").value;

  const time =
    $("stime").value.trim();

  const place =
    $("splace").value.trim();


  if(!date){

    showMessage(
      "scheduleMsg",
      "日付を入力してください。",
      true
    );

    return;
  }


  try{

    await set(
      ref(
        db,
        "schedules/" + date
      ),
      {
        time:time,
        place:place,
        updatedAt:Date.now()
      }
    );


    showMessage(
      "scheduleMsg",
      "保存しました。"
    );


    await loadSchedules();


  }catch(error){

    console.error(error);

    showMessage(
      "scheduleMsg",

      "保存に失敗しました。\n\n" +

      "code: " +
      (error?.code || "(なし)") +

      "\nmessage: " +
      (error?.message || "(なし)"),

      true
    );

  }

}


// ========================================
// 予定一覧
// ========================================

async function loadSchedules(){

  const snapshot =
    await get(
      ref(db,"schedules")
    );


  const data =
    snapshot.exists()
      ? snapshot.val()
      : {};


  const entries =
    Object.entries(data).sort();


  if(!entries.length){

    $("schedules").innerHTML =
      "<p class='small'>予定はありません。</p>";

    return;
  }


  $("schedules").innerHTML =
    entries.map(([date,x]) => `

      <div class="item">

        <strong>
          ${esc(date)}
        </strong>

        <br>

        ${esc(x.time || "")}

        <br>

        ${esc(x.place || "")}

        <div class="row">

          <button
            onclick="editSchedule('${esc(date)}')"
          >
            変更
          </button>

          <button
            class="danger"
            onclick="deleteSchedule('${esc(date)}')"
          >
            削除
          </button>

        </div>

      </div>

    `).join("");

}


// ========================================
// 予定変更
// ========================================

async function editSchedule(date){

  const snapshot =
    await get(
      ref(
        db,
        "schedules/" + date
      )
    );


  if(!snapshot.exists()){
    return;
  }


  const data =
    snapshot.val();


  $("sdate").value =
    date;

  $("stime").value =
    data.time || "";

  $("splace").value =
    data.place || "";

}


// ========================================
// 予定削除
// ========================================

async function deleteSchedule(date){

  if(
    !confirm(
      date + "の予定を削除しますか？"
    )
  ){
    return;
  }


  await remove(
    ref(
      db,
      "schedules/" + date
    )
  );


  await loadSchedules();

}


// ========================================
// HTMLから呼び出せるようにする
// ========================================

window.adminLogin =
  adminLogin;

window.logout =
  logout;

window.addMember =
  addMember;

window.editMember =
  editMember;

window.deleteMember =
  deleteMember;

window.saveSchedule =
  saveSchedule;

window.editSchedule =
  editSchedule;

window.deleteSchedule =
  deleteSchedule;

</script>

</body>
</html>
