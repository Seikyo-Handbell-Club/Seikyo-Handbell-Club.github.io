<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>管理者設定｜清教学園ハンドベル部</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{background:#fff;padding:20px;border-bottom:1px solid #e5e8ed}h1{margin:0;text-align:center;font-size:21px}main{max-width:800px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 2px 12px #0000000b}.hidden{display:none!important}label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}input,select{width:100%;padding:11px;border:1px solid #d9dee7;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#1f6feb;color:#fff;width:100%;margin-top:14px}.secondary{background:#eef3fb}.danger{background:#fff0f0;color:#b22;border:1px solid #efbbbb}.msg{padding:12px;border-radius:10px;background:#fff8df;color:#69520a;margin-top:10px;font-size:14px}.error{background:#fff0f0;color:#9b1c1c}.item{border:1px solid #e3e7ed;border-radius:12px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}.small{font-size:12px;color:#6f7882}</style></head>
<body>
<header><h1>清教学園ハンドベル部 管理者設定</h1></header>
<main>
<section id="login" class="card">
<h2>管理者ログイン</h2>
<label>メールアドレス</label><input id="email" type="email">
<label>パスワード</label><input id="password" type="password">
<button class="primary" onclick="adminLogin()">ログイン</button>
<div id="loginMsg"></div>
</section>

<section id="app" class="hidden">
<div class="card"><button class="secondary" onclick="logout()">ログアウト</button></div>

<div class="card">
<h2>部員登録</h2>
<label>学校ID</label><input id="mid">
<label>名前</label><input id="mname">
<label>学年</label><select id="mgrade"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
<label>クラス</label><input id="mclass">
<button class="primary" onclick="addMember()">登録する</button><div id="memberMsg"></div>
</div>

<div class="card"><h2>部員一覧</h2><div id="members"></div></div>

<div class="card">
<h2>清教学園ハンドベル部予定表</h2>
<label>予定の種類</label>
<select id="stype" onchange="updateScheduleForm()">
<option value="normal">通常の部活予定</option>
<option value="exam">試験期間</option>
<option value="concert">演奏会</option>
<option value="schoolHoliday">学校が休みの日</option>
<option value="event">その他のイベント</option>
</select>

<div id="normalFields">
<label>日付</label><input id="sdate" type="date">
<label>開始時間</label><input id="sstart" type="time">
<label>終了時間</label><input id="send" type="time">
<label>場所</label><input id="splace">
<label>備考</label><input id="snote">
</div>

<div id="examFields" class="hidden">
<label>開始日</label><input id="examStart" type="date">
<label>終了日</label><input id="examEnd" type="date">
</div>

<div id="specialFields" class="hidden">
<label>日付</label><input id="specialDate" type="date">
<label>タイトル</label><input id="specialTitle" placeholder="未入力でも可">
<label>開始時間</label><input id="specialStart" type="time">
<label>終了時間</label><input id="specialEnd" type="time">
<label>場所</label><input id="specialPlace">
<label>備考</label><input id="specialNote">
</div>

<div id="holidayFields" class="hidden">
<label>日付</label><input id="holidayDate" type="date">
<label>タイトル</label><input id="holidayTitle" placeholder="未入力でも可">
</div>

<button class="primary" onclick="saveSchedule()">予定を保存</button>
<div id="scheduleMsg"></div>
<div id="schedules"></div>
</div>
</section>
</main>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getDatabase,ref,get,set,update,remove}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",
  authDomain:"seikyo-handbell-club.firebaseapp.com",
  databaseURL:"https://seikyo-handbell-club-default-rtdb.firebaseio.com",
  projectId:"seikyo-handbell-club",
  storageBucket:"seikyo-handbell-club.firebasestorage.app",
  messagingSenderId:"55435007971",
  appId:"1:55435007971:web:25f5c3b9dcd4324bc3f2d6"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

setPersistence(auth,browserLocalPersistence).catch(console.error);

function m(id,t,e=false){$(id).className=t?(e?"msg error":"msg"):"";$(id).textContent=t}
async function admin(){if(!auth.currentUser)return false;const s=await get(ref(db,"admins/"+auth.currentUser.uid));return s.exists()&&s.val()===true}

onAuthStateChanged(auth,async u=>{
  if(u&&await admin()){
    $("login").classList.add("hidden");$("app").classList.remove("hidden");
    loadMembers();loadSchedules();updateScheduleForm();
  }else{$("login").classList.remove("hidden");$("app").classList.add("hidden")}
});

async function adminLogin(){try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);if(!(await admin())){await signOut(auth);m("loginMsg","このアカウントは管理者として登録されていません。",true)}}catch(e){m("loginMsg","ログインできませんでした。",true)}}
function logout(){signOut(auth)}

async function addMember(){if(!(await admin()))return;let id=$("mid").value.trim(),name=$("mname").value.trim(),grade=$("mgrade").value,cl=$("mclass").value.trim();if(!id||!name||!cl)return m("memberMsg","すべて入力してください。",true);if((await get(ref(db,"memberRegistrations/"+id))).exists())return m("memberMsg","そのIDはすでに登録されています。",true);await set(ref(db,"memberRegistrations/"+id),{schoolId:id,name,grade,className:cl,createdAt:Date.now()});await set(ref(db,"memberIds/"+id),{accountCreated:false});$("mid").value=$("mname").value=$("mclass").value="";m("memberMsg","登録しました。");loadMembers()}
async function loadMembers(){let s=await get(ref(db,"memberRegistrations")),v=s.exists()?s.val():{};let a=Object.entries(v);$("members").innerHTML=a.length?a.map(([id,x])=>`<div class="item"><strong>${esc(id)}　${esc(x.name)}</strong><div>${esc(x.grade)}年${esc(x.className)}組</div><div class="row"><button onclick="editMember('${id}')">変更</button><button class="danger" onclick="deleteMember('${id}')">削除</button></div></div>`).join(""):"<p class='small'>まだ登録されていません。</p>"}
async function editMember(id){let s=await get(ref(db,"memberRegistrations/"+id));if(!s.exists())return;let x=s.val(),name=prompt("名前",x.name),grade=prompt("学年",x.grade),cl=prompt("クラス",x.className);if(name===null||grade===null||cl===null)return;await update(ref(db,"memberRegistrations/"+id),{name,grade,className:cl});loadMembers()}
async function deleteMember(id){if(!confirm("この部員登録を削除しますか？"))return;await remove(ref(db,"memberRegistrations/"+id));await remove(ref(db,"memberIds/"+id));loadMembers()}

function getTime(startId,endId){const start=$(startId).value,end=$(endId).value;if(!start&&!end)return{ok:true,value:"終日"};if(!start||!end)return{ok:false,value:""};return{ok:true,value:`${start}〜${end}`}}
function splitTimeRange(time){const v=String(time||"").trim();if(!v||v==="終日")return{start:"",end:""};const m=v.match(/^(\d{1,2}:\d{2})\s*[〜~\-－]\s*(\d{1,2}:\d{2})$/);return m?{start:m[1],end:m[2]}:{start:"",end:""}}

function updateScheduleForm(){
  const t=$("stype").value;
  $("normalFields").classList.toggle("hidden",t!=="normal");
  $("examFields").classList.toggle("hidden",t!=="exam");
  $("specialFields").classList.toggle("hidden",!(t==="concert"||t==="event"));
  $("holidayFields").classList.toggle("hidden",t!=="schoolHoliday");
}

async function saveSchedule(){
  if(!(await admin()))return;
  const type=$("stype").value;
  try{
    if(type==="normal"){
      const d=$("sdate").value,t=getTime("sstart","send");
      if(!d)return m("scheduleMsg","日付を入力してください。",true);
      if(!t.ok)return m("scheduleMsg","開始時間と終了時間を両方入力してください。",true);
      await set(ref(db,"schedules/"+d),{type:"normal",time:t.value,place:$("splace").value.trim(),note:$("snote").value.trim(),updatedAt:Date.now()});
    }else if(type==="exam"){
      const start=$("examStart").value,end=$("examEnd").value;
      if(!start||!end)return m("scheduleMsg","開始日と終了日を入力してください。",true);
      await set(ref(db,"schedules/special_"+Date.now()),{type:"exam",startDate:start,endDate:end,title:"試験期間",updatedAt:Date.now()});
    }else if(type==="schoolHoliday"){
      const d=$("holidayDate").value;
      if(!d)return m("scheduleMsg","日付を入力してください。",true);
      await set(ref(db,"schedules/special_"+Date.now()),{type:"schoolHoliday",date:d,title:$("holidayTitle").value.trim(),updatedAt:Date.now()});
    }else{
      const d=$("specialDate").value,t=getTime("specialStart","specialEnd");
      if(!d)return m("scheduleMsg","日付を入力してください。",true);
      if(!t.ok)return m("scheduleMsg","開始時間と終了時間を両方入力してください。",true);
      await set(ref(db,"schedules/special_"+Date.now()),{type,date:d,title:$("specialTitle").value.trim(),time:t.value,place:$("specialPlace").value.trim(),note:$("specialNote").value.trim(),updatedAt:Date.now()});
    }
    m("scheduleMsg","保存しました。");loadSchedules();
  }catch(e){console.error(e);m("scheduleMsg","保存に失敗しました。",true)}
}

function scheduleTitle(x){if(x.type==="exam")return"試験期間";if(x.type==="schoolHoliday")return x.title||"（タイトルなし）";if(x.type==="concert")return x.title||"演奏会（タイトルなし）";if(x.type==="event")return x.title||"その他のイベント（タイトルなし）";return"部活動"}
function scheduleDateText(x,key){if(x.type==="exam")return`${x.startDate||""}〜${x.endDate||""}`;return x.date||key}

async function loadSchedules(){
  const s=await get(ref(db,"schedules")),v=s.exists()?s.val():{};
  const a=Object.entries(v).sort((a,b)=>String(a[1]?.startDate||a[1]?.date||a[0]).localeCompare(String(b[1]?.startDate||b[1]?.date||b[0])));
  $("schedules").innerHTML=a.length?a.map(([key,x])=>`<div class="item"><strong>${esc(scheduleTitle(x))}</strong><br>${esc(scheduleDateText(x,key))}${x.time?`<br>${esc(x.time)}`:""}${x.place?`<br>${esc(x.place)}`:""}${x.note?`<br>${esc(x.note)}`:""}<div class="row"><button onclick="editSchedule('${key}')">変更</button><button class="danger" onclick="deleteSchedule('${key}')">削除</button></div></div>`).join(""):"<p class='small'>予定はありません。</p>"
}

async function editSchedule(key){
  const s=await get(ref(db,"schedules/"+key));if(!s.exists())return;const x=s.val();$("stype").value=x.type||"normal";updateScheduleForm();
  if(x.type==="normal"){const t=splitTimeRange(x.time);$("sdate").value=key;$("sstart").value=t.start;$("send").value=t.end;$("splace").value=x.place||"";$("snote").value=x.note||""}
  else if(x.type==="exam"){$("examStart").value=x.startDate||"";$("examEnd").value=x.endDate||""}
  else if(x.type==="schoolHoliday"){$("holidayDate").value=x.date||x.startDate||"";$("holidayTitle").value=x.title||""}
  else {const t=splitTimeRange(x.time);$("specialDate").value=x.date||"";$("specialTitle").value=x.title||"";$("specialStart").value=t.start;$("specialEnd").value=t.end;$("specialPlace").value=x.place||"";$("specialNote").value=x.note||""}
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
async function deleteSchedule(key){if(confirm("この予定を削除しますか？")){await remove(ref(db,"schedules/"+key));loadSchedules()}}

window.adminLogin=adminLogin;window.logout=logout;window.addMember=addMember;window.editMember=editMember;window.deleteMember=deleteMember;window.saveSchedule=saveSchedule;window.editSchedule=editSchedule;window.deleteSchedule=deleteSchedule;window.updateScheduleForm=updateScheduleForm;
</script></body></html>
