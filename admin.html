<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理者設定｜清教学園ハンドベル部</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f7fb;
  color:#20242a;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif
}
header{
  background:#fff;
  padding:20px;
  border-bottom:1px solid #e5e8ed
}
h1{
  margin:0;
  text-align:center;
  font-size:21px
}
main{
  max-width:800px;
  margin:auto;
  padding:18px
}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0000000b
}
.hidden{display:none!important}
label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 5px
}
input,select{
  width:100%;
  padding:11px;
  border:1px solid #d9dee7;
  border-radius:10px;
  font-size:16px
}
button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer
}
.primary{
  background:#1f6feb;
  color:#fff;
  width:100%;
  margin-top:14px
}
.secondary{background:#eef3fb}
.danger{
  background:#fff0f0;
  color:#b22;
  border:1px solid #efbbbb
}
.msg{
  padding:12px;
  border-radius:10px;
  background:#fff8df;
  color:#69520a;
  margin-top:10px;
  font-size:14px
}
.error{
  background:#fff0f0;
  color:#9b1c1c
}
.item{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin:10px 0
}
.row{
  display:flex;
  gap:8px;
  margin-top:10px
}
.row button{flex:1}
.small{
  font-size:12px;
  color:#6f7882
}
</style>
</head>

<body>

<header>
<h1>清教学園ハンドベル部 管理者設定</h1>
</header>

<main>

<section id="login" class="card">
  <h2>管理者ログイン</h2>

  <label>メールアドレス</label>
  <input id="email" type="email" value="kazuma.cosmos@gmail.com">

  <label>パスワード</label>
  <input id="password" type="password">

  <button class="primary" onclick="adminLogin()">ログイン</button>

  <div id="loginMsg"></div>

  <p class="small">
    管理者アカウントはFirebase Authenticationで作成し、
    Realtime Databaseの admins/{UID} に true を登録してください。
  </p>
</section>


<section id="app" class="hidden">

<div class="card">
  <button class="secondary" onclick="logout()">ログアウト</button>
</div>


<div class="card">

<h2>部員登録</h2>

<label>学校ID</label>
<input id="mid">

<label>名前</label>
<input id="mname">

<label>学年</label>
<select id="mgrade">
  <option value="1">中学1年</option>
  <option value="2">中学2年</option>
  <option value="3">中学3年</option>
  <option value="4">高校1年</option>
  <option value="5">高校2年</option>
</select>

<label>クラス</label>
<select id="mclass">
  <option value="A">A組</option>
  <option value="B">B組</option>
  <option value="C">C組</option>
  <option value="D">D組</option>
  <option value="E">E組</option>
  <option value="F">F組</option>
  <option value="G">G組</option>
  <option value="H">H組</option>
  <option value="I">I組</option>
  <option value="J">J組</option>
  <option value="K">K組</option>
</select>

<button class="primary" onclick="addMember()">登録する</button>

<div id="memberMsg"></div>

</div>


<div class="card">

<h2>部員一覧</h2>

<div id="members"></div>

</div>


<div class="card">

<h2>清教学園ハンドベル部予定表</h2>

<label>日付</label>
<input id="sdate" type="date">

<label>時間</label>
<input id="stime" placeholder="例：17:00〜19:00">

<label>場所</label>
<input id="splace">

<button class="primary" onclick="saveSchedule()">
予定を保存
</button>

<div id="scheduleMsg"></div>

<div id="schedules"></div>

</div>

</section>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
   Firebase設定
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyAK9yRrSSLsfYpLSyluzwRyI22Zp32KeMSA",
  authDomain: "seikyo-handbell-club.firebaseapp.com",
  databaseURL: "https://seikyo-handbell-club-default-rtdb.firebaseio.com",
  projectId: "seikyo-handbell-club",
  storageBucket: "seikyo-handbell-club.firebasestorage.app",
  messagingSenderId: "55435007971",
  appId: "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"
};


/* =========================
   Firebase初期化
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

const $ = id => document.getElementById(id);


/* =========================
   HTMLエスケープ
========================= */

function esc(s){
  return String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}


/* =========================
   メッセージ表示
========================= */

function message(id,text,error=false){

  const el = $(id);

  if(!text){
    el.className = "";
    el.textContent = "";
    return;
  }

  el.className = error ? "msg error" : "msg";

  el.textContent = text;
}


/* =========================
   管理者確認
========================= */

async function isAdmin(){

  if(!auth.currentUser){
    return false;
  }

  const snap = await get(
    ref(db,"admins/" + auth.currentUser.uid)
  );

  return snap.exists() && snap.val() === true;
}


/* =========================
   ログイン状態
========================= */

onAuthStateChanged(auth, async user => {

  if(user){

    try{

      const ok = await isAdmin();

      if(ok){

        $("login").classList.add("hidden");

        $("app").classList.remove("hidden");

        await loadMembers();

        await loadSchedules();

      }else{

        await signOut(auth);

        $("login").classList.remove("hidden");

        $("app").classList.add("hidden");

        message(
          "loginMsg",
          "このアカウントは管理者として登録されていません。",
          true
        );
      }

    }catch(e){

      console.error(e);

      message(
        "loginMsg",
        "管理者情報を確認できませんでした。Firebaseの設定を確認してください。",
        true
      );

    }

  }else{

    $("login").classList.remove("hidden");

    $("app").classList.add("hidden");

  }

});


/* =========================
   管理者ログイン
========================= */

async function adminLogin(){

  const email = $("email").value.trim();

  const password = $("password").value;

  message("loginMsg","");

  if(!email || !password){

    message(
      "loginMsg",
      "メールアドレスとパスワードを入力してください。",
      true
    );

    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(e){

    console.error("Firebase Auth error:",e);

    let detail = e?.code || e?.message || "不明なエラー";

    message(
      "loginMsg",
      "ログインできませんでした。\nエラーコード: " + detail,
      true
    );

  }

}


/* =========================
   ログアウト
========================= */

function logout(){

  signOut(auth);

}


/* =========================
   部員登録
========================= */

async function addMember(){

  if(!(await isAdmin())){
    return;
  }

  const id = $("mid").value.trim();

  const name = $("mname").value.trim();

  const grade = $("mgrade").value;

  const className = $("mclass").value;


  if(!id || !name || !className){

    message(
      "memberMsg",
      "すべて入力してください。",
      true
    );

    return;
  }


  const existing = await get(
    ref(db,"memberRegistrations/" + id)
  );


  if(existing.exists()){

    message(
      "memberMsg",
      "その学校IDはすでに登録されています。",
      true
    );

    return;
  }


  await set(
    ref(db,"memberRegistrations/" + id),
    {
      schoolId:id,
      name:name,
      grade:grade,
      className:className,
      createdAt:Date.now()
    }
  );


  await set(
    ref(db,"memberIds/" + id),
    {
      accountCreated:false
    }
  );


  $("mid").value = "";

  $("mname").value = "";

  $("mgrade").value = "1";

  $("mclass").value = "A";


  message(
    "memberMsg",
    "登録しました。"
  );


  await loadMembers();

}


/* =========================
   学年順・クラス順・名前順
========================= */

function sortMembers(a,b){

  const ga = Number(a[1]?.grade ?? 99);

  const gb = Number(b[1]?.grade ?? 99);

  if(ga !== gb){
    return ga - gb;
  }


  const ca = String(a[1]?.className ?? "");

  const cb = String(b[1]?.className ?? "");

  if(ca !== cb){
    return ca.localeCompare(cb,"ja");
  }


  const na = String(a[1]?.name ?? "");

  const nb = String(b[1]?.name ?? "");

  return na.localeCompare(nb,"ja");
}


/* =========================
   部員一覧
========================= */

async function loadMembers(){

  const snap = await get(
    ref(db,"memberRegistrations")
  );

  const data = snap.exists() ? snap.val() : {};

  const list = Object.entries(data);

  list.sort(sortMembers);


  if(!list.length){

    $("members").innerHTML =
      "<p class='small'>まだ登録されていません。</p>";

    return;
  }


  $("members").innerHTML = list.map(
    ([id,x]) => {

      const gradeNames = {
        "1":"中学1年",
        "2":"中学2年",
        "3":"中学3年",
        "4":"高校1年",
        "5":"高校2年"
      };

      const grade =
        gradeNames[String(x.grade)] ||
        String(x.grade ?? "");


      const className =
        String(x.className ?? "") +
        (x.className ? "組" : "");


      return `
        <div class="item">

          <strong>
            ${esc(x.name)}
          </strong>

          <div>
            ${esc(grade)} ${esc(className)}
          </div>

          <div class="small">
            学校ID：${esc(id)}
          </div>

          <div class="row">

            <button onclick="editMember('${esc(id)}')">
              変更
            </button>

            <button
              class="danger"
              onclick="deleteMember('${esc(id)}')"
            >
              削除
            </button>

          </div>

        </div>
      `;

    }
  ).join("");

}


/* =========================
   部員変更
========================= */

async function editMember(id){

  if(!(await isAdmin())){
    return;
  }


  const snap = await get(
    ref(db,"memberRegistrations/" + id)
  );


  if(!snap.exists()){
    return;
  }


  const x = snap.val();


  const name = prompt(
    "名前",
    x.name || ""
  );

  if(name === null){
    return;
  }


  const grade = prompt(
    "学年\n1=中1\n2=中2\n3=中3\n4=高1\n5=高2",
    x.grade || ""
  );

  if(grade === null){
    return;
  }


  const className = prompt(
    "クラス（A〜K）",
    x.className || ""
  );

  if(className === null){
    return;
  }


  if(
    !name.trim() ||
    !["1","2","3","4","5"].includes(grade) ||
    !/^[A-K]$/i.test(className.trim())
  ){

    alert(
      "入力内容を確認してください。"
    );

    return;
  }


  await update(
    ref(db,"memberRegistrations/" + id),
    {
      name:name.trim(),
      grade:grade,
      className:className.trim().toUpperCase()
    }
  );


  await loadMembers();

}


/* =========================
   部員削除
========================= */

async function deleteMember(id){

  if(!(await isAdmin())){
    return;
  }


  const ok = confirm(
    "この部員登録を削除しますか？"
  );


  if(!ok){
    return;
  }


  await remove(
    ref(db,"memberRegistrations/" + id)
  );


  await remove(
    ref(db,"memberIds/" + id)
  );


  await loadMembers();

}


/* =========================
   予定保存
========================= */

async function saveSchedule(){

  if(!(await isAdmin())){
    return;
  }


  const date = $("sdate").value;

  const time = $("stime").value.trim();

  const place = $("splace").value.trim();


  if(!date){

    message(
      "scheduleMsg",
      "日付を入力してください。",
      true
    );

    return;
  }


  await set(
    ref(db,"schedules/" + date),
    {
      date:date,
      time:time,
      place:place,
      updatedAt:Date.now()
    }
  );


  message(
    "scheduleMsg",
    "保存しました。"
  );


  await loadSchedules();

}


/* =========================
   予定一覧
========================= */

async function loadSchedules(){

  const snap = await get(
    ref(db,"schedules")
  );

  const data = snap.exists()
    ? snap.val()
    : {};


  const list = Object.entries(data);

  list.sort(
    (a,b) => a[0].localeCompare(b[0])
  );


  if(!list.length){

    $("schedules").innerHTML =
      "<p class='small'>予定はありません。</p>";

    return;
  }


  $("schedules").innerHTML = list.map(
    ([date,x]) => {

      return `
        <div class="item">

          <strong>
            ${esc(date)}
          </strong>

          <div>
            ${esc(x.time || "")}
          </div>

          <div>
            ${esc(x.place || "")}
          </div>

          <div class="row">

            <button
              onclick="editSchedule('${esc(date)}')"
            >
              変更
            </button>

            <button
              class="danger"
              onclick="deleteSchedule('${esc(date)}')"
            >
              削除
            </button>

          </div>

        </div>
      `;

    }
  ).join("");

}


/* =========================
   予定変更
========================= */

async function editSchedule(date){

  if(!(await isAdmin())){
    return;
  }


  const snap = await get(
    ref(db,"schedules/" + date)
  );


  if(!snap.exists()){
    return;
  }


  const x = snap.val();


  $("sdate").value = date;

  $("stime").value = x.time || "";

  $("splace").value = x.place || "";


  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}


/* =========================
   予定削除
========================= */

async function deleteSchedule(date){

  if(!(await isAdmin())){
    return;
  }


  if(!confirm(
    date + " の予定を削除しますか？"
  )){
    return;
  }


  await remove(
    ref(db,"schedules/" + date)
  );


  await loadSchedules();

}


/* =========================
   HTMLから呼び出せるようにする
========================= */

window.adminLogin = adminLogin;

window.logout = logout;

window.addMember = addMember;

window.editMember = editMember;

window.deleteMember = deleteMember;

window.saveSchedule = saveSchedule;

window.editSchedule = editSchedule;

window.deleteSchedule = deleteSchedule;

</script>

</body>
</html>
