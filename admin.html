<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理者設定｜清教学園ハンドベル部</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fb;
  color:#20242a;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

header{
  background:#fff;
  padding:20px;
  border-bottom:1px solid #e5e8ed;
  position:relative;
}

h1{
  margin:0;
  text-align:center;
  font-size:21px;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0000000b;
}

.hidden{
  display:none!important;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 5px;
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid #d9dee7;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:9px;
  padding:8px 12px;
  font-weight:600;
  cursor:pointer;
}

.primary{
  background:#1f6feb;
  color:#fff;
  width:100%;
  margin-top:14px;
}

.secondary{
  background:#f3f5f8;
  color:#4f5965;
}

/* ログアウト */
.logout{
  position:absolute;
  right:18px;
  top:15px;
  background:#f3f5f8;
  color:#59636f;
  font-size:13px;
  padding:7px 10px;
}

/* 部員一覧・予定表の控えめなボタン */
.item-actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

.action{
  background:#f5f6f8;
  color:#59636f;
  border:1px solid #e1e4e8;
  font-size:13px;
  padding:6px 10px;
  font-weight:500;
}

.action.danger{
  color:#a15c5c;
  background:#faf6f6;
  border-color:#eadede;
}

.item{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}

.item-head{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.item-main{
  flex:1;
  min-width:0;
}

.msg{
  padding:12px;
  border-radius:10px;
  background:#fff8df;
  color:#69520a;
  margin-top:10px;
  font-size:14px;
}

.error{
  background:#fff0f0;
  color:#9b1c1c;
}

.small{
  font-size:12px;
  color:#6f7882;
}
</style>
</head>

<body>

<header>
  <h1>清教学園ハンドベル部 管理者設定</h1>
</header>

<main>

<!-- 管理者ログイン -->
<section id="login" class="card">
  <h2>管理者ログイン</h2>

  <label>メールアドレス</label>
  <input id="email" type="email">

  <label>パスワード</label>
  <input id="password" type="password">

  <button class="primary" onclick="adminLogin()">ログイン</button>

  <div id="loginMsg"></div>

  <p class="small">
    管理者アカウントはFirebase Authenticationで作成し、
    Realtime Databaseの admins/{UID} に true を登録してください。
  </p>
</section>


<section id="app" class="hidden">

<!-- ① 清教学園ハンドベル部予定表 -->
<div class="card">
  <h2>清教学園ハンドベル部予定表</h2>
  <p class="small">
    登録されている予定は「登録済みの予定」に表示されます。
  </p>
</div>


<!-- ② 予定を手動で登録 -->
<div class="card">
  <h2>予定を手動で登録</h2>

  <label>日付</label>
  <input id="sdate" type="date">

  <label>時間</label>
  <input id="stime" placeholder="例：17:00〜19:00">

  <label>場所</label>
  <input id="splace">

  <button class="primary" onclick="saveSchedule()">
    予定を保存
  </button>

  <div id="scheduleMsg"></div>
</div>


<!-- ③ 部員登録 -->
<div class="card">
  <h2>部員登録</h2>

  <label>学校ID</label>
  <input id="mid">

  <label>名前</label>
  <input id="mname">

  <label>学年</label>
  <select id="mgrade">
    <option>1</option>
    <option>2</option>
    <option>3</option>
    <option>4</option>
    <option>5</option>
    <option>6</option>
  </select>

  <label>クラス</label>
  <input id="mclass">

  <button class="primary" onclick="addMember()">
    登録する
  </button>

  <div id="memberMsg"></div>
</div>


<!-- ④ 部員名簿 -->
<div class="card">
  <h2>部員名簿</h2>
  <div id="members"></div>
</div>


<!-- ⑤ 登録済みの予定 -->
<div class="card">
  <h2>登録済みの予定</h2>
  <div id="schedules"></div>
</div>

</section>

</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
   Firebase設定
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",
  authDomain: "seikyo-handbell-club.firebaseapp.com",
  databaseURL: "https://seikyo-handbell-club-default-rtdb.firebaseio.com",
  projectId: "seikyo-handbell-club",
  storageBucket: "seikyo-handbell-club.firebasestorage.app",
  messagingSenderId: "55435007971",
  appId: "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const $ = id => document.getElementById(id);


/* HTMLエスケープ */
const esc = s =>
  String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));


/* =========================
   管理者確認
========================= */

async function admin(){

  if(!auth.currentUser) return false;

  const s = await get(
    ref(db, "admins/" + auth.currentUser.uid)
  );

  return s.exists() && s.val() === true;
}


/* =========================
   メッセージ
========================= */

function m(id, text, error=false){

  $(id).className =
    text
      ? (error ? "msg error" : "msg")
      : "";

  $(id).textContent = text;
}


/* =========================
   ログイン状態
========================= */

onAuthStateChanged(auth, async user => {

  if(user && await admin()){

    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");

    addLogoutButton();

    loadMembers();
    loadSchedules();

  }else{

    $("login").classList.remove("hidden");
    $("app").classList.add("hidden");

  }

});


/* =========================
   ログアウトボタン
========================= */

function addLogoutButton(){

  if(document.getElementById("logoutButton")) return;

  const button = document.createElement("button");

  button.id = "logoutButton";
  button.className = "logout";
  button.textContent = "ログアウト";

  button.onclick = logout;

  document.querySelector("header").appendChild(button);
}


/* =========================
   管理者ログイン
========================= */

async function adminLogin(){

  try{

    await signInWithEmailAndPassword(
      auth,
      $("email").value.trim(),
      $("password").value
    );

    if(!(await admin())){

      await signOut(auth);

      m(
        "loginMsg",
        "このアカウントは管理者として登録されていません。",
        true
      );

    }

  }catch(e){

    m(
      "loginMsg",
      "ログインできませんでした。",
      true
    );

  }

}


/* =========================
   ログアウト
========================= */

function logout(){

  signOut(auth);

}


/* =========================
   部員登録
========================= */

async function addMember(){

  if(!(await admin())) return;

  const id =
    $("mid").value.trim();

  const name =
    $("mname").value.trim();

  const grade =
    $("mgrade").value;

  const cl =
    $("mclass").value.trim();


  if(!id || !name || !cl){

    return m(
      "memberMsg",
      "すべて入力してください。",
      true
    );

  }


  const existing =
    await get(
      ref(db, "memberRegistrations/" + id)
    );


  if(existing.exists()){

    return m(
      "memberMsg",
      "そのIDはすでに登録されています。",
      true
    );

  }


  await set(
    ref(db, "memberRegistrations/" + id),
    {
      schoolId:id,
      name:name,
      grade:grade,
      className:cl,
      createdAt:Date.now()
    }
  );


  await set(
    ref(db, "memberIds/" + id),
    {
      accountCreated:false
    }
  );


  $("mid").value = "";
  $("mname").value = "";
  $("mclass").value = "";


  m(
    "memberMsg",
    "登録しました。"
  );


  loadMembers();

}


/* =========================
   部員名簿
========================= */

async function loadMembers(){

  const s =
    await get(
      ref(db, "memberRegistrations")
    );

  const v =
    s.exists() ? s.val() : {};

  const a =
    Object.entries(v);


  /* 学年 → クラス → 名前順 */

  a.sort(([,x],[,y]) => {

    const grade =
      Number(x.grade) - Number(y.grade);

    if(grade !== 0) return grade;

    const cls =
      String(x.className || "")
        .localeCompare(
          String(y.className || ""),
          "ja"
        );

    if(cls !== 0) return cls;

    return String(x.name || "")
      .localeCompare(
        String(y.name || ""),
        "ja"
      );

  });


  $("members").innerHTML =
    a.length

      ? a.map(([id,x]) => `

        <div class="item">

          <div class="item-head">

            <div class="item-main">

              <strong>
                ${esc(x.name)}
              </strong>

              <div class="small">
                ${esc(id)}
               　
                ${esc(x.grade)}年
                ${esc(x.className)}組
              </div>

            </div>

            <div class="item-actions">

              <button
                class="action"
                onclick="editMember('${id}')">
                変更
              </button>

              <button
                class="action danger"
                onclick="deleteMember('${id}')">
                削除
              </button>

            </div>

          </div>

        </div>

      `).join("")

      : `
        <p class="small">
          まだ登録されていません。
        </p>
      `;

}


/* =========================
   部員変更
========================= */

async function editMember(id){

  const s =
    await get(
      ref(db, "memberRegistrations/" + id)
    );

  if(!s.exists()) return;

  const x = s.val();


  const name =
    prompt("名前", x.name);

  const grade =
    prompt("学年", x.grade);

  const cl =
    prompt("クラス", x.className);


  if(
    name === null ||
    grade === null ||
    cl === null
  ) return;


  await update(
    ref(db, "memberRegistrations/" + id),
    {
      name:name,
      grade:grade,
      className:cl
    }
  );


  loadMembers();

}


/* =========================
   部員削除
========================= */

async function deleteMember(id){

  if(
    !confirm(
      "この部員登録を削除しますか？"
    )
  ) return;


  await remove(
    ref(db, "memberRegistrations/" + id)
  );

  await remove(
    ref(db, "memberIds/" + id)
  );


  loadMembers();

}


/* =========================
   予定を手動登録
========================= */

async function saveSchedule(){

  if(!(await admin())) return;


  const d =
    $("sdate").value;

  const t =
    $("stime").value.trim();

  const p =
    $("splace").value.trim();


  if(!d){

    return m(
      "scheduleMsg",
      "日付を入力してください。",
      true
    );

  }


  await set(
    ref(db, "schedules/" + d),
    {
      time:t,
      place:p,
      updatedAt:Date.now()
    }
  );


  m(
    "scheduleMsg",
    "保存しました。"
  );


  loadSchedules();

}


/* =========================
   登録済みの予定
========================= */

async function loadSchedules(){

  const s =
    await get(
      ref(db, "schedules")
    );

  const v =
    s.exists() ? s.val() : {};

  const a =
    Object.entries(v).sort();


  $("schedules").innerHTML =
    a.length

      ? a.map(([d,x]) => `

        <div class="item">

          <div class="item-head">

            <div class="item-main">

              <strong>
                ${esc(d)}
              </strong>

              <div>
                ${esc(x.time || "")}
              </div>

              <div>
                ${esc(x.place || "")}
              </div>

            </div>

            <div class="item-actions">

              <button
                class="action"
                onclick="editSchedule('${d}')">
                変更
              </button>

              <button
                class="action danger"
                onclick="deleteSchedule('${d}')">
                削除
              </button>

            </div>

          </div>

        </div>

      `).join("")

      : `
        <p class="small">
          予定はありません。
        </p>
      `;

}


/* =========================
   予定変更
========================= */

async function editSchedule(d){

  const s =
    await get(
      ref(db, "schedules/" + d)
    );

  if(!s.exists()) return;

  const x = s.val();


  $("sdate").value = d;
  $("stime").value = x.time || "";
  $("splace").value = x.place || "";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   予定削除
========================= */

async function deleteSchedule(d){

  if(
    !confirm(
      d + "の予定を削除しますか？"
    )
  ) return;


  await remove(
    ref(db, "schedules/" + d)
  );


  loadSchedules();

}


/* =========================
   HTMLから呼び出せるようにする
========================= */

window.adminLogin = adminLogin;
window.logout = logout;

window.addMember = addMember;
window.editMember = editMember;
window.deleteMember = deleteMember;

window.saveSchedule = saveSchedule;
window.editSchedule = editSchedule;
window.deleteSchedule = deleteSchedule;

</script>

</body>
</html>
