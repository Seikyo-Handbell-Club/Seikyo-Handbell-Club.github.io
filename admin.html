<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理者設定｜清教学園ハンドベル部</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#20242a;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

header{
  background:#fff;
  padding:20px;
  border-bottom:1px solid #e5e8ed;
}

h1{
  margin:0;
  text-align:center;
  font-size:21px;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0000000b;
}

.hidden{
  display:none!important;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 5px;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #d9dee7;
  border-radius:10px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:130px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#1f6feb;
  color:#fff;
  width:100%;
  margin-top:14px;
}

.secondary{
  background:#eef3fb;
}

.cancel{
  background:#f1f3f5;
  color:#4b5560;
  width:100%;
  margin-top:8px;
}

.danger{
  background:#fff0f0;
  color:#b22;
  border:1px solid #efbbbb;
}

.msg{
  padding:12px;
  border-radius:10px;
  background:#fff8df;
  color:#69520a;
  margin-top:10px;
  font-size:14px;
}

.error{
  background:#fff0f0;
  color:#9b1c1c;
}

.item{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.row button{
  flex:1;
}

.small{
  font-size:12px;
  color:#6f7882;
}

/* =========================
   部員一覧
========================= */

.member-head{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.member-head strong{
  font-size:16px;
}

.member-actions{
  display:flex;
  gap:5px;
  margin-left:auto;
}

.member-actions button{
  padding:5px 9px;
  font-size:12px;
}

/* =========================
   変更中のフォーム
========================= */

.editing{
  border:2px solid #1f6feb;
}

/* =========================
   OCR
========================= */

.preview{
  max-width:100%;
  max-height:240px;
  border-radius:10px;
  margin-top:10px;
}

.ocr-candidate{
  display:grid;
  grid-template-columns:
    auto
    1fr
    1fr
    1fr;
  gap:7px;
  align-items:center;
  margin:8px 0;
}

.ocr-candidate input{
  padding:8px;
  font-size:14px;
}

.ocr-candidate .ocr-raw{
  grid-column:span 2;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.ocr-day{
  font-weight:700;
  font-size:14px;
  white-space:nowrap;
}

.ocr-note{
  grid-column:span 3;
}

@media(max-width:600px){

  .ocr-candidate{
    grid-template-columns:
      auto
      1fr
      1fr;
  }

  .ocr-candidate button{
    grid-column:span 2;
  }

  .ocr-note{
    grid-column:span 2;
  }

  .ocr-candidate .ocr-raw{
    grid-column:span 2;
  }

}

</style>
</head>


<body>

<header>
<h1>清教学園ハンドベル部 管理者設定</h1>
</header>


<main>


<!-- =========================
     ログイン
========================= -->

<section
  id="login"
  class="card"
>

<h2>管理者ログイン</h2>

<p class="small">
管理者として登録されたアカウントでログインしてください。
</p>


<label>パスワード</label>

<input
  id="password"
  type="password"
  autocomplete="current-password"
>


<button
  class="primary"
  onclick="adminLogin()"
>
ログイン
</button>


<div id="loginMsg"></div>

</section>



<!-- =========================
     管理画面
========================= -->

<section
  id="app"
  class="hidden"
>


<div class="card">

<button
  class="secondary"
  onclick="logout()"
>
ログアウト
</button>

</div>



<!-- =========================
     部員登録・変更
========================= -->

<div
  id="memberFormCard"
  class="card"
>

<h2 id="memberFormTitle">
部員登録
</h2>


<label>学校ID</label>

<input
  id="mid"
  autocomplete="off"
>


<label>名前</label>

<input
  id="mname"
>


<label>学年</label>

<select id="mgrade">

<option value="中学1年">
中学1年
</option>

<option value="中学2年">
中学2年
</option>

<option value="中学3年">
中学3年
</option>

<option value="高校1年">
高校1年
</option>

<option value="高校2年">
高校2年
</option>

</select>


<label>クラス</label>

<select id="mclass">

<option value="A">A組</option>
<option value="B">B組</option>
<option value="C">C組</option>
<option value="D">D組</option>
<option value="E">E組</option>
<option value="F">F組</option>
<option value="G">G組</option>
<option value="H">H組</option>
<option value="I">I組</option>
<option value="J">J組</option>
<option value="K">K組</option>

</select>


<button
  id="memberSubmit"
  class="primary"
  onclick="addMember()"
>
登録する
</button>


<button
  id="memberCancel"
  class="cancel hidden"
  onclick="cancelMemberEdit()"
>
変更をやめる
</button>


<div id="memberMsg"></div>

</div>



<!-- =========================
     部員一覧
========================= -->

<div class="card">

<h2>部員一覧</h2>

<div id="members"></div>

</div>



<!-- =========================
     予定表
========================= -->

<div class="card">

<h2>
清教学園ハンドベル部予定表
</h2>


<label>
予定表の画像
</label>


<input
  id="scheduleImage"
  type="file"
  accept="image/*"
  onchange="previewScheduleImage(event)"
>


<img
  id="schedulePreview"
  class="preview hidden"
>


<button
  class="secondary"
  style="margin-top:10px;width:100%"
  onclick="runOCR()"
>
画像から予定を読み取る
</button>


<div id="ocrMsg"></div>



<label>
読み取った文字
</label>


<textarea
  id="ocrText"
  placeholder="OCR結果がここに表示されます。必要なら修正できます。"
></textarea>



<h3>
予定候補
</h3>


<p class="small">
チェックが入っている予定が登録対象です。OCRが間違っていても、登録前に修正できます。
</p>


<div id="ocrCandidates">

<p class="small">
画像を読み取ると候補が表示されます。
</p>

</div>


<button
  class="primary"
  onclick="registerOCRCandidates()"
>
選択した予定を登録
</button>



<hr
  style="
    border:0;
    border-top:1px solid #e5e8ed;
    margin:20px 0
  "
>



<!-- =========================
     手動予定登録
========================= -->

<h3>
手動で予定を登録
</h3>


<label>
日付
</label>


<input
  id="sdate"
  type="date"
>


<label>
時間
</label>


<input
  id="stime"
  placeholder="例：17:00〜19:00"
>


<label>
場所
</label>


<input
  id="splace"
>


<button
  class="primary"
  onclick="saveSchedule()"
>
予定を保存
</button>


<div id="scheduleMsg"></div>


<div id="schedules"></div>

</div>


</section>

</main>



<script type="module">


/* =====================================================
   Firebase
===================================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";



/* =====================================================
   管理者アカウント
===================================================== */

const ADMIN_EMAIL =
"kazuma.cosmos@gmail.com";



/* =====================================================
   Firebase設定
===================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",

  authDomain:
  "seikyo-handbell-club.firebaseapp.com",

  databaseURL:
  "https://seikyo-handbell-club-default-rtdb.firebaseio.com",

  projectId:
  "seikyo-handbell-club",

  storageBucket:
  "seikyo-handbell-club.firebasestorage.app",

  messagingSenderId:
  "55435007971",

  appId:
  "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"

};


const app =
initializeApp(
  firebaseConfig
);


const auth =
getAuth(app);


const db =
getDatabase(app);



/* =====================================================
   共通
===================================================== */

const $ =
id =>
document.getElementById(id);


const esc =
s =>
String(s ?? "")
.replace(
  /[&<>"']/g,
  c =>
  ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);



/* =====================================================
   状態
===================================================== */

let editingMemberId =
null;


let ocrCandidates =
[];



/* =====================================================
   メッセージ
===================================================== */

function msg(
  id,
  text,
  error=false
){

  const el =
  $(id);


  el.className =
  text
  ? (
      error
      ? "msg error"
      : "msg"
    )
  : "";


  el.textContent =
  text;

}



/* =====================================================
   管理者確認
===================================================== */

async function isAdmin(){

  if(
    !auth.currentUser
  )
    return false;


  const s =
  await get(
    ref(
      db,
      "admins/" +
      auth.currentUser.uid
    )
  );


  return (
    s.exists() &&
    s.val() === true
  );

}



/* =====================================================
   ログイン状態
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(
      user &&
      await isAdmin()
    ){

      $("login")
      .classList
      .add("hidden");


      $("app")
      .classList
      .remove("hidden");


      loadMembers();

      loadSchedules();

    }
    else{

      $("login")
      .classList
      .remove("hidden");


      $("app")
      .classList
      .add("hidden");

    }

  }
);



/* =====================================================
   ログイン
===================================================== */

async function adminLogin(){

  try{

    await signInWithEmailAndPassword(
      auth,
      ADMIN_EMAIL,
      $("password").value
    );


    if(
      !(await isAdmin())
    ){

      await signOut(auth);


      msg(
        "loginMsg",
        "このアカウントは管理者として登録されていません。",
        true
      );

    }
    else{

      $("password").value =
      "";


      msg(
        "loginMsg",
        ""
      );

    }

  }
  catch(e){

    console.error(e);


    msg(
      "loginMsg",
      "ログインできませんでした。パスワードを確認してください。",
      true
    );

  }

}



function logout(){

  signOut(auth);

}



/* =====================================================
   部員登録
===================================================== */

async function addMember(){

  if(
    !(await isAdmin())
  )
    return;


  const id =
  $("mid").value.trim();


  const name =
  $("mname").value.trim();


  const grade =
  $("mgrade").value;


  const cl =
  $("mclass").value;


  if(
    !id ||
    !name ||
    !grade ||
    !cl
  ){

    msg(
      "memberMsg",
      "すべて入力してください。",
      true
    );

    return;

  }


  const existing =
  await get(
    ref(
      db,
      "memberRegistrations/" +
      id
    )
  );


  if(
    existing.exists()
  ){

    msg(
      "memberMsg",
      "その学校IDはすでに登録されています。",
      true
    );

    return;

  }


  await set(
    ref(
      db,
      "memberRegistrations/" +
      id
    ),
    {

      schoolId:id,

      name:name,

      grade:grade,

      className:cl,

      createdAt:
      Date.now()

    }
  );


  await set(
    ref(
      db,
      "memberIds/" +
      id
    ),
    {
      accountCreated:false
    }
  );


  clearMemberForm();


  msg(
    "memberMsg",
    "登録しました。"
  );


  loadMembers();

}



/* =====================================================
   登録フォームを空に戻す
===================================================== */

function clearMemberForm(){

  $("mid").value =
  "";


  $("mname").value =
  "";


  $("mgrade").value =
  "中学1年";


  $("mclass").value =
  "A";

}



/* =====================================================
   部員一覧
===================================================== */

async function loadMembers(){

  const s =
  await get(
    ref(
      db,
      "memberRegistrations"
    )
  );


  const v =
  s.exists()
  ? s.val()
  : {};


  const gradeOrder = {

    "中学1年":1,

    "中学2年":2,

    "中学3年":3,

    "高校1年":4,

    "高校2年":5

  };


  const classOrder =
  c =>
  String(c || "")
  .charCodeAt(0);


  const a =
  Object
  .entries(v)
  .sort(
    ([,x],[,y]) => {

      const g =
      (
        gradeOrder[x.grade] || 99
      )
      -
      (
        gradeOrder[y.grade] || 99
      );


      if(g)
        return g;


      const c =
      classOrder(x.className)
      -
      classOrder(y.className);


      if(c)
        return c;


      return String(
        x.name || ""
      ).localeCompare(
        String(y.name || ""),
        "ja"
      );

    }
  );


  $("members").innerHTML =

  a.length

  ?

  a.map(
    ([id,x]) => `

      <div class="item">

        <div class="member-head">

          <strong>
            ${esc(x.name)}
          </strong>


          <div class="member-actions">

            <button
              class="secondary"
              onclick="editMember('${esc(id)}')"
            >
              変更
            </button>


            <button
              class="danger"
              onclick="deleteMember('${esc(id)}')"
            >
              削除
            </button>

          </div>

        </div>


        <div class="small">

          ${esc(id)}
          　
          ${esc(x.grade)}
          　
          ${esc(x.className)}組

        </div>

      </div>

    `
  ).join("")

  :

  "<p class='small'>まだ登録されていません。</p>";

}



/* =====================================================
   部員変更
===================================================== */

async function editMember(id){

  const s =
  await get(
    ref(
      db,
      "memberRegistrations/" +
      id
    )
  );


  if(
    !s.exists()
  )
    return;


  const x =
  s.val();


  editingMemberId =
  id;


  $("memberFormCard")
  .classList
  .add("editing");


  $("memberFormTitle")
  .textContent =
  "部員変更";


  $("mid").value =
  x.schoolId || id;


  $("mname").value =
  x.name || "";


  $("mgrade").value =
  x.grade || "中学1年";


  $("mclass").value =
  x.className || "A";


  $("memberSubmit")
  .textContent =
  "変更を保存";


  $("memberSubmit")
  .onclick =
  saveMemberEdit;


  $("memberCancel")
  .classList
  .remove("hidden");


  $("memberFormCard")
  .scrollIntoView({

    behavior:"smooth",

    block:"start"

  });

}



/* =====================================================
   部員変更を保存
===================================================== */

async function saveMemberEdit(){

  if(
    !(await isAdmin()) ||
    !editingMemberId
  )
    return;


  const oldId =
  editingMemberId;


  const newId =
  $("mid").value.trim();


  const name =
  $("mname").value.trim();


  const grade =
  $("mgrade").value;


  const cl =
  $("mclass").value;


  if(
    !newId ||
    !name ||
    !grade ||
    !cl
  ){

    msg(
      "memberMsg",
      "すべて入力してください。",
      true
    );

    return;

  }


  if(
    newId !== oldId
  ){

    const exists =
    await get(
      ref(
        db,
        "memberRegistrations/" +
        newId
      )
    );


    if(
      exists.exists()
    ){

      msg(
        "memberMsg",
        "変更後の学校IDはすでに登録されています。",
        true
      );

      return;

    }

  }


  const oldSnap =
  await get(
    ref(
      db,
      "memberRegistrations/" +
      oldId
    )
  );


  const oldData =
  oldSnap.val() || {};


  const newData = {

    ...oldData,

    schoolId:
    newId,

    name:
    name,

    grade:
    grade,

    className:
    cl,

    updatedAt:
    Date.now()

  };


  if(
    newId !== oldId
  ){

    await set(
      ref(
        db,
        "memberRegistrations/" +
        newId
      ),
      newData
    );


    const memberIdSnap =
    await get(
      ref(
        db,
        "memberIds/" +
        oldId
      )
    );


    if(
      memberIdSnap.exists()
    ){

      await set(
        ref(
          db,
          "memberIds/" +
          newId
        ),
        memberIdSnap.val()
      );

    }
    else{

      await set(
        ref(
          db,
          "memberIds/" +
          newId
        ),
        {
          accountCreated:false
        }
      );

    }


    await remove(
      ref(
        db,
        "memberRegistrations/" +
        oldId
      )
    );


    await remove(
      ref(
        db,
        "memberIds/" +
        oldId
      )
    );

  }
  else{

    await update(
      ref(
        db,
        "memberRegistrations/" +
        oldId
      ),
      newData
    );

  }


  cancelMemberEdit();


  msg(
    "memberMsg",
    "変更を保存しました。"
  );


  loadMembers();

}



/* =====================================================
   変更をやめる
===================================================== */

function cancelMemberEdit(){

  editingMemberId =
  null;


  $("memberFormCard")
  .classList
  .remove("editing");


  $("memberFormTitle")
  .textContent =
  "部員登録";


  $("memberSubmit")
  .textContent =
  "登録する";


  $("memberSubmit")
  .onclick =
  addMember;


  $("memberCancel")
  .classList
  .add("hidden");


  clearMemberForm();

}



/* =====================================================
   部員削除
===================================================== */

async function deleteMember(id){

  if(
    !confirm(
      "この部員登録を削除しますか？"
    )
  )
    return;


  await remove(
    ref(
      db,
      "memberRegistrations/" +
      id
    )
  );


  await remove(
    ref(
      db,
      "memberIds/" +
      id
    )
  );


  if(
    editingMemberId === id
  ){

    cancelMemberEdit();

  }


  loadMembers();

}



/* =====================================================
   予定表画像プレビュー
===================================================== */

function previewScheduleImage(event){

  const file =
  event.target.files?.[0];


  if(!file)
    return;


  const url =
  URL.createObjectURL(file);


  $("schedulePreview").src =
  url;


  $("schedulePreview")
  .classList
  .remove("hidden");

}



/* =====================================================
   OCR
===================================================== */

async function runOCR(){

  const file =
  $("scheduleImage")
  .files?.[0];


  if(!file){

    msg(
      "ocrMsg",
      "先に予定表の画像を選択してください。",
      true
    );

    return;

  }


  msg(
    "ocrMsg",
    "予定表を読み取っています。少し待ってください。"
  );


  try{

    const result =
    await Tesseract.recognize(
      file,
      "jpn+eng",
      {

        logger:m=>{

          if(
            m.status ===
            "recognizing text"
          ){

            msg(
              "ocrMsg",
              "予定表を読み取っています… " +
              Math.round(
                (m.progress || 0) * 100
              ) +
              "%"
            );

          }

        },

        /*
         * 表の文字をバラバラに認識しやすくする
         */
        tessedit_pageseg_mode:11

      }
    );


    const rawText =
    result.data.text || "";


    $("ocrText").value =
    rawText;


    ocrCandidates =
    parseScheduleTable(
      result.data,
      rawText
    );


    renderOCRCandidates();


    if(
      ocrCandidates.length
    ){

      msg(
        "ocrMsg",
        "読み取り完了。予定候補を確認してください。"
      );

    }
    else{

      msg(
        "ocrMsg",
        "日付を読み取れませんでした。画像を確認してください。",
        true
      );

    }

  }
  catch(e){

    console.error(e);


    msg(
      "ocrMsg",
      "画像を読み取れませんでした。もう一度試してください。",
      true
    );

  }

}



/* =====================================================
   表形式予定表の解析
===================================================== */

function parseScheduleTable(
  data,
  text
){

  /*
   * 予定表の月を検出
   */

  const month =
  detectScheduleMonth(
    text
  );


  /*
   * 年を検出
   */

  const year =
  detectScheduleYear(
    text
  );


  /*
   * Tesseractの行情報
   */

  let lines =
  Array.isArray(
    data?.lines
  )
  ? data.lines
  : [];


  /*
   * 行情報が取れない場合
   */

  if(
    !lines.length
  ){

    lines =
    text
    .split(/\r?\n/)
    .map(
      (text,i)=>({

        text,

        bbox:{
          x0:0,
          y0:i*30,
          x1:1000,
          y1:i*30+20
        }

      })
    );

  }


  /*
   * OCR文字を整理
   */

  lines =
  lines
  .filter(
    x =>
    String(
      x.text || ""
    ).trim()
  )
  .map(
    x => ({

      text:
      normalizeOCRText(
        x.text
      ),

      y:
      (
        Number(
          x.bbox?.y0 || 0
        )
        +
        Number(
          x.bbox?.y1 || 0
        )
      ) / 2

    })
  )
  .sort(
    (a,b)=>
    a.y-b.y
  );


  /*
   * 日付の行を探す
   */

  const dateRows=[];


  for(
    const line of lines
  ){

    const m =
    findScheduleDate(
      line.text,
      month
    );


    if(!m)
      continue;


    const exists =
    dateRows.find(
      x =>
      x.day === m.day
    );


    if(!exists){

      dateRows.push({

        day:
        m.day,

        y:
        line.y,

        text:
        line.text

      });

    }

  }


  /*
   * 日付を見つけられなかった場合は
   * 従来方式へ
   */

  if(
    !dateRows.length
  ){

    return parseScheduleCandidates(
      text
    );

  }


  /*
   * 日付順
   */

  dateRows.sort(
    (a,b)=>
    a.day-b.day
  );


  const result=[];


  /*
   * 日付ごとに処理
   */

  for(
    let i=0;
    i<dateRows.length;
    i++
  ){

    const row =
    dateRows[i];


    const next =
    dateRows[i+1];


    const top =
    row.y - 35;


    const bottom =
    next
    ? next.y - 15
    : row.y + 100;


    const rowLines =
    lines.filter(
      x =>
      x.y >= top &&
      x.y < bottom
    );


    const rowText =
    rowLines
    .map(
      x =>
      x.text
    )
    .join(" ")
    .replace(
      /\s+/g,
      " "
    )
    .trim();


    const time =
    extractScheduleTime(
      rowText
    );


    const place =
    extractSchedulePlace(
      rowText
    );


    const note =
    extractScheduleNote(
      rowText
    );


    /*
     * 時間がある、
     * またはイベント系の文字がある場合は
     * 初期状態でチェック。
     */

    const active =
    !!(
      time ||
      /リハーサル|文化祭|練習|本番|演奏|準備|コンサート|発表/
      .test(rowText)
    );


    result.push({

      selected:
      active,

      date:
      `${year}-${String(month).padStart(2,"0")}-${String(row.day).padStart(2,"0")}`,

      time:
      time,

      place:
      place,

      note:
      note,

      raw:
      rowText

    });

  }


  /*
   * OCRが読み取れなかった日も
   * 1〜月末まで全部表示する
   */

  const maxDay =
  getDaysInMonth(
    year,
    month
  );


  const byDay =
  new Map(
    result.map(
      x => [
        Number(
          x.date.slice(8,10)
        ),
        x
      ]
    )
  );


  const complete=[];


  for(
    let day=1;
    day<=maxDay;
    day++
  ){

    if(
      byDay.has(day)
    ){

      complete.push(
        byDay.get(day)
      );

    }
    else{

      complete.push({

        selected:false,

        date:
        `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`,

        time:"",

        place:"",

        note:"",

        raw:""

      });

    }

  }


  return complete;

}



/* =====================================================
   OCR文字の正規化
===================================================== */

function normalizeOCRText(text){

  return String(
    text || ""
  )

  .replace(
    /　/g,
    " "
  )

  .replace(
    /[|｜]/g,
    " "
  )

  .replace(
    /[：﹕]/g,
    ":"
  )

  .replace(
    /[～〜~]/g,
    "〜"
  )

  .replace(
    /[－—–]/g,
    "-"
  )

  .replace(
    /\s+/g,
    " "
  )

  .trim();

}



/* =====================================================
   月を検出
===================================================== */

function detectScheduleMonth(text){

  const t =
  normalizeOCRText(
    text
  );


  const m =
  t.match(
    /(\d{1,2})\s*月/
  );


  if(m){

    const n =
    Number(
      m[1]
    );


    if(
      n>=1 &&
      n<=12
    )
      return n;

  }


  /*
   * 今回のように
   * タイトルの「9月」が
   * OCRされた場合
   */

  const m2 =
  t.match(
    /([1-9]|1[0-2])/
  );


  if(m2){

    const n =
    Number(
      m2[1]
    );


    if(
      n>=1 &&
      n<=12
    )
      return n;

  }


  return (
    new Date()
    .getMonth()
    +
    1
  );

}



/* =====================================================
   年を検出
===================================================== */

function detectScheduleYear(text){

  const m =
  String(
    text || ""
  )
  .match(
    /20\d{2}/
  );


  if(m)
    return Number(
      m[0]
    );


  return new Date()
  .getFullYear();

}



/* =====================================================
   日付検出
===================================================== */

function findScheduleDate(
  text,
  month
){

  let t =
  normalizeOCRText(
    text
  );


  /*
   * 9月1日
   */

  let m =
  t.match(
    /(?:\d{1,2})\s*月\s*(\d{1,2})\s*[日昌]?/
  );


  if(m){

    const day =
    Number(
      m[1]
    );


    if(
      day>=1 &&
      day<=31
    ){

      return {

        month:
        month,

        day:
        day

      };

    }

  }


  /*
   * 9月1
   */

  m =
  t.match(
    /(?:\d{1,2})\s*月\s*(\d{1,2})/
  );


  if(m){

    const day =
    Number(
      m[1]
    );


    if(
      day>=1 &&
      day<=31
    ){

      return {

        month:
        month,

        day:
        day

      };

    }

  }


  return null;

}



/* =====================================================
   時間抽出
===================================================== */

function extractScheduleTime(text){

  const t =
  normalizeOCRText(
    text
  );


  /*
   * 15:45〜18:00
   */

  let m =
  t.match(
    /(\d{1,2})\s*:\s*(\d{2})\s*[〜\-]\s*(\d{1,2})\s*:\s*(\d{2})/
  );


  if(m){

    return (

      `${m[1].padStart(2,"0")}:${m[2]}` +

      `〜` +

      `${m[3].padStart(2,"0")}:${m[4]}`

    );

  }


  /*
   * 1545〜1800
   */

  m =
  t.match(
    /(\d{3,4})\s*[〜\-]\s*(\d{3,4})/
  );


  if(m){

    const a =
    normalizeTimeNumber(
      m[1]
    );


    const b =
    normalizeTimeNumber(
      m[2]
    );


    if(
      a &&
      b
    ){

      return (
        `${a}〜${b}`
      );

    }

  }


  return "";

}



/* =====================================================
   時刻補正
===================================================== */

function normalizeTimeNumber(
  value
){

  const s =
  String(
    value
  );


  if(
    s.length === 3
  ){

    return (
      "0" +
      s[0] +
      ":" +
      s.slice(1)
    );

  }


  if(
    s.length === 4
  ){

    return (
      s.slice(0,2) +
      ":" +
      s.slice(2)
    );

  }


  return "";

}



/* =====================================================
   場所抽出
===================================================== */

function extractSchedulePlace(
  text
){

  const t =
  normalizeOCRText(
    text
  );


  const places = [

    "音楽練習室",

    "音楽室",

    "講堂",

    "体育館",

    "礼拝堂",

    "教室"

  ];


  for(
    const place of places
  ){

    if(
      t.includes(place)
    ){

      return place;

    }

  }


  return "";

}



/* =====================================================
   備考・内容抽出
===================================================== */

function extractScheduleNote(
  text
){

  const t =
  normalizeOCRText(
    text
  );


  const notes=[];


  /*
   * 文化祭
   */

  const festival =
  t.match(
    /文化祭[①②③④⑤1-5]?/
  );


  if(festival){

    notes.push(
      festival[0]
    );

  }


  /*
   * リハーサル
   */

  if(
    /リハーサル/
    .test(t)
  ){

    const m =
    t.match(
      /リハーサル\s*[？?]?/
    );


    notes.push(
      m
      ? m[0]
      : "リハーサル"
    );

  }


  /*
   * 文化祭準備
   */

  if(
    /文化祭準備/
    .test(t)
  ){

    notes.push(
      "文化祭準備"
    );

  }


  /*
   * 不在
   */

  const absence =
  t.match(
    /不在\s*[:：]?\s*[^ ]+/
  );


  if(absence){

    notes.push(
      absence[0]
    );

  }


  /*
   * 敬老の日
   */

  if(
    /敬老の日/
    .test(t)
  ){

    notes.push(
      "敬老の日"
    );

  }


  /*
   * 国民の休日
   */

  if(
    /国民の休日/
    .test(t)
  ){

    notes.push(
      "国民の休日"
    );

  }


  /*
   * 秋分の日
   */

  if(
    /秋分の日/
    .test(t)
  ){

    notes.push(
      "秋分の日"
    );

  }


  return [
    ...new Set(
      notes
    )
  ].join(
    " / "
  );

}



/* =====================================================
   月の日数
===================================================== */

function getDaysInMonth(
  year,
  month
){

  return new Date(
    year,
    month,
    0
  ).getDate();

}



/* =====================================================
   従来型OCR
   （予備）
===================================================== */

function parseScheduleCandidates(
  text
){

  const lines =
  text
  .split(/\r?\n/)
  .map(
    x =>
    x.trim()
  )
  .filter(Boolean);


  const found=[];


  const dateRe =
  /(\d{1,2})\s*月\s*(\d{1,2})\s*[日昌]?/;


  for(
    const line of lines
  ){

    const m =
    line.match(
      dateRe
    );


    if(!m)
      continue;


    const month =
    Number(
      m[1]
    );


    const day =
    Number(
      m[2]
    );


    if(
      month<1 ||
      month>12 ||
      day<1 ||
      day>31
    )
      continue;


    const time =
    extractScheduleTime(
      line
    );


    const place =
    extractSchedulePlace(
      line
    );


    const note =
    extractScheduleNote(
      line
    );


    found.push({

      selected:
      !!(
        time ||
        note
      ),

      date:
      `${new Date().getFullYear()}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`,

      time:

      time,

      place:

      place,

      note:

      note,

      raw:

      line

    });

  }


  const unique=[];


  const seen =
  new Set();


  for(
    const x of found
  ){

    if(
      seen.has(
        x.date
      )
    )
      continue;


    seen.add(
      x.date
    );


    unique.push(
      x
    );

  }


  return unique;

}



/* =====================================================
   OCR候補表示
===================================================== */

function renderOCRCandidates(){

  const el =
  $("ocrCandidates");


  if(
    !ocrCandidates.length
  ){

    el.innerHTML =
    "<p class='small'>予定を自動認識できませんでした。手動登録を使ってください。</p>";

    return;

  }


  el.innerHTML =

  ocrCandidates
  .map(
    (x,i)=>`

      <div
        class="ocr-candidate"
        style="
          border:1px solid #e3e7ed;
          border-radius:12px;
          padding:10px;
          margin-bottom:8px;
        "
      >


        <div
          class="ocr-day"
        >

          <input
            type="checkbox"
            ${x.selected ? "checked" : ""}
            onchange="
              updateOCRCandidate(
                ${i},
                'selected',
                this.checked
              )
            "
          >

          ${esc(x.date)}

        </div>


        <input
          type="date"
          value="${esc(x.date)}"
          onchange="
            updateOCRCandidate(
              ${i},
              'date',
              this.value
            )
          "
        >


        <input
          placeholder="時間"
          value="${esc(x.time)}"
          onchange="
            updateOCRCandidate(
              ${i},
              'time',
              this.value
            )
          "
        >


        <button
          class="danger"
          onclick="
            removeOCRCandidate(${i})
          "
        >
          削除
        </button>


        <input
          placeholder="場所"
          value="${esc(x.place)}"
          onchange="
            updateOCRCandidate(
              ${i},
              'place',
              this.value
            )
          "
        >


        <input
          class="ocr-note"
          placeholder="内容・備考"
          value="${esc(x.note || "")}"
          onchange="
            updateOCRCandidate(
              ${i},
              'note',
              this.value
            )
          "
        >


        <span
          class="small ocr-raw"
        >
          OCR：
          ${esc(x.raw || "文字なし")}

        </span>


      </div>

    `
  )
  .join("");

}



/* =====================================================
   OCR候補更新
===================================================== */

function updateOCRCandidate(
  index,
  key,
  value
){

  if(
    !ocrCandidates[index]
  )
    return;


  ocrCandidates[index][key] =
  value;

}



/* =====================================================
   OCR候補削除
===================================================== */

function removeOCRCandidate(
  i
){

  ocrCandidates.splice(
    i,
    1
  );


  renderOCRCandidates();

}



/* =====================================================
   OCR予定登録
===================================================== */

async function registerOCRCandidates(){

  if(
    !(await isAdmin())
  )
    return;


  const selected =
  ocrCandidates.filter(
    x =>
    x.selected &&
    x.date
  );


  if(
    !selected.length
  ){

    msg(
      "ocrMsg",
      "登録する予定を選択してください。",
      true
    );

    return;

  }


  if(
    !confirm(
      selected.length +
      "件の予定を登録しますか？"
    )
  ){

    return;

  }


  for(
    const x of selected
  ){

    await set(
      ref(
        db,
        "schedules/" +
        x.date
      ),
      {

        time:
        x.time || "",

        place:
        x.place || "",

        note:
        x.note || "",

        updatedAt:
        Date.now()

      }
    );

  }


  msg(
    "ocrMsg",
    selected.length +
    "件の予定を登録しました。"
  );


  loadSchedules();

}



/* =====================================================
   手動予定登録
===================================================== */

async function saveSchedule(){

  if(
    !(await isAdmin())
  )
    return;


  const d =
  $("sdate").value;


  const t =
  $("stime").value.trim();


  const p =
  $("splace").value.trim();


  if(!d){

    msg(
      "scheduleMsg",
      "日付を入力してください。",
      true
    );

    return;

  }


  await set(
    ref(
      db,
      "schedules/" +
      d
    ),
    {

      time:
      t,

      place:
      p,

      updatedAt:
      Date.now()

    }
  );


  msg(
    "scheduleMsg",
    "保存しました。"
  );


  loadSchedules();

}



/* =====================================================
   予定一覧
===================================================== */

async function loadSchedules(){

  const s =
  await get(
    ref(
      db,
      "schedules"
    )
  );


  const v =
  s.exists()
  ? s.val()
  : {};


  const a =
  Object
  .entries(v)
  .sort();


  $("schedules").innerHTML =

  a.length

  ?

  a.map(
    ([d,x]) => `

      <div class="item">

        <strong>
          ${esc(d)}
        </strong>


        <br>


        ${esc(
          x.time || ""
        )}


        <br>


        ${esc(
          x.place || ""
        )}


        ${
          x.note
          ?
          `<br>${esc(x.note)}`
          :
          ""
        }


        <div class="row">

          <button
            onclick="
              editSchedule('${esc(d)}')
            "
          >
            変更
          </button>


          <button
            class="danger"
            onclick="
              deleteSchedule('${esc(d)}')
            "
          >
            削除
          </button>

        </div>

      </div>

    `
  ).join("")

  :

  "<p class='small'>予定はありません。</p>";

}



/* =====================================================
   予定変更
===================================================== */

async function editSchedule(
  d
){

  const s =
  await get(
    ref(
      db,
      "schedules/" +
      d
    )
  );


  if(
    !s.exists()
  )
    return;


  const x =
  s.val();


  $("sdate").value =
  d;


  $("stime").value =
  x.time || "";


  $("splace").value =
  x.place || "";


  $("sdate")
  .scrollIntoView({

    behavior:
    "smooth",

    block:
    "center"

  });

}



/* =====================================================
   予定削除
===================================================== */

async function deleteSchedule(
  d
){

  if(
    confirm(
      d +
      "の予定を削除しますか？"
    )
  ){

    await remove(
      ref(
        db,
        "schedules/" +
        d
      )
    );


    loadSchedules();

  }

}
