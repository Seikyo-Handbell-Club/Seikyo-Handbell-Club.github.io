<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>管理者設定｜清教学園ハンドベル部</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#20242a;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;

header{

h1{

main{

.card{

}

.hidden{
  display:none!important;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 5px;
}

input,
select,
textarea{

  background:#fff;

textarea{

}

button{

  padding:11px 14px;

  font-size:14px;
}

button:disabled{

}

.primary{

  color:#fff;

}

.secondary{

  color:#20242a;
}

.danger{

}

.msg{

  margin-top:10px;
  font-size:14px;

}

.error{
  background:#fff0f0;
  color:#9b1c1c;
}

.success{
  background:#effaf1;
  color:#176b2c;
}

.item{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.row button{
  flex:1;
}

.small{
  font-size:12px;
  color:#6f7882;
}

.section-title{
  margin-top:0;
  margin-bottom:4px;
}

.sub-title{
  margin-top:0;
  color:#68717d;
  font-size:13px;
}

.pdf-box{

  border-radius:14px;
  padding:16px;

  margin-top:10px;
}

.pdf-box input{
  background:#fff;
}

.candidate{
  border:1px solid #dfe4eb;
  border-radius:14px;
  padding:14px;
  margin-top:12px;
  background:#fff;
}

.candidate-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.candidate-head input[type="checkbox"]{
  width:20px;
  height:20px;
  flex:none;
}

.candidate-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.candidate-grid label{
  margin:0;
  font-size:12px;
  color:#66717e;
}

.candidate-grid input,
.candidate-grid textarea{
  margin-top:4px;
  font-size:14px;
}

.pdf-status{
  margin-top:10px;
  white-space:pre-wrap;
}

.loading{
  opacity:.7;
  pointer-events:none;
}

.divider{
  height:1px;
  background:#e5e8ed;
  margin:20px 0;
}

@media(max-width:600px){
  .candidate-grid{
    grid-template-columns:1fr;
  }

  .row{
    flex-direction:column;
  }

  .row button{
    width:100%;
  }
}
</style>
</head>

<!-- =========================

========================= -->

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================================
   Firebase設定
========================================= */

const firebaseConfig = {
  apiKey:
    "AIzaSyAK9yRrSSLsfYpLSyuzwRyI2ZZp32KeMSA",

  authDomain:
    "seikyo-handbell-club.firebaseapp.com",

  databaseURL:
    "https://seikyo-handbell-club-default-rtdb.firebaseio.com",

  projectId:
    "seikyo-handbell-club",

  storageBucket:
    "seikyo-handbell-club.firebasestorage.app",

  messagingSenderId:
    "55435007971",

  appId:
    "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"
};


/* =========================================
   管理者アカウント
   メールアドレスは画面には表示しない
========================================= */

const ADMIN_EMAIL =
  "kazuma.cosmos@gmail.com";


/* =========================================
   Firebase初期化
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);


/* =========================================
   DOM
========================================= */

const $ =
  id => document.getElementById(id);


/* =========================================
   HTMLエスケープ
========================================= */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c]));

}


/* =========================================
   メッセージ表示
========================================= */

function message(
  id,
  text,
  type = ""
){

  const el = $(id);

  el.className =
    text
      ? `msg ${type}`
      : "";

  el.textContent =
    text || "";

}


/* =========================================
   管理者権限確認
========================================= */

async function isAdmin(){

  if(!auth.currentUser){
    return false;
  }

  const snapshot =
    await get(
      ref(
        db,
        "admins/" +
        auth.currentUser.uid
      )
    );

  return (
    snapshot.exists() &&
    snapshot.val() === true
  );
}


/* =========================================
   認証状態監視
========================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(
      user &&
      await isAdmin()
    ){

      $("login")
        .classList
        .add("hidden");

      $("app")
        .classList
        .remove("hidden");

      $("password").value = "";

      await loadMembers();

      await loadSchedules();

    }else{

      $("login")
        .classList
        .remove("hidden");

      $("app")
        .classList
        .add("hidden");

    }

  }
);


/* =========================================
   管理者ログイン
========================================= */

async function adminLogin(){

  const password =
    $("password")
      .value;

  message(
    "loginMsg",
    ""
  );

  if(!password){

    message(
      "loginMsg",
      "パスワードを入力してください。",
      "error"
    );

    return;
  }

  const button =
    $("loginButton");

  button.disabled = true;

  button.textContent =
    "ログイン中...";

  try{

    /*
      ここが重要。

      メールアドレスは画面から入力させず、
      管理者アカウントとして登録してある
      ADMIN_EMAIL を内部で使用する。
    */

    await signInWithEmailAndPassword(
      auth,
      ADMIN_EMAIL,
      password
    );

    /*
      ログインできても
      admins/{UID} が true でなければ
      管理画面には入れない。
    */

    const admin =
      await isAdmin();

    if(!admin){

      await signOut(auth);

      message(
        "loginMsg",
        "このアカウントは管理者として登録されていません。",
        "error"
      );

      return;
    }

  }catch(error){

    console.error(
      "管理者ログインエラー:",
      error
    );

    let text =
      "ログインできませんでした。\n";

    if(
      error &&
      error.code
    ){

      switch(error.code){

        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found":
          text +=
            "パスワードを確認してください。";
          break;

        case "auth/too-many-requests":
          text +=
            "ログイン試行回数が多いため、一時的に制限されています。";
          break;

        case "auth/network-request-failed":
          text +=
            "ネットワーク接続を確認してください。";
          break;

        default:
          text +=
            "Firebase Authenticationの設定を確認してください。";
          break;

      }

    }else{

      text +=
        "Firebaseとの通信を確認してください。";

    }

    message(
      "loginMsg",
      text,
      "error"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "ログイン";

  }

}


/* =========================================
   ログアウト
========================================= */

async function logout(){

  await signOut(auth);

}


/* =========================================
   部員登録
========================================= */

async function addMember(){

  if(!(await isAdmin())){
    return;
  }

  const id =
    $("mid")
      .value
      .trim();

  const name =
    $("mname")
      .value
      .trim();

  const grade =
    $("mgrade")
      .value;

  const className =
    $("mclass")
      .value;

  if(
    !id ||
    !name ||
    !grade ||
    !className
  ){

    message(
      "memberMsg",
      "学校ID・名前・学年・クラスをすべて入力してください。",
      "error"
    );

    return;
  }


  const existing =
    await get(
      ref(
        db,
        "memberRegistrations/" +
        id
      )
    );

  if(existing.exists()){

    message(
      "memberMsg",
      "その学校IDはすでに登録されています。",
      "error"
    );

    return;
  }


  await set(
    ref(
      db,
      "memberRegistrations/" +
      id
    ),
    {
      schoolId:id,
      name:name,
      grade:grade,
      className:className,
      createdAt:Date.now()
    }
  );


  /*
    初回パスワード設定用
  */

  await set(
    ref(
      db,
      "memberIds/" +
      id
    ),
    {
      accountCreated:false
    }
  );


  $("mid").value = "";
  $("mname").value = "";
  $("mgrade").value = "";
  $("mclass").value = "";


  message(
    "memberMsg",
    "登録しました。",
    "success"
  );


  await loadMembers();

}


/* =========================================
   学年順
========================================= */

const gradeOrder = {
  "中学1年":0,
  "中学2年":1,
  "中学3年":2,
  "高校1年":3,
  "高校2年":4
};


/* =========================================
   クラス順
========================================= */

const classOrder = {
  A:0,
  B:1,
  C:2,
  D:3,
  E:4,
  F:5,
  G:6,
  H:7,
  I:8,
  J:9,
  K:10
};


/* =========================================
   部員一覧
========================================= */

async function loadMembers(){

  const snapshot =
    await get(
      ref(
        db,
        "memberRegistrations"
      )
    );

  const data =
    snapshot.exists()
      ? snapshot.val()
      : {};

  const members =
    Object.entries(data);


  members.sort(
    ([,a],[,b]) => {

      const gradeDiff =
        (
          gradeOrder[a.grade] ?? 99
        ) -
        (
          gradeOrder[b.grade] ?? 99
        );

      if(gradeDiff !== 0){
        return gradeDiff;
      }


      const classDiff =
        (
          classOrder[a.className] ?? 99
        ) -
        (
          classOrder[b.className] ?? 99
        );

      if(classDiff !== 0){
        return classDiff;
      }


      return String(
        a.name || ""
      ).localeCompare(
        String(
          b.name || ""
        ),
        "ja"
      );

    }
  );


  if(!members.length){

    $("members").innerHTML =
      "<p class='small'>まだ登録されていません。</p>";

    return;
  }


  $("members").innerHTML =
    members
      .map(
        ([id,x]) => `

          <div class="item">

            <div>
              <strong>
                ${esc(x.name)}
              </strong>

              <span class="small">
                （${esc(id)}）
              </span>
            </div>

            <div class="small">
              ${esc(x.grade)}
              ・
              ${esc(x.className)}組
            </div>

            <div class="row">

              <button
                onclick="editMember('${esc(id)}')"
              >
                変更
              </button>

              <button
                class="danger"
                onclick="deleteMember('${esc(id)}')"
              >
                削除
              </button>

            </div>

          </div>

        `
      )
      .join("");

}


/* =========================================
   部員変更
========================================= */

async function editMember(id){

  if(!(await isAdmin())){
    return;
  }

  const snapshot =
    await get(
      ref(
        db,
        "memberRegistrations/" +
        id
      )
    );

  if(!snapshot.exists()){
    return;
  }

  const data =
    snapshot.val();


  const name =
    prompt(
      "名前",
      data.name || ""
    );

  if(name === null){
    return;
  }


  const grade =
    prompt(
      "学年\n\n中学1年\n中学2年\n中学3年\n高校1年\n高校2年",
      data.grade || ""
    );

  if(grade === null){
    return;
  }


  const className =
    prompt(
      "クラス（A〜K）",
      data.className || ""
    );

  if(className === null){
    return;
  }


  const normalizedClass =
    className
      .replace("組","")
      .trim()
      .toUpperCase();


  if(
    !Object.prototype.hasOwnProperty.call(
      gradeOrder,
      grade
    )
  ){

    alert(
      "学年は「中学1年」〜「高校2年」で入力してください。"
    );

    return;
  }


  if(
    !Object.prototype.hasOwnProperty.call(
      classOrder,
      normalizedClass
    )
  ){

    alert(
      "クラスはA〜Kで入力してください。"
    );

    return;
  }


  await update(
    ref(
      db,
      "memberRegistrations/" +
      id
    ),
    {
      name:name.trim(),
      grade:grade,
      className:normalizedClass
    }
  );


  await loadMembers();

}


/* =========================================
   部員削除
========================================= */

async function deleteMember(id){

  if(!(await isAdmin())){
    return;
  }

  const ok =
    confirm(
      "この部員登録を削除しますか？"
    );

  if(!ok){
    return;
  }


  await remove(
    ref(
      db,
      "memberRegistrations/" +
      id
    )
  );


  await remove(
    ref(
      db,
      "memberIds/" +
      id
    )
  );


  await loadMembers();

}


/* =========================================
   PDF.js
========================================= */

let pdfjsLib = null;


/* =========================================
   PDF.js読み込み
========================================= */

async function getPdfJs(){

  if(pdfjsLib){
    return pdfjsLib;
  }


  const module =
    await import(
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    );


  module.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


  pdfjsLib =
    module;


  return pdfjsLib;

}


/* =========================================
   PDFからテキストを抽出
========================================= */

async function extractPdfLines(file){

  const pdf =
    await getPdfJs();


  const buffer =
    await file.arrayBuffer();


  const document =
    await pdf.getDocument({
      data:buffer
    }).promise;


  const allLines = [];


  for(
    let pageNumber = 1;
    pageNumber <= document.numPages;
    pageNumber++
  ){

    const page =
      await document.getPage(
        pageNumber
      );


    const content =
      await page.getTextContent();


    /*
      PDFの文字を
      Y座標ごとの行にまとめる。
    */

    const items =
      content.items
        .filter(
          item =>
            item.str &&
            item.str.trim()
        )
        .map(
          item => {

            const transform =
              item.transform || [];

            return {
              text:item.str.trim(),
              x:Number(
                transform[4] || 0
              ),
              y:Number(
                transform[5] || 0
              ),
              width:Number(
                item.width || 0
              )
            };

          }
        );


    items.sort(
      (a,b) => {

        if(
          Math.abs(
            a.y - b.y
          ) > 3
        ){

          return b.y - a.y;

        }

        return a.x - b.x;

      }
    );


    const rows = [];


    for(const item of items){

      let row =
        rows.find(
          r =>
            Math.abs(
              r.y - item.y
            ) < 4
        );


      if(!row){

        row = {
          y:item.y,
          items:[]
        };

        rows.push(row);

      }


      row.items.push(item);

    }


    rows.sort(
      (a,b) =>
        b.y - a.y
    );


    for(const row of rows){

      row.items.sort(
        (a,b) =>
          a.x - b.x
      );


      const text =
        row.items
          .map(
            item => item.text
          )
          .join(" ")
          .replace(
            /\s+/g,
            " "
          )
          .trim();


      if(text){

        allLines.push({
          page:pageNumber,
          y:row.y,
          items:row.items,
          text:text
        });

      }

    }

  }


  return allLines;

}


/* =========================================
   PDF予定解析
========================================= */

function parseScheduleLines(lines){

  /*
    PDFの中から月を探す。

    ただし「練習曲の目安」など
    関係ない文字列は無視する。
  */

  let month = null;


  for(const line of lines){

    const match =
      line.text.match(
        /(\d{1,2})月/
      );

    if(match){

      const m =
        Number(match[1]);

      if(
        m >= 1 &&
        m <= 12
      ){

        month = m;

        break;

      }

    }

  }


  /*
    月が見つからなかった場合は
    現在の月を使用。
  */

  if(!month){

    month =
      new Date()
        .getMonth() + 1;

  }


  const year =
    new Date()
      .getFullYear();


  const candidates = [];


  let currentDate = null;


  /*
    PDF抽出後の文字列を
    順番に処理する。
  */

  for(
    let i = 0;
    i < lines.length;
    i++
  ){

    const raw =
      lines[i].text;


    /*
      練習曲関連は完全に無視
    */

    if(
      raw.includes("練習曲の目安")
    ){

      continue;

    }


    /*
      「○月○日」
    */

    let dateMatch =
      raw.match(
        /(\d{1,2})月\s*(\d{1,2})日?/
      );


    /*
      「10/1」のような表記にも対応
    */

    if(!dateMatch){

      dateMatch =
        raw.match(
          /(\d{1,2})[\/／](\d{1,2})/
        );

    }


    if(dateMatch){

      const m =
        Number(dateMatch[1]);

      const d =
        Number(dateMatch[2]);


      if(
        m >= 1 &&
        m <= 12 &&
        d >= 1 &&
        d <= 31
      ){

        month = m;

        currentDate = {
          year:year,
          month:m,
          day:d
        };


        /*
          日付の後ろに
          時間・場所などが続いている場合、
          同じ行も解析する。
        */

        const rest =
          raw
            .replace(
              dateMatch[0],
              ""
            )
            .trim();


        if(rest){

          const candidate =
            makeCandidate(
              currentDate,
              rest
            );

          if(candidate){
            candidates.push(
              candidate
            );
          }

        }

        continue;

      }

    }


    /*
      日付が確定している場合、
      次の行にある時間や場所を
      補足として扱う。
    */

    if(currentDate){

      const candidate =
        makeCandidate(
          currentDate,
          raw
        );


      if(candidate){

        /*
          まったく関係ない文章を
          予定として登録しないため、
          活動時間・場所・不在など
          予定表らしい内容を含む場合だけ採用。
        */

        if(
          containsScheduleInformation(
            raw
          )
        ){

          candidates.push(
            candidate
          );

        }

      }

    }

  }


  /*
    重複削除
  */

  const unique =
    new Map();


  for(const item of candidates){

    const key =
      [
        item.date,
        item.time,
        item.place,
        item.note
      ].join("|");


    if(!unique.has(key)){

      unique.set(
        key,
        item
      );

    }

  }


  return Array.from(
    unique.values()
  );

}


/* =========================================
   予定らしい文字か
========================================= */

function containsScheduleInformation(text){

  return (
    /\d{1,2}:\d{2}/.test(text) ||
    /音楽練習室/.test(text) ||
    /不在/.test(text) ||
    /文化祭/.test(text) ||
    /リハーサル/.test(text) ||
    /準備/.test(text) ||
    /休み/.test(text)
  );

}


/* =========================================
   1行から予定候補を作る
========================================= */

function makeCandidate(dateObj,text){

  if(!text){
    return null;
  }


  /*
    練習曲は無視
  */

  if(
    text.includes("練習曲")
  ){

    return null;

  }


  const yyyy =
    String(
      dateObj.year
    );


  const mm =
    String(
      dateObj.month
    ).padStart(
      2,
      "0"
    );


  const dd =
    String(
      dateObj.day
    ).padStart(
      2,
      "0"
    );


  const date =
    `${yyyy}-${mm}-${dd}`;


  /*
    時間
  */

  const timeMatches =
    text.match(
      /\d{1,2}:\d{2}\s*[〜~\-－]\s*\d{1,2}:\d{2}/g
    );


  let time =
    timeMatches
      ? timeMatches[0]
      : "";


  /*
    「15:45〜18:00」の
    前後に余計な空白がある場合
  */

  time =
    time.replace(
      /\s+/g,
      ""
    );


  /*
    場所
  */

  let place = "";


  if(
    text.includes("音楽練習室")
  ){

    place =
      "音楽練習室";

  }


  /*
    備考

    時間・場所・練習曲関連を
    取り除いて残ったもの。
  */

  let note =
    text;


  if(time){

    note =
      note.replace(
        timeMatches[0],
        ""
      );

  }


  if(place){

    note =
      note.replace(
        place,
        ""
      );

  }


  note =
    note
      .replace(
        /練習曲の目安/g,
        ""
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  /*
    「富田林教会」など、
    PDF内の予定表外の文字が
    単独で入ってきた場合に
    そのまま予定にしない。

    ただし「不在」「文化祭」などは
    備考として残す。
  */

  if(
    !time &&
    !place &&
    !/不在|文化祭|リハーサル|準備|休み/.test(note)
  ){

    return null;

  }


  return {
    date:date,
    time:time,
    place:place,
    note:note
  };

}


/* =========================================
   PDF読み込み
========================================= */

async function readSchedulePDF(){

  if(!(await isAdmin())){
    return;
  }


  const file =
    $("schedulePdf")
      .files[0];


  if(!file){

    message(
      "pdfStatus",
      "PDFファイルを選択してください。",
      "error"
    );

    return;
  }


  const button =
    $("readPdfButton");


  button.disabled = true;

  button.textContent =
    "PDFを読み込んでいます...";


  $("pdfCandidates")
    .classList
    .add("hidden");


  message(
    "pdfStatus",
    "PDFを解析しています..."
  );


  try{

    const lines =
      await extractPdfLines(
        file
      );


    if(!lines.length){

      throw new Error(
        "PDFから文字を読み取れませんでした。"
      );

    }


    const candidates =
      parseScheduleLines(
        lines
      );


    if(!candidates.length){

      message(
        "pdfStatus",
        "PDFから予定を見つけられませんでした。\n\nこのPDFが画像として保存されている場合は、文字情報を読み取れない可能性があります。",
        "error"
      );

      return;

    }


    renderCandidates(
      candidates
    );


    message(
      "pdfStatus",
      `${candidates.length}件の予定候補を読み取りました。`
    );


    $("pdfCandidates")
      .classList
      .remove("hidden");


  }catch(error){

    console.error(
      "PDF読み込みエラー:",
      error
    );


    message(
      "pdfStatus",
      "PDFの読み込みに失敗しました。\n" +
      (error.message || ""),
      "error"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "PDFを読み込む";

  }

}


/* =========================================
   PDF候補表示
========================================= */

let pdfCandidatesData = [];


function renderCandidates(

){

  pdfCandidatesData =
    candidates;


  const container =

  container.innerHTML =
    candidates
      .map(
        (item,index) => `

          <div
            class="candidate"
            data-index="${index}"
          >

            <div class="candidate-head">

              <input
                type="checkbox"
                class="candidate-check"
                checked
              >

              <strong>
                予定 ${index + 1}
              </strong>

            </div>


            <div class="candidate-grid">

              <div>

                <label>
                  日付
                </label>

                <input
                  class="candidate-date"
                  type="date"
                  value="${esc(item.date)}"
                >

              </div>


              <div>

                <label>
                  時間
                </label>

                <input
                  class="candidate-time"
                  type="text"
                  value="${esc(item.time)}"
                  placeholder="例：15:45〜18:00"
                >

              </div>


              <div>

                <label>
                  場所
                </label>

                <input
                  class="candidate-place"
                  type="text"
                  value="${esc(item.place)}"
                >

              </div>


              <div>

                <label>
                  その他・備考
                </label>

                <input
                  class="candidate-note"
                  type="text"
                  value="${esc(item.note)}"
                >

              </div>

            </div>

          </div>

        `
      )
      .join("");

}


/* =========================================
   選択したPDF予定を登録
========================================= */

async function registerCandidates(){

  if(!(await isAdmin())){
    return;
  }


  const boxes =
    document.querySelectorAll(
      ".candidate"
    );


  const selected = [];


  boxes.forEach(
    box => {

      const check =
        box.querySelector(
          ".candidate-check"
        );


      if(!check.checked){
        return;
      }


      const date =
        box.querySelector(
          ".candidate-date"
        ).value;


      const time =
        box.querySelector(
          ".candidate-time"
        ).value.trim();


      const place =
        box.querySelector(
          ".candidate-place"
        ).value.trim();


      const note =
        box.querySelector(
          ".candidate-note"
        ).value.trim();


      if(!date){
        return;
      }


      selected.push({
        date,
        time,
        place,
        note
      });

    }
  );


  if(!selected.length){

    message(
      "candidateMsg",
      "登録する予定を1つ以上選択してください。",
      "error"
    );

    return;

  }


  const button =
    $("registerCandidatesButton");


  button.disabled = true;

  button.textContent =
    "登録しています...";


  try{

    for(const item of selected){

      await set(
        ref(
          db,
          "schedules/" +
          item.date
        ),
        {
          time:item.time,
          place:item.place,
          note:item.note,
          updatedAt:Date.now()
        }
      );

    }


    message(
      "candidateMsg",
      `${selected.length}件の予定を登録しました。`,
      "success"
    );


    await loadSchedules();


  }catch(error){

    console.error(
      "PDF予定登録エラー:",
      error
    );


    message(
      "candidateMsg",
      "予定の登録に失敗しました。",
      "error"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "選択した予定を登録";

  }

}


/* =========================================
   手動予定保存
========================================= */

async function saveSchedule(){

  if(!(await isAdmin())){
    return;
  }


  const date =
    $("sdate")
      .value;


  const time =
    $("stime")
      .value
      .trim();


  const place =
    $("splace")
      .value
      .trim();


  const note =
    $("snote")
      .value
      .trim();


  if(!date){

    message(
      "scheduleMsg",
      "日付を入力してください。",
      "error"
    );

    return;
  }


  await set(
    ref(
      db,
      "schedules/" +
      date
    ),
    {
      time:time,
      place:place,
      note:note,
      updatedAt:Date.now()
    }
  );


  message(
    "scheduleMsg",
    "予定を保存しました。",
    "success"
  );


  $("sdate").value = "";
  $("stime").value = "";
  $("splace").value = "";
  $("snote").value = "";


  await loadSchedules();

}


/* =========================================
   登録済み予定読み込み
========================================= */

async function loadSchedules(){

  const snapshot =
    await get(
      ref(
        db,
        "schedules"
      )
    );


  const data =
    snapshot.exists()
      ? snapshot.val()
      : {};


  const schedules =
    Object.entries(data)
      .sort(
        ([a],[b]) =>
          a.localeCompare(b)
      );


  if(!schedules.length){

    $("schedules").innerHTML =
      "<p class='small'>予定はありません。</p>";

    return;

  }


  $("schedules").innerHTML =
    schedules
      .map(
        ([date,x]) => `

          <div class="item">

            <strong>
              ${esc(date)}
            </strong>

            ${
              x.time
                ? `<div>${esc(x.time)}</div>`
                : ""
            }

            ${
              x.place
                ? `<div>${esc(x.place)}</div>`
                : ""
            }

            ${
              x.note
                ? `<div class="small">
                    備考：${esc(x.note)}
                   </div>`
                : ""
            }


            <div class="row">

              <button
                onclick="editSchedule('${esc(date)}')"
              >
                変更
              </button>

              <button
                class="danger"
                onclick="deleteSchedule('${esc(date)}')"
              >
                削除
              </button>

            </div>

          </div>

        `
      )
      .join("");

}


/* =========================================
   予定変更
========================================= */

async function editSchedule(date){

  if(!(await isAdmin())){
    return;
  }


  const snapshot =
    await get(
      ref(
        db,
        "schedules/" +
        date
      )
    );


  if(!snapshot.exists()){
    return;
  }


  const data =
    snapshot.val();


  $("sdate").value =
    date;

  $("stime").value =
    data.time || "";

  $("splace").value =
    data.place || "";

  $("snote").value =
    data.note || "";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   予定削除
========================================= */

async function deleteSchedule(date){

  if(!(await isAdmin())){
    return;
  }


  const ok =
    confirm(
      `${date}の予定を削除しますか？`
    );


  if(!ok){
    return;
  }


  await remove(
    ref(
      db,
      "schedules/" +
      date
    )
  );


  await loadSchedules();

}
