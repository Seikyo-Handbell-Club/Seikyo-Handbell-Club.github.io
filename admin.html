<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理者設定｜清教学園ハンドベル部</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{background:#fff;padding:20px;border-bottom:1px solid #e5e8ed}h1{margin:0;text-align:center;font-size:21px}main{max-width:850px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 2px 12px #0000000b}.hidden{display:none!important}label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d9dee7;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:80px;resize:vertical}button{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;font-size:14px}.primary{background:#1f6feb;color:#fff;width:100%;margin-top:14px}.secondary{background:#eef3fb;color:#20242a}.msg{padding:12px;border-radius:10px;background:#fff8df;color:#69520a;margin-top:10px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.error{background:#fff0f0;color:#9b1c1c}.success{background:#effaf1;color:#176b2c}.item{border:1px solid #e3e7ed;border-radius:12px;padding:12px;margin:10px 0}.small{font-size:12px;color:#6f7882}.section-title{margin-top:0;margin-bottom:4px}.sub-title{margin-top:0;color:#68717d;font-size:13px}.pdf-box{border:2px dashed #cfd7e3;border-radius:14px;padding:16px;background:#fafbfd;margin-top:10px}.candidate{border:1px solid #dfe4eb;border-radius:14px;padding:14px;margin-top:12px;background:#fff}.candidate-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.candidate-head input[type="checkbox"]{width:20px;height:20px;flex:none}.candidate-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.candidate-grid label{margin:0;font-size:12px;color:#66717e}.candidate-grid input,.candidate-grid textarea{margin-top:4px;font-size:14px}.divider{height:1px;background:#e5e8ed;margin:20px 0}.app-topbar{display:flex;justify-content:flex-end;margin-bottom:16px}.logout-button{background:#f5f7fa;color:#68717d;border:1px solid #dfe4eb;padding:7px 11px;border-radius:8px;font-size:13px}.item-main{display:flex;align-items:center;justify-content:space-between;gap:12px}.item-actions{display:flex;gap:5px;flex-shrink:0}.item-actions button{padding:5px 8px;font-size:12px;background:#f7f8fa;color:#68717d;border:1px solid #e1e5ea}.item-actions .delete-button{background:transparent;color:#a06a6a;border-color:#ead6d6}.time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.time-field label{margin-top:0}.time-note{margin-top:6px;font-size:12px;color:#6f7882}@media(max-width:600px){.candidate-grid{grid-template-columns:1fr}.item-main{align-items:flex-start}.item-actions{margin-left:auto}}
</style>
</head>
<body>
<header><h1>清教学園ハンドベル部 管理者設定</h1></header>
<main>
<section id="login" class="card"><h2 class="section-title">管理者ログイン</h2><p class="small">管理者用パスワードを入力してください。</p><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" placeholder="パスワード"><button id="loginButton" class="primary" type="button">ログイン</button><div id="loginMsg"></div></section>
<section id="app" class="hidden">
<div class="app-topbar"><button id="logoutButton" class="logout-button" type="button">ログアウト</button></div>
<div class="card"><h2 class="section-title">清教学園ハンドベル部予定表</h2><p class="sub-title">PDFから予定を読み込み、確認して登録できます。</p><div class="pdf-box"><label for="schedulePdf">予定表PDF</label><input id="schedulePdf" type="file" accept="application/pdf,.pdf"><button id="readPdfButton" class="primary" type="button">PDFを読み込む</button><div id="pdfStatus"></div></div><div id="pdfCandidates" class="hidden"><div class="divider"></div><h3>読み取った予定</h3><p class="small">登録したい予定にチェックを入れて、内容を確認してください。「練習曲の目安」は読み取りません。</p><div id="candidateList"></div><button id="registerCandidatesButton" class="primary" type="button">選択した予定を登録</button><div id="candidateMsg"></div></div></div>
<div class="card"><h2 class="section-title">予定を手動で登録</h2><label for="stype">予定の種類</label><select id="stype"><option value="normal">通常の部活予定</option><option value="exam">試験期間</option><option value="concert">演奏会</option><option value="schoolHoliday">学校が休みの日</option><option value="event">その他のイベント</option></select>
<div id="normalScheduleFields"><label for="sdate">日付</label><input id="sdate" type="date"><label>時間</label><div class="time-row"><div class="time-field"><label for="stimeStart">開始</label><input id="stimeStart" type="time"></div><div class="time-field"><label for="stimeEnd">終了</label><input id="stimeEnd" type="time"></div></div><div class="time-note">開始・終了を両方空欄にすると「終日」になります。</div><label for="splace">場所</label><input id="splace" type="text" placeholder="例：音楽練習室"><label for="sTitle">タイトル</label><input id="sTitle" type="text" placeholder="例：通常練習"><label for="snote">備考</label><textarea id="snote" placeholder="必要な場合のみ入力"></textarea></div>
<div id="examScheduleFields" class="hidden"><label for="examStartDate">開始日</label><input id="examStartDate" type="date"><label for="examEndDate">終了日</label><input id="examEndDate" type="date"><label for="examTitle">タイトル</label><input id="examTitle" type="text" placeholder="例：中間考査"><label for="examNote">備考</label><textarea id="examNote" placeholder="必要な場合のみ入力"></textarea></div>
<div id="concertScheduleFields" class="hidden"><label for="concertDate">日付</label><input id="concertDate" type="date"><label>時間</label><div class="time-row"><div class="time-field"><label for="concertTimeStart">開始</label><input id="concertTimeStart" type="time"></div><div class="time-field"><label for="concertTimeEnd">終了</label><input id="concertTimeEnd" type="time"></div></div><div class="time-note">開始・終了を両方空欄にすると「終日」になります。</div><label for="concertTitle">タイトル</label><input id="concertTitle" type="text" placeholder="例：定期演奏会"><label for="concertPlace">場所</label><input id="concertPlace" type="text" placeholder="例：講堂"><label for="concertNote">備考</label><textarea id="concertNote" placeholder="必要な場合のみ入力"></textarea></div>
<div id="schoolHolidayScheduleFields" class="hidden"><label for="schoolHolidayDate">日付</label><input id="schoolHolidayDate" type="date"><label for="schoolHolidayTitle">タイトル</label><input id="schoolHolidayTitle" type="text" placeholder="例：創立記念日"><label for="schoolHolidayNote">備考</label><textarea id="schoolHolidayNote" placeholder="必要な場合のみ入力"></textarea></div>
<div id="eventScheduleFields" class="hidden"><label for="eventDate">日付</label><input id="eventDate" type="date"><label>時間</label><div class="time-row"><div class="time-field"><label for="eventTimeStart">開始</label><input id="eventTimeStart" type="time"></div><div class="time-field"><label for="eventTimeEnd">終了</label><input id="eventTimeEnd" type="time"></div></div><div class="time-note">開始・終了を両方空欄にすると「終日」になります。</div><label for="eventTitle">タイトル</label><input id="eventTitle" type="text" placeholder="例：部活動説明会"><label for="eventPlace">場所</label><input id="eventPlace" type="text" placeholder="例：講堂"><label for="eventNote">備考</label><textarea id="eventNote" placeholder="必要な場合のみ入力"></textarea></div>
<button id="saveScheduleButton" class="primary" type="button">予定を保存</button><div id="scheduleMsg"></div></div>
<div class="card"><h2 class="section-title">部員登録</h2><p class="sub-title">部員の学校ID・名前・学年・クラスを登録します。</p><label for="mid">学校ID</label><input id="mid"><label for="mname">名前</label><input id="mname"><label for="mgrade">学年</label><select id="mgrade"><option value="">選択してください</option><option>中学1年</option><option>中学2年</option><option>中学3年</option><option>高校1年</option><option>高校2年</option></select><label for="mclass">クラス</label><select id="mclass"><option value="">選択してください</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option>G</option><option>H</option><option>I</option><option>J</option><option>K</option></select><button id="addMemberButton" class="primary">登録する</button><div id="memberMsg"></div></div>
<div class="card"><h2 class="section-title">部員名簿</h2><div id="members"><p class="small">読み込み中...</p></div></div>
<div class="card"><h2 class="section-title">登録済みの予定</h2><div id="schedules"><p class="small">読み込み中...</p></div></div>
</section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getDatabase,ref,get,set,update,remove}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",authDomain:"seikyo-handbell-club.firebaseapp.com",databaseURL:"https://seikyo-handbell-club-default-rtdb.firebaseio.com",projectId:"seikyo-handbell-club",storageBucket:"seikyo-handbell-club.firebasestorage.app",messagingSenderId:"55435007971",appId:"1:55435007971:web:25f5c3b9dcd4324bc3f2d6"};
const ADMIN_EMAIL="kazuma.cosmos@gmail.com";const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getDatabase(app);await setPersistence(auth,browserLocalPersistence);const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function message(id,text,type=""){const e=$(id);if(!e)return;e.className=text?`msg ${type}`:"";e.textContent=text||""}function makeTimeRange(start,end){start=String(start||"").trim();end=String(end||"").trim();if(!start&&!end)return"終日";if(!start||!end||start>=end)return null;return`${start}〜${end}`}function splitTimeRange(time){const v=String(time||"").trim();if(!v||v==="終日")return{start:"",end:""};const m=v.match(/^(\d{1,2}:\d{2})\s*[〜~\-－]\s*(\d{1,2}:\d{2})$/);return m?{start:m[1],end:m[2]}:{start:"",end:""}}
async function isAdmin(){if(!auth.currentUser)return false;const s=await get(ref(db,"admins/"+auth.currentUser.uid));return s.exists()&&s.val()===true}
onAuthStateChanged(auth,async user=>{if(!user){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}try{if(!(await isAdmin())){await signOut(auth);return}$("login").classList.add("hidden");$("app").classList.remove("hidden");$("password").value="";await loadMembers();await loadSchedules()}catch(e){console.error(e);message("loginMsg","管理者権限の確認に失敗しました。\n\n"+(e.message||"不明"),"error")}});
async function adminLogin(){const password=$("password").value;message("loginMsg","");if(!password){message("loginMsg","パスワードを入力してください。","error");return}const b=$("loginButton");b.disabled=true;b.textContent="ログイン中...";try{const c=await signInWithEmailAndPassword(auth,ADMIN_EMAIL,password);const s=await get(ref(db,"admins/"+c.user.uid));if(!s.exists()||s.val()!==true){await signOut(auth);message("loginMsg","管理者として登録されていません。","error");return}$("login").classList.add("hidden");$("app").classList.remove("hidden");await loadMembers();await loadSchedules()}catch(e){message("loginMsg","ログインできませんでした。\n\nエラーコード: "+(e.code||"不明")+"\n詳細: "+(e.message||"不明"),"error")}finally{b.disabled=false;b.textContent="ログイン"}}
async function logout(){await signOut(auth)}
const gradeOrder={"中学1年":0,"中学2年":1,"中学3年":2,"高校1年":3,"高校2年":4};const classOrder={A:0,B:1,C:2,D:3,E:4,F:5,G:6,H:7,I:8,J:9,K:10};
let editingMemberId = null;
function resetMemberForm(){editingMemberId=null;$("mid").disabled=false;$("mname").value=$("mgrade").value=$("mclass").value="";$("addMemberButton").textContent="登録する"}
async function addMember(){if(!(await isAdmin()))return;const id=$("mid").value.trim(),name=$("mname").value.trim(),grade=$("mgrade").value,className=$("mclass").value;if(!id||!name||!grade||!className){message("memberMsg","学校ID・名前・学年・クラスをすべて入力してください。","error");return}
if(editingMemberId){await update(ref(db,"memberRegistrations/"+editingMemberId),{name,grade,className});resetMemberForm();message("memberMsg","変更しました。","success");await loadMembers();return}
if((await get(ref(db,"memberRegistrations/"+id))).exists()){message("memberMsg","その学校IDはすでに登録されています。","error");return}await set(ref(db,"memberRegistrations/"+id),{schoolId:id,name,grade,className,createdAt:Date.now()});await set(ref(db,"memberIds/"+id),{accountCreated:false});resetMemberForm();message("memberMsg","登録しました。","success");await loadMembers()}
async function loadMembers(){const s=await get(ref(db,"memberRegistrations")),data=s.exists()?s.val():{},members=Object.entries(data);members.sort(([,a],[,b])=>(gradeOrder[a.grade]??99)-(gradeOrder[b.grade]??99)||(classOrder[a.className]??99)-(classOrder[b.className]??99)||String(a.name||"").localeCompare(String(b.name||""),"ja"));$("members").innerHTML=members.length?members.map(([id,x])=>`<div class="item"><div class="item-main"><div><strong>${esc(x.name)}</strong><div class="small">（${esc(id)}）</div></div><div class="item-actions"><button onclick="editMember('${esc(id)}')">変更</button><button class="delete-button" onclick="deleteMember('${esc(id)}')">削除</button></div></div><div class="small">${esc(x.grade)}・${esc(x.className)}組</div></div>`).join(""):"<p class='small'>まだ登録されていません。</p>"}
async function editMember(id){if(!(await isAdmin()))return;const s=await get(ref(db,"memberRegistrations/"+id));if(!s.exists())return;const d=s.val();editingMemberId=id;$("mid").value=d.schoolId||id;$("mname").value=d.name||"";$("mgrade").value=d.grade||"";$("mclass").value=d.className||"";$("mid").disabled=true;$("addMemberButton").textContent="変更を保存";message("memberMsg","");$("mid").scrollIntoView({behavior:"smooth",block:"center"})}
async function deleteMember(id){if(!(await isAdmin())||!confirm("この部員登録を削除しますか？"))return;await remove(ref(db,"memberRegistrations/"+id));await remove(ref(db,"memberIds/"+id));await loadMembers()}
let pdfjsLib=null;async function getPdfJs(){if(pdfjsLib)return pdfjsLib;const m=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");m.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";return pdfjsLib=m}
async function extractPdfLines(file){const pdf=await getPdfJs(),buf=await file.arrayBuffer(),doc=await pdf.getDocument({data:buf}).promise,all=[];for(let p=1;p<=doc.numPages;p++){const page=await doc.getPage(p),items=(await page.getTextContent()).items.filter(i=>i.str&&i.str.trim()).map(i=>({text:i.str.trim(),x:Number(i.transform?.[4]||0),y:Number(i.transform?.[5]||0)}));items.sort((a,b)=>Math.abs(a.y-b.y)>3?b.y-a.y:a.x-b.x);const rows=[];for(const item of items){let r=rows.find(r=>Math.abs(r.y-item.y)<4);if(!r)rows.push(r={y:item.y,items:[]});r.items.push(item)}rows.sort((a,b)=>b.y-a.y);for(const r of rows){r.items.sort((a,b)=>a.x-b.x);const text=r.items.map(i=>i.text).join(" ").replace(/\s+/g," ").trim();if(text)all.push({page:p,y:r.y,items:r.items,text})}}return all}
function makeCandidate(dateObj,text){if(!text||text.includes("練習曲"))return null;const date=`${dateObj.year}-${String(dateObj.month).padStart(2,"0")}-${String(dateObj.day).padStart(2,"0")}`,tm=text.match(/\d{1,2}:\d{2}\s*[〜~\-－]\s*\d{1,2}:\d{2}/)?.[0]?.replace(/\s+/g,"")||"";const place=text.includes("音楽練習室")?"音楽練習室":"";let note=text.replace(tm,"").replace(place,"").replace(/練習曲の目安/g,"").replace(/\s+/g," ").trim();if(!tm&&!place&&!/不在|文化祭|リハーサル|準備|休み/.test(note))return null;return{date,time:tm,place,note,title:note||""}}
function parseScheduleLines(lines){let month=null;for(const l of lines){const m=l.text.match(/(\d{1,2})月/);if(m&&+m[1]>=1&&+m[1]<=12){month=+m[1];break}}if(!month)month=new Date().getMonth()+1;const year=new Date().getFullYear(),out=[];let cur=null;for(const l of lines){const raw=l.text;if(raw.includes("練習曲"))continue;const m=raw.match(/(\d{1,2})月\s*(\d{1,2})日?/)||raw.match(/(\d{1,2})[\/／](\d{1,2})/);if(m&&+m[1]>=1&&+m[1]<=12&&+m[2]>=1&&+m[2]<=31){cur={year,month:+m[1],day:+m[2]};const rest=raw.replace(m[0],"").trim();if(rest){const c=makeCandidate(cur,rest);if(c)out.push(c)}continue}if(cur){const c=makeCandidate(cur,raw);if(c&&/\d{1,2}:\d{2}|音楽練習室|不在|文化祭|リハーサル|準備|休み/.test(raw))out.push(c)}}return[...new Map(out.map(x=>[[x.date,x.time,x.place,x.note].join("|"),x])).values()]}
async function readSchedulePDF(){if(!(await isAdmin()))return;const file=$("schedulePdf").files[0];if(!file){message("pdfStatus","PDFファイルを選択してください。","error");return}const b=$("readPdfButton");b.disabled=true;b.textContent="PDFを読み込んでいます...";try{const c=parseScheduleLines(await extractPdfLines(file));if(!c.length){message("pdfStatus","PDFから予定を見つけられませんでした。","error");return}renderCandidates(c);message("pdfStatus",`${c.length}件の予定候補を読み取りました。`);$("pdfCandidates").classList.remove("hidden")}catch(e){message("pdfStatus","PDFの読み込みに失敗しました。\n\n"+(e.message||"不明"),"error")}finally{b.disabled=false;b.textContent="PDFを読み込む"}}
let pdfCandidatesData=[];function renderCandidates(c){pdfCandidatesData=c;$("candidateList").innerHTML=c.map((x,i)=>`<div class="candidate"><div class="candidate-head"><input type="checkbox" class="candidate-check" checked><strong>予定 ${i+1}</strong></div><div class="candidate-grid"><div><label>日付</label><input class="candidate-date" type="date" value="${esc(x.date)}"></div><div><label>時間</label><input class="candidate-time" value="${esc(x.time)}"></div><div><label>場所</label><input class="candidate-place" value="${esc(x.place)}"></div><div><label>タイトル</label><input class="candidate-title" value="${esc(x.title)}"></div><div><label>備考</label><input class="candidate-note" value="${esc(x.note)}"></div></div></div>`).join("")}
async function registerCandidates(){if(!(await isAdmin()))return;const boxes=document.querySelectorAll(".candidate"),selected=[];boxes.forEach(b=>{if(!b.querySelector(".candidate-check").checked)return;const date=b.querySelector(".candidate-date").value;if(!date)return;selected.push({date,time:b.querySelector(".candidate-time").value.trim(),place:b.querySelector(".candidate-place").value.trim(),title:b.querySelector(".candidate-title").value.trim(),note:b.querySelector(".candidate-note").value.trim()})});if(!selected.length){message("candidateMsg","登録する予定を1つ以上選択してください。","error");return}const b=$("registerCandidatesButton");b.disabled=true;try{for(const x of selected)await set(ref(db,"schedules/"+x.date),{type:"normal",time:x.time,place:x.place,title:x.title,note:x.note,updatedAt:Date.now()});message("candidateMsg",`${selected.length}件の予定を登録しました。`,`success`);await loadSchedules()}catch(e){message("candidateMsg","予定の登録に失敗しました。\n\n"+(e.message||"不明"),"error")}finally{b.disabled=false}}
function updateScheduleFields(){const t=$("stype").value;for(const x of ["normal","exam","concert","schoolHoliday","event"])$(x+"ScheduleFields").classList.toggle("hidden",t!==x)}
async function saveSchedule(){if(!(await isAdmin()))return;const type=$("stype").value;
if(type==="normal"){const date=$("sdate").value,time=makeTimeRange($("stimeStart").value,$("stimeEnd").value),place=$("splace").value.trim(),title=$("sTitle").value.trim(),note=$("snote").value.trim();if(!date||time===null){message("scheduleMsg","日付と時間を確認してください。","error");return}await set(ref(db,"schedules/"+date),{type:"normal",date,title,time,place,note,updatedAt:Date.now()});$("sdate").value=$("stimeStart").value=$("stimeEnd").value=$("splace").value=$("sTitle").value=$("snote").value="";message("scheduleMsg","予定を保存しました。","success");return}
if(type==="exam"){const startDate=$("examStartDate").value,endDate=$("examEndDate").value,title=$("examTitle").value.trim(),note=$("examNote").value.trim();if(!startDate||!endDate||startDate>endDate||!title){message("scheduleMsg","開始日・終了日・タイトルを確認してください。","error");return}await set(ref(db,"schedules/special_"+Date.now()),{type:"exam",startDate,endDate,title,note,updatedAt:Date.now()});$("examStartDate").value=$("examEndDate").value=$("examTitle").value=$("examNote").value="";message("scheduleMsg","試験期間を保存しました。","success");return}
if(type==="concert"){const date=$("concertDate").value,time=makeTimeRange($("concertTimeStart").value,$("concertTimeEnd").value),title=$("concertTitle").value.trim(),place=$("concertPlace").value.trim(),note=$("concertNote").value.trim();if(!date||time===null||!title){message("scheduleMsg","日付・時間・タイトルを確認してください。","error");return}await set(ref(db,"schedules/special_"+Date.now()),{type:"concert",date,time,title,place,note,updatedAt:Date.now()});["concertDate","concertTimeStart","concertTimeEnd","concertTitle","concertPlace","concertNote"].forEach(id=>$(id).value="");message("scheduleMsg","演奏会を保存しました。","success");return}
if(type==="schoolHoliday"){const date=$("schoolHolidayDate").value,title=$("schoolHolidayTitle").value.trim(),note=$("schoolHolidayNote").value.trim();if(!date){message("scheduleMsg","日付を入力してください。","error");return}await set(ref(db,"schedules/special_"+Date.now()),{type:"schoolHoliday",date,title,note,updatedAt:Date.now()});$("schoolHolidayDate").value=$("schoolHolidayTitle").value=$("schoolHolidayNote").value="";message("scheduleMsg","学校が休みの日を保存しました。","success");return}
if(type==="event"){const date=$("eventDate").value,time=makeTimeRange($("eventTimeStart").value,$("eventTimeEnd").value),title=$("eventTitle").value.trim(),place=$("eventPlace").value.trim(),note=$("eventNote").value.trim();if(!date||time===null||!title){message("scheduleMsg","日付・時間・タイトルを確認してください。","error");return}await set(ref(db,"schedules/special_"+Date.now()),{type:"event",date,time,title,place,note,updatedAt:Date.now()});["eventDate","eventTimeStart","eventTimeEnd","eventTitle","eventPlace","eventNote"].forEach(id=>$(id).value="");message("scheduleMsg","イベントを保存しました。","success")}}
async function loadSchedules(){const s=await get(ref(db,"schedules")),data=s.exists()?s.val():{},list=Object.entries(data).sort(([a],[b])=>a.localeCompare(b));$("schedules").innerHTML=list.length?list.map(([key,x])=>{const t=x.type||"normal",label={normal:"通常の部活予定",exam:"試験期間",concert:"演奏会",schoolHoliday:"学校が休みの日",event:"その他のイベント"}[t]||"予定";const date=t==="exam"?`${x.startDate||""} 〜 ${x.endDate||""}`:(x.date||key);return`<div class="item"><div class="item-main"><div><strong>${esc(label)}</strong><div class="small">${esc(date)}</div></div><div class="item-actions"><button onclick="editSchedule('${esc(key)}')">変更</button><button class="delete-button" onclick="deleteSchedule('${esc(key)}')">削除</button></div></div>${x.title?`<div>タイトル：${esc(x.title)}</div>`:""}${x.time?`<div>${esc(x.time)}</div>`:""}${x.place?`<div>${esc(x.place)}</div>`:""}${x.note?`<div class="small">備考：${esc(x.note)}</div>`:""}</div>`}).join(""):"<p class='small'>予定はありません。</p>"}
async function editSchedule(key){if(!(await isAdmin()))return;const s=await get(ref(db,"schedules/"+key));if(!s.exists())return;const d=s.val(),t=d.type||"normal";$("stype").value=t;updateScheduleFields();if(t==="normal"){$("sdate").value=d.date||key;const z=splitTimeRange(d.time);$("stimeStart").value=z.start;$("stimeEnd").value=z.end;$("splace").value=d.place||"";$("sTitle").value=d.title||"";$("snote").value=d.note||""}if(t==="exam"){$("examStartDate").value=d.startDate||d.date||"";$('examEndDate').value=d.endDate||d.date||"";$("examTitle").value=d.title||"";$("examNote").value=d.note||""}if(t==="concert"){$("concertDate").value=d.date||"";const z=splitTimeRange(d.time);$("concertTimeStart").value=z.start;$("concertTimeEnd").value=z.end;$("concertTitle").value=d.title||"";$("concertPlace").value=d.place||"";$("concertNote").value=d.note||""}if(t==="schoolHoliday"){$("schoolHolidayDate").value=d.date||key;$("schoolHolidayTitle").value=d.title||"";$("schoolHolidayNote").value=d.note||""}if(t==="event"){$("eventDate").value=d.date||"";const z=splitTimeRange(d.time);$("eventTimeStart").value=z.start;$("eventTimeEnd").value=z.end;$("eventTitle").value=d.title||"";$("eventPlace").value=d.place||"";$("eventNote").value=d.note||""}$("stype").scrollIntoView({behavior:"smooth",block:"center"})}
async function deleteSchedule(key){if(!(await isAdmin()))return;const s=await get(ref(db,"schedules/"+key));if(!s.exists())return;const d=s.val();if(!confirm("この予定を削除しますか？"))return;await remove(ref(db,"schedules/"+key));await loadSchedules()}
Object.assign(window,{adminLogin,logout,addMember,editMember,deleteMember,saveSchedule,editSchedule,deleteSchedule,readSchedulePDF,registerCandidates});
$("loginButton").addEventListener("click",adminLogin);$("logoutButton").addEventListener("click",logout);$("addMemberButton").addEventListener("click",addMember);$("readPdfButton").addEventListener("click",readSchedulePDF);$("registerCandidatesButton").addEventListener("click",registerCandidates);$("saveScheduleButton").addEventListener("click",saveSchedule);$("stype").addEventListener("change",updateScheduleFields);$("password").addEventListener("keydown",e=>{if(e.key==="Enter")adminLogin()});updateScheduleFields();
