<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理者設定｜清教学園ハンドベル部</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#20242a;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

header{
  background:#fff;
  padding:20px;
  border-bottom:1px solid #e5e8ed;
}

h1{
  margin:0;
  text-align:center;
  font-size:21px;
}

h2{
  margin-top:0;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0000000b;
}

.hidden{
  display:none!important;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 5px;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #d9dee7;
  border-radius:10px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#1f6feb;
  color:#fff;
  width:100%;
  margin-top:14px;
}

.secondary{
  background:#eef3fb;
}

.danger{
  background:#fff0f0;
  color:#b22;
  border:1px solid #efbbbb;
}

.msg{
  padding:12px;
  border-radius:10px;
  background:#fff8df;
  color:#69520a;
  margin-top:10px;
  font-size:14px;
}

.error{
  background:#fff0f0;
  color:#9b1c1c;
}

.item{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.row button{
  flex:1;
}

.small{
  font-size:12px;
  color:#6f7882;
}

.member-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.member-name{
  font-weight:700;
  flex:1;
}

.member-buttons{
  display:flex;
  gap:4px;
}

.member-buttons button{
  padding:5px 8px;
  font-size:12px;
  font-weight:500;
  background:#f3f5f8;
  color:#68717c;
}

.member-buttons .danger{
  background:#fff5f5;
  color:#a66;
  border:1px solid #f0d0d0;
}

.grade-title{
  font-size:18px;
  font-weight:800;
  margin-top:22px;
  margin-bottom:8px;
}

.class-title{
  font-size:14px;
  font-weight:700;
  color:#68717c;
  margin-top:12px;
  margin-bottom:5px;
}

.preview{
  width:100%;
  max-height:400px;
  object-fit:contain;
  border-radius:10px;
  border:1px solid #ddd;
  margin-top:10px;
}

.detected{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}

.detected-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

@media(max-width:600px){
  .detected-row{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>清教学園ハンドベル部 管理者設定</h1>
</header>

<main>

<!-- ログイン -->
<section id="login" class="card">
  <h2>管理者ログイン</h2>

  <label>パスワード</label>
  <input id="password" type="password">

  <button class="primary" onclick="adminLogin()">ログイン</button>

  <div id="loginMsg"></div>
</section>


<section id="app" class="hidden">

<!-- ログアウト -->
<div class="card">
  <button class="secondary" onclick="logout()">ログアウト</button>
</div>


<!-- 部員登録 -->
<div class="card">

  <h2>部員登録</h2>

  <label>学校ID</label>
  <input id="mid" placeholder="学校ID">

  <label>名前</label>
  <input id="mname" placeholder="名前">

  <label>学年</label>
  <select id="mgrade">
    <option value="">学年を選択</option>
    <option value="中学1年">中学1年</option>
    <option value="中学2年">中学2年</option>
    <option value="中学3年">中学3年</option>
    <option value="高校1年">高校1年</option>
    <option value="高校2年">高校2年</option>
  </select>

  <label>クラス</label>
  <select id="mclass">
    <option value="">クラスを選択</option>
    <option value="A">A組</option>
    <option value="B">B組</option>
    <option value="C">C組</option>
    <option value="D">D組</option>
    <option value="E">E組</option>
    <option value="F">F組</option>
    <option value="G">G組</option>
    <option value="H">H組</option>
    <option value="I">I組</option>
    <option value="J">J組</option>
    <option value="K">K組</option>
  </select>

  <button class="primary" onclick="addMember()">登録する</button>

  <div id="memberMsg"></div>

</div>


<!-- 部員一覧 -->
<div class="card">

  <h2>部員一覧</h2>

  <div id="members"></div>

</div>


<!-- 予定表 -->
<div class="card">

  <h2>清教学園ハンドベル部予定表</h2>

  <p class="small">
    学校の予定表の画像を読み込んで登録できます。
    読み取り後に内容を確認・修正してから登録してください。
  </p>

  <label>予定表の画像</label>

  <input
    id="scheduleImage"
    type="file"
    accept="image/*"
  >

  <img
    id="schedulePreview"
    class="preview hidden"
    alt="予定表プレビュー"
  >

  <button
    class="secondary"
    style="margin-top:10px;width:100%;"
    onclick="readScheduleImage()"
  >
    画像を読み取る
  </button>

  <div id="ocrMsg"></div>

  <label>読み取った文字</label>

  <textarea
    id="ocrText"
    placeholder="画像を読み取ると、ここに文字が表示されます。"
  ></textarea>

  <button
    class="secondary"
    style="margin-top:10px;width:100%;"
    onclick="buildDetectedSchedules()"
  >
    日付を読み取る
  </button>

  <div id="detectedSchedules"></div>

  <button
    id="registerDetectedButton"
    class="primary hidden"
    onclick="registerDetectedSchedules()"
  >
    読み取った予定を登録
  </button>


  <hr style="margin:25px 0;border:0;border-top:1px solid #e5e8ed;">


  <h3>手動で登録</h3>

  <label>日付</label>
  <input id="sdate" type="date">

  <label>時間</label>
  <input id="stime" placeholder="例：17:00〜19:00">

  <label>場所</label>
  <input id="splace" placeholder="例：音楽室">

  <button class="primary" onclick="saveSchedule()">
    予定を保存
  </button>

  <div id="scheduleMsg"></div>

  <div id="schedules"></div>

</div>

</section>

</main>


<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",
  authDomain: "seikyo-handbell-club.firebaseapp.com",
  databaseURL: "https://seikyo-handbell-club-default-rtdb.firebaseio.com",
  projectId: "seikyo-handbell-club",
  storageBucket: "seikyo-handbell-club.firebasestorage.app",
  messagingSenderId: "55435007971",
  appId: "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

const ADMIN_EMAIL = "kazuma.cosmos@gmail.com";

const $ = id => document.getElementById(id);

const esc = s =>
  String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );


/* =========================
   メッセージ
========================= */

function message(id,text,error=false){

  const el = $(id);

  el.className = text
    ? (error ? "msg error" : "msg")
    : "";

  el.textContent = text;
}


/* =========================
   管理者確認
========================= */

async function isAdmin(){

  if(!auth.currentUser) return false;

  const s = await get(
    ref(db,"admins/"+auth.currentUser.uid)
  );

  return s.exists() && s.val() === true;
}


/* =========================
   ログイン状態
========================= */

onAuthStateChanged(auth,async user=>{

  if(user && await isAdmin()){

    $("login").classList.add("hidden");

    $("app").classList.remove("hidden");

    loadMembers();

    loadSchedules();

  }else{

    $("login").classList.remove("hidden");

    $("app").classList.add("hidden");

  }

});


/* =========================
   ログイン
========================= */

async function adminLogin(){

  try{

    await signInWithEmailAndPassword(
      auth,
      ADMIN_EMAIL,
      $("password").value
    );

    if(!(await isAdmin())){

      await signOut(auth);

      message(
        "loginMsg",
        "このアカウントは管理者として登録されていません。",
        true
      );

    }

  }catch(e){

    message(
      "loginMsg",
      "ログインできませんでした。",
      true
    );

  }

}


/* =========================
   ログアウト
========================= */

function logout(){

  signOut(auth);

}


/* =========================
   部員登録
========================= */

async function addMember(){

  if(!(await isAdmin())) return;

  const id = $("mid").value.trim();

  const name = $("mname").value.trim();

  const grade = $("mgrade").value;

  const cl = $("mclass").value;


  if(!id || !name || !grade || !cl){

    message(
      "memberMsg",
      "すべて入力してください。",
      true
    );

    return;

  }


  const existing = await get(
    ref(db,"memberRegistrations/"+id)
  );


  if(existing.exists()){

    message(
      "memberMsg",
      "その学校IDはすでに登録されています。",
      true
    );

    return;

  }


  await set(
    ref(db,"memberRegistrations/"+id),
    {
      schoolId:id,
      name:name,
      grade:grade,
      className:cl,
      createdAt:Date.now()
    }
  );


  await set(
    ref(db,"memberIds/"+id),
    {
      accountCreated:false
    }
  );


  $("mid").value = "";

  $("mname").value = "";

  $("mgrade").value = "";

  $("mclass").value = "";


  message(
    "memberMsg",
    "登録しました。"
  );


  loadMembers();

}


/* =========================
   部員一覧
========================= */

async function loadMembers(){

  const s = await get(
    ref(db,"memberRegistrations")
  );

  const v = s.exists() ? s.val() : {};

  let a = Object.entries(v);


  const gradeOrder = {
    "中学1年":1,
    "中学2年":2,
    "中学3年":3,
    "高校1年":4,
    "高校2年":5
  };


  const classOrder = {
    A:1,
    B:2,
    C:3,
    D:4,
    E:5,
    F:6,
    G:7,
    H:8,
    I:9,
    J:10,
    K:11
  };


  a.sort((x,y)=>{

    const gx =
      gradeOrder[x[1].grade] ?? 99;

    const gy =
      gradeOrder[y[1].grade] ?? 99;


    if(gx !== gy){

      return gx - gy;

    }


    const cx =
      classOrder[x[1].className] ?? 99;

    const cy =
      classOrder[y[1].className] ?? 99;


    if(cx !== cy){

      return cx - cy;

    }


    return String(x[1].name ?? "")
      .localeCompare(
        String(y[1].name ?? ""),
        "ja"
      );

  });


  if(!a.length){

    $("members").innerHTML =
      "<p class='small'>まだ登録されていません。</p>";

    return;

  }


  let html = "";

  let currentGrade = "";

  let currentClass = "";


  for(const [id,x] of a){

    if(x.grade !== currentGrade){

      currentGrade = x.grade;

      currentClass = "";

      html += `
        <div class="grade-title">
          ${esc(x.grade)}
        </div>
      `;

    }


    if(x.className !== currentClass){

      currentClass = x.className;

      html += `
        <div class="class-title">
          ${esc(x.className)}組
        </div>
      `;

    }


    html += `
      <div class="item">

        <div class="member-row">

          <div class="member-name">
            ${esc(x.name)}
          </div>

          <div class="member-buttons">

            <button
              onclick="editMember('${esc(id)}')"
            >
              変更
            </button>

            <button
              class="danger"
              onclick="deleteMember('${esc(id)}')"
            >
              削除
            </button>

          </div>

        </div>

      </div>
    `;

  }


  $("members").innerHTML = html;

}


/* =========================
   部員変更
========================= */

async function editMember(id){

  const s = await get(
    ref(db,"memberRegistrations/"+id)
  );

  if(!s.exists()) return;

  const x = s.val();


  const name = prompt(
    "名前",
    x.name
  );

  if(name === null) return;


  const grades = [
    "中学1年",
    "中学2年",
    "中学3年",
    "高校1年",
    "高校2年"
  ];


  const gradeText =
    grades.join("\n");


  const grade = prompt(
    "学年\n\n"+gradeText,
    x.grade
  );

  if(grade === null) return;


  const classes = [
    "A","B","C","D","E","F",
    "G","H","I","J","K"
  ];


  const cl = prompt(
    "クラス\n\nA〜K",
    x.className
  );

  if(cl === null) return;


  if(!grades.includes(grade)){

    alert("学年は中学1年〜高校2年から選択してください。");

    return;

  }


  if(!classes.includes(cl.toUpperCase())){

    alert("クラスはA〜Kで入力してください。");

    return;

  }


  await update(
    ref(db,"memberRegistrations/"+id),
    {
      name:name.trim(),
      grade:grade,
      className:cl.toUpperCase()
    }
  );


  loadMembers();

}


/* =========================
   部員削除
========================= */

async function deleteMember(id){

  if(!confirm(
    "この部員登録を削除しますか？"
  )) return;


  await remove(
    ref(db,"memberRegistrations/"+id)
  );


  await remove(
    ref(db,"memberIds/"+id)
  );


  loadMembers();

}


/* =========================
   画像プレビュー
========================= */

$("scheduleImage").addEventListener(
  "change",
  e=>{

    const file = e.target.files[0];

    if(!file){

      $("schedulePreview")
        .classList.add("hidden");

      return;

    }


    const url =
      URL.createObjectURL(file);


    $("schedulePreview").src = url;

    $("schedulePreview")
      .classList.remove("hidden");

  }
);


/* =========================
   OCR
========================= */

async function readScheduleImage(){

  const file =
    $("scheduleImage").files[0];


  if(!file){

    message(
      "ocrMsg",
      "予定表の画像を選択してください。",
      true
    );

    return;

  }


  message(
    "ocrMsg",
    "画像を読み取っています。少し待ってください。"
  );


  try{

    const result =
      await Tesseract.recognize(
        file,
        "jpn+eng",
        {
          logger:m=>{

            if(
              m.status === "recognizing text" &&
              typeof m.progress === "number"
            ){

              const percent =
                Math.round(m.progress*100);

              message(
                "ocrMsg",
                "画像を読み取っています… "+
                percent+"%"
              );

            }

          }
        }
      );


    $("ocrText").value =
      result.data.text || "";


    message(
      "ocrMsg",
      "読み取りが完了しました。"
    );


    buildDetectedSchedules();

  }catch(e){

    console.error(e);

    message(
      "ocrMsg",
      "画像を読み取れませんでした。",
      true
    );

  }

}


/* =========================
   OCR文字から予定候補作成
========================= */

function buildDetectedSchedules(){

  const text =
    $("ocrText").value.trim();


  if(!text){

    message(
      "ocrMsg",
      "読み取った文字がありません。",
      true
    );

    return;

  }


  const lines =
    text
      .split(/\r?\n/)
      .map(x=>x.trim())
      .filter(Boolean);


  const results = [];


  for(let i=0;i<lines.length;i++){

    const line = lines[i];


    /*
      例
      9月10日
      9/10
      9月10日（水）
    */

    let match =
      line.match(
        /(\d{1,2})\s*月\s*(\d{1,2})\s*日/
      );


    if(!match){

      match =
        line.match(
          /(\d{1,2})\s*[\/／]\s*(\d{1,2})/
        );

    }


    if(!match) continue;


    const month =
      Number(match[1]);

    const day =
      Number(match[2]);


    if(
      month < 1 ||
      month > 12 ||
      day < 1 ||
      day > 31
    ) continue;


    let year =
      new Date().getFullYear();


    const timeMatch =
      line.match(
        /(\d{1,2}:\d{2})\s*[〜~\-－]\s*(\d{1,2}:\d{2})/
      );


    let time = "";


    if(timeMatch){

      time =
        timeMatch[1]+"〜"+timeMatch[2];

    }


    let place = "";


    const nextLine =
      lines[i+1] || "";


    if(
      nextLine &&
      !nextLine.match(
        /(\d{1,2})\s*月\s*(\d{1,2})\s*日/
      ) &&
      !nextLine.match(
        /(\d{1,2})\s*[\/／]\s*(\d{1,2})/
      )
    ){

      if(
        /音楽室|講堂|教室|ホール|体育館|部室/
          .test(nextLine)
      ){

        place = nextLine;

      }

    }


    const date =
      year+
      "-" +
      String(month).padStart(2,"0")+
      "-" +
      String(day).padStart(2,"0");


    if(
      !results.some(x=>x.date===date)
    ){

      results.push({
        date,
        time,
        place
      });

    }

  }


  renderDetectedSchedules(results);

}


/* =========================
   OCR候補表示
========================= */

let detectedSchedules = [];


function renderDetectedSchedules(results){

  detectedSchedules = results;


  if(!results.length){

    $("detectedSchedules").innerHTML = `
      <div class="msg">
        日付を自動で見つけられませんでした。
        「読み取った文字」を確認して、必要なら手動登録してください。
      </div>
    `;

    $("registerDetectedButton")
      .classList.add("hidden");

    return;

  }


  let html = `
    <div class="detected">

      <strong>
        読み取った予定
      </strong>

      <p class="small">
        内容を確認・修正してから登録してください。
      </p>
  `;


  results.forEach((x,i)=>{

    html += `
      <div class="detected-row">

        <input
          type="date"
          id="detectedDate${i}"
          value="${x.date}"
        >

        <input
          type="text"
          id="detectedTime${i}"
          placeholder="時間"
          value="${esc(x.time)}"
        >

        <input
          type="text"
          id="detectedPlace${i}"
          placeholder="場所"
          value="${esc(x.place)}"
        >

        <button
          class="danger"
          onclick="removeDetected(${i})"
        >
          削除
        </button>

      </div>
    `;

  });


  html += `
    </div>
  `;


  $("detectedSchedules").innerHTML =
    html;


  $("registerDetectedButton")
    .classList.remove("hidden");

}


/* =========================
   OCR候補削除
========================= */

function removeDetected(index){

  detectedSchedules.splice(index,1);

  renderDetectedSchedules(
    detectedSchedules
  );

}


/* =========================
   OCR候補をFirebase登録
========================= */

async function registerDetectedSchedules(){

  if(!(await isAdmin())) return;


  const rows = [];


  for(
    let i=0;
    i<detectedSchedules.length;
    i++
  ){

    const date =
      $("detectedDate"+i)?.value;

    const time =
      $("detectedTime"+i)?.value.trim() || "";

    const place =
      $("detectedPlace"+i)?.value.trim() || "";


    if(!date) continue;


    rows.push({
      date,
      time,
      place
    });

  }


  if(!rows.length){

    alert("登録できる予定がありません。");

    return;

  }


  for(const x of rows){

    await set(
      ref(db,"schedules/"+x.date),
      {
        time:x.time,
        place:x.place,
        updatedAt:Date.now()
      }
    );

  }


  message(
    "ocrMsg",
    rows.length+"件の予定を登録しました。"
  );


  $("detectedSchedules").innerHTML = "";

  $("registerDetectedButton")
    .classList.add("hidden");


  detectedSchedules = [];

  loadSchedules();

}


/* =========================
   手動予定登録
========================= */

async function saveSchedule(){

  if(!(await isAdmin())) return;


  const d =
    $("sdate").value;

  const t =
    $("stime").value.trim();

  const p =
    $("splace").value.trim();


  if(!d){

    message(
      "scheduleMsg",
      "日付を入力してください。",
      true
    );

    return;

  }


  await set(
    ref(db,"schedules/"+d),
    {
      time:t,
      place:p,
      updatedAt:Date.now()
    }
  );


  message(
    "scheduleMsg",
    "保存しました。"
  );


  loadSchedules();

}


/* =========================
   予定一覧
========================= */

async function loadSchedules(){

  const s =
    await get(ref(db,"schedules"));

  const v =
    s.exists() ? s.val() : {};


  const a =
    Object.entries(v).sort();


  if(!a.length){

    $("schedules").innerHTML =
      "<p class='small'>予定はありません。</p>";

    return;

  }


  $("schedules").innerHTML =
    a.map(([d,x])=>`

      <div class="item">

        <strong>
          ${esc(d)}
        </strong>

        <br>

        ${esc(x.time || "")}

        <br>

        ${esc(x.place || "")}

        <div class="row">

          <button
            onclick="editSchedule('${esc(d)}')"
          >
            変更
          </button>

          <button
            class="danger"
            onclick="deleteSchedule('${esc(d)}')"
          >
            削除
          </button>

        </div>

      </div>

    `).join("");

}


/* =========================
   予定変更
========================= */

async function editSchedule(d){

  const s =
    await get(
      ref(db,"schedules/"+d)
    );


  if(!s.exists()) return;


  const x = s.val();


  $("sdate").value = d;

  $("stime").value =
    x.time || "";

  $("splace").value =
    x.place || "";

}


/* =========================
   予定削除
========================= */

async function deleteSchedule(d){

  if(!confirm(
    d+"の予定を削除しますか？"
  )) return;


  await remove(
    ref(db,"schedules/"+d)
  );


  loadSchedules();

}


/* =========================
   HTMLから呼び出せるようにする
========================= */

window.adminLogin =

window.logout =

window.addMember =

window.editMember =

window.deleteMember =

window.readScheduleImage =
  readScheduleImage;

window.buildDetectedSchedules =
  buildDetectedSchedules;

window.removeDetected =
  removeDetected;

window.registerDetectedSchedules =
  registerDetectedSchedules;

window.saveSchedule =
  saveSchedule;

window.editSchedule =
  editSchedule;

window.deleteSchedule =
  deleteSchedule;

</script>
