<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理者設定｜清教学園ハンドベル部</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fb;
  color:#20242a;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

header{
  background:#fff;
  padding:20px;
  border-bottom:1px solid #e5e8ed;
}

h1{
  margin:0;
  text-align:center;
  font-size:21px;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0000000b;
}

.hidden{
  display:none!important;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 5px;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #d9dee7;
  border-radius:10px;
  font-size:16px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#1f6feb;
  color:#fff;
  width:100%;
  margin-top:14px;
}

.secondary{
  background:#eef3fb;
}

.danger{
  background:#fff0f0;
  color:#b22;
  border:1px solid #efbbbb;
}

.msg{
  padding:12px;
  border-radius:10px;
  background:#fff8df;
  color:#69520a;
  margin-top:10px;
  font-size:14px;
}

.error{
  background:#fff0f0;
  color:#9b1c1c;
}

.item{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.row button{
  flex:1;
}

.small{
  font-size:12px;
  color:#6f7882;
}

.member-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.member-name{
  font-weight:700;
}

.member-actions{
  display:flex;
  gap:5px;
}

.member-actions button{
  padding:5px 8px;
  font-size:12px;
}

.pdf-box{
  border:1px dashed #b9c3d0;
  border-radius:12px;
  padding:14px;
  background:#fafbfd;
}

.candidate{
  border:1px solid #dfe4eb;
  border-radius:12px;
  padding:12px;
  margin:9px 0;
  background:#fff;
}

.candidate label{
  margin:0;
  font-weight:400;
}

.candidate-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.candidate-grid div{
  font-size:13px;
}

.badge{
  display:inline-block;
  padding:3px 7px;
  border-radius:999px;
  background:#eef3fb;
  font-size:12px;
  margin-bottom:7px;
}

.notice{
  white-space:pre-wrap;
}
</style>
</head>

<body>

<header>
  <h1>清教学園ハンドベル部 管理者設定</h1>
</header>

<main>

<!-- ログイン -->
<section id="login" class="card">

  <h2>管理者ログイン</h2>

  <p class="small">
    管理者用パスワードを入力してください。
  </p>

  <label>パスワード</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
  >

  <button class="primary" onclick="adminLogin()">
    ログイン
  </button>

  <div id="loginMsg"></div>

</section>


<!-- 管理画面 -->
<section id="app" class="hidden">

  <!-- ログアウト -->
  <div class="card">
    <button class="secondary" onclick="logout()">
      ログアウト
    </button>
  </div>


  <!-- 部員登録 -->
  <div class="card">

    <h2>部員登録</h2>

    <label>学校ID</label>
    <input id="mid">

    <label>名前</label>
    <input id="mname">

    <label>学年</label>

    <select id="mgrade">
      <option value="中学1年">中学1年</option>
      <option value="中学2年">中学2年</option>
      <option value="中学3年">中学3年</option>
      <option value="高校1年">高校1年</option>
      <option value="高校2年">高校2年</option>
    </select>

    <label>クラス</label>

    <select id="mclass">
      <option value="A">A組</option>
      <option value="B">B組</option>
      <option value="C">C組</option>
      <option value="D">D組</option>
      <option value="E">E組</option>
      <option value="F">F組</option>
      <option value="G">G組</option>
      <option value="H">H組</option>
      <option value="I">I組</option>
      <option value="J">J組</option>
      <option value="K">K組</option>
    </select>

    <button class="primary" onclick="addMember()">
      登録する

  </div>


  <!-- 部員一覧 -->
  <div class="card">

    <h2>部員一覧</h2>

  </div>


  <!-- 予定表 -->

    <h2>清教学園ハンドベル部予定表</h2>


    <!-- PDF読み込み -->
    <div class="pdf-box">

<script type="module">

/* =====================================================
   Firebase
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAK9yRrSSLsfYpLSyuzwRyI2ZZp32KeMSA",

  authDomain:
    "seikyo-handbell-club.firebaseapp.com",

  databaseURL:
    "https://seikyo-handbell-club-default-rtdb.firebaseio.com",

  projectId:
    "seikyo-handbell-club",

  storageBucket:
    "seikyo-handbell-club.firebasestorage.app",

  messagingSenderId:
    "55435007971",

  appId:
    "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"

};


const ADMIN_EMAIL = "kazuma.cosmos@gmail.com";

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

const $ = id => document.getElementById(id);

let pdfCandidates = [];


/* =====================================================
   共通
===================================================== */

const esc = s =>
  String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );


const gradeOrder = {
  "中学1年":1,
  "中学2年":2,
  "中学3年":3,
  "高校1年":4,
  "高校2年":5
};


const classOrder = {
  A:1,
  B:2,
  C:3,
  D:4,
  E:5,
  F:6,
  G:7,
  H:8,
  I:9,
  J:10,
  K:11
};


function msg(id,text,error=false){

  const el = $(id);

  el.className =
    text
      ? (error ? "msg error" : "msg")
      : "";

  el.textContent = text;
}


async function isAdmin(){

  if(!auth.currentUser) return false;

  const s =
    await get(
      ref(
        db,
        "admins/" + auth.currentUser.uid
      )
    );

  return (
    s.exists() &&
    s.val() === true
  );
}


/* =====================================================
   ログイン
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(
      user &&
      await isAdmin()
    ){

      $("login")
        .classList
        .add("hidden");

      $("app")
        .classList
        .remove("hidden");

      loadMembers();
      loadSchedules();

    }else{

      $("login")
        .classList
        .remove("hidden");

      $("app")
        .classList
        .add("hidden");

    }

  }
);


async function adminLogin(){

  try{

    await signInWithEmailAndPassword(
      auth,
      ADMIN_EMAIL,
      $("password").value
    );

    if(
      !(await isAdmin())
    ){

      await signOut(auth);

      msg(
        "loginMsg",
        "このアカウントは管理者として登録されていません。",
        true
      );

    }else{

      $("password").value = "";

      msg(
        "loginMsg",
        ""
      );

    }

  }catch(e){

    console.error(e);

    msg(
      "loginMsg",
      "ログインできませんでした。パスワードを確認してください。",
      true
    );

  }

}


function logout(){

  signOut(auth);

}


/* =====================================================
   部員
===================================================== */

async function addMember(){

  if(!(await isAdmin())) return;

  const id =
    $("mid").value.trim();

  const name =
    $("mname").value.trim();

  const grade =
    $("mgrade").value;

  const cl =
    $("mclass").value;


  if(
    !id ||
    !name ||
    !grade ||
    !cl
  ){

    msg(
      "memberMsg",
      "すべて入力してください。",
      true
    );

    return;
  }


  if(
    (
      await get(
        ref(
          db,
          "memberRegistrations/" + id
        )
      )
    ).exists()
  ){

    msg(
      "memberMsg",
      "その学校IDはすでに登録されています。",
      true
    );

    return;
  }


  await set(
    ref(
      db,
      "memberRegistrations/" + id
    ),
    {
      schoolId:id,
      name,
      grade,
      className:cl,
      createdAt:Date.now()
    }
  );


  await set(
    ref(
      db,
      "memberIds/" + id
    ),
    {
      accountCreated:false
    }
  );


  $("mid").value = "";
  $("mname").value = "";

  msg(
    "memberMsg",
    "登録しました。"
  );

  loadMembers();

}


async function loadMembers(){

  const s =
    await get(
      ref(
        db,
        "memberRegistrations"
      )
    );

  const v =
    s.exists()
      ? s.val()
      : {};


  const a =
    Object
      .entries(v)
      .sort(
        ([,x],[,y]) => {

          const g =
            (gradeOrder[x.grade] || 99) -
            (gradeOrder[y.grade] || 99);

          if(g) return g;


          const c =
            (classOrder[x.className] || 99) -
            (classOrder[y.className] || 99);

          if(c) return c;


          return String(
            x.name || ""
          ).localeCompare(
            String(y.name || ""),
            "ja"
          );

        }
      );


  $("members").innerHTML =
    a.length

      ? a.map(
          ([id,x]) => `

            <div class="item">

              <div class="member-head">

                <div>

                  <span class="member-name">
                    ${esc(x.name)}
                  </span>

                  <span class="small">
                    ${esc(id)}
                  </span>

                </div>


                <div class="member-actions">

                  <button
                    onclick="editMember('${esc(id)}')"
                  >
                    変更
                  </button>

                  <button
                    class="danger"
                    onclick="deleteMember('${esc(id)}')"
                  >
                    削除
                  </button>

                </div>

              </div>


              <div class="small">
                ${esc(x.grade)}
               　
                ${esc(x.className)}組
              </div>

            </div>

          `
        ).join("")

      : "<p class='small'>まだ登録されていません。</p>";

}


async function editMember(id){

  const s =
    await get(
      ref(
        db,
        "memberRegistrations/" + id
      )
    );

  if(!s.exists()) return;

  const x = s.val();


  const name =
    prompt(
      "名前",
      x.name || ""
    );

  if(name === null) return;


  const grade =
    prompt(
      "学年（中学1年〜高校2年）",
      x.grade || ""
    );

  if(grade === null) return;


  const cl =
    prompt(
      "クラス（A〜K）",
      x.className || ""
    );

  if(cl === null) return;


  if(
    ![
      "中学1年",
      "中学2年",
      "中学3年",
      "高校1年",
      "高校2年"
    ].includes(grade) ||
    !/^[A-K]$/.test(cl)
  ){

    alert(
      "学年またはクラスの入力が正しくありません。"
    );

    return;
  }


  await update(
    ref(
      db,
      "memberRegistrations/" + id
    ),
    {
      name:name.trim(),
      grade,
      className:cl
    }
  );


  loadMembers();

}


async function deleteMember(id){

  if(
    !confirm(
      "この部員登録を削除しますか？"
    )
  ) return;


  await remove(
    ref(
      db,
      "memberRegistrations/" + id
    )
  );


  await remove(
    ref(
      db,
      "memberIds/" + id
    )
  );


  loadMembers();

}


/* =====================================================
   手動予定登録
===================================================== */

async function saveSchedule(){

  if(!(await isAdmin())) return;


  const d =
    $("sdate").value;

  const t =
    $("stime").value.trim();

  const p =
    $("splace").value.trim();

  const n =
    $("snote").value.trim();


  if(!d){

    msg(
      "scheduleMsg",
      "日付を入力してください。",
      true
    );

    return;
  }


  await set(
    ref(
      db,
      "schedules/" + d
    ),
    {
      time:t,
      place:p,
      note:n,
      updatedAt:Date.now()
    }
  );


  msg(
    "scheduleMsg",
    "保存しました。"
  );

  loadSchedules();

}


async function loadSchedules(){

  const s =
    await get(
      ref(
        db,
        "schedules"
      )
    );

  const v =
    s.exists()
      ? s.val()
      : {};


  const a =
    Object
      .entries(v)
      .sort();


  $("schedules").innerHTML =
    a.length

      ? a.map(
          ([d,x]) => `

            <div class="item">

              <strong>
                ${esc(d)}
              </strong>

              ${
                x.time
                  ? `<br>${esc(x.time)}`
                  : ""
              }

              ${
                x.place
                  ? `<br>${esc(x.place)}`
                  : ""
              }

              ${
                x.note
                  ? `<br><span class="notice">${esc(x.note)}</span>`
                  : ""
              }


              <div class="row">

                <button
                  onclick="editSchedule('${esc(d)}')"
                >
                  変更
                </button>

                <button
                  class="danger"
                  onclick="deleteSchedule('${esc(d)}')"
                >
                  削除
                </button>

              </div>

            </div>

          `
        ).join("")

      : "<p class='small'>予定はありません。</p>";

}


async function editSchedule(d){

  const s =
    await get(
      ref(
        db,
        "schedules/" + d
      )
    );

  if(!s.exists()) return;

  const x = s.val();


  $("sdate").value =
    d;

  $("stime").value =
    x.time || "";

  $("splace").value =
    x.place || "";

  $("snote").value =
    x.note || "";


  window.scrollTo({
    top:
      $("sdate").getBoundingClientRect().top +
      window.scrollY -
      20,
    behavior:"smooth"
  });

}


async function deleteSchedule(d){

  if(
    !confirm(
      d + "の予定を削除しますか？"
    )
  ) return;


  await remove(
    ref(
      db,
      "schedules/" + d
    )
  );


  loadSchedules();

}


/* =====================================================
   PDF読み込み
===================================================== */

/*
  今回のPDFは文字データを持っているので、
  画像OCRは使用しない。

  PDF.jsでPDF内の文字を直接取得する。

  読み込む列：
  ・日付
  ・活動時間
  ・場所
  ・その他・備考

  無視する列：
  ・練習曲の目安
*/


function normalizeText(s){

  return String(s || "")
    .replace(/\u3000/g," ")
    .replace(/[：]/g,":")
    .replace(/[～〜−ー]/g,"~")
    .replace(/\s+/g," ")
    .trim();

}


function parseTimeFromLine(line){

  const s =
    normalizeText(line)
      .replace(/[：]/g,":")
      .replace(/[～〜−ー]/g,"~")
      .replace(/\s+/g,"");


  let m =
    s.match(
      /(\d{1,2}:\d{2})~(\d{1,2}:\d{2})/
    );


  if(!m){

    m =
      s.match(
        /(\d{1,2}:\d{2})[-–](\d{1,2}:\d{2})/
      );

  }


  if(!m) return "";


  return (
    m[1] +
    "〜" +
    m[2]
  );

}


function cleanOtherText(s){

  let x =
    normalizeText(s);


  x =
    x.replace(
      /^(活動時間|場所|練習曲の目安|その他・備考)$/,
      ""
    );


  x =
    x.replace(
      /\d{1,2}:\d{2}\s*[~\-–]\s*\d{1,2}:\d{2}/g,
      ""
    );


  x =
    x.replace(
      /\d{1,2}月\d{1,2}日?/g,
      ""
    );


  return x.trim();

}


function makeDate(
  year,
  month,
  day
){

  return (
    year +
    "-" +
    String(month).padStart(2,"0") +
    "-" +
    String(day).padStart(2,"0")
  );

}


/* =====================================================
   PDF.js
===================================================== */

async function getPdfJs(){

  if(window.pdfjsLib){

    return window.pdfjsLib;

  }


  const module =
    await import(
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
    );


  module.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


  window.pdfjsLib =
    module;


  return module;

}


/* =====================================================
   PDF → 行
===================================================== */

async function extractPdfLines(file){

  const pdfjs =
    await getPdfJs();


  const buffer =
    await file.arrayBuffer();


  const pdf =
    await pdfjs.getDocument({
      data:buffer
    }).promise;


  const allLines = [];


  for(
    let pageNo = 1;
    pageNo <= pdf.numPages;
    pageNo++
  ){

    const page =
      await pdf.getPage(pageNo);


    const content =
      await page.getTextContent();


    const words =
      content.items

        .filter(
          x =>
            String(
              x.str || ""
            ).trim()
        )

        .map(
          x => ({
            text:
              normalizeText(x.str),

            x:
              Number(
                x.transform?.[4] || 0
              ),

            y:
              Number(
                x.transform?.[5] || 0
              )
          })
        );


    const rows = [];

    const tolerance = 4;


    for(const word of words){

      let row =
        rows.find(
          r =>
            Math.abs(
              r.y - word.y
            ) <= tolerance
        );


      if(!row){

        row = {
          y:word.y,
          items:[]
        };

        rows.push(row);

      }


      row.items.push(word);

    }


    rows.sort(
      (a,b) =>
        b.y - a.y
    );


    for(const row of rows){

      row.items.sort(
        (a,b) =>
          a.x - b.x
      );


      const text =
        row.items
          .map(
            x => x.text
          )
          .join(" ");


      allLines.push(
        normalizeText(text)
      );

    }

  }


  return allLines;

}


/* =====================================================
   PDF → 予定
===================================================== */

function parseScheduleLines(lines){

  const currentYear =
    new Date().getFullYear();


  let month = null;


  /*
    表題から月を探す
  */

  for(const line of lines){

    const m =
      line.match(
        /(\d{1,2})\s*月/
      );


    if(m){

      const n =
        Number(m[1]);


      if(
        n >= 1 &&
        n <= 12
      ){

        month = n;

        break;

      }

    }

  }


  if(!month){

    throw new Error(
      "PDFから月を読み取れませんでした。"
    );

  }


  const results = [];

  let current = null;


  for(const raw of lines){

    const line =
      normalizeText(raw);


    if(!line) continue;


    /*
      見出しを無視
    */

    if(
      /予定表|活動時間|場所|練習曲の目安|その他・備考/.test(
        line
      )
    ){

      continue;

    }


    /*
      日付
    */

    const dateMatch =
      line.match(
        /(\d{1,2})月\s*(\d{1,2})日?/
      );


    let dateInfo = null;


    if(dateMatch){

      const mm =
        Number(dateMatch[1]);

      const dd =
        Number(dateMatch[2]);


      if(
        mm === month &&
        dd >= 1 &&
        dd <= 31
      ){

        dateInfo = {
          month:mm,
          day:dd
        };

      }

    }


    /*
      新しい日付
    */

    if(dateInfo){

      if(current){

        results.push(
          current
        );

      }


      let rest =
        line.replace(
          new RegExp(
            dateInfo.month +
            "月\\s*" +
            dateInfo.day +
            "日?"
          ),
          ""
        )
        .trim();


      /*
        曜日を除去
      */

      rest =
        rest.replace(
          /^(月|火|水|木|金|土|日)\s*/,
          ""
        )
        .trim();


      current = {

        date:
          makeDate(
            currentYear,
            dateInfo.month,
            dateInfo.day
          ),

        time:
          parseTimeFromLine(
            rest
          ),

        place:"",

        note:""

      };


      /*
        時間を除去
      */

      rest =
        rest.replace(
          /\d{1,2}:\d{2}\s*[~\-–]\s*\d{1,2}:\d{2}/,
          ""
        )
        .trim();


      /*
        場所
      */

      if(
        rest.includes(
          "音楽練習室"
        )
      ){

        current.place =
          "音楽練習室";


        rest =
          rest
            .replace(
              "音楽練習室",
              ""
            )
            .trim();

      }


      /*
        残りは備考
      */

      const note =
        cleanOtherText(
          rest
        );


      if(note){

        current.note =
          note;

      }


      continue;

    }


    /*
      日付だけが別行になった場合
    */

    const dayOnly =
      line.match(
        /^(\d{1,2})$/
      );


    if(
      dayOnly &&
      Number(dayOnly[1]) >= 1 &&
      Number(dayOnly[1]) <= 31
    ){

      if(current){

        results.push(
          current
        );

      }


      current = {

        date:
          makeDate(
            currentYear,
            month,
            Number(dayOnly[1])
          ),

        time:"",

        place:"",

        note:""

      };


      continue;

    }


    /*
      日付の次の行に
      時間・場所・備考がある場合
    */

    if(current){

      const time =
        parseTimeFromLine(
          line
        );


      if(time){

        current.time =
          time;

      }


      if(
        line.includes(
          "音楽練習室"
        )
      ){

        current.place =
          "音楽練習室";

      }


      /*
        練習曲はここでは
        一切処理しない
      */

      let rest =
        line

          .replace(
            /\d{1,2}:\d{2}\s*[~\-–]\s*\d{1,2}:\d{2}/,
            ""
          )

          .replace(
            /音楽練習室/g,
            ""
          )

          .trim();


      /*
        曜日だけなら無視
      */

      if(
        !/^(月|火|水|木|金|土|日)$/.test(
          rest
        )
      ){

        const note =
          cleanOtherText(
            rest
          );


        if(note){

          current.note =
            current.note
              ? current.note +
                " " +
                note
              : note;

        }

      }

    }

  }


  if(current){

    results.push(
      current
    );

  }


  /*
    同じ日付をまとめる
  */

  const map =
    new Map();


  for(const x of results){

    if(!x.date) continue;


    if(!map.has(x.date)){

      map.set(
        x.date,
        {...x}
      );

    }else{

      const old =
        map.get(x.date);


      if(x.time){

        old.time =
          x.time;

      }


      if(x.place){

        old.place =
          x.place;

      }


      if(x.note){

        old.note =
          old.note
            ? old.note +
              " " +
              x.note
            : x.note;

      }

    }

  }


  return [
    ...map.values()
  ]
    .sort(
      (a,b) =>
        a.date.localeCompare(
          b.date
        )
    );

}


/* =====================================================
   PDF読み取り
===================================================== */

async function readSchedulePDF(){

  if(!(await isAdmin())) return;


  const file =
    $("schedulePdf")
      .files[0];


  if(!file){

    msg(
      "pdfMsg",
      "PDFファイルを選択してください。",
      true
    );

    return;

  }


  if(
    file.type !== "application/pdf" &&
    !file.name
      .toLowerCase()
      .endsWith(".pdf")
  ){

    msg(
      "pdfMsg",
      "PDFファイルを選択してください。",
      true
    );

    return;

  }


  msg(
    "pdfMsg",
    "PDFを読み取っています。少し待ってください。"
  );


  try{

    const lines =
      await extractPdfLines(
        file
      );


    console.log(
      "PDFから取得した文字：",
      lines
    );


    pdfCandidates =
      parseScheduleLines(
        lines
      );


    if(
      !pdfCandidates.length
    ){

      throw new Error(
        "予定候補を見つけられませんでした。"
      );

    }


    renderPDFCandidates();


    $("pdfCandidatesBox")
      .classList
      .remove("hidden");


    msg(
      "pdfMsg",
      pdfCandidates.length +
      "件の予定候補を読み取りました。"
    );


  }catch(e){

    console.error(e);


    msg(
      "pdfMsg",
      "PDFを読み取れませんでした。PDFの文字データを確認してください。",
      true
    );

  }

}


/* =====================================================
   候補表示
===================================================== */

function renderPDFCandidates(){

  $("pdfCandidates").innerHTML =
    pdfCandidates
      .map(
        (x,i) => `

          <div class="candidate">

            <label>

              <input
                type="checkbox"
                id="pdfCheck${i}"
                checked
              >

              <span class="badge">
                ${esc(x.date)}
              </span>

            </label>


            <div class="candidate-grid">

              <div>

                <strong>
                  日付
                </strong>

                <input
                  id="pdfDate${i}"
                  type="date"
                  value="${esc(x.date)}"
                >

              </div>


              <div>

                <strong>
                  時間
                </strong>

                <input
                  id="pdfTime${i}"
                  value="${esc(x.time)}"
                  placeholder="例：15:45〜18:00"
                >

              </div>


              <div>

                <strong>
                  場所
                </strong>

                <input
                  id="pdfPlace${i}"
                  value="${esc(x.place)}"
                >

              </div>


              <div>

                <strong>
                  その他・備考
                </strong>

                <input
                  id="pdfNote${i}"
                  value="${esc(x.note)}"
                >

              </div>

            </div>

          </div>

        `
      )
      .join("");

}


/* =====================================================
   PDF候補をFirebaseへ登録
===================================================== */

async function registerPDFCandidates(){

  if(!(await isAdmin())) return;


  let count = 0;


  for(
    let i = 0;
    i < pdfCandidates.length;
    i++
  ){

    const check =
      $(`pdfCheck${i}`);


    if(
      !check ||
      !check.checked
    ){

      continue;

    }


    const d =
      $(`pdfDate${i}`).value;

    const t =
      $(`pdfTime${i}`).value.trim();

    const p =
      $(`pdfPlace${i}`).value.trim();

    const n =
      $(`pdfNote${i}`).value.trim();


    if(!d) continue;


    await set(
      ref(
        db,
        "schedules/" + d
      ),
      {
        time:t,
        place:p,
        note:n,
        updatedAt:Date.now()
      }
    );


    count++;

  }


  msg(
    "pdfMsg",
    count +
    "件の予定を登録しました。"
  );


  loadSchedules();

}
