<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シークレット月夜演出</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#061126;
}

body{
  position:relative;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

/* =====================================================
   月夜
===================================================== */

.scene{
  position:absolute;
  inset:0;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(70,94,150,.28),
      transparent 38%
    ),
    linear-gradient(
      to bottom,
      #020817 0%,
      #07152f 58%,
      #101d38 100%
    );

  opacity:0;

  animation:
    sceneIn
    .55s
    ease-out
    forwards;
}

@keyframes sceneIn{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}

/* =====================================================
   星
===================================================== */

.stars{
  position:absolute;
  inset:0;
}

.star{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#fff;

  opacity:.75;

  animation:
    twinkle
    2.4s
    ease-in-out
    infinite;
}

.star.cross{
  width:2px;
  height:10px;

  border-radius:2px;

  opacity:.85;
}

.star.cross::after{
  content:"";

  position:absolute;

  left:-4px;
  top:4px;

  width:10px;
  height:2px;

  border-radius:2px;

  background:#fff;
}

@keyframes twinkle{

  0%,
  100%{
    opacity:.25;
    transform:scale(.7);
  }

  50%{
    opacity:1;
    transform:scale(1.25);
  }

}

/* =====================================================
   月
===================================================== */

.moon{
  position:absolute;

  width:min(30vw,150px);
  height:min(30vw,150px);

  min-width:92px;
  min-height:92px;

  right:13%;
  top:10%;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 32%,
      #fff 0 8%,
      transparent 9%
    ),
    radial-gradient(
      circle at 62% 60%,
      rgba(190,198,220,.6) 0 8%,
      transparent 9%
    ),
    radial-gradient(
      circle at 38% 67%,
      rgba(190,198,220,.42) 0 6%,
      transparent 7%
    ),
    #f4f4df;

  box-shadow:
    0 0 18px rgba(240,243,255,.9),
    0 0 55px rgba(170,190,255,.6),
    0 0 110px rgba(120,150,240,.25);

  opacity:0;

  transform:
    scale(.55);

  animation:
    moonIn
    1.15s
    cubic-bezier(.2,.9,.25,1.1)
    .45s
    forwards;

  z-index:5;
}

@keyframes moonIn{

  0%{
    opacity:0;

    transform:
      scale(.55)
      translateY(-18px);
  }

  100%{
    opacity:1;

    transform:
      scale(1)
      translateY(0);
  }

}

/* =====================================================
   月光スポット
===================================================== */

.moonlight{
  position:absolute;

  left:50%;
  top:5%;

  width:95vw;
  height:115vh;

  transform:
    translateX(-50%);

  background:
    radial-gradient(
      ellipse at 50% 48%,
      rgba(235,241,255,.55) 0%,
      rgba(190,210,255,.24) 18%,
      rgba(150,180,245,.10) 38%,
      transparent 67%
    );

  opacity:0;

  filter:blur(2px);

  animation:
    moonlightIn
    1.7s
    ease-out
    1.0s
    forwards;

  z-index:3;

  pointer-events:none;
}

@keyframes moonlightIn{

  from{
    opacity:0;
  }

  to{
    opacity:.72;
  }

}

/* =====================================================
   地面
===================================================== */

.ground{
  position:absolute;

  left:-5%;
  right:-5%;
  bottom:-3%;

  height:28%;

  background:
    radial-gradient(
      ellipse at 50% 0%,
      rgba(115,133,177,.24),
      transparent 55%
    ),
    linear-gradient(
      to bottom,
      #152340,
      #0a1224
    );

  border-radius:
    50% 50% 0 0 /
    14% 14% 0 0;

  box-shadow:
    0 -10px 35px
    rgba(110,140,210,.12);

  z-index:10;
}

.ground-glow{
  position:absolute;

  left:50%;
  bottom:21%;

  width:190px;
  height:70px;

  transform:
    translateX(-50%);

  border-radius:50%;

  background:
    rgba(225,235,255,.18);

  filter:blur(20px);

  opacity:0;

  animation:
    groundGlow
    1s
    ease-out
    4.05s
    forwards;

  z-index:11;
}

@keyframes groundGlow{

  from{
    opacity:0;

    transform:
      translateX(-50%)
      scale(.5);
  }

  to{
    opacity:1;

    transform:
      translateX(-50%)
      scale(1);
  }

}

/* =====================================================
   シークレット衣装
===================================================== */

.secret-character{
  position:absolute;

  left:50%;
  top:-145px;

  width:90px;
  height:90px;

  transform:
    translateX(-50%);

  z-index:12;

  opacity:.055;

  filter:
    brightness(0);

  animation:
    secretDescend
    4.25s
    cubic-bezier(.18,.72,.22,1)
    forwards,
    secretReveal
    4.25s
    linear
    forwards;
}

.secret-body{
  position:absolute;

  inset:0;

  transform-origin:
    50% 90%;
}

.layer{
  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center;

  pointer-events:none;
  user-select:none;
}

/* base */

.l0{
  width:100%;
  height:100%;

  transform:
    translate(-20px,-10px)
    scale(1.35)
    rotate(-10deg);

  transform-origin:center;
}

/* main */

.l1{
  width:100%;
  height:100%;

  transform:
    translate(-15px,30px)
    scale(1.5)
    rotate(0deg);

  transform-origin:center;
}

/* layer-02 */

.l3{
  transform:
    translate(0,0)
    scale(1)
    rotate(0deg);
}

/* layer-03 */

.l4{
  transform:
    translate(0,0)
    scale(1)
    rotate(0deg);
}

/* layer-05 */

.l6{
  transform:
    translate(0,0)
    scale(1)
    rotate(0deg);
}

/* =====================================================
   ベルちゃんが上から降りてくる
===================================================== */

@keyframes secretDescend{

  0%{

    top:-145px;

    transform:
      translateX(-50%)
      scale(.88);
  }

  76%{

    top:
      calc(72% - 45px);

    transform:
      translateX(-50%)
      scale(.98);
  }

  88%{

    top:
      calc(72% - 50px);

    transform:
      translateX(-50%)
      scale(1.01);
  }

  94%{

    top:
      calc(72% - 45px);

    transform:
      translateX(-50%)
      scale(.99);
  }

  100%{

    top:
      calc(72% - 47px);

    transform:
      translateX(-50%)
      scale(1);
  }

}

/* =====================================================
   シルエット → 徐々に姿が見える
===================================================== */

@keyframes secretReveal{

  0%,
  43%{

    opacity:.055;

    filter:
      brightness(0)
      saturate(0);
  }

  58%{

    opacity:.20;

    filter:
      brightness(.15)
      saturate(.15);
  }

  72%{

    opacity:.72;

    filter:
      brightness(.75)
      saturate(.8);
  }

  82%,
  100%{

    opacity:1;

    filter:
      brightness(1)
      saturate(1);
  }

}

/* =====================================================
   着地の輪
===================================================== */

.landing-ring{
  position:absolute;

  left:50%;
  bottom:24%;

  width:30px;
  height:12px;

  border:
    2px solid
    rgba(235,242,255,.75);

  border-radius:50%;

  transform:
    translateX(-50%)
    scale(.2);

  opacity:0;

  z-index:13;

  animation:
    landingRing
    .75s
    ease-out
    3.75s
    forwards;
}

@keyframes landingRing{

  0%{

    opacity:0;

    transform:
      translateX(-50%)
      scale(.2);
  }

  20%{
    opacity:.9;
  }

  100%{

    opacity:0;

    transform:
      translateX(-50%)
      scale(5.2);
  }

}

/* =====================================================
   衣装のきらめき
===================================================== */

.sparkles{
  position:absolute;

  inset:0;

  z-index:15;

  pointer-events:none;
}

.spark{
  position:absolute;

  width:6px;
  height:6px;

  border-radius:50%;

  background:#fff;

  opacity:0;

  box-shadow:
    0 0 8px 2px
    rgba(255,236,170,.9);
}

.spark::before,
.spark::after{
  content:"";

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  background:#fff;

  border-radius:2px;
}

.spark::before{
  width:2px;
  height:18px;
}

.spark::after{
  width:18px;
  height:2px;
}

.s1{
  left:43%;
  top:65%;

  animation:
    sparkFly
    1.35s
    ease-out
    4.15s
    forwards;
}

.s2{
  left:55%;
  top:68%;

  animation:
    sparkFly
    1.5s
    ease-out
    4.28s
    forwards;
}

.s3{
  left:47%;
  top:61%;

  animation:
    sparkFly
    1.2s
    ease-out
    4.38s
    forwards;
}

.s4{
  left:59%;
  top:62%;

  animation:
    sparkFly
    1.4s
    ease-out
    4.48s
    forwards;
}

.s5{
  left:40%;
  top:70%;

  animation:
    sparkFly
    1.35s
    ease-out
    4.55s
    forwards;
}

.s6{
  left:63%;
  top:69%;

  animation:
    sparkFly
    1.5s
    ease-out
    4.62s
    forwards;
}

@keyframes sparkFly{

  0%{

    opacity:0;

    transform:
      translate(0,0)
      scale(.2)
      rotate(0deg);
  }

  18%{
    opacity:1;
  }

  100%{

    opacity:0;

    transform:
      translate(
        calc(var(--dx) * 55px),
        calc(var(--dy) * 55px)
      )
      scale(1.2)
      rotate(90deg);
  }

}

.s1{
  --dx:-1;
  --dy:-1;
}

.s2{
  --dx:1;
  --dy:-1;
}

.s3{
  --dx:-.5;
  --dy:-1;
}

.s4{
  --dx:1.2;
  --dy:-.5;
}

.s5{
  --dx:-1.2;
  --dy:.1;
}

.s6{
  --dx:1.1;
  --dy:.2;
}

/* =====================================================
   月光を強くする
===================================================== */

.intensify{
  position:absolute;

  inset:0;

  z-index:20;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 50% 55%,
      rgba(255,255,255,.82),
      rgba(225,235,255,.42) 28%,
      transparent 63%
    );

  opacity:0;

  animation:
    lightIntensify
    1.15s
    ease-in
    4.7s
    forwards;
}

@keyframes lightIntensify{

  0%{
    opacity:0;
  }

  55%{
    opacity:.32;
  }

  100%{
    opacity:.78;
  }

}

/* =====================================================
   白飛び
===================================================== */

.whiteout{
  position:absolute;

  inset:0;

  z-index:100;

  background:#fff;

  opacity:0;

  pointer-events:none;

  animation:
    whiteout
    1.35s
    ease-in
    5.65s
    forwards;
}

@keyframes whiteout{

  0%{
    opacity:0;
  }

  48%{
    opacity:0;
  }

  100%{
    opacity:1;
  }

}

/* =====================================================
   最後に少し戻す
===================================================== */

.fadeBack{
  position:absolute;

  inset:0;

  z-index:101;

  background:#fff;

  opacity:0;

  pointer-events:none;

  animation:
    fadeBack
    .55s
    ease-out
    6.85s
    forwards;
}

@keyframes fadeBack{

  0%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}

/* =====================================================
   動きを減らす設定
===================================================== */

@media (prefers-reduced-motion:reduce){

  .scene,
  .moon,
  .moonlight,
  .secret-character,
  .landing-ring,
  .spark,
  .intensify,
  .whiteout,
  .fadeBack{

    animation:none !important;

  }

}
</style>
</head>

<body>

<div class="scene">

  <!-- 星 -->
  <div
    class="stars"
    id="stars">
  </div>

  <!-- 月 -->
  <div class="moon"></div>

  <!-- 月から降りる光 -->
  <div class="moonlight"></div>

  <!-- 地面 -->
  <div class="ground"></div>

  <div class="ground-glow"></div>

  <!-- =================================================
       シークレット衣装
  ================================================== -->

  <div
    class="secret-character"
    aria-hidden="true">

    <div class="secret-body">

      <img
        class="layer l0"
        src="costumes/bell-secret-base.png"
        alt=""
      >

      <img
        class="layer l1"
        src="costumes/bell-secret-main.png"
        alt=""
      >

      <img
        class="layer l3"
        src="costumes/bell-secret-layer-02.png"
        alt=""
      >

      <img
        class="layer l4"
        src="costumes/bell-secret-layer-03.png"
        alt=""
      >

      <img
        class="layer l6"
        src="costumes/bell-secret-layer-05.png"
        alt=""
      >

    </div>

  </div>

  <!-- 着地 -->
  <div class="landing-ring"></div>

  <!-- きらめき -->
  <div class="sparkles">

    <i class="spark s1"></i>
    <i class="spark s2"></i>
    <i class="spark s3"></i>
    <i class="spark s4"></i>
    <i class="spark s5"></i>
    <i class="spark s6"></i>

  </div>

  <!-- 月光強化 -->
  <div class="intensify"></div>

  <!-- 白飛び -->
  <div class="whiteout"></div>

  <!-- 終了直前 -->
  <div class="fadeBack"></div>

</div>

<script>

(function(){

  /* =================================================
     星を生成
  ================================================== */

  const stars =
    document.getElementById(
      "stars"
    );

  for(
    let i=0;
    i<72;
    i++
  ){

    const star =
      document.createElement(
        "i"
      );

    star.className =
      "star";

    /*
     * 一部を十字の星にする
     */
    if(i%13===0){

      star.classList.add(
        "cross"
      );

    }

    star.style.left =
      (Math.random()*100)
      + "%";

    star.style.top =
      (Math.random()*72)
      + "%";

    star.style.animationDelay =
      (Math.random()*2.2)
      + "s";

    star.style.transform =
      "scale(" +
      (
        .55 +
        Math.random()*.9
      ) +
      ")";

    stars.appendChild(
      star
    );

  }

  /* =================================================
     7秒後に親ページへ終了通知
  ================================================== */

  setTimeout(
    function(){

      try{

        window.parent.postMessage(
          {
            type:
              "secret-moon-finished"
          },
          "*"
        );

      }catch(error){

        /*
         * 親ページが存在しない場合は
         * 何もしない
         */

      }

    },
    7000
  );

})();

</script>

</body>
</html>
