<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>シークレット月夜</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{position:relative}

/* ---------- 夜空のシーン（最後にまとめて消える） ---------- */
#scene{position:absolute;inset:0;overflow:hidden;opacity:0;
  background:linear-gradient(to bottom,#030a1c 0%,#07152f 55%,#101d34 100%)}
#stars{position:absolute;inset:0}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.65;animation:twinkle 2.8s ease-in-out infinite}
.star.cross{width:2px;height:10px;border-radius:2px}
.star.cross::after{content:"";position:absolute;left:-4px;top:4px;width:10px;height:2px;background:#fff;border-radius:2px}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}

/* 三日月 */
#moonWrap{position:absolute;right:12%;top:8%;width:118px;height:118px;opacity:0}
#moonHalo{position:absolute;left:-90px;top:-90px;width:298px;height:298px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,238,190,.55) 0%,rgba(255,225,160,.22) 30%,rgba(150,180,245,.08) 55%,transparent 70%)}
#moonSvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-18deg);
  filter:drop-shadow(0 0 10px rgba(255,236,180,.95)) drop-shadow(0 0 28px rgba(255,214,130,.55))}

/* 月の光の筋 */
#beam{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;
  filter:blur(7px);mix-blend-mode:screen}

/* 地面 */
#ground{position:absolute;left:-5%;right:-5%;bottom:-4%;height:27%;
  background:linear-gradient(to bottom,#14213b,#050a14 75%);
  clip-path:polygon(0 22%,12% 17%,24% 21%,38% 13%,51% 19%,65% 10%,78% 18%,90% 13%,100% 19%,100% 100%,0 100%);
  box-shadow:0 -12px 35px rgba(103,137,190,.15)}
#landingGlow{position:absolute;left:0;top:0;width:260px;height:110px;border-radius:50%;opacity:0;
  background:radial-gradient(ellipse,rgba(255,236,180,.42),rgba(255,214,130,.14) 40%,transparent 72%);
  filter:blur(5px)}

/* 流れ星 */
#shoot{position:absolute;left:-150px;top:0;width:150px;height:2px;border-radius:2px;opacity:0;
  transform-origin:100% 50%;
  background:linear-gradient(to left,#fff,rgba(255,255,255,0));
  box-shadow:0 0 8px 1px rgba(255,255,255,.7)}

/* ---------- 主役（シーンの外に置く：背景が消えても残る） ---------- */
#actor{position:absolute;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;opacity:0;will-change:transform}
#halo{position:absolute;left:-60px;top:-60px;width:240px;height:240px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,230,160,.55) 0%,rgba(255,214,130,.2) 40%,transparent 68%)}
.layerHost{position:absolute;left:0;top:0;width:120px;height:120px;overflow:visible}
#actorDark{filter:brightness(0) drop-shadow(0 0 5px rgba(140,170,255,.55))}
#actorColor{clip-path:inset(-60% -60% 160% -60%)}

/* 金色の粒 */
#fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
</style>
</head>
<body>

<div id="scene">
  <div id="stars"></div>

  <div id="moonWrap">
    <div id="moonHalo"></div>
    <svg id="moonSvg" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <radialGradient id="mg" cx="35%" cy="30%" r="80%">
          <stop offset="0" stop-color="#fffdf0"/>
          <stop offset=".55" stop-color="#ffeec0"/>
          <stop offset="1" stop-color="#f3cf84"/>
        </radialGradient>
        <mask id="cm">
          <rect width="100" height="100" fill="#fff"/>
          <circle cx="64" cy="42" r="37" fill="#000"/>
        </mask>
      </defs>
      <circle cx="46" cy="52" r="40" fill="url(#mg)" mask="url(#cm)"/>
    </svg>
  </div>

  <svg id="beam" aria-hidden="true">
    <defs>
      <linearGradient id="beamGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
        <stop offset="0" stop-color="#fff3c8" stop-opacity=".55"/>
        <stop offset="1" stop-color="#cfe0ff" stop-opacity=".08"/>
      </linearGradient>
    </defs>
    <polygon id="beamPoly" fill="url(#beamGrad)"/>
  </svg>

  <div id="ground"></div>
  <div id="landingGlow"></div>
  <div id="shoot"></div>
</div>

<div id="actor">
  <div id="halo"></div>
  <div id="actorDark" class="layerHost"></div>
  <div id="actorColor" class="layerHost"></div>
</div>

<canvas id="fx"></canvas>

<script>
/* =====================================================
   シークレット月夜（全体 6.5 秒）

   0.0〜0.5  夜空が現れる
   0.15〜1.0 三日月が昇る
   0.6〜1.2  月の光の筋が差す
   1.25〜2.05 流れ星が1本
   0.5〜3.2  シルエットが羽根のように、ゆっくり降りてくる
             ※色が戻るのは「月光の範囲に入った部分」だけ（位置で決まる）
   3.2〜4.0  ふわっと着地 → 金色の粒が舞う
   4.1〜5.3  衣装が縮みながら右上の定位置へ飛んでいく
   4.7〜6.0  夜空がすうっと消える
   6.5       終了通知

   時間を変えたいときは、下の T の数字だけ変えればよい。
===================================================== */

const T={fallStart:.5,land:3.2,flyStart:4.1,flyEnd:5.3,bgFade0:4.7,bgFade1:6.0,end:6.5,
         beamOut0:4.3,beamOut1:5.1,haloOut0:4.7,haloOut1:5.6};

const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---------- 星 ---------- */
(function(){
  const box=$("stars");
  for(let i=0;i<66;i++){
    const s=document.createElement("i");
    s.className="star"+(Math.random()<.16?" cross":"");
    s.style.left=(3+Math.random()*94)+"%";
    s.style.top=(4+Math.random()*62)+"%";
    s.style.animationDelay=(Math.random()*2.5)+"s";
    box.appendChild(s);
  }
})();

/* ---------- 親ページ（design.html）から衣装を複製 ---------- */
function buildActor(){
  let source=null;
  try{source=window.parent.document.getElementById("secretCostume")}catch(e){console.error(e)}
  if(!source)return false;

  /* 各レイヤーの位置ずらしはpx指定（元の大きさ基準）。
     枠の幅だけ変えると位置がずれるので、元の大きさのまま全体を拡大する。 */
  const size=source.offsetWidth||90;

  ["actorDark","actorColor"].forEach(id=>{
    const clone=source.cloneNode(true);
    clone.removeAttribute("id");
    const st=clone.style;
    ["position:absolute","left:0","top:0","right:auto","bottom:auto","margin:0",
     "display:block","visibility:visible","opacity:1","pointer-events:none","overflow:visible",
     "width:"+size+"px","height:"+size+"px",
     "transform:scale("+(120/size)+")","transform-origin:0 0"
    ].forEach(rule=>{
      const i=rule.indexOf(":");
      st.setProperty(rule.slice(0,i),rule.slice(i+1),"important");
    });
    clone.querySelectorAll(".secret-body,.secret-layer-wrap,.secret-layer").forEach(el=>{
      el.style.setProperty("animation","none","important");
    });
    $(id).appendChild(clone);
  });
  return true;
}

/* ---------- 定位置（右上のベルちゃんの場所） ---------- */
function getHome(W){
  let h=null;
  try{h=window.parent.__secretMoonHome}catch(e){}
  if(h&&isFinite(h.cx)&&isFinite(h.cy))return {x:h.cx,y:h.cy,size:h.size||90};
  return {x:W-60,y:70,size:90};
}

/* ---------- 金色の粒（canvas） ---------- */
const canvas=$("fx"),ctx=canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  DPR=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
}
const P=[];
function spawn(x,y,vx,vy,life,size,grav){
  P.push({x,y,vx,vy,life,age:0,size,grav:grav||0,seed:Math.random()*6.28});
}
function stepParticles(dt){
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];
    p.age+=dt;
    if(p.age>=p.life){P.splice(i,1);continue}
    p.vy+=p.grav*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
}
function drawParticles(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation="lighter";
  for(const p of P){
    const a=1-p.age/p.life;
    const f=.65+.35*Math.sin(p.age*18+p.seed);
    const alpha=Math.max(0,a*f);
    ctx.fillStyle="rgba(255,214,120,"+(alpha*.28)+")";
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*3,0,6.2832);ctx.fill();
    ctx.fillStyle="rgba(255,243,200,"+alpha+")";
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.2832);ctx.fill();
  }
  /* 着地の波紋 */
  const rp=(t-T.land)/.9;
  if(rp>=0&&rp<=1){
    const rx=20+170*rp;
    ctx.strokeStyle="rgba(255,236,190,"+((1-rp)*.8)+")";
    ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(W/2,H*.74+52,rx,rx*.28,0,0,6.2832);ctx.stroke();
  }
  ctx.globalCompositeOperation="source-over";
}

/* ---------- 主役の動き ---------- */
function actorState(t){
  const Lx=W/2,Ly=H*.68,home=getHome(W);
  let x,y,rot=0,sx=1,sy=1,s=1;

  if(t<T.land){
    /* 羽根のように左右に揺れながら、一定速度で降りる */
    const u=clamp((t-T.fallStart)/(T.land-T.fallStart));
    y=lerp(-90,Ly,u);
    const amp=Math.min(26,W*.035),ph=2*Math.PI*1.25*u,damp=Math.pow(1-u,.7);
    x=Lx+amp*Math.sin(ph)*damp;
    rot=5*Math.cos(ph)*damp;
  }else if(t<T.flyStart){
    /* ふわっと沈んで、小さく跳ね返る */
    const tau=t-T.land;
    x=Lx;
    y=Ly-14*Math.exp(-5*tau)*Math.abs(Math.sin(2*Math.PI*1.6*tau));
    const k=Math.exp(-7*tau)*Math.cos(2*Math.PI*2.2*tau);
    sy=1-.08*k;sx=1+.05*k;
  }else{
    /* 弧を描いて、縮みながら定位置へ */
    const e=easeIO(clamp((t-T.flyStart)/(T.flyEnd-T.flyStart)));
    const cx=lerp(Lx,home.x,.4),cy=Math.min(Ly,home.y)-H*.16;
    x=(1-e)*(1-e)*Lx+2*(1-e)*e*cx+e*e*home.x;
    y=(1-e)*(1-e)*Ly+2*(1-e)*e*cy+e*e*home.y;
    s=lerp(1,home.size/120,e);
    rot=-10*Math.sin(Math.PI*e);
  }
  return {x,y,rot,sx,sy,s,Lx,Ly,home};
}

/* ---------- 月光の形：月 → 着地点（その先まで少し伸ばす） ---------- */
function beamGeometry(st){
  const m=moonEl.getBoundingClientRect();
  const ax=m.left+m.width*.5-10,ay=m.top+m.height*.5;
  const bx=st.Lx,by=st.Ly+60;
  let dx=bx-ax,dy=by-ay;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
  const nx=-dy,ny=dx,EXT=130,HALF=260,APEX=14;
  const ex=bx+dx*EXT,ey=by+dy*EXT,eh=HALF*(L+EXT)/L;
  return {ax,ay,ex,ey,poly:[
    [ax+nx*APEX,ay+ny*APEX],[ax-nx*APEX,ay-ny*APEX],
    [ex-nx*eh,ey-ny*eh],[ex+nx*eh,ey+ny*eh]
  ]};
}
function inPoly(x,y,poly){
  let c=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c;
  }
  return c;
}

/* ---------- メインループ ---------- */
const sceneEl=$("scene"),actorEl=$("actor"),haloEl=$("halo"),colorEl=$("actorColor"),darkEl=$("actorDark");
const moonEl=$("moonWrap"),beamEl=$("beam"),beamPoly=$("beamPoly"),beamGrad=$("beamGrad");
const glowEl=$("landingGlow"),shootEl=$("shoot");

let t0=null,last=null,burst=false,arrive=false,finished=false;

function frame(now){
  if(t0===null){t0=now;last=now}
  const t=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);
  last=now;
  if(window.innerWidth!==W||window.innerHeight!==H)resize();

  const st=actorState(t);

  /* 夜空：現れて、最後に消える */
  sceneEl.style.opacity=(smooth(0,.5,t)*(1-smooth(T.bgFade0,T.bgFade1,t))).toFixed(3);

  /* 三日月 */
  const mo=smooth(.15,1,t);
  moonEl.style.opacity=mo.toFixed(3);
  moonEl.style.transform="translateY("+((1-mo)*18).toFixed(1)+"px) scale("+(.82+.18*mo).toFixed(3)+")";

  /* 月の光の筋 */
  const beam=beamGeometry(st);
  const bo=smooth(.6,1.2,t)*(1-smooth(T.beamOut0,T.beamOut1,t))*(.9+.1*Math.sin(t*3));
  beamEl.style.opacity=bo.toFixed(3);
  beamPoly.setAttribute("points",beam.poly.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" "));
  beamGrad.setAttribute("x1",beam.ax);beamGrad.setAttribute("y1",beam.ay);
  beamGrad.setAttribute("x2",beam.ex);beamGrad.setAttribute("y2",beam.ey);

  /* 流れ星（1本） */
  const sp=(t-1.25)/.8;
  if(sp>=0&&sp<=1){
    const sx0=W*.55,sy0=H*.06,sx1=W*.15,sy1=H*.3;
    const hx=lerp(sx0,sx1,sp),hy=lerp(sy0,sy1,sp);
    const ang=Math.atan2(sy1-sy0,sx1-sx0)*180/Math.PI;
    shootEl.style.opacity=Math.pow(Math.sin(sp*Math.PI),.8).toFixed(3);
    shootEl.style.transform="translate("+hx.toFixed(1)+"px,"+hy.toFixed(1)+"px) rotate("+ang.toFixed(1)+"deg)";
  }else shootEl.style.opacity=0;

  /* 着地点の光だまり */
  glowEl.style.left=st.Lx+"px";glowEl.style.top=(st.Ly+58)+"px";
  glowEl.style.transform="translate(-50%,-50%)";
  glowEl.style.opacity=smooth(2.9,3.6,t).toFixed(3);

  /* 衣装：月光の範囲に入った部分だけ、色が戻る（時間ではなく位置で決まる） */
  let r=1;
  if(t<T.land){
    const cs=Math.cos(st.rot*Math.PI/180),sn=Math.sin(st.rot*Math.PI/180);
    const kx=st.s*st.sx,ky=st.s*st.sy;
    if(bo>.35){
      /* 月光の四角形を、衣装の枠の中の座標に直して、その形で切り抜く */
      const local=beam.poly.map(p=>{
        const dx=p[0]-st.x,dy=p[1]-st.y;
        return [(dx*cs+dy*sn)/kx+60,(-dx*sn+dy*cs)/ky+60];
      });
      colorEl.style.clipPath="polygon("+local.map(q=>q[0].toFixed(1)+"px "+q[1].toFixed(1)+"px").join(",")+")";
      /* 衣装のうち、どれだけが光の中にあるか（光の輪の強さに使う） */
      let inside=0;
      for(let i=0;i<7;i++)for(let j=0;j<7;j++){
        const qx=-60+120*i/6,qy=-60+120*j/6;
        if(inPoly(st.x+qx*kx*cs-qy*ky*sn,st.y+qx*kx*sn+qy*ky*cs,beam.poly))inside++;
      }
      r=inside/49;
    }else{
      colorEl.style.clipPath="polygon(0px 0px,0px 0px,0px 0px)";
      r=0;
    }
    darkEl.style.opacity=1;
  }else{
    /* 着地したあとは、全身に色が戻っている */
    colorEl.style.clipPath="none";
    darkEl.style.opacity=0;
  }
  haloEl.style.opacity=(.6*r*(1-smooth(T.haloOut0,T.haloOut1,t))*(1+.12*Math.sin(t*5))).toFixed(3);

  actorEl.style.opacity=smooth(T.fallStart,T.fallStart+.2,t).toFixed(3);
  actorEl.style.transform=
    "translate("+st.x.toFixed(1)+"px,"+st.y.toFixed(1)+"px) rotate("+st.rot.toFixed(2)+"deg) scale("+
    (st.s*st.sx).toFixed(4)+","+(st.s*st.sy).toFixed(4)+")";

  /* 金色の粒 */
  if(t>=T.land&&!burst){
    burst=true;
    for(let i=0;i<64;i++){
      const a=-Math.PI*(.05+Math.random()*.9),sp2=90+Math.random()*210;
      spawn(st.Lx+(Math.random()-.5)*50,st.Ly+48,Math.cos(a)*sp2,Math.sin(a)*sp2,.9+Math.random()*.7,1.6+Math.random()*2.6,300);
    }
  }
  if(t>=T.land&&t<T.land+.8){
    for(let i=0;i<2;i++)
      spawn(st.Lx+(Math.random()-.5)*110,st.Ly+40+Math.random()*20,(Math.random()-.5)*40,-(30+Math.random()*60),1+Math.random()*.6,1.4+Math.random()*2,-15);
  }
  if(t>=T.flyStart&&t<=T.flyEnd+.05){
    for(let i=0;i<3;i++)
      spawn(st.x+(Math.random()-.5)*50,st.y+(Math.random()-.5)*50,(Math.random()-.5)*50,(Math.random()-.5)*50,.5+Math.random()*.4,1.3+Math.random()*1.8,0);
  }
  if(t>=T.flyEnd&&!arrive){
    arrive=true;
    for(let i=0;i<28;i++){
      const a=Math.random()*6.2832,sp3=30+Math.random()*90;
      spawn(st.home.x,st.home.y,Math.cos(a)*sp3,Math.sin(a)*sp3,.6+Math.random()*.5,1.4+Math.random()*2.2,0);
    }
  }
  stepParticles(dt);
  drawParticles(t);

  /* 終了通知（このとき夜空は完全に消え、衣装は定位置にいる） */
  if(t>=T.end&&!finished){
    finished=true;
    try{window.parent.postMessage({type:"secret-moon-finished"},"*")}catch(e){console.error(e)}
  }
  requestAnimationFrame(frame);
}

resize();
window.addEventListener("resize",resize);

/* 衣装の複製に成功してから開始（最大約2秒まで待つ） */
let tries=0;
(function boot(){
  if(buildActor()||tries++>20){requestAnimationFrame(frame);return}
  setTimeout(boot,100);
})();
</script>
</body>
</html>
