<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>シークレット月夜</title>

<style>

/* =====================================================
   基本
===================================================== */

html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#071329;

}

body{

  position:relative;

}


/* =====================================================
   月夜
===================================================== */

#scene{

  position:absolute;

  inset:0;

  overflow:hidden;

  opacity:1;

  background:
    linear-gradient(
      to bottom,
      #030a1c 0%,
      #07152f 55%,
      #101d34 100%
    );

}


/* =====================================================
   星空
===================================================== */

#stars{

  position:absolute;

  inset:0;

  z-index:1;

}

.star{

  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#fff;

  opacity:.65;

  animation:
    twinkle
    2.8s
    ease-in-out
    infinite;

}

.star.cross{

  width:2px;
  height:10px;

  border-radius:2px;

}

.star.cross::after{

  content:"";

  position:absolute;

  left:-4px;
  top:4px;

  width:10px;
  height:2px;

  background:#fff;

  border-radius:2px;

}

@keyframes twinkle{

  0%,
  100%{

    opacity:.25;

    transform:scale(.7);

  }

  50%{

    opacity:1;

    transform:scale(1.2);

  }

}


/* =====================================================
   月
===================================================== */

#moon{

  position:absolute;

  width:105px;
  height:105px;

  right:13%;
  top:10%;

  border-radius:50%;

  background:

    radial-gradient(
      circle at 34% 30%,
      #ffffff 0 8%,
      #eef2ff 35%,
      #cbd8f4 73%,
      #a1b2d8 100%
    );

  box-shadow:

    0 0 20px
    rgba(213,228,255,.75),

    0 0 65px
    rgba(151,184,255,.42);

  opacity:0;

  transform:scale(.72);

  animation:
    moonIn
    1.4s
    cubic-bezier(.2,.8,.2,1)
    .25s
    forwards;

  z-index:5;

}

#moon::before{

  content:"";

  position:absolute;

  width:20px;
  height:13px;

  left:22px;
  top:27px;

  border-radius:50%;

  background:
    rgba(128,145,181,.18);

}

#moon::after{

  content:"";

  position:absolute;

  width:14px;
  height:9px;

  left:61px;
  top:58px;

  border-radius:50%;

  background:
    rgba(128,145,181,.18);

}

@keyframes moonIn{

  0%{

    opacity:0;

    transform:scale(.72);

  }

  65%{

    opacity:1;

    transform:scale(1.05);

  }

  100%{

    opacity:1;

    transform:scale(1);

  }

}


/* =====================================================
   月光
===================================================== */

#moonGlow{

  position:absolute;

  left:50%;
  top:2%;

  width:95vw;
  height:110vh;

  transform:
    translateX(-50%);

  background:

    radial-gradient(
      ellipse at 50% 45%,

      rgba(225,238,255,.45) 0%,

      rgba(190,215,255,.23) 22%,

      rgba(150,180,245,.10) 42%,

      transparent 70%
    );

  filter:blur(4px);

  opacity:0;

  animation:
    moonLightIn
    1.8s
    ease-out
    .8s
    forwards;

  z-index:3;

  pointer-events:none;

}

@keyframes moonLightIn{

  from{

    opacity:0;

  }

  to{

    opacity:.78;

  }

}


/* =====================================================
   地面
===================================================== */

#ground{

  position:absolute;

  left:-5%;
  right:-5%;

  bottom:-4%;

  height:27%;

  background:

    linear-gradient(
      to bottom,
      #14213b,
      #050a14 75%
    );

  clip-path:
    polygon(
      0 22%,
      12% 17%,
      24% 21%,
      38% 13%,
      51% 19%,
      65% 10%,
      78% 18%,
      90% 13%,
      100% 19%,
      100% 100%,
      0 100%
    );

  box-shadow:
    0 -12px 35px
    rgba(103,137,190,.15);

  z-index:10;

}


/* =====================================================
   着地点の光
===================================================== */

#landingGlow{

  position:absolute;

  left:50%;
  bottom:17%;

  width:250px;
  height:115px;

  transform:
    translateX(-50%)
    scale(.65);

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,
      rgba(223,235,255,.38),
      rgba(163,193,255,.15) 35%,
      transparent 72%
    );

  filter:blur(5px);

  opacity:0;

  animation:
    landingGlowIn
    1.5s
    ease-out
    1.1s
    forwards;

  z-index:11;

}

@keyframes landingGlowIn{

  from{

    opacity:0;

    transform:
      translateX(-50%)
      scale(.65);

  }

  to{

    opacity:1;

    transform:
      translateX(-50%)
      scale(1);

  }

}


/* =====================================================
   シークレットベルちゃん
===================================================== */

#silhouette{

  position:absolute;

  left:50%;

  top:-160px;

  width:120px;
  height:120px;

  transform:
    translateX(-50%)
    scale(.82);

  opacity:.055;

  filter:
    brightness(0);

  z-index:20;

  animation:
    bellFall
    4.1s
    cubic-bezier(.22,.72,.28,1)
    .45s
    forwards;

}


/* =====================================================
   親からコピーした衣装
===================================================== */

.secret-clone{

  position:absolute !important;

  left:0 !important;
  top:0 !important;

  right:auto !important;
  bottom:auto !important;

  width:120px !important;
  height:120px !important;

  margin:0 !important;

  display:block !important;

  visibility:visible !important;

  opacity:1 !important;

  pointer-events:none !important;

  overflow:visible !important;

}


/*
 * 親側で動いている衣装アニメーションは
 * 月夜側では止める。
 *
 * 月夜ではベルちゃん全体を
 * 上から下へ動かすため。
 */

.secret-clone .secret-body{

  animation:none !important;

}

.secret-clone .secret-layer-wrap{

  animation:none !important;

}


/* =====================================================
   ベルちゃん降下
===================================================== */

@keyframes bellFall{

  0%{

    top:-160px;

    opacity:.055;

    filter:
      brightness(0);

    transform:
      translateX(-50%)
      scale(.82);

  }

  35%{

    opacity:.08;

  }

  62%{

    opacity:.18;

  }

  78%{

    opacity:.55;

    filter:
      brightness(.45);

  }

  90%{

    opacity:.88;

    filter:
      brightness(.85);

  }

  96%{

    top:63%;

    opacity:1;

    filter:
      brightness(1.05);

    transform:
      translateX(-50%)
      scale(1.02);

  }

  100%{

    top:63%;

    opacity:1;

    filter:
      brightness(1);

    transform:
      translateX(-50%)
      scale(1);

  }

}


/* =====================================================
   着地後の光
===================================================== */

#landingFlash{

  position:absolute;

  left:50%;
  bottom:24%;

  width:45px;
  height:18px;

  transform:
    translateX(-50%)
    scale(.2);

  border:
    2px solid
    rgba(240,245,255,.85);

  border-radius:50%;

  opacity:0;

  z-index:21;

  animation:
    landingFlash
    .8s
    ease-out
    3.95s
    forwards;

}

@keyframes landingFlash{

  0%{

    opacity:0;

    transform:
      translateX(-50%)
      scale(.2);

  }

  20%{

    opacity:.9;

  }

  100%{

    opacity:0;

    transform:
      translateX(-50%)
      scale(5);

  }

}


/* =====================================================
   キラキラ
===================================================== */

#sparkles{

  position:absolute;

  inset:0;

  z-index:30;

  pointer-events:none;

}

.spark{

  position:absolute;

  color:#fff;

  font-size:18px;

  opacity:0;

  text-shadow:
    0 0 8px
    rgba(255,235,170,.9);

  animation:
    sparkFly
    1s
    ease-out
    4.15s
    forwards;

}

@keyframes sparkFly{

  0%{

    opacity:0;

    transform:
      translate(0,0)
      scale(.3);

  }

  20%{

    opacity:1;

  }

  100%{

    opacity:0;

    transform:
      translate(
        var(--dx),
        var(--dy)
      )
      scale(1.2)
      rotate(90deg);

  }

}


/* =====================================================
   最後の月光強化
===================================================== */

#finalLight{

  position:absolute;

  inset:0;

  z-index:40;

  pointer-events:none;

  background:

    radial-gradient(
      ellipse at 50% 55%,

      rgba(255,255,255,.82),

      rgba(225,235,255,.38) 28%,

      transparent 64%
    );

  opacity:0;

}


/* =====================================================
   白飛び
===================================================== */

/*
 * ★重要★
 *
 * この要素は最初から白くしない。
 *
 * JavaScriptで最後の瞬間にだけ
 * display:block にする。
 */

#whiteout{

  position:absolute;

  inset:0;

  z-index:100;

  background:#fff;

  opacity:0;

  display:none;

  pointer-events:none;

}


/* =====================================================
   最終白飛び
===================================================== */

.whiteout-active{

  display:block !important;

  animation:
    whiteFlash
    .75s
    ease-in
    forwards;

}

@keyframes whiteFlash{

  0%{

    opacity:0;

  }

  55%{

    opacity:.75;

  }

  100%{

    opacity:1;

  }

}


/* =====================================================
   月光強化アニメーション
===================================================== */

.final-light-active{

  animation:
    finalLight
    1s
    ease-in
    forwards;

}

@keyframes finalLight{

  from{

    opacity:0;

  }

  to{

    opacity:.8;

  }

}

</style>

</head>


<body>


<div id="scene">


  <!-- 星空 -->

  <div id="stars"></div>


  <!-- 月 -->

  <div id="moon"></div>


  <!-- 月光 -->

  <div id="moonGlow"></div>


  <!-- 地面 -->

  <div id="ground"></div>


  <!-- 着地点 -->

  <div id="landingGlow"></div>


  <!-- ベルちゃん -->

  <div id="silhouette"></div>


  <!-- 着地エフェクト -->

  <div id="landingFlash"></div>


  <!-- キラキラ -->

  <div id="sparkles"></div>


  <!-- 月光強化 -->

  <div id="finalLight"></div>


  <!-- 最後の白飛び -->

  <div id="whiteout"></div>


</div>


<script>

/* =====================================================
   星を生成
===================================================== */

const stars =
  document.getElementById(
    "stars"
  );


for(
  let i = 0;
  i < 72;
  i++
){

  const star =
    document.createElement(
      "i"
    );

  star.className =
    "star";


  if(
    Math.random() < .16
  ){

    star.classList.add(
      "cross"
    );

  }


  star.style.left =
    (
      3 +
      Math.random() * 94
    ) + "%";


  star.style.top =
    (
      4 +
      Math.random() * 67
    ) + "%";


  star.style.animationDelay =
    (
      Math.random() * 2.5
    ) + "s";


  stars.appendChild(
    star
  );

}


/* =====================================================
   親ページからシークレット衣装を取得
===================================================== */

function loadSecretCostume(){

  const container =
    document.getElementById(
      "silhouette"
    );


  if(!container){

    return;

  }


  try{

    /*
     * 親ページの
     *
     * #secretCostume
     *
     * を取得。
     */

    const source =
      window.parent.document
        .getElementById(
          "secretCostume"
        );


    if(!source){

      console.warn(
        "secretCostume が見つかりません"
      );

      return;

    }


    /*
     * 衣装を丸ごとコピー。
     *
     * 直接PNGを読み込まないので、
     * 四角い背景が出ない。
     */

    const clone =
      source.cloneNode(
        true
      );


    clone.id =
      "secretCostumeClone";


    clone.classList.add(
      "secret-clone"
    );


    /*
     * 親側の表示状態を解除。
     */

    clone.style.setProperty(
      "display",
      "block",
      "important"
    );

    clone.style.setProperty(
      "visibility",
      "visible",
      "important"
    );

    clone.style.setProperty(
      "opacity",
      "1",
      "important"
    );

    clone.style.setProperty(
      "pointer-events",
      "none",
      "important"
    );


    /*
     * 親側の位置指定を解除。
     */

    clone.style.setProperty(
      "right",
      "auto",
      "important"
    );

    clone.style.setProperty(
      "bottom",
      "auto",
      "important"
    );

    clone.style.setProperty(
      "left",
      "0px",
      "important"
    );

    clone.style.setProperty(
      "top",
      "0px",
      "important"
    );


    /*
     * 月夜側のアニメーションを停止。
     */

    clone
      .querySelectorAll(
        ".secret-body"
      )
      .forEach(
        element => {

          element.style.setProperty(
            "animation",
            "none",
            "important"
          );

        }
      );


    clone
      .querySelectorAll(
        ".secret-layer-wrap"
      )
      .forEach(
        element => {

          element.style.setProperty(
            "animation",
            "none",
            "important"
          );

        }
      );


    container.appendChild(
      clone
    );


    /*
     * 重要。
     *
     * シルエット演出では
     * 最初は黒くする。
     */

    container.style.opacity =
      ".055";

    container.style.filter =
      "brightness(0)";


  }catch(error){

    console.error(
      "シークレット衣装取得エラー:",
      error
    );

  }

}


/* =====================================================
   衣装を読み込む
===================================================== */

setTimeout(
  loadSecretCostume,
  80
);


/* =====================================================
   4.1秒
   ベルちゃん着地
===================================================== */

setTimeout(
  function(){

    const silhouette =
      document.getElementById(
        "silhouette"
      );


    silhouette.style.animation =
      "none";


    silhouette.style.top =
      "63%";


    silhouette.style.transform =
      "translateX(-50%) scale(1)";


    silhouette.style.opacity =
      "1";


    silhouette.style.filter =
      "brightness(1)";


    /*
     * キラキラ生成
     */

    const sparkles =
      document.getElementById(
        "sparkles"
      );


    for(
      let i = 0;
      i < 15;
      i++
    ){

      const spark =
        document.createElement(
          "span"
        );


      spark.className =
        "spark";


      spark.textContent =
        i % 3 === 0
          ? "✦"
          : "·";


      spark.style.left =
        (
          37 +
          Math.random() * 26
        ) + "%";


      spark.style.top =
        (
          54 +
          Math.random() * 23
        ) + "%";


      spark.style.setProperty(
        "--dx",
        (
          -100 +
          Math.random() * 200
        ) + "px"
      );


      spark.style.setProperty(
        "--dy",
        (
          -80 +
          Math.random() * 110
        ) + "px"
      );


      spark.style.animationDelay =
        (
          Math.random() * .25
        ) + "s";


      sparkles.appendChild(
        spark
      );

    }

  },
  4100
);


/* =====================================================
   4.8秒
   月光を強くする
===================================================== */

setTimeout(
  function(){

    document
      .getElementById(
        "finalLight"
      )
      .classList.add(
        "final-light-active"
      );

  },
  4800
);


/* =====================================================
   6.2秒
   白飛び開始
===================================================== */

setTimeout(
  function(){

    document
      .getElementById(
        "whiteout"
      )
      .classList.add(
        "whiteout-active"
      );

  },
  6200
);


/* =====================================================
   7秒
   親ページへ終了通知
===================================================== */

setTimeout(
  function(){

    window.parent.postMessage(
      {
        type:
          "secret-moon-finished"
      },
      "*"
    );

  },
  7000
);

</script>

</body>
</html>
