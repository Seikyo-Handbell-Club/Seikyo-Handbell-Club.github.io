<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Secret Moon</title>
<style>
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:transparent;
}
#moonScene{
  position:fixed;inset:0;overflow:hidden;
  opacity:0;
  background:
    radial-gradient(circle at 50% 38%,rgba(224,205,255,.28),transparent 24%),
    linear-gradient(180deg,#24204f 0%,#39336f 48%,#181938 100%);
  animation:sceneIn .65s ease-out forwards;
}
#softStars{
  position:absolute;inset:0;opacity:0;
  animation:starsIn .8s ease-out .25s forwards;
}
.star{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:#fff6ff;
  box-shadow:0 0 8px 2px rgba(255,235,255,.7);
  opacity:.7;
  animation:twinkle var(--twinkle) ease-in-out var(--delay) infinite;
}
.star.small{width:3px;height:3px;box-shadow:0 0 5px 1px rgba(255,235,255,.55)}
.star.cross::before,.star.cross::after{
  content:"";position:absolute;left:50%;top:50%;
  width:16px;height:2px;border-radius:2px;
  background:rgba(255,247,255,.85);transform:translate(-50%,-50%);
}
.star.cross::after{transform:translate(-50%,-50%) rotate(90deg)}

#moonGlow{
  position:absolute;left:50%;top:34%;
  width:min(76vw,460px);height:min(76vw,460px);
  transform:translate(-50%,-50%) scale(.55);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,244,207,.58),rgba(245,215,255,.24) 42%,transparent 72%);
  filter:blur(4px);opacity:0;
  animation:moonGlowIn 1s cubic-bezier(.2,.85,.25,1) .7s forwards;
}
#moon{
  position:absolute;left:50%;top:34%;
  width:min(34vw,235px);height:min(34vw,235px);
  transform:translate(-50%,-50%) scale(.35);
  border-radius:50%;
  background:
    radial-gradient(circle at 33% 28%,#fffef5 0%,#fff5d9 42%,#f3dfbd 73%,#dfc9a2 100%);
  box-shadow:
    0 0 24px rgba(255,245,207,.9),
    0 0 65px rgba(245,218,255,.52),
    0 0 120px rgba(183,196,255,.25);
  opacity:0;
  animation:moonIn 1.05s cubic-bezier(.2,.85,.25,1) .75s forwards;
}
.moon-face{
  position:absolute;left:0;right:0;top:43%;
  text-align:center;color:#b99f9b;
  font:700 31px/1 "Hiragino Sans",sans-serif;
  letter-spacing:8px;
  opacity:.55;
}
.moon-blush{
  position:absolute;top:53%;width:25px;height:11px;border-radius:50%;
  background:rgba(245,166,192,.28);filter:blur(3px);
}
.moon-blush.left{left:21%}.moon-blush.right{right:21%}

#ribbon{
  position:absolute;left:50%;top:62%;
  width:min(80vw,500px);height:180px;
  transform:translateX(-50%) scale(.7);
  opacity:0;
  pointer-events:none;
  animation:ribbonIn 1s ease-out 1.45s forwards;
}
.ribbon{
  position:absolute;width:130px;height:70px;
  border:5px solid rgba(236,207,255,.72);
  border-radius:70% 30% 70% 30%;
  filter:drop-shadow(0 0 8px rgba(255,220,255,.4));
}
.ribbon.left{left:8%;transform:rotate(25deg)}
.ribbon.right{right:8%;transform:scaleX(-1) rotate(25deg)}
.ribbon.mid{
  left:50%;top:34px;width:78px;height:78px;
  transform:translateX(-50%) rotate(45deg);
  border-radius:50% 20% 50% 20%;
  border-width:6px;
}
#light{
  position:absolute;inset:-20%;
  background:radial-gradient(circle at 50% 34%,rgba(255,246,215,.18),rgba(226,208,255,.1) 28%,transparent 58%);
  opacity:0;animation:lightIn 1.1s ease-out 1.65s forwards;
}
#sparkleBurst{
  position:absolute;left:50%;top:34%;
  width:10px;height:10px;transform:translate(-50%,-50%) scale(.2);
  opacity:0;animation:burstIn .9s ease-out 1.7s forwards;
}
.spark{
  position:absolute;left:50%;top:50%;
  width:7px;height:28px;border-radius:99px;
  background:linear-gradient(#fff,#f7d8ff);
  box-shadow:0 0 12px rgba(255,224,255,.8);
  transform-origin:50% 0;
}
.spark.s1{transform:rotate(0deg) translateY(-68px)}
.spark.s2{transform:rotate(45deg) translateY(-68px)}
.spark.s3{transform:rotate(90deg) translateY(-68px)}
.spark.s4{transform:rotate(135deg) translateY(-68px)}
.spark.s5{transform:rotate(180deg) translateY(-68px)}
.spark.s6{transform:rotate(225deg) translateY(-68px)}
.spark.s7{transform:rotate(270deg) translateY(-68px)}
.spark.s8{transform:rotate(315deg) translateY(-68px)}

.heart{
  position:absolute;font-family:Arial,sans-serif;
  color:#ffc6df;text-shadow:0 0 8px rgba(255,190,220,.7);
  opacity:0;animation:heartFloat 2.3s ease-out forwards;
}
#hearts{position:absolute;inset:0;pointer-events:none}

#finishGlow{
  position:absolute;inset:0;background:#fff8e8;opacity:0;pointer-events:none;
  animation:finishGlow .42s ease-out 4.25s forwards;
}

@keyframes sceneIn{from{opacity:0}to{opacity:1}}
@keyframes starsIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes moonGlowIn{
  from{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@keyframes moonIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@keyframes lightIn{from{opacity:0}to{opacity:1}}
@keyframes ribbonIn{
  from{opacity:0;transform:translateX(-50%) scale(.55) rotate(-8deg)}
  65%{opacity:1;transform:translateX(-50%) scale(1.05) rotate(3deg)}
  to{opacity:1;transform:translateX(-50%) scale(1) rotate(0)}
}
@keyframes burstIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}
  35%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(12deg)}
  100%{opacity:.8;transform:translate(-50%,-50%) scale(.9) rotate(0)}
}
@keyframes heartFloat{
  0%{opacity:0;transform:translate(0,12px) scale(.5) rotate(-8deg)}
  18%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),-110px) scale(1) rotate(var(--rot))}
}
@keyframes finishGlow{0%{opacity:0}45%{opacity:.18}100%{opacity:0}}
#moonScene.fadeOut{animation:sceneOut .9s ease-in forwards}
#moonScene.fadeOut #moon,#moonScene.fadeOut #moonGlow{animation:moonOut .6s ease-in forwards}
#moonScene.fadeOut #softStars{animation:starsOut .7s ease-in .1s forwards}
#moonScene.fadeOut #light,#moonScene.fadeOut #ribbon,#moonScene.fadeOut #sparkleBurst{animation:fadeOut .65s ease-in forwards}
@keyframes sceneOut{from{opacity:1}to{opacity:0}}
@keyframes moonOut{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) scale(.88)}}
@keyframes starsOut{from{opacity:1}to{opacity:0}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<div id="moonScene">
  <div id="softStars"></div>
  <div id="moonGlow"></div>
  <div id="moon">
    <div class="moon-blush left"></div>
    <div class="moon-blush right"></div>
    <div class="moon-face">•ᴗ•</div>
  </div>
  <div id="light"></div>
  <div id="ribbon"><span class="ribbon left"></span><span class="ribbon mid"></span><span class="ribbon right"></span></div>
  <div id="sparkleBurst">
    <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span>
    <span class="spark s5"></span><span class="spark s6"></span><span class="spark s7"></span><span class="spark s8"></span>
  </div>
  <div id="hearts"></div>
  <div id="finishGlow"></div>
</div>
<script>
(function(){
  const scene=document.getElementById("moonScene");
  const stars=document.getElementById("softStars");
  const hearts=document.getElementById("hearts");

  const count=Math.min(70,Math.max(38,Math.floor(innerWidth*innerHeight/14500)));
  for(let i=0;i<count;i++){
    const s=document.createElement("span");
    s.className="star"+(Math.random()<.28?" cross":Math.random()<.45?" small":"");
    s.style.left=(Math.random()*94+3)+"%";
    s.style.top=(Math.random()*78+5)+"%";
    s.style.setProperty("--twinkle",(1.5+Math.random()*2.2).toFixed(2)+"s");
    s.style.setProperty("--delay",(-Math.random()*2.5).toFixed(2)+"s");
    stars.appendChild(s);
  }

  for(let i=0;i<9;i++){
    const h=document.createElement("span");
    h.className="heart";
    h.textContent=i%3===0?"♡":"♥";
    h.style.left=(35+Math.random()*30)+"%";
    h.style.top=(55+Math.random()*12)+"%";
    h.style.fontSize=(13+Math.random()*10)+"px";
    h.style.setProperty("--dx",(Math.random()*100-50)+"px");
    h.style.setProperty("--rot",(Math.random()*50-25)+"deg");
    h.style.animationDelay=(1.45+Math.random()*.55)+"s";
    hearts.appendChild(h);
  }

  setTimeout(()=>{
    scene.classList.add("fadeOut");
    setTimeout(()=>{
      window.parent.postMessage({type:"secret-moon-finished"},"*");
    },950);
  },4450);
})();
</script>
</body>
</html>
