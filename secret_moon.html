<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Secret Moon</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#moonScene{position:fixed;inset:0;overflow:hidden;opacity:0;background:radial-gradient(circle at 50% 34%,rgba(116,145,220,.22),rgba(58,73,137,.16) 22%,rgba(9,14,45,.90) 58%,rgba(3,6,25,.97));animation:sceneIn .8s ease-out forwards}
#stars{position:absolute;inset:0;opacity:0;animation:starsIn 1.1s ease-out .45s forwards}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.75;animation:twinkle var(--twinkle) ease-in-out var(--delay) infinite}.star.big{width:3px;height:3px;box-shadow:0 0 7px 1px rgba(255,255,255,.55)}
#moonGlow{position:absolute;left:50%;top:33%;width:min(68vw,420px);height:min(68vw,420px);transform:translate(-50%,-50%) scale(.55);border-radius:50%;background:radial-gradient(circle,rgba(255,244,210,.65),rgba(255,229,166,.23) 35%,rgba(255,220,155,0) 70%);filter:blur(3px);opacity:0;animation:moonGlowIn 1.25s cubic-bezier(.2,.8,.25,1) 1s forwards}
#moon{position:absolute;left:50%;top:33%;width:min(38vw,250px);height:min(38vw,250px);transform:translate(-50%,-50%) scale(.45);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffef3,#f9f1d5 48%,#e8d9af 78%,#cbbd91);box-shadow:0 0 22px rgba(255,240,190,.72),0 0 70px rgba(255,226,157,.42),0 0 130px rgba(180,198,255,.20);opacity:0;animation:moonIn 1.2s cubic-bezier(.2,.8,.25,1) 1.05s forwards}
.crater{position:absolute;border-radius:50%;background:rgba(177,160,119,.18)}.c1{width:24px;height:16px;left:27%;top:25%}.c2{width:15px;height:15px;left:62%;top:29%}.c3{width:30px;height:21px;left:48%;top:61%}.c4{width:13px;height:10px;left:25%;top:64%}.c5{width:18px;height:18px;left:69%;top:58%}
#light{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 33%,rgba(255,240,190,.16),rgba(180,201,255,.09) 24%,rgba(0,0,0,0) 55%);opacity:0;animation:lightIn 1.2s ease-out 1.8s forwards}
#moonBeam{position:absolute;left:50%;top:33%;width:min(90vw,720px);height:min(90vw,720px);transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,239,188,.08);box-shadow:0 0 80px rgba(255,231,171,.10);opacity:0;animation:beamIn 1.2s ease-out 2s forwards}
#finishGlow{position:absolute;inset:0;background:#fffdf0;opacity:0;pointer-events:none;animation:finishGlow .45s ease-out 4.35s forwards}
@keyframes sceneIn{from{opacity:0}to{opacity:1}}@keyframes starsIn{from{opacity:0}to{opacity:1}}@keyframes moonGlowIn{from{opacity:0;transform:translate(-50%,-50%) scale(.55)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes moonIn{from{opacity:0;transform:translate(-50%,-50%) scale(.45)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes lightIn{from{opacity:0}to{opacity:1}}@keyframes beamIn{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes finishGlow{0%{opacity:0}45%{opacity:.22}100%{opacity:0}}
#moonScene.fadeOut{animation:sceneOut 1.05s ease-in forwards}#moonScene.fadeOut #moon,#moonScene.fadeOut #moonGlow{animation:moonOut .65s ease-in forwards}#moonScene.fadeOut #stars{animation:starsOut .8s ease-in .18s forwards}#moonScene.fadeOut #light,#moonScene.fadeOut #moonBeam{animation:lightOut .75s ease-in forwards}
@keyframes sceneOut{from{opacity:1}to{opacity:0}}@keyframes moonOut{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) scale(.9)}}@keyframes starsOut{from{opacity:1}to{opacity:0}}@keyframes lightOut{from{opacity:1}to{opacity:0}}@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.35)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="moonScene"><div id="stars"></div><div id="moonGlow"></div><div id="moon"><span class="crater c1"></span><span class="crater c2"></span><span class="crater c3"></span><span class="crater c4"></span><span class="crater c5"></span></div><div id="light"></div><div id="moonBeam"></div><div id="finishGlow"></div></div>
<script>
(function(){
 const scene=document.getElementById('moonScene'),stars=document.getElementById('stars');
 const count=Math.min(95,Math.max(55,Math.floor(innerWidth*innerHeight/11000)));
 for(let i=0;i<count;i++){const s=document.createElement('span');s.className='star'+(Math.random()<.12?' big':'');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.setProperty('--twinkle',(1.7+Math.random()*2.5).toFixed(2)+'s');s.style.setProperty('--delay',(-Math.random()*3).toFixed(2)+'s');stars.appendChild(s)}
 setTimeout(()=>{scene.classList.add('fadeOut');setTimeout(()=>window.parent.postMessage({type:'secret-moon-finished'},'*'),1100)},4450);
})();
</script>
</body>
</html>
