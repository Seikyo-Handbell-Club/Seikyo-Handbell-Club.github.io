<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>シークレット月夜</title>


<style>

/* =====================================================
   基本設定
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#020817;

}

body{

  position:relative;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;

}


/* =====================================================
   月夜の背景
===================================================== */

.scene{

  position:absolute;

  inset:0;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 43%,
      rgba(80,105,170,.30),
      transparent 40%
    ),
    linear-gradient(
      to bottom,
      #020817 0%,
      #07152f 55%,
      #101d38 100%
    );

  opacity:0;

  animation:
    sceneAppear
    .55s
    ease-out
    forwards;

}

@keyframes sceneAppear{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}


/* =====================================================
   星
===================================================== */

.stars{

  position:absolute;

  inset:0;

  z-index:1;

}

.star{

  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#fff;

  opacity:.7;

  animation:
    starTwinkle
    2.4s
    ease-in-out
    infinite;

}

.star.cross{

  width:2px;
  height:10px;

  border-radius:2px;

}

.star.cross::after{

  content:"";

  position:absolute;

  left:-4px;
  top:4px;

  width:10px;
  height:2px;

  border-radius:2px;

  background:#fff;

}

@keyframes starTwinkle{

  0%,
  100%{

    opacity:.25;

    transform:
      scale(.7);

  }

  50%{

    opacity:1;

    transform:
      scale(1.2);

  }

}


/* =====================================================
   月
===================================================== */

.moon{

  position:absolute;

  width:min(30vw,150px);
  height:min(30vw,150px);

  min-width:92px;
  min-height:92px;

  right:13%;
  top:10%;

  border-radius:50%;

  background:

    radial-gradient(
      circle at 35% 32%,
      #fff 0 8%,
      transparent 9%
    ),

    radial-gradient(
      circle at 62% 60%,
      rgba(190,198,220,.60) 0 8%,
      transparent 9%
    ),

    radial-gradient(
      circle at 38% 67%,
      rgba(190,198,220,.42) 0 6%,
      transparent 7%
    ),

    #f4f4df;

  box-shadow:

    0 0 18px
    rgba(240,243,255,.95),

    0 0 55px
    rgba(170,190,255,.65),

    0 0 110px
    rgba(120,150,240,.30);

  opacity:0;

  transform:
    scale(.55);

  animation:
    moonAppear
    1.15s
    cubic-bezier(.2,.9,.25,1.1)
    .4s
    forwards;

  z-index:5;

}

@keyframes moonAppear{

  0%{

    opacity:0;

    transform:
      scale(.55)
      translateY(-18px);

  }

  100%{

    opacity:1;

    transform:
      scale(1)
      translateY(0);

  }

}


/* =====================================================
   月光
===================================================== */

.moonlight{

  position:absolute;

  left:50%;
  top:4%;

  width:95vw;
  height:115vh;

  transform:
    translateX(-50%);

  background:

    radial-gradient(
      ellipse at 50% 48%,

      rgba(235,241,255,.58) 0%,

      rgba(190,210,255,.26) 18%,

      rgba(150,180,245,.11) 38%,

      transparent 67%
    );

  opacity:0;

  filter:blur(2px);

  animation:
    moonlightAppear
    1.7s
    ease-out
    .9s
    forwards;

  z-index:3;

  pointer-events:none;

}

@keyframes moonlightAppear{

  from{
    opacity:0;
  }

  to{
    opacity:.75;
  }

}


/* =====================================================
   地面
===================================================== */

.ground{

  position:absolute;

  left:-5%;
  right:-5%;

  bottom:-3%;

  height:28%;

  background:

    radial-gradient(
      ellipse at 50% 0%,
      rgba(115,133,177,.24),
      transparent 55%
    ),

    linear-gradient(
      to bottom,
      #152340,
      #0a1224
    );

  border-radius:
    50% 50% 0 0 /
    14% 14% 0 0;

  box-shadow:
    0 -10px 35px
    rgba(110,140,210,.12);

  z-index:10;

}


/* =====================================================
   着地地点の光
===================================================== */

.ground-glow{

  position:absolute;

  left:50%;
  bottom:21%;

  width:190px;
  height:70px;

  transform:
    translateX(-50%)
    scale(.5);

  border-radius:50%;

  background:
    rgba(225,235,255,.18);

  filter:blur(20px);

  opacity:0;

  animation:
    groundGlowAppear
    1s
    ease-out
    3.8s
    forwards;

  z-index:11;

}

@keyframes groundGlowAppear{

  from{

    opacity:0;

    transform:
      translateX(-50%)
      scale(.5);

  }

  to{

    opacity:1;

    transform:
      translateX(-50%)
      scale(1);

  }

}


/* =====================================================
   シークレット衣装
===================================================== */

.secret-character{

  position:absolute;

  left:50%;

  top:-150px;

  width:90px;
  height:90px;

  transform:
    translateX(-50%);

  z-index:20;

  opacity:.055;

  filter:
    brightness(0);

  animation:

    secretFall
    4.25s
    cubic-bezier(.18,.72,.22,1)
    forwards,

    secretReveal
    4.25s
    linear
    forwards;

}


/*
   親ページからコピーした
   完成済みシークレット衣装

   PNGをここで直接読み込まない。
   親ページ側で作られた衣装を
   そのまま複製する。
*/

.secret-clone{

  position:absolute !important;

  left:0 !important;
  top:0 !important;

  right:auto !important;
  bottom:auto !important;

  margin:0 !important;

  display:block !important;

  visibility:visible !important;

  opacity:1 !important;

  pointer-events:none !important;

  overflow:visible !important;

}


/* =====================================================
   シークレット衣装が降りる
===================================================== */

@keyframes secretFall{

  0%{

    top:-150px;

    transform:
      translateX(-50%)
      scale(.88);

  }

  76%{

    top:
      calc(72% - 45px);

    transform:
      translateX(-50%)
      scale(.98);

  }

  88%{

    top:
      calc(72% - 50px);

    transform:
      translateX(-50%)
      scale(1.01);

  }

  94%{

    top:
      calc(72% - 45px);

    transform:
      translateX(-50%)
      scale(.99);

  }

  100%{

    top:
      calc(72% - 47px);

    transform:
      translateX(-50%)
      scale(1);

  }

}


/* =====================================================
   シルエットから本体へ
===================================================== */

@keyframes secretReveal{

  0%,
  43%{

    opacity:.055;

    filter:
      brightness(0)
      saturate(0);

  }

  58%{

    opacity:.20;

    filter:
      brightness(.15)
      saturate(.15);

  }

  72%{

    opacity:.72;

    filter:
      brightness(.75)
      saturate(.8);

  }

  82%,
  100%{

    opacity:1;

    filter:
      brightness(1)
      saturate(1);

  }

}


/* =====================================================
   着地の波紋
===================================================== */

.landing-ring{

  position:absolute;

  left:50%;

  bottom:24%;

  width:30px;
  height:12px;

  border:
    2px solid
    rgba(235,242,255,.75);

  border-radius:50%;

  transform:
    translateX(-50%)
    scale(.2);

  opacity:0;

  z-index:21;

  animation:
    landingRing
    .75s
    ease-out
    3.75s
    forwards;

}

@keyframes landingRing{

  0%{

    opacity:0;

    transform:
      translateX(-50%)
      scale(.2);

  }

  20%{

    opacity:.9;

  }

  100%{

    opacity:0;

    transform:
      translateX(-50%)
      scale(5.2);

  }

}


/* =====================================================
   キラキラ
===================================================== */

.sparkles{

  position:absolute;

  inset:0;

  z-index:30;

  pointer-events:none;

}

.spark{

  position:absolute;

  width:6px;
  height:6px;

  border-radius:50%;

  background:#fff;

  opacity:0;

  box-shadow:
    0 0 8px 2px
    rgba(255,236,170,.9);

}

.spark::before,
.spark::after{

  content:"";

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  background:#fff;

  border-radius:2px;

}

.spark::before{

  width:2px;
  height:18px;

}

.spark::after{

  width:18px;
  height:2px;

}


/* -----------------------------------------------------
   キラキラ1
----------------------------------------------------- */

.s1{

  left:43%;
  top:65%;

  --dx:-1;
  --dy:-1;

  animation:
    sparkFly
    1.35s
    ease-out
    4.15s
    forwards;

}


/* -----------------------------------------------------
   キラキラ2
----------------------------------------------------- */

.s2{

  left:55%;
  top:68%;

  --dx:1;
  --dy:-1;

  animation:
    sparkFly
    1.5s
    ease-out
    4.28s
    forwards;

}


/* -----------------------------------------------------
   キラキラ3
----------------------------------------------------- */

.s3{

  left:47%;
  top:61%;

  --dx:-.5;
  --dy:-1;

  animation:
    sparkFly
    1.2s
    ease-out
    4.38s
    forwards;

}


/* -----------------------------------------------------
   キラキラ4
----------------------------------------------------- */

.s4{

  left:59%;
  top:62%;

  --dx:1.2;
  --dy:-.5;

  animation:
    sparkFly
    1.4s
    ease-out
    4.48s
    forwards;

}


/* -----------------------------------------------------
   キラキラ5
----------------------------------------------------- */

.s5{

  left:40%;
  top:70%;

  --dx:-1.2;
  --dy:.1;

  animation:
    sparkFly
    1.35s
    ease-out
    4.55s
    forwards;

}


/* -----------------------------------------------------
   キラキラ6
----------------------------------------------------- */

.s6{

  left:63%;
  top:69%;

  --dx:1.1;
  --dy:.2;

  animation:
    sparkFly
    1.5s
    ease-out
    4.62s
    forwards;

}


/* =====================================================
   キラキラの動き
===================================================== */

@keyframes sparkFly{

  0%{

    opacity:0;

    transform:
      translate(0,0)
      scale(.2)
      rotate(0deg);

  }

  18%{

    opacity:1;

  }

  100%{

    opacity:0;

    transform:

      translate(
        calc(var(--dx) * 55px),
        calc(var(--dy) * 55px)
      )

      scale(1.2)

      rotate(90deg);

  }

}


/* =====================================================
   月光をさらに強くする
===================================================== */

.intensify{

  position:absolute;

  inset:0;

  z-index:40;

  pointer-events:none;

  background:

    radial-gradient(
      ellipse at 50% 55%,

      rgba(255,255,255,.82),

      rgba(225,235,255,.42) 28%,

      transparent 63%
    );

  opacity:0;

  animation:

    lightIntensify
    1.15s
    ease-in
    4.7s
    forwards;

}

@keyframes lightIntensify{

  0%{

    opacity:0;

  }

  55%{

    opacity:.32;

  }

  100%{

    opacity:.78;

  }

}


/* =====================================================
   白飛び
===================================================== */

.whiteout{

  position:absolute;

  inset:0;

  z-index:100;

  background:#fff;

  opacity:0;

  pointer-events:none;

  animation:

    whiteout
    1.35s
    ease-in
    5.65s
    forwards;

}

@keyframes whiteout{

  0%{

    opacity:0;

  }

  48%{

    opacity:0;

  }

  100%{

    opacity:1;

  }

}


/* =====================================================
   白飛び後に戻る
===================================================== */

.fadeBack{

  position:absolute;

  inset:0;

  z-index:101;

  background:#fff;

  /*
   * ここ重要。
   * 最初から白くしない。
   */

  opacity:0;

  pointer-events:none;

  animation:

    fadeBack
    .55s
    ease-out
    6.85s
    forwards;

}

@keyframes fadeBack{

  0%{

    opacity:1;

  }

  100%{

    opacity:0;

  }

}


/* =====================================================
   動きを減らす設定
===================================================== */

@media (prefers-reduced-motion:reduce){

  .scene,
  .moon,
  .moonlight,
  .secret-character,
  .landing-ring,
  .spark,
  .intensify,
  .whiteout,
  .fadeBack{

    animation:none !important;

  }

}

</style>

</head>


<body>


<div class="scene">


  <!-- =================================================
       星
  ================================================== -->

  <div
    class="stars"
    id="stars">
  </div>


  <!-- =================================================
       月
  ================================================== -->

  <div class="moon"></div>


  <!-- =================================================
       月光
  ================================================== -->

  <div class="moonlight"></div>


  <!-- =================================================
       地面
  ================================================== -->

  <div class="ground"></div>

  <div class="ground-glow"></div>


  <!-- =================================================
       シークレット衣装
  ================================================== -->

  <div
    class="secret-character"
    id="secretCharacter">

    <!--
      ここへ親ページの
      #secretCostume
      をJavaScriptでコピーする
    -->

  </div>


  <!-- =================================================
       着地エフェクト
  ================================================== -->

  <div class="landing-ring"></div>


  <!-- =================================================
       キラキラ
  ================================================== -->

  <div class="sparkles">

    <i class="spark s1"></i>

    <i class="spark s2"></i>

    <i class="spark s3"></i>

    <i class="spark s4"></i>

    <i class="spark s5"></i>

    <i class="spark s6"></i>

  </div>


  <!-- =================================================
       月光強化
  ================================================== -->

  <div class="intensify"></div>


  <!-- =================================================
       白飛び
  ================================================== -->

  <div class="whiteout"></div>


  <!-- =================================================
       最後に白から戻す
  ================================================== -->

  <div class="fadeBack"></div>


</div>


<script>

/* =====================================================
   シークレットムーン本体
===================================================== */

(function(){


  /* ===================================================
     星を生成
  =================================================== */

  const stars =
    document.getElementById(
      "stars"
    );


  for(
    let i=0;
    i<72;
    i++
  ){

    const star =
      document.createElement(
        "i"
      );


    star.className =
      "star";


    /*
     * 一部を十字の星にする
     */

    if(
      i % 13 === 0
    ){

      star.classList.add(
        "cross"
      );

    }


    star.style.left =
      (
        Math.random() * 100
      ) + "%";


    star.style.top =
      (
        Math.random() * 72
      ) + "%";


    star.style.animationDelay =
      (
        Math.random() * 2.2
      ) + "s";


    star.style.transform =
      "scale(" +
      (
        .55 +
        Math.random() * .9
      ) +
      ")";


    stars.appendChild(
      star
    );

  }


  /* ===================================================
     親ページのシークレット衣装を取得
  =================================================== */

  function loadSecretCostume(){


    const container =
      document.getElementById(
        "secretCharacter"
      );


    if(!container){

      return;

    }


    try{


      /*
       * 親の
       *
       * design_secret_moon.html
       *
       * にある完成済みの
       *
       * #secretCostume
       *
       * を取得。
       */

      const source =
        window.parent.document
          .getElementById(
            "secretCostume"
          );


      if(!source){

        console.warn(
          "親ページに secretCostume がありません"
        );

        return;

      }


      /*
       * 衣装全体を丸ごと複製。
       *
       * これによって、
       *
       * ・透過処理済みレイヤー
       * ・レイヤー位置
       * ・レイヤーサイズ
       * ・角度
       * ・表示状態
       *
       * を引き継ぐ。
       */

      const clone =
        source.cloneNode(
          true
        );


      /*
       * IDを変更。
       *
       * iframe内で同じIDを使わない。
       */

      clone.id =
        "secretCostumeClone";


      clone.classList.add(
        "secret-clone"
      );


      /*
       * 親側のCSSで
       * display:none になっていても
       * この演出では表示する。
       */

      clone.style.setProperty(
        "display",
        "block",
        "important"
      );


      clone.style.setProperty(
        "visibility",
        "visible",
        "important"
      );


      clone.style.setProperty(
        "opacity",
        "1",
        "important"
      );


      clone.style.setProperty(
        "pointer-events",
        "none",
        "important"
      );


      clone.style.setProperty(
        "overflow",
        "visible",
        "important"
      );


      /*
       * 親ページの
       *
       * right
       * top
       * bottom
       *
       * は演出では使用しない。
       *
       * secret-character自体を
       * 上から下へ動かす。
       */

      clone.style.setProperty(
        "right",
        "auto",
        "important"
      );


      clone.style.setProperty(
        "bottom",
        "auto",
        "important"
      );


      clone.style.setProperty(
        "left",
        "0px",
        "important"
      );


      clone.style.setProperty(
        "top",
        "0px",
        "important"
      );


      clone.style.setProperty(
        "margin",
        "0",
        "important"
      );


      /*
       * 親のサイズを取得。
       */

      const parentStyle =
        window.parent.getComputedStyle(
          source
        );


      if(
        parentStyle.width
      ){

        clone.style.setProperty(
          "width",
          parentStyle.width,
          "important"
        );

      }


      if(
        parentStyle.height
      ){

        clone.style.setProperty(
          "height",
          parentStyle.height,
          "important"
        );

      }


      /*
       * iframe側へ追加。
       */

      container.appendChild(
        clone
      );


    }catch(error){

      console.error(
        "シークレット衣装の読み込みに失敗しました:",
        error
      );

    }

  }


  /* ===================================================
     少し待ってから衣装を読み込む
  =================================================== */

  setTimeout(
    function(){

      loadSecretCostume();

    },
    100
  );


  /* ===================================================
     7秒後
     親ページへ終了通知
  =================================================== */

  setTimeout(
    function(){

      try{

        window.parent.postMessage(
          {
            type:
              "secret-moon-finished"
          },
          "*"
        );

      }catch(error){

        console.warn(
          "シークレットムーン終了通知に失敗しました:",
          error
        );

      }

    },
    7000
  );


})();

</script>


</body>
</html>
