<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>シークレット月夜</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071329}
#scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#050d21 0%,#0b1733 58%,#101c32 100%);opacity:0;animation:sceneIn .45s ease forwards}
#stars{position:absolute;inset:0}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.55;animation:twinkle 2.8s ease-in-out infinite}
.star.cross:before,.star.cross:after{content:"";position:absolute;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}
.star.cross:before{width:8px;height:1px}.star.cross:after{width:1px;height:8px}
#ground{position:absolute;left:-5%;right:-5%;bottom:-4%;height:27%;background:linear-gradient(180deg,#10192b,#050a14 72%);clip-path:polygon(0 22%,12% 17%,24% 21%,38% 13%,51% 19%,65% 10%,78% 18%,90% 13%,100% 19%,100% 100%,0 100%);box-shadow:0 -12px 35px rgba(103,137,190,.12)}
#moon{position:absolute;width:105px;height:105px;border-radius:50%;right:13%;top:10%;background:radial-gradient(circle at 34% 30%,#fff 0 8%,#eaf0ff 34%,#c7d6f4 72%,#9aadd4 100%);box-shadow:0 0 20px rgba(213,228,255,.65),0 0 65px rgba(151,184,255,.38);opacity:0;transform:scale(.72);animation:moonIn 1.7s cubic-bezier(.2,.8,.2,1) .15s forwards}
#moon:before,#moon:after{content:"";position:absolute;border-radius:50%;background:rgba(128,145,181,.18)}
#moon:before{width:20px;height:13px;left:22px;top:27px}.#moon:after{width:14px;height:9px;left:61px;top:58px}
#moonGlow{position:absolute;width:420px;height:620px;left:50%;top:4%;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0%,transparent 37%,rgba(211,226,255,.16) 48%,rgba(232,240,255,.33) 50%,rgba(211,226,255,.16) 52%,transparent 63%);filter:blur(8px);opacity:0;animation:lightIn 1.8s ease .65s forwards;pointer-events:none}
#landingGlow{position:absolute;left:50%;bottom:17%;width:250px;height:115px;transform:translateX(-50%) scale(.7);background:radial-gradient(ellipse,rgba(223,235,255,.38),rgba(163,193,255,.15) 35%,transparent 72%);filter:blur(5px);opacity:0;animation:landingIn 1.8s ease 1.05s forwards}
#silhouette{position:absolute;left:50%;top:-150px;width:105px;height:105px;transform:translateX(-50%);opacity:.055;filter:brightness(0);animation:fall 3.65s cubic-bezier(.22,.72,.28,1) .55s forwards;z-index:8}
#silhouette img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:brightness(0);}
#silhouette.light{opacity:1;filter:none}
#sparkles{position:absolute;inset:0;pointer-events:none;z-index:20}
.spark{position:absolute;font-size:16px;color:#fff;opacity:0;animation:sparkFly .85s ease forwards}
#white{position:absolute;inset:0;background:#fff;opacity:0;z-index:50;pointer-events:none;animation:whiteout 1.15s ease 5.65s forwards}
@keyframes sceneIn{to{opacity:1}}@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes moonIn{0%{opacity:0;transform:scale(.72)}60%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes lightIn{to{opacity:1}}@keyframes landingIn{to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes fall{0%{top:-150px;opacity:.035;transform:translateX(-50%) scale(.82)}38%{opacity:.08}70%{opacity:.18}100%{top:63%;opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes sparkFly{0%{opacity:0;transform:translate(0,0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}
@keyframes whiteout{0%{opacity:0}70%{opacity:.85}100%{opacity:1}}
</style>
</head>
<body>
<div id="scene"><div id="stars"></div><div id="moonGlow"></div><div id="moon"></div><div id="ground"></div><div id="landingGlow"></div><div id="silhouette"></div><div id="sparkles"></div><div id="white"></div></div>
<script>
const stars=document.getElementById('stars');
for(let i=0;i<72;i++){const s=document.createElement('i');s.className='star'+(Math.random()<.16?' cross':'');s.style.left=(3+Math.random()*94)+'%';s.style.top=(4+Math.random()*67)+'%';s.style.animationDelay=(Math.random()*2.5)+'s';stars.appendChild(s)}
function getSecretClone(){
  try{
    const src=parent.document.getElementById('secretCostume');
    if(!src || !src.classList.contains('show')) return null;
    const clone=src.cloneNode(true);
    clone.removeAttribute('id');
    clone.classList.remove('show','celebrating');
    clone.style.display='block';clone.style.position='absolute';clone.style.left='50%';clone.style.top='0';clone.style.right='auto';clone.style.bottom='auto';clone.style.width='120px';clone.style.height='120px';clone.style.zIndex='8';clone.style.transform='translateX(-50%)';clone.style.filter='brightness(0)';clone.style.opacity='.055';clone.style.overflow='visible';
    clone.querySelectorAll('.secret-body').forEach(x=>{x.style.animation='none';x.style.transform='none'});
    clone.querySelectorAll('.secret-layer-wrap').forEach(x=>{x.style.animation='none'});
    clone.querySelectorAll('.secret-costume').forEach(x=>{});
    return clone;
  }catch(e){return null}
}
const sil=document.getElementById('silhouette');
const clone=getSecretClone();
if(clone){sil.appendChild(clone)}else{const fallback=document.createElement('div');fallback.style.cssText='position:absolute;inset:12%;background:#02040a;border-radius:45% 45% 35% 35%;';sil.appendChild(fallback)}
setTimeout(()=>{
  sil.style.animation='none';sil.style.top='63%';sil.style.transform='translateX(-50%) scale(1)';sil.style.opacity='1';
  sil.style.filter='none';
  if(clone){clone.style.filter='brightness(0)';clone.style.opacity='1'}
},4250);
setTimeout(()=>{
  const clone2=clone;
  if(clone2){clone2.style.filter='brightness(1) drop-shadow(0 0 8px rgba(255,235,170,.9))';clone2.style.opacity='1'}
  for(let i=0;i<13;i++){const p=document.createElement('span');p.className='spark';p.textContent=i%3===0?'✦':'·';p.style.left=(38+Math.random()*24)+'%';p.style.top=(55+Math.random()*22)+'%';p.style.setProperty('--dx',(-100+Math.random()*200)+'px');p.style.setProperty('--dy',(-70+Math.random()*100)+'px');p.style.animationDelay=(Math.random()*.18)+'s';document.getElementById('sparkles').appendChild(p)}
},4250);
setTimeout(()=>{document.getElementById('moonGlow').style.animation='lightIn .9s ease forwards';document.getElementById('landingGlow').style.animation='landingIn .9s ease forwards'},4850);
setTimeout(()=>{parent.postMessage({type:'secret-moon-finished'},'*')},7000);
</script>
</body>
</html>
