<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>着替える</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:#f6f8fa;
  color:#26343d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

body{
  padding:18px 14px 30px;
}

.page{
  width:min(760px,100%);
  margin:0 auto;
}

.card{
  background:#fff;
  border:1px solid #e1e8ed;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 18px rgba(30,55,70,.06);
  margin-bottom:16px;
}

h1{
  margin:4px 0 8px;
  font-size:24px;
}

h2{
  margin:0 0 8px;
  font-size:20px;
}

p{
  margin:0 0 14px;
}

.small{
  color:#71808a;
  font-size:13px;
  line-height:1.6;
}


/* =====================================================
   キャラクター選択
===================================================== */

.character-select{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.character-button{
  border:2px solid #e1e8ed;
  border-radius:18px;
  background:#fff;
  padding:14px;
  cursor:pointer;
  text-align:center;
  transition:
    transform .15s ease,
    border-color .15s ease,
    box-shadow .15s ease;
}

.character-button:active{
  transform:scale(.98);
}

.character-button img{
  width:100%;
  height:190px;
  object-fit:contain;
  display:block;
  margin-bottom:10px;
}

.character-button .no-image{
  height:190px;
}

.character-name{
  font-size:17px;
  font-weight:700;
}


/* =====================================================
   衣装選択画面
===================================================== */

#costumeScreen{
  display:none;
}

.screen-back{
  border:none;
  background:#eef3f7;
  color:#43545e;
  border-radius:10px;
  padding:9px 13px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  margin-bottom:14px;
}

.character-heading{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.character-heading h2{
  margin:0;
}

.costume-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.costume-card{
  position:relative;
  border:2px solid #e1e8ed;
  border-radius:16px;
  background:#fff;
  padding:10px;
  text-align:center;
  cursor:pointer;
  transition:
    border-color .15s ease,
    transform .15s ease,
    box-shadow .15s ease;
}

.costume-card:active{
  transform:scale(.98);
}

.costume-card.selected{
  border-color:#5b9bd5;
  box-shadow:
    0 0 0 3px rgba(91,155,213,.14);
}

.costume-card img{
  display:block;
  width:100%;
  height:150px;
  object-fit:contain;
  margin:0 auto 8px;
}

.costume-name{
  font-size:14px;
  font-weight:600;
  line-height:1.4;
}

.selected-badge{
  position:absolute;
  top:8px;
  right:8px;
  padding:4px 7px;
  border-radius:999px;
  background:#5b9bd5;
  color:#fff;
  font-size:11px;
  font-weight:700;
}

.no-image{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f3f5f7;
  border-radius:12px;
  color:#8a969e;
  font-size:13px;
  line-height:1.5;
  text-align:center;
}

.locked-message{
  padding:14px;
  border-radius:12px;
  background:#f5f7f9;
  color:#71808a;
  font-size:13px;
  line-height:1.5;
}


/* =====================================================
   下部ボタン
===================================================== */

.actions{
  position:sticky;
  bottom:10px;
  z-index:5;
  background:rgba(246,248,250,.94);
  padding-top:8px;
}

button{
  width:100%;
  border:none;
  border-radius:12px;
  padding:13px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#3f7fb8;
  color:#fff;
}

.secondary{
  background:#fff;
  color:#43545e;
  border:1px solid #d8e1e7;
  margin-top:9px;
}

button:disabled{
  opacity:.55;
  cursor:default;
}

#message{
  min-height:20px;
  margin-top:10px;
  text-align:center;
  font-size:13px;
}

#message.error{
  color:#c84c4c;
}


/* =====================================================
   スマホ
===================================================== */

@media(max-width:480px){

  body{
    padding:14px 10px 26px;
  }

  .card{
    padding:14px;
  }

  .character-select{
    gap:10px;
  }

  .character-button{
    padding:10px;
  }

  .character-button img,
  .character-button .no-image{
    height:145px;
  }

  .costume-grid{
    grid-template-columns:1fr 1fr;
  }

  .costume-card img{
    height:125px;
  }

}

</style>
</head>

<body>

<div class="page">


  <!-- ===================================================
       キャラクター選択画面
  ==================================================== -->

  <div id="characterScreen">

    <div class="card">

      <h1>👕 着替える</h1>

      <p class="small">
        着替えたいキャラクターを選んでください。
      </p>

    </div>


    <div class="card">

      <div class="character-select">


        <!-- ベルちゃん -->

        <button
          id="bellSelect"
          class="character-button"
          type="button"
        >

          <div
            id="bellSelectImage"
            class="no-image"
          >
            画像未登録
          </div>

          <div class="character-name">
            🔔 ベルちゃん
          </div>

        </button>


        <!-- チャイムくん -->

        <button
          id="chimeSelect"
          class="character-button"
          type="button"
        >

          <div
            id="chimeSelectImage"
            class="no-image"
          >
            画像未登録
          </div>

          <div class="character-name">
            🎵 チャイムくん
          </div>

        </button>


      </div>

    </div>


    <div class="actions">

      <button
        id="backFromCharacter"
        class="secondary"
        type="button"
      >
        ← マイページに戻る
      </button>

    </div>

  </div>



  <!-- ===================================================
       衣装選択画面
  ==================================================== -->

  <div id="costumeScreen">


    <div class="card">

      <button
        id="characterBackButton"
        class="screen-back"
        type="button"
      >
        ← キャラクター選択に戻る
      </button>

      <div class="character-heading">

        <h2 id="characterTitle">
          ベルちゃん
        </h2>

      </div>

      <p class="small">
        持っている衣装から好きなものを選んでください。
      </p>

      <div
        id="costumeGrid"
        class="costume-grid"
      ></div>

    </div>


    <div class="actions">

      <button
        id="saveButton"
        class="primary"
        type="button"
        disabled
      >
        この衣装に着替える
      </button>

      <button
        id="backButton"
        class="secondary"
        type="button"
      >
        ← マイページに戻る
      </button>

      <div id="message"></div>

    </div>

  </div>

</div>


<script type="module">

import{
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import{
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import{
  getDatabase,
  ref,
  get,
  update
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =====================================================
   Firebase設定
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",

  authDomain:
    "seikyo-handbell-club.firebaseapp.com",

  databaseURL:
    "https://seikyo-handbell-club-default-rtdb.firebaseio.com",

  projectId:
    "seikyo-handbell-club",

  storageBucket:
    "seikyo-handbell-club.firebasestorage.app",

  messagingSenderId:
    "55435007971",

  appId:
    "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);


setPersistence(
  auth,
  browserLocalPersistence
).catch(
  error =>
    console.error(
      "認証状態の保存設定エラー:",
      error
    )
  );


/* =====================================================
   ★ 衣装登録場所
=====================================================

   今は衣装画像がまだ無くても大丈夫。

   あとで画像を追加するときは、
   ここに1個ずつ追加していく。

   例：

   {
     id:"costume_bell_summer",
     name:"ベルちゃん・夏服",
     src:"costumes/bell-summer.png"
   }

   取得条件を設定する場合は、
   collection側のIDと同じidにする。

===================================================== */

const costumeDefinitions = {

  bell:[

    {
      id:null,
      name:"通常衣装",
      src:"bell.png"
    }

    /*
    あとからここに追加

    ,{
      id:"costume_bell_summer",
      name:"ベルちゃん・夏服",
      src:"costumes/bell-summer.png"
    }

    */

  ],


  chime:[

    {
      id:null,
      name:"通常衣装",
      src:"chime.png"
    }

    /*
    あとからここに追加

    ,{
      id:"costume_chime_summer",
      name:"チャイムくん・夏服",
      src:"costumes/chime-summer.png"
    }

    */

  ]

};


/* =====================================================
   状態
===================================================== */

let currentUser = null;

let acquiredCollection = {};

let equippedCostume = {

  bell:null,
  chime:null

};

let selectedCostume = {

  bell:null,
  chime:null

};

let currentCharacter = null;


/* =====================================================
   DOM
===================================================== */

const characterScreen =
  document.getElementById(
    "characterScreen"
  );

const costumeScreen =
  document.getElementById(
    "costumeScreen"
  );

const costumeGrid =
  document.getElementById(
    "costumeGrid"
  );

const characterTitle =
  document.getElementById(
    "characterTitle"
  );

const saveButton =
  document.getElementById(
    "saveButton"
  );

const message =
  document.getElementById(
    "message"
  );


/* =====================================================
   メッセージ
===================================================== */

function showMessage(
  text,
  error=false
){

  message.textContent =
    text;

  message.classList.toggle(
    "error",
    error
  );

}


/* =====================================================
   画像表示
===================================================== */

function createImageOrPlaceholder(
  src,
  alt,
  className
){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    className || "no-image";


  /*
   * 画像が存在しない場合でも
   * 「画像未登録」と表示して
   * 壊れた画像マークを出さない。
   */

  if(!src){

    wrapper.textContent =
      "画像未登録";

    return wrapper;

  }


  const img =
    document.createElement("img");

  img.src =
    src;

  img.alt =
    alt || "";

  img.onerror =
    ()=>{

      img.remove();

      wrapper.textContent =
        "画像未登録";

      wrapper.classList.add(
        "no-image"
      );

    };

  wrapper.classList.remove(
    "no-image"
  );

  wrapper.appendChild(
    img
  );

  return wrapper;

}


/* =====================================================
   キャラクター選択画面の画像
===================================================== */

function renderCharacterImages(){

  const bellContainer =
    document.getElementById(
      "bellSelectImage"
    );

  const chimeContainer =
    document.getElementById(
      "chimeSelectImage"
    );


  const bellSrc =
    costumeDefinitions.bell[0]?.src ||
    null;

  const chimeSrc =
    costumeDefinitions.chime[0]?.src ||
    null;


  bellContainer.innerHTML = "";

  chimeContainer.innerHTML = "";


  if(bellSrc){

    const img =
      document.createElement("img");

    img.src =
      bellSrc;

    img.alt =
      "ベルちゃん";

    img.onerror =
      ()=>{

        bellContainer.innerHTML =
          "画像未登録";

        bellContainer.className =
          "no-image";

      };

    bellContainer.className = "";

    bellContainer.appendChild(
      img
    );

  }else{

    bellContainer.textContent =
      "画像未登録";

  }


  if(chimeSrc){

    const img =
      document.createElement("img");

    img.src =
      chimeSrc;

    img.alt =
      "チャイムくん";

    img.onerror =
      ()=>{

        chimeContainer.innerHTML =
          "画像未登録";

        chimeContainer.className =
          "no-image";

      };

    chimeContainer.className = "";

    chimeContainer.appendChild(
      img
    );

  }else{

    chimeContainer.textContent =
      "画像未登録";

  }

}


/* =====================================================
   コレクション取得
===================================================== */

async function loadMemberData(){

  if(!currentUser)
    return false;


  try{

    const memberRef =
      ref(
        db,
        `members/${currentUser.uid}`
      );


    const snap =
      await get(memberRef);


    if(!snap.exists()){

      showMessage(
        "部員情報を取得できませんでした。",
        true
      );

      return false;

    }


    const data =
      snap.val() || {};


    acquiredCollection =
      data.collection || {};


    const saved =
      data.equippedCostume || {};


    equippedCostume = {

      bell:
        saved.bell || null,

      chime:
        saved.chime || null

    };


    selectedCostume = {

      bell:
        equippedCostume.bell,

      chime:
        equippedCostume.chime

    };


    return true;


  }catch(error){

    console.error(
      "着替え設定の読み込みエラー:",
      error
    );


    showMessage(
      "衣装情報を読み込めませんでした。",
      true
    );


    return false;

  }

}


/* =====================================================
   取得済み判定
===================================================== */

function isAcquired(
  costumeId
){

  /*
   * nullは通常衣装。
   * 通常衣装は最初から使用可能。
   */

  if(!costumeId)
    return true;


  return !!acquiredCollection[
    costumeId
  ];

}


/* =====================================================
   衣装一覧
===================================================== */

function renderCostumes(){

  costumeGrid.innerHTML = "";


  const costumes =
    costumeDefinitions[
      currentCharacter
    ] || [];


  let displayedCount = 0;


  costumes.forEach(
    costume=>{

      /*
       * 未取得衣装は表示しない。
       */

      if(
        costume.id &&
        !isAcquired(
          costume.id
        )
      ){

        return;

      }


      displayedCount++;


      const card =
        document.createElement(
          "button"
        );


      card.type =
        "button";

      card.className =
        "costume-card";


      if(
        selectedCostume[
          currentCharacter
        ] === costume.id
      ){

        card.classList.add(
          "selected"
        );

      }


      /*
       * 画像
       */

      if(costume.src){

        const image =
          document.createElement(
            "img"
          );


        image.src =
          costume.src;

        image.alt =
          costume.name;


        image.onerror =
          ()=>{

            image.style.display =
              "none";

            const placeholder =
              document.createElement(
                "div"
              );

            placeholder.className =
              "no-image";

            placeholder.style.height =
              "150px";

            placeholder.textContent =
              "画像未登録";


            card.insertBefore(
              placeholder,
              card.firstChild
            );

          };


        card.appendChild(
          image
        );

      }else{

        const placeholder =
          document.createElement(
            "div"
          );

        placeholder.className =
          "no-image";

        placeholder.style.height =
          "150px";

        placeholder.textContent =
          "画像未登録";


        card.appendChild(
          placeholder
        );

      }


      /*
       * 名前
       */

      const name =
        document.createElement(
          "div"
        );


      name.className =
        "costume-name";


      name.textContent =
        costume.name;


      card.appendChild(
        name
      );


      /*
       * 選択中
       */

      if(
        selectedCostume[
          currentCharacter
        ] === costume.id
      ){

        const badge =
          document.createElement(
            "span"
          );


        badge.className =
          "selected-badge";


        badge.textContent =
          "選択中";


        card.appendChild(
          badge
        );

      }


      /*
       * 選択
       */

      card.addEventListener(
        "click",
        ()=>{

          selectedCostume[
            currentCharacter
          ] =
            costume.id;


          renderCostumes();

        }
      );


      costumeGrid.appendChild(
        card
      );

    }
  );


  /*
   * 衣装が1つも表示されない場合
   */

  if(displayedCount === 0){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "locked-message";


    empty.textContent =
      "まだ取得済みの衣装がありません。";


    costumeGrid.appendChild(
      empty
    );

  }

}


/* =====================================================
   キャラクターを選ぶ
===================================================== */

function openCharacter(
  character
){

  currentCharacter =
    character;


  if(character === "bell"){

    characterTitle.textContent =
      "🔔 ベルちゃん";

  }else{

    characterTitle.textContent =
      "🎵 チャイムくん";

  }


  characterScreen.style.display =
    "none";


  costumeScreen.style.display =
    "block";


  showMessage("");


  renderCostumes();

}


/* =====================================================
   キャラクター選択画面へ
===================================================== */

function backToCharacters(){

  currentCharacter =
    null;


  costumeScreen.style.display =
    "none";


  characterScreen.style.display =
    "block";


  showMessage("");

}


/* =====================================================
   保存
===================================================== */

async function saveCostume(){

  if(!currentUser)
    return;


  if(!currentCharacter)
    return;


  saveButton.disabled =
    true;


  showMessage(
    "衣装を保存しています……"
  );


  try{

    const updates = {};


    updates[
      `members/${currentUser.uid}/equippedCostume/${currentCharacter}`
    ] =
      selectedCostume[
        currentCharacter
      ];


    /*
     * equippedCostumeだけ更新。
     *
     * collectionやプロフィールなどは
     * 絶対に上書きしない。
     */

    await update(
      ref(db),
      updates
    );


    equippedCostume[
      currentCharacter
    ] =
      selectedCostume[
        currentCharacter
      ];


    showMessage(
      "衣装を変更しました！"
    );


    setTimeout(
      ()=>{
        location.href =
          "handbell.html";
      },
      700
    );


  }catch(error){

    console.error(
      "衣装保存エラー:",
      error
    );


    showMessage(
      "衣装を保存できませんでした。",
      true
    );


    saveButton.disabled =
      false;

  }

}


/* =====================================================
   ボタン
===================================================== */

document
  .getElementById(
    "bellSelect"
  )
  .addEventListener(
    "click",
    ()=>{
      openCharacter("bell");
    }
  );


document
  .getElementById(
    "chimeSelect"
  )
  .addEventListener(
    "click",
    ()=>{
      openCharacter("chime");
    }
  );


document
  .getElementById(
    "characterBackButton"
  )
  .addEventListener(
    "click",
    backToCharacters
  );


document
  .getElementById(
    "backFromCharacter"
  )
  .addEventListener(
    "click",
    ()=>{
      location.href =
        "handbell.html";
    }
  );


document
  .getElementById(
    "backButton"
  )
  .addEventListener(
    "click",
    ()=>{
      location.href =
        "handbell.html";
    }
  );


saveButton.addEventListener(
  "click",
  saveCostume
);


/* =====================================================
   認証状態
===================================================== */

onAuthStateChanged(
  auth,
  async user=>{

    currentUser =
      user;


    if(!user){

      characterScreen.style.display =
        "block";

      costumeScreen.style.display =
        "none";

      showMessage(
        "ログインが必要です。",
        true
      );

      return;

    }


    const loaded =
      await loadMemberData();


    if(!loaded){

      return;

    }


    renderCharacterImages();

  }
);

</script>

</body>
</html>
