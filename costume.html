<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>着替える</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:#f6f8fa;
  color:#26343d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

body{
  padding:18px 14px 30px;
}

.page{
  width:min(760px,100%);
  margin:0 auto;
}

.card{
  background:#fff;
  border:1px solid #e1e8ed;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 18px rgba(30,55,70,.06);
  margin-bottom:16px;
}

h1{
  margin:4px 0 8px;
  font-size:24px;
}

h2{
  margin:0 0 8px;
  font-size:20px;
}

p{
  margin:0 0 14px;
}

.small{
  color:#71808a;
  font-size:13px;
  line-height:1.6;
}

.character-section{
  margin-top:18px;
}

.character-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
}

.character-title h2{
  margin:0;
}

.costume-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.costume-card{
  position:relative;
  border:2px solid #e1e8ed;
  border-radius:16px;
  background:#fff;
  padding:10px;
  text-align:center;
  cursor:pointer;
  transition:
    border-color .15s ease,
    transform .15s ease,
    box-shadow .15s ease;
}

.costume-card:active{
  transform:scale(.98);
}

.costume-card.selected{
  border-color:#5b9bd5;
  box-shadow:0 0 0 3px rgba(91,155,213,.14);
}

.costume-card img{
  display:block;
  width:100%;
  height:150px;
  object-fit:contain;
  margin:0 auto 8px;
}

.costume-name{
  font-size:14px;
  font-weight:600;
  line-height:1.4;
}

.selected-badge{
  position:absolute;
  top:8px;
  right:8px;
  padding:4px 7px;
  border-radius:999px;
  background:#5b9bd5;
  color:#fff;
  font-size:11px;
  font-weight:700;
}

.costume-type-badge{
  position:absolute;
  top:8px;
  left:8px;
  padding:4px 7px;
  border-radius:999px;
  background:#8b78c8;
  color:#fff;
  font-size:10px;
  font-weight:700;
}

.costume-type-badge.daily{
  background:#6a9f68;
}

.costume-type-badge.secret{
  background:#d06bb5;
}

.costume-type-badge.none{
  background:#7f8b93;
}

.locked-message{
  padding:12px;
  border-radius:12px;
  background:#f5f7f9;
  color:#71808a;
  font-size:13px;
  line-height:1.5;
}

.actions{
  position:sticky;
  bottom:10px;
  z-index:5;
  background:rgba(246,248,250,.94);
  padding-top:8px;
}

button{
  width:100%;
  border:none;
  border-radius:12px;
  padding:13px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#3f7fb8;
  color:#fff;
}

.secondary{
  background:#fff;
  color:#43545e;
  border:1px solid #d8e1e7;
  margin-top:9px;
}

button:disabled{
  opacity:.55;
  cursor:default;
}

#message{
  min-height:20px;
  margin-top:10px;
  text-align:center;
  font-size:13px;
}

#message.error{
  color:#c84c4c;
}

@media(max-width:480px){
  .costume-grid{
    grid-template-columns:1fr 1fr;
  }

  .costume-card img{
    height:125px;
  }

  body{
    padding:14px 10px 26px;
  }

  .card{
    padding:14px;
  }
}

.character-choice-button{
  flex:1;
  padding:12px 8px;
  border:2px solid #e1e5ea;
  border-radius:14px;
  background:#fff;
  font-weight:700;
  cursor:pointer;
}

.character-choice-button.selected{
  border-color:#ff8ab3;
  background:#fff2f7;
}
</style>
</head>

<body>

<div class="page">

  <div class="card">
    <h1>👕 着替える</h1>

    <p class="small">
      取得済みの衣装だけ着替えに使えます。<br>
      ベルちゃんとチャイムくんは、それぞれ別々に衣装を設定できます。
    </p>
  </div>


  <!-- キャラクター選択 -->
  <div class="card character-section">

    <div class="character-title">
      <h2>誰に着せる？</h2>
    </div>

    <div style="display:flex;gap:10px;margin-top:12px;">

      <button
        id="selectBell"
        type="button"
        class="character-choice-button"
      >
        🔔 ベルちゃん
      </button>

      <button
        id="selectChime"
        type="button"
        class="character-choice-button"
      >
        🎵 チャイムくん
      </button>

    </div>

  </div>


  <!-- 衣装一覧 -->
  <div class="card character-section">

    <div class="character-title">
      <h2 id="selectedCharacterTitle">
        🔔 ベルちゃんの衣装
      </h2>
    </div>

    <div
      id="costumeList"
      class="costume-grid"
    ></div>

  </div>


  <!-- 操作 -->
  <div class="actions">

    <button
      id="saveButton"
      class="primary"
      type="button"
      disabled
    >
      この衣装に着替える
    </button>

    <button
      id="backButton"
      class="secondary"
      type="button"
    >
      ← マイページに戻る
    </button>

    <div id="message"></div>

  </div>

</div>


<script type="module">

  initializeApp
}
from

import{
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import{
  getDatabase,
  ref,
  get,
  update
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =====================================================
   Firebase設定
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",

  authDomain:
    "seikyo-handbell-club.firebaseapp.com",

  databaseURL:
    "https://seikyo-handbell-club-default-rtdb.firebaseio.com",

  projectId:
    "seikyo-handbell-club",

  storageBucket:
    "seikyo-handbell-club.firebasestorage.app",

  messagingSenderId:
    "55435007971",

  appId:
    "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


setPersistence(
  auth,
  browserLocalPersistence
).catch(
  error =>
    console.error(
      "認証状態の保存設定エラー:",
      error
    )
  );


const db =
  getDatabase(app);


/* =====================================================
   イベント衣装
===================================================== */

const eventCostumeDefinitions = [

  [
    "newyear",
    "お正月",
    "bell-newyear.png",
    "chime-newyear.png"
  ],

  [
    "setsubun",
    "節分",
    "bell-setsubun.png",
    "chime-setsubun.png"
  ],

  [
    "valentine",
    "バレンタイン",
    "bell-valentine.png",
    "chime-valentine.png"
  ],

  [
    "hinamatsuri",
    "ひな祭り",
    "bell-hinamatsuri.png",
    "chime-hinamatsuri.png"
  ],

  [
    "whiteday",
    "ホワイトデー",
    "bell-whiteday.png",
    "chime-whiteday.png"
  ],

  [
    "kodomonohi",
    "こどもの日",
    "bell-kodomonohi.png",
    "chime-kodomonohi.png"
  ],

  [
    "tanabata",
    "七夕",
    "bell-tanabata.png",
    "chime-tanabata.png"
  ],

  [
    "tsukimi",
    "十五夜",
    "bell-tsukimi.png",
    "chime-tsukimi.png"
  ],

  [
    "halloween",
    "ハロウィン",
    "bell-halloween.png",
    "chime-halloween.png"
  ],

  [
    "christmaseve",
    "クリスマスイブ",
    "bell-christmaseve.png",
    "chime-christmaseve.png"
  ],

  [
    "christmas",
    "クリスマス",
    "bell-christmas.png",
    "chime-christmas.png"
  ],

  [
    "newyearseve",
    "大晦日",
    "bell-winter.png",
    "chime-winter.png"
  ]

];


/* =====================================================
   毎日衣装
===================================================== */

const dailyCostumeDefinitions = [

  {
    id:"daily-costume-01",
    name:"毎日衣装 01",
    src:"costumes/daily-costume-01.png"
  },

  {
    id:"daily-costume-02",
    name:"毎日衣装 02",
    src:"costumes/daily-costume-02.png"
  }

];


/* =====================================================
   シークレット衣装
===================================================== */

const secretCostumeDefinitions = {

  bell:{
    /*
     * 装備時に保存するID
     */
    id:"secret-bell",

    /*
     * コレクション側で
     * 取得済み判定に使うID
     */
    collectionId:"secret_bell_rare_costume",

    name:"ベルちゃん・シークレット衣装",

    src:"costumes/bell-secret-main.png",

    kind:"secret"
  },

  chime:{
    /*
     * 装備時に保存するID
     */
    id:"secret-chime",

    /*
     * コレクション側で
     * 取得済み判定に使うID
     */
    collectionId:"secret_chime_rare_costume",

    name:"チャイムくん・シークレット衣装",

    src:"costumes/chime-secret-main.png",

    kind:"secret"
  }

};


/* =====================================================
   衣装一覧
===================================================== */

const costumeDefinitions = {

  bell:[

    ...eventCostumeDefinitions.map(
      ([
        key,
        name,
        bellFile
      ])=>({

        id:`event_${key}_bell`,

        name:`ベルちゃん・${name}`,

        src:`costumes/${bellFile}`,

        kind:"event"

      })
    ),

    ...dailyCostumeDefinitions.map(
      costume=>({

        ...costume,

        kind:"daily"

      })
    ),

    secretCostumeDefinitions.bell

  ],


  chime:[

    ...eventCostumeDefinitions.map(
      ([
        key,
        name,
        bellFile,
        chimeFile
      ])=>({

        id:`event_${key}_chime`,

        name:`チャイムくん・${name}`,

        src:`costumes/${chimeFile}`,

        kind:"event"

      })
    ),

    ...dailyCostumeDefinitions.map(
      costume=>({

        ...costume,

        kind:"daily"

      })
    ),

    secretCostumeDefinitions.chime

  ]

};


/* =====================================================
   現在の状態
===================================================== */

let currentUser = null;


let acquiredCollection = {};


let equippedCostume = {

  bell:null,

  chime:null

};


let dailyCostumes = {

  bell:{},

  chime:{}

};


let selectedCostume = {

  bell:null,

  chime:null

};


let eventCostumeOverride = {};


let selectedCharacter = "bell";


/* =====================================================
   要素
===================================================== */

const costumeList =
  document.getElementById(
    "costumeList"
  );


const selectedCharacterTitle =
  document.getElementById(
    "selectedCharacterTitle"
  );


const selectBell =
  document.getElementById(
    "selectBell"
  );


const selectChime =
  document.getElementById(
    "selectChime"
  );


const saveButton =
  document.getElementById(
    "saveButton"
  );


const backButton =
  document.getElementById(
    "backButton"
  );


const message =
  document.getElementById(
    "message"
  );


/* =====================================================
   メッセージ
===================================================== */

function showMessage(
  text,
  error=false
){

  message.textContent =
    text;

  message.classList.toggle(
    "error",
    error
  );

}


/* =====================================================
   今日のイベント
===================================================== */

function getTodayEventKey(){

  const now =
    new Date();

  const md =
    `${String(
      now.getMonth()+1
    ).padStart(2,"0")}-${String(
      now.getDate()
    ).padStart(2,"0")}`;


  /*
   * お正月
   */

  if(
    now.getMonth()+1 === 1 &&
    now.getDate() >= 1 &&
    now.getDate() <= 5
  ){

    return "newyear";

  }


  const fixed = {

    "02-03":"setsubun",

    "02-14":"valentine",

    "03-03":"hinamatsuri",

    "03-14":"whiteday",

    "05-05":"kodomonohi",

    "07-07":"tanabata",

    "10-31":"halloween",

    "12-24":"christmaseve",

    "12-25":"christmas",

    "12-31":"newyearseve"

  };


  return fixed[md] || null;

}


/* =====================================================
   会員データ取得
===================================================== */

async function loadMemberData(){

  if(!currentUser)
    return false;


  try{

    const memberRef =
      ref(
        db,
        `members/${currentUser.uid}`
      );


    const snap =
      await get(memberRef);


    if(!snap.exists()){

      showMessage(
        "部員情報を取得できませんでした。",
        true
      );

      return false;

    }


    const data =
      snap.val() || {};


    /* -------------------------
       コレクション
    ------------------------- */

    acquiredCollection =
      data.collection || {};


    /* -------------------------
       毎日衣装
    ------------------------- */

    const daily =
      data.dailyCostumes || {};


    dailyCostumes = {

      bell:
        daily.bell &&
        typeof daily.bell === "object"
          ? daily.bell
          : {},

      chime:
        daily.chime &&
        typeof daily.chime === "object"
          ? daily.chime
          : {}

    };


    /* -------------------------
       イベント衣装の手動上書き
    ------------------------- */

    eventCostumeOverride =
      data.eventCostumeOverride &&
      typeof data.eventCostumeOverride === "object"
        ? data.eventCostumeOverride
        : {};


    /* -------------------------
       通常時の装備
    ------------------------- */

    const saved =
      data.equippedCostume || {};


    equippedCostume = {

      bell:
        saved.bell || null,

      chime:
        saved.chime || null

    };


    /* =================================================
       画面で最初に選択する衣装
    ================================================= */

    const eventKey =
      getTodayEventKey();


    if(eventKey){

      selectedCostume = {

        bell:
          eventCostumeOverride?.[eventKey]?.bell
            ?? null,

        chime:
          eventCostumeOverride?.[eventKey]?.chime
            ?? null

      };

    }else{

      selectedCostume = {

        bell:
          equippedCostume.bell,

        chime:
          equippedCostume.chime

      };

    }


    return true;


  }catch(error){

    console.error(
      "着替え設定の読み込みエラー:",
      error
    );


    showMessage(
      "衣装情報を読み込めませんでした。",
      true
    );


    return false;

  }

}


/* =====================================================
   取得済み判定
===================================================== */

function isAcquired(
  character,
  costume
){

  /*
   * 「衣装なし」は
   * 常に使用可能
   */

  if(
    costume.kind === "none"
  ){

    return true;

  }


  /*
   * IDなしの衣装も
   * 使用可能
   */

  if(!costume.id){

    return true;

  }


  /*
   * 毎日衣装
   */

  if(
    costume.kind === "daily"
  ){

    return !!(
      dailyCostumes?.[
        character
      ]?.[
        costume.id
      ]
    );

  }


  /*
   * シークレット衣装
   *
   * 装備IDとコレクションIDが
   * 異なるため、collectionIdを
   * 優先して取得判定する。
   */

  if(
    costume.kind === "secret"
  ){

    const collectionId =
      costume.collectionId ||
      costume.id;


    return !!acquiredCollection[
      collectionId
    ];

  }


  /*
   * 通常イベント衣装
   */

  return !!acquiredCollection[
    costume.id
  ];

}


/* =====================================================
   衣装カード表示
===================================================== */

function renderCostumes(){

  const character =
    selectedCharacter;


  costumeList.innerHTML = "";


  /*
   * -----------------------------------------
   * 衣装なし
   * -----------------------------------------
   */

  const noneCostume = {

    id:null,

    name:"衣装なし",

    src:
      character === "bell"
        ? "bell.png"
        : "chime.png",

    kind:"none"

  };


  renderCostumeCard(
    character,
    noneCostume
  );


  /*
   * -----------------------------------------
   * 取得済み衣装
   * -----------------------------------------
   */

  (
    costumeDefinitions[
      character
    ] || []
  ).forEach(

    costume=>{

      if(
        !isAcquired(
          character,
          costume
        )
      ){

        return;

      }


      renderCostumeCard(
        character,
        costume
      );

    }

  );


  /*
   * 何もない場合
   */

  if(
    !costumeList.children.length
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "locked-message";


    empty.textContent =
      "まだ取得済みの衣装がありません。";


    costumeList.appendChild(
      empty
    );

  }

}


/* =====================================================
   衣装カード1枚を作る
===================================================== */

function renderCostumeCard(
  character,
  costume
){

  const card =
    document.createElement(
      "button"
    );


  card.type =
    "button";


  card.className =
    "costume-card";


  /*
   * 現在選択中
   */

  if(
    selectedCostume[
      character
    ] === costume.id
  ){

    card.classList.add(
      "selected"
    );

  }


  /*
   * 画像
   */

  const image =
    document.createElement(
      "img"
    );


  image.src =
    costume.src;


  image.alt =
    costume.name;


  /*
   * 名前
   */

  const name =
    document.createElement(
      "div"
    );


  name.className =
    "costume-name";


  name.textContent =
    costume.name;


  card.appendChild(
    image
  );


  card.appendChild(
    name
  );


  /*
   * 種類バッジ
   */

  const badge =
    document.createElement(
      "span"
    );


  badge.className =
    "costume-type-badge";


  if(
    costume.kind === "daily"
  ){

    badge.classList.add(
      "daily"
    );

    badge.textContent =
      "毎日";

  }else if(
    costume.kind === "secret"
  ){

    badge.classList.add(
      "secret"
    );

    badge.textContent =
      "SECRET";

  }else if(
    costume.kind === "none"
  ){

    badge.classList.add(
      "none"
    );

    badge.textContent =
      "なし";

  }else{

    badge.textContent =
      "イベント";

  }


  card.appendChild(
    badge
  );


  /*
   * 選択中バッジ
   */

  if(
    selectedCostume[
      character
    ] === costume.id
  ){

    const selectedBadge =
      document.createElement(
        "span"
      );


    selectedBadge.className =
      "selected-badge";


    selectedBadge.textContent =
      "選択中";


    card.appendChild(
      selectedBadge
    );

  }


  /*
   * クリック
   */

  card.addEventListener(
    "click",
    ()=>{

      selectedCostume[
        character
      ] =
        costume.id;


      renderAll();

    }
  );


  costumeList.appendChild(
    card
  );

}


/* =====================================================
   全体描画
===================================================== */

function renderAll(){

  selectedCharacterTitle.textContent =
    selectedCharacter === "chime"
      ? "🎵 チャイムくんの衣装"
      : "🔔 ベルちゃんの衣装";


  selectBell.classList.toggle(
    "selected",
    selectedCharacter === "bell"
  );


  selectChime.classList.toggle(
    "selected",
    selectedCharacter === "chime"
  );


  renderCostumes();


  /*
   * null = 衣装なし
   * なので null でも保存可能。
   */

  saveButton.disabled =
    !currentUser;

}


/* =====================================================
   衣装保存
===================================================== */

async function saveCostume(){

  if(!currentUser)
    return;


  const character =
    selectedCharacter;


  /*
   * nullも有効。
   *
   * null = 衣装なし
   */

  const costumeId =
    selectedCostume[
      character
    ];


  saveButton.disabled =
    true;


  showMessage(
    "衣装を保存しています……"
  );


  try{

    const eventKey =
      getTodayEventKey();


    const updates = {};


    /* =================================================
       イベント日
    ================================================= */

    if(eventKey){

      if(costumeId){

        updates[
          `members/${currentUser.uid}/eventCostumeOverride/${eventKey}/${character}`
        ] =
          costumeId;

      }else{

        updates[
          `members/${currentUser.uid}/eventCostumeOverride/${eventKey}/${character}`
        ] =
          null;

      }

    }


    /* =================================================
       通常日
    ================================================= */

    else{

      updates[
        `members/${currentUser.uid}/equippedCostume/${character}`
      ] =
        costumeId || null;

    }


    /*
     * Firebaseへ保存
     */

    await update(
      ref(db),
      updates
    );


    /*
     * ローカル状態も更新
     */

    if(eventKey){

      if(!eventCostumeOverride[eventKey]){

        eventCostumeOverride[eventKey] =
          {};

      }


      if(costumeId){

        eventCostumeOverride[
          eventKey
        ][
          character
        ] =
          costumeId;

      }else{

        delete eventCostumeOverride[
          eventKey
        ][
          character
        ];

      }

    }else{

      equippedCostume[
        character
      ] =
        costumeId || null;

    }


    /*
     * 完了
     */

    if(costumeId){

      showMessage(
        "衣装を変更しました！"
      );

    }else{

      showMessage(
        "衣装なしに変更しました！"
      );

    }


    /*
     * 少し待ってマイページへ
     */

    setTimeout(
      ()=>{
        location.href =
          "handbell.html";
      },
      700
    );


  }catch(error){

    console.error(
      "衣装保存エラー:",
      error
    );


    showMessage(
      "衣装を保存できませんでした。",
      true
    );


    saveButton.disabled =
      false;

  }

}


/* =====================================================
   キャラクター切り替え
===================================================== */

selectBell.addEventListener(
  "click",
  ()=>{

    selectedCharacter =
      "bell";

    renderAll();

  }
);


selectChime.addEventListener(
  "click",
  ()=>{

    selectedCharacter =
      "chime";

    renderAll();

  }
);


/* =====================================================
   戻る
===================================================== */

backButton.addEventListener(
  "click",
  ()=>{

    location.href =
      "handbell.html";

  }
);


/* =====================================================
   保存ボタン
===================================================== */

saveButton.addEventListener(
  "click",
  saveCostume
);


/* =====================================================
   認証状態
===================================================== */

onAuthStateChanged(
  auth,
  async user=>{

    currentUser =
      user;


    if(!user){

      showMessage(
        "ログインが必要です。",
        true
      );


      saveButton.disabled =
        true;


      return;

    }


    const loaded =
      await loadMemberData();


    if(!loaded){

      saveButton.disabled =
        true;


      return;

    }


    renderAll();

  }
);

</script>
