<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>部活おやすみ連絡｜清教学園ハンドベル部</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f7fb;color:#20242a}
header{background:#fff;padding:20px 18px 14px;position:sticky;top:0;z-index:10;border-bottom:1px solid #e7eaf0}
h1{font-size:22px;margin:0 0 5px;text-align:center}
.club{text-align:center;color:#66717e;font-size:13px;margin-bottom:15px}
.actions{display:flex;gap:10px}
button{border:0;border-radius:12px;padding:12px 10px;font-size:15px;font-weight:700;cursor:pointer}
.actions button{flex:1;background:#1f6feb;color:#fff}
.actions button:last-child{background:#fff;color:#1f6feb;border:1px solid #1f6feb}
main{max-width:720px;margin:auto;padding:18px}
.card,.panel{background:#fff;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 2px 12px #0000000b}
.hidden{display:none!important}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d9dee7;border-radius:10px;font-size:16px;background:#fff}
textarea{min-height:85px}
.primary{width:100%;margin-top:16px;background:#1f6feb;color:#fff}
.secondary{background:#eef3fb;color:#333}
.danger{background:#fff0f0;color:#d33;border:1px solid #f0b8b8}
.msg{padding:12px;border-radius:10px;background:#fff8df;color:#69520a;font-size:14px;margin-top:12px}
.error{background:#fff0f0;color:#9b1c1c}
.userbar{background:#f5f8ff;border-radius:12px;padding:12px;margin-bottom:14px}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week div{text-align:center;font-size:12px;color:#7b8490;padding:5px 0}
.day{min-height:72px;background:#f8f9fb;border-radius:10px;padding:6px;cursor:pointer}
.day.empty{background:transparent;cursor:default}
.day.off{opacity:.45}
.daynum{font-weight:700;font-size:14px}
.count{display:inline-block;margin-top:8px;background:#e8f0ff;color:#1f6feb;border-radius:999px;padding:3px 7px;font-size:12px;font-weight:700}
.dot{display:block;margin-top:7px;font-size:11px;color:#64707d}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.monthbar button{background:#eef3fb;padding:8px 12px}
.month-title{font-size:18px;font-weight:800}
.item{border:1px solid #e3e7ed;border-radius:12px;padding:12px;margin:10px 0}
.meta{font-size:13px;color:#66717e;margin-top:4px}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#eef3fb;font-size:12px;font-weight:700}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1}
.small{font-size:12px;color:#77818e}
.linkbtn{background:none;color:#1f6feb;padding:4px 0}
</style>
</head>

<body>

<header>
<h1>部活おやすみ連絡</h1>
<div class="club">清教学園ハンドベル部</div>

<div id="loggedOut" class="actions">
<button onclick="showLogin()">ログイン</button>
<button onclick="showSetup()">初回パスワード設定</button>
</div>

<div id="loggedIn" class="hidden">
<div id="userbar" class="userbar"></div>
<div class="actions">
<button onclick="showForm()">欠席連絡</button>
<button onclick="showEdit()">連絡を修正</button>
</div>
<button class="linkbtn" onclick="logout()">ログアウト</button>
</div>
</header>

<main>

<section id="calendarView">
<div class="card">
<div class="monthbar">
<button onclick="changeMonth(-1)">‹</button>
<div class="month-title" id="monthTitle"></div>
<button onclick="changeMonth(1)">›</button>
</div>

<div class="week">
<div>月</div>
<div>火</div>
<div>水</div>
<div>木</div>
<div>金</div>
<div>土</div>
<div>日</div>
</div>

<div class="days" id="days"></div>
</div>
</section>

<section id="detailView" class="panel hidden">
<button class="secondary" onclick="backHome()">← カレンダーに戻る</button>
<div id="detail"></div>
</section>

<section id="loginView" class="panel hidden">
<button class="secondary" onclick="backHome()">← 戻る</button>

<h2>ログイン</h2>

<label>学校ID</label>
<input id="loginId" autocomplete="username">

<label>パスワード</label>
<input id="loginPassword" type="password" autocomplete="current-password">

<button class="primary" onclick="login()">ログイン</button>

<div id="loginMsg"></div>
</section>

<section id="setupView" class="panel hidden">
<button class="secondary" onclick="backHome()">← 戻る</button>

<h2>初回パスワード設定</h2>

<p class="small">
管理者に登録された学校IDを入力して、自分でパスワードを設定します。
</p>

<label>学校ID</label>
<input id="setupId">

<label>新しいパスワード（6文字以上）</label>
<input id="setupPassword" type="password">

<label>確認</label>
<input id="setupPassword2" type="password">

<button class="primary" onclick="setupPassword()">設定する</button>

<div id="setupMsg"></div>
</section>

<section id="formView" class="panel hidden">
<button class="secondary" onclick="backHome()">← 戻る</button>

<h2 id="formTitle">欠席連絡</h2>

<div id="profileBox" class="userbar"></div>

<label>連絡の種類</label>
<select id="type" onchange="updateTimeFields()">
<option>欠席</option>
<option>遅刻</option>
<option>早退</option>
<option>途中抜け</option>
</select>

<label>日付</label>
<input id="date" type="date" onchange="checkDate()">

<div id="timeFields"></div>

<label>理由（必須）</label>
<textarea id="reason"></textarea>

<div id="formNotice"></div>

<button class="primary" onclick="saveNotice()">登録する</button>
</section>

<section id="editView" class="panel hidden">
<button class="secondary" onclick="backHome()">← 戻る</button>

<h2>連絡を修正</h2>

<div id="myNotices"></div>
</section>

</main>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged,
signInWithEmailAndPassword,
createUserWithEmailAndPassword,
signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
getDatabase,
ref,
get,
set,
update,
remove,
push
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
   Firebase設定
   ========================= */

const firebaseConfig = {
apiKey:"AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",
authDomain:"seikyo-handbell-club.firebaseapp.com",
databaseURL:"https://seikyo-handbell-club-default-rtdb.firebaseio.com",
projectId:"seikyo-handbell-club",
storageBucket:"seikyo-handbell-club.firebasestorage.app",
messagingSenderId:"55435007971",
appId:"1:55435007971:web:25f5c3b9dcd4324bc3f2d6"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);


/* =========================
   共通
   ========================= */

const $=id=>document.getElementById(id);

let profile=null;
let currentUser=null;
let editingId=null;
let current=new Date();

const DOMAIN="@seikyo-handbell-club.local";

const esc=s=>String(s??"").replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c])
);

const pad=n=>String(n).padStart(2,"0");

const ymd=(y,m,d)=>
`${y}-${pad(m+1)}-${pad(d)}`;

const jp=s=>{
let[a,b,c]=s.split("-");
return `${a}年${+b}月${+c}日`;
};

const email=id=>
String(id).trim()+DOMAIN;


/* =========================
   画面切り替え
   ========================= */

function hide(){
[
"calendarView",
"detailView",
"loginView",
"setupView",
"formView",
"editView"
].forEach(x=>
$(x).classList.add("hidden")
);
}

function backHome(){
hide();
$("calendarView").classList.remove("hidden");
render();
}

function showLogin(){
hide();
$("loginView").classList.remove("hidden");
}

function showSetup(){
hide();
$("setupView").classList.remove("hidden");
}


/* =========================
   部員情報
   ========================= */

async function loadProfile(){

if(!currentUser)return;

const s=
await get(ref(db,"members/"+currentUser.uid));

profile=s.exists()?s.val():null;

if(profile){

$("userbar").innerHTML=
`<strong>${esc(profile.name)}</strong>
${esc(profile.grade)}年${esc(profile.className)}組　
ID：${esc(profile.schoolId)}`;

$("profileBox").textContent=
`${profile.name}（${profile.grade}年${profile.className}組）`;

}

}


/* =========================
   ログイン状態
   ========================= */

onAuthStateChanged(auth,async u=>{

currentUser=u;

if(u){

await loadProfile();

$("loggedOut").classList.add("hidden");
$("loggedIn").classList.remove("hidden");

render();

}else{

$("loggedOut").classList.remove("hidden");
$("loggedIn").classList.add("hidden");

profile=null;

}

});


/* =========================
   ログイン
   ========================= */

async function login(){

let id=$("loginId").value.trim();
let pw=$("loginPassword").value;

if(!id||!pw){

$("loginMsg").innerHTML=
'<div class="msg error">IDとパスワードを入力してください。</div>';

return;
}

try{

await signInWithEmailAndPassword(
auth,
email(id),
pw
);

backHome();

}catch(e){

console.error(e);

$("loginMsg").innerHTML=
`<div class="msg error">
IDまたはパスワードが正しくありません。<br>
<span class="small">${esc(e.code||"")}</span>
</div>`;

}

}


/* =========================
   初回パスワード設定
   ========================= */

async function setupPassword(){

let id=$("setupId").value.trim();
let p=$("setupPassword").value;
let p2=$("setupPassword2").value;

if(!id||p.length<6||p!==p2){

$("setupMsg").innerHTML=
'<div class="msg error">入力内容を確認してください。</div>';

return;
}

try{

let exists=
await get(ref(db,"memberIds/"+id));

if(!exists.exists())
throw Error("not-registered");

let reg=
await get(ref(db,"memberRegistrations/"+id));

if(!reg.exists())
throw Error("no-data");

let data=reg.val();

let cred=
await createUserWithEmailAndPassword(
auth,
email(id),
p
);

await set(
ref(db,"members/"+cred.user.uid),
{
schoolId:id,
name:data.name,
grade:data.grade,
className:data.className
}
);

await update(
ref(db,"memberIds/"+id),
{
accountCreated:true,
uid:cred.user.uid
}
);

backHome();

}catch(e){

console.error(e);

$("setupMsg").innerHTML=
'<div class="msg error">そのIDが登録されていないか、すでに初回設定済みです。</div>';

}

}


/* =========================
   ログアウト
   ========================= */

function logout(){
signOut(auth);
}


/* =========================
   カレンダー
   ========================= */

async function render(){

let y=current.getFullYear();
let m=current.getMonth();

$("monthTitle").textContent=
`${y}年${m+1}月`;

let ss=
await get(ref(db,"schedules"));

let ns=
await get(ref(db,"notices"));

let sch=
ss.exists()?ss.val():{};

let all=
ns.exists()?ns.val():{};

let first=
(new Date(y,m,1).getDay()+6)%7;

let last=
new Date(y,m+1,0).getDate();

let h="";

for(let i=0;i<first;i++){

h+='<div class="day empty"></div>';

}

for(let d=1;d<=last;d++){

let date=ymd(y,m,d);

let has=!!sch[date];

let count=
Object.values(all)
.filter(n=>n.date===date)
.length;

h+=`
<div class="day ${has?"":"off"}"
onclick="openDay('${date}')">

<div class="daynum">${d}</div>

${count?
`<span class="count">${count}件</span>`
:""}

<span class="dot">
${has?
esc(sch[date].time||"部活あり"):
"部活なし"}
</span>

</div>
`;

}

$("days").innerHTML=h;

}


function changeMonth(n){

current=
new Date(
current.getFullYear(),
current.getMonth()+n,
1
);

render();

}


/* =========================
   日付詳細
   ========================= */

async function openDay(date){

hide();

$("detailView").classList.remove("hidden");

let ss=
await get(ref(db,"schedules/"+date));

let ns=
await get(ref(db,"notices"));

let sch=
ss.exists()?ss.val():null;

let all=
ns.exists()?ns.val():{};

let list=
Object.values(all)
.filter(n=>n.date===date);

let h=
`<h2>${jp(date)}</h2>`;

if(!sch){

$("detail").innerHTML=
h+
'<div class="msg error">この日は部活動がありません。</div>';

return;

}

h+=`
<div class="userbar">
<strong>部活動あり</strong>
${esc(sch.time||"")}<br>
${esc(sch.place||"")}
</div>

<h3>連絡 ${list.length}件</h3>
`;

h+=
list.length?

list.map(n=>`

<div class="item">

<strong>
${esc(n.name)}
<span class="badge">${esc(n.type)}</span>
</strong>

${n.time?
`<div class="meta">${esc(n.time)}</div>`
:""}

<div class="meta">
理由：${esc(n.reason)}
</div>

</div>

`).join("")

:

"<p class='small'>現在、連絡はありません。</p>";

$("detail").innerHTML=h;

}


/* =========================
   連絡フォーム
   ========================= */

function showForm(id=null){

if(!currentUser||!profile)
return showLogin();

editingId=id;

hide();

$("formView").classList.remove("hidden");

$("formTitle").textContent=
id?"連絡を修正":"欠席連絡";

$("type").value="欠席";
$("date").value="";
$("reason").value="";

updateTimeFields();

}


function updateTimeFields(v=""){

let t=$("type").value;

let l="";
let p="";

if(t==="遅刻"){

l="到着予定時刻";
p="例：17:30";

}

if(t==="早退"){

l="帰る予定時刻";
p="例：17:30";

}

if(t==="途中抜け"){

l="抜ける時間〜戻る時間";
p="例：18:00〜19:00";

}

$("timeFields").innerHTML=
l?
`
<label>${l}</label>
<input id="time"
value="${esc(v)}"
placeholder="${p}">
`
:"";

}


/* =========================
   日付確認
   ========================= */

async function checkDate(){

let d=$("date").value;

if(!d){

$("formNotice").innerHTML="";

return;
}

let s=
await get(ref(db,"schedules/"+d));

$("formNotice").innerHTML=

s.exists()?

`<div class="msg">
部活：${esc(s.val().time||"")} /
${esc(s.val().place||"")}
</div>`

:

'<div class="msg error">この日は部活動がないため、連絡できません。</div>';

}


/* =========================
   連絡登録
   ========================= */

async function saveNotice(){

let d=$("date").value;
let r=$("reason").value.trim();
let t=$("type").value;
let time=$("time")?.value.trim()||"";

if(!d||!r){

alert("日付と理由は必須です。");

return;
}

if(!(await get(ref(db,"schedules/"+d))).exists()){

alert("その日は部活動がありません。");

return;
}

if(editingId){

await update(
ref(db,"notices/"+editingId),
{
type:t,
date:d,
time,
reason:r,
updatedAt:Date.now()
}
);

}else{

await set(
push(ref(db,"notices")),
{
uid:currentUser.uid,
schoolId:profile.schoolId,
name:profile.name,
type:t,
date:d,
time,
reason:r,
createdAt:Date.now(),
updatedAt:Date.now()
}
);

}

alert("登録しました。");

backHome();

}


/* =========================
   自分の連絡
   ========================= */

async function showEdit(){

if(!currentUser)
return showLogin();

hide();

$("editView").classList.remove("hidden");

let s=
await get(ref(db,"notices"));

let all=
s.exists()?s.val():{};

let list=
Object.entries(all)
.filter(([id,n])=>n.uid===currentUser.uid);

$("myNotices").innerHTML=

list.length?

list.map(([id,n])=>`

<div class="item">

<strong>
${jp(n.date)}　
${esc(n.type)}
</strong>

${n.time?
`<div class="meta">${esc(n.time)}</div>`
:""}

<div class="meta">
理由：${esc(n.reason)}
</div>

<div class="row">

<button onclick="editNotice('${id}')">
修正
</button>

<button
class="danger"
onclick="deleteNotice('${id}')">
削除
</button>

</div>

</div>

`).join("")

:

"<p class='small'>登録された連絡がありません。</p>";

}


/* =========================
   連絡修正
   ========================= */

async function editNotice(id){

let s=
await get(ref(db,"notices/"+id));

if(
!s.exists()||
s.val().uid!==currentUser.uid
)return;

let n=s.val();

editingId=id;

hide();

$("formView").classList.remove("hidden");

$("formTitle").textContent="連絡を修正";

$("type").value=n.type;
$("date").value=n.date;
$("reason").value=n.reason;

updateTimeFields(n.time||"");

checkDate();

}


/* =========================
   連絡削除
   ========================= */

async function deleteNotice(id){

if(!confirm("この連絡を削除しますか？"))
return;

let s=
await get(ref(db,"notices/"+id));

if(
s.exists()&&
s.val().uid===currentUser.uid
){

await remove(
ref(db,"notices/"+id)
);

}

showEdit();

}


/* =========================
   HTMLから呼び出す関数
   ========================= */

window.showLogin=showLogin;
window.showSetup=showSetup;
window.login=login;
window.setupPassword=setupPassword;
window.logout=logout;
window.changeMonth=changeMonth;
window.openDay=openDay;
window.showForm=showForm;
window.showEdit=showEdit;
window.updateTimeFields=updateTimeFields;
window.checkDate=checkDate;
window.saveNotice=saveNotice;
window.editNotice=editNotice;
window.deleteNotice=deleteNotice;
window.backHome=backHome;


/* =========================
   初期表示
   ========================= */

render();

</script>

</body>
</html>
