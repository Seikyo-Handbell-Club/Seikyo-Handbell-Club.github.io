<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理者設定｜清教学園ハンドベル部</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fb;
  color:#20242a;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}

header{
  background:#fff;
  padding:20px;
  border-bottom:1px solid #e5e8ed;
}

h1{
  margin:0;
  text-align:center;
  font-size:21px;
}

main{
  max-width:800px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0000000b;
}

.hidden{
  display:none!important;
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:12px 0 5px;
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #d9dee7;
  border-radius:10px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#1f6feb;
  color:#fff;
  width:100%;
  margin-top:14px;
}

.secondary{
  background:#eef3fb;
}

.danger{
  background:#fff0f0;
  color:#b22;
  border:1px solid #efbbbb;
}

.msg{
  padding:12px;
  border-radius:10px;
  background:#fff8df;
  color:#69520a;
  margin-top:10px;
  font-size:14px;
}

.error{
  background:#fff0f0;
  color:#9b1c1c;
}

.item{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.row button{
  flex:1;
}

.small{
  font-size:12px;
  color:#6f7882;
}

.note{
  background:#f5f8ff;
  border-radius:10px;
  padding:11px;
  font-size:13px;
  line-height:1.6;
}

.preview{
  max-width:100%;
  max-height:360px;
  display:block;
  margin:12px auto;
  border-radius:10px;
  border:1px solid #e3e7ed;
}

.progress{
  height:8px;
  background:#e8edf5;
  border-radius:99px;
  overflow:hidden;
  margin-top:10px;
}

.progress>div{
  height:100%;
  width:0;
  background:#1f6feb;
  transition:width .2s;
}

.ocrline{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:10px;
}

.ocrline button{
  white-space:nowrap;
}

.schedule-grid{
  display:grid;
  grid-template-columns:34px 115px 1fr 1fr;
  gap:7px;
  align-items:center;
}

.schedule-grid input{
  min-width:0;
  padding:9px;
}

.schedule-grid .head{
  font-size:12px;
  font-weight:700;
  color:#68717c;
}

.check{
  width:20px;
  height:20px;
}
</style>
</head>

<body>

<header>
<h1>清教学園ハンドベル部 管理者設定</h1>
</header>

<main>

<!-- ログイン -->
<section id="login" class="card">

<h2>管理者ログイン</h2>

<label>パスワード</label>

<input
  id="password"
  type="password"
  autocomplete="current-password"
>

<button
  class="primary"
  onclick="adminLogin()"
>
ログイン
</button>

<div id="loginMsg"></div>

</section>


<!-- 管理画面 -->
<section id="app" class="hidden">

<div class="card">
<button
  class="secondary"
  onclick="logout()"
>
ログアウト
</button>
</div>


<!-- 部員登録 -->
<div class="card">

<h2>部員登録</h2>

<label>学校ID</label>
<input id="mid">

<label>名前</label>
<input id="mname">

<label>学年</label>

<select id="mgrade">

<option value="中学1年">中学1年</option>
<option value="中学2年">中学2年</option>
<option value="中学3年">中学3年</option>
<option value="高校1年">高校1年</option>
<option value="高校2年">高校2年</option>

</select>

<label>クラス</label>
<input id="mclass">

<button
  class="primary"
  onclick="addMember()"
>
登録する
</button>

<div id="memberMsg"></div>

</div>


<!-- 部員一覧 -->
<div class="card">

<h2>部員一覧</h2>

<div id="members"></div>

</div>


<!-- 予定表 -->
<div class="card">

<h2>清教学園ハンドベル部予定表</h2>

<div class="note">

予定表の画像をアップロードすると、
画像内の文字を読み取って予定を作成します。

<br>

<strong>
登録前に内容を確認・修正できます。
</strong>

</div>


<label>予定表の画像</label>

<input
  id="scheduleImage"
  type="file"
  accept="image/*"
>

<img
  id="schedulePreview"
  class="preview hidden"
  alt="予定表プレビュー"
>


<div class="ocrline">

<button
  class="secondary"
  onclick="readScheduleImage()"
>
画像を読み取る
</button>

<span

  class="small"
></span>

</div>


<div class="progress">

<div id="ocrProgress"></div>

</div>


<label>読み取った文字</label>

<textarea
  id="ocrText"
  placeholder="画像を読み取ると、ここに文字が入ります。"
></textarea>


<!-- 読み取り結果 -->
<div id="detectedBox" class="hidden">

<div class="small">
チェックを入れた行だけ登録されます。

</div>

<div id="detectedSchedules"></div>

<button
  class="primary"
  onclick="registerDetectedSchedules()"

チェックした予定を登録
</button>

<div id="imageScheduleMsg"></div>

</div>

  style="
    border:0;
    border-top:1px solid #e5e8ed;
    margin:20px 0;
  "
>


<h3>手入力</h3>

<label>日付</label>
<input id="sdate" type="date">

<label>時間</label>
<input
  id="stime"
  placeholder="例：17:00〜19:00"
>

<label>場所</label>
<input id="splace">

<button
  class="primary"
  onclick="saveSchedule()"
>
予定を保存
</button>

<div id="scheduleMsg"></div>

<div id="schedules"></div>

</div>

</section>

</main>


<!-- OCRライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  update,
  remove
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
   Firebase設定
========================= */

const ADMIN_EMAIL="kazuma.cosmos@gmail.com";

const firebaseConfig={

  apiKey:
  "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",

  authDomain:
  "seikyo-handbell-club.firebaseapp.com",

  databaseURL:
  "https://seikyo-handbell-club-default-rtdb.firebaseio.com",

  projectId:
  "seikyo-handbell-club",

  storageBucket:
  "seikyo-handbell-club.firebasestorage.app",

  messagingSenderId:
  "55435007971",

  appId:
  "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"
};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);


const $=id =>
document.getElementById(id);


const esc=s =>
String(s??"").replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);


function message(id,text,error=false){

  $(id).className=
    text
      ? (error ? "msg error" : "msg")
      : "";

  $(id).textContent=text;

}


/* =========================
   管理者確認
========================= */

async function isAdmin(){

  if(!auth.currentUser)
    return false;

  const s=
    await get(
      ref(
        db,
        "admins/"+auth.currentUser.uid
      )
    );

  return(
    s.exists() &&
    s.val()===true
  );

}


/* =========================
   ログイン状態
========================= */

onAuthStateChanged(
  auth,
  async user=>{

    if(
      user &&
      await isAdmin()
    ){

      $("login")
        .classList
        .add("hidden");

      $("app")
        .classList
        .remove("hidden");

      loadMembers();

      loadSchedules();

    }else{

      $("login")
        .classList
        .remove("hidden");

      $("app")
        .classList
        .add("hidden");

    }

  }
);


/* =========================
   ログイン
========================= */

async function adminLogin(){

  try{

    await signInWithEmailAndPassword(
      auth,
      ADMIN_EMAIL,
      $("password").value
    );

    if(
      !(await isAdmin())
    ){

      await signOut(auth);

      message(
        "loginMsg",
        "このアカウントは管理者として登録されていません。",
        true
      );

    }

  }catch(e){

    message(
      "loginMsg",
      "ログインできませんでした。コード："+e.code,
      true
    );

  }

}


function logout(){

  signOut(auth);

}


/* =========================
   部員登録
========================= */

async function addMember(){

  if(!(await isAdmin()))
    return;

  const id=
    $("mid").value.trim();

  const name=
    $("mname").value.trim();

  const grade=
    $("mgrade").value;

  const cl=
    $("mclass").value.trim();


  if(
    !id ||
    !name ||
    !cl
  ){

    return message(
      "memberMsg",
      "すべて入力してください。",
      true
    );

  }


  if(
    (
      await get(
        ref(
          db,
          "memberRegistrations/"+id
        )
      )
    ).exists()
  ){

    return message(
      "memberMsg",
      "そのIDはすでに登録されています。",
      true
    );

  }


  await set(
    ref(
      db,
      "memberRegistrations/"+id
    ),
    {
      schoolId:id,
      name:name,
      grade:grade,
      className:cl,
      createdAt:Date.now()
    }
  );


  await set(
    ref(
      db,
      "memberIds/"+id
    ),
    {
      accountCreated:false
    }
  );


  $("mid").value="";
  $("mname").value="";
  $("mclass").value="";


  message(
    "memberMsg",
    "登録しました。"
  );


  loadMembers();

}


/* =========================
   部員一覧
========================= */

async function loadMembers(){

  const s=
    await get(
      ref(
        db,
        "memberRegistrations"
      )
    );

  const v=
    s.exists()
      ? s.val()
      : {};

  const a=
    Object.entries(v);


  $("members").innerHTML=

    a.length

      ?

      a.map(
        ([id,x])=>

        `
        <div class="item">

          <strong>
            ${esc(id)}
            　
            ${esc(x.name)}
          </strong>

          <div>
            ${esc(x.grade)}
            ${esc(x.className)}組
          </div>

          <div class="row">

            <button
              onclick="editMember('${id}')"
            >
              変更
            </button>

            <button
              class="danger"
              onclick="deleteMember('${id}')"
            >
              削除
            </button>

          </div>

        </div>
        `
      ).join("")

      :

      "<p class='small'>まだ登録されていません。</p>";

}


/* =========================
   部員変更
========================= */

async function editMember(id){

  const s=
    await get(
      ref(
        db,
        "memberRegistrations/"+id
      )
    );

  if(!s.exists())
    return;


  const x=s.val();


  const name=
    prompt(
      "名前",
      x.name
    );


  const grade=
    prompt(
      "学年\n\n中学1年\n中学2年\n中学3年\n高校1年\n高校2年",
      x.grade
    );


  const cl=
    prompt(
      "クラス",
      x.className
    );


  if(
    name===null ||
    grade===null ||
    cl===null
  )
    return;


  await update(
    ref(
      db,
      "memberRegistrations/"+id
    ),
    {
      name:name,
      grade:grade,
      className:cl
    }
  );


  loadMembers();

}


/* =========================
   部員削除
========================= */

async function deleteMember(id){

  if(
    !confirm(
      "この部員登録を削除しますか？"
    )
  )
    return;


  await remove(
    ref(
      db,
      "memberRegistrations/"+id
    )
  );


  await remove(
    ref(
      db,
      "memberIds/"+id
    )
  );


  loadMembers();

}


/* =========================
   画像選択
========================= */

$("scheduleImage")
.addEventListener(
  "change",
  event=>{

    const file=
      event.target.files?.[0];

    if(!file)
      return;


    const url=
      URL.createObjectURL(file);


    $("schedulePreview").src=url;

    $("schedulePreview")
      .classList
      .remove("hidden");

  }
);


/* =========================
   OCR
========================= */

async function readScheduleImage(){

  const file=
    $("scheduleImage")
      .files?.[0];


  if(!file){

    return message(
      "imageScheduleMsg",
      "先に予定表の画像を選択してください。",
      true
    );

  }


  if(!window.Tesseract){

    return message(
      "imageScheduleMsg",
      "画像読み取り機能を読み込めませんでした。ページを再読み込みしてください。",
      true
    );

  }


  $("ocrProgress")
    .style
    .width="0%";

  $("ocrStatus")
    .textContent="読み取り中…";


  try{

    const result=
      await Tesseract.recognize(
        file,
        "jpn+eng",
        {

          logger:data=>{

            if(
              data.status===
              "recognizing text"
            ){

              const p=
                Math.round(
                  (data.progress||0)*100
                );


              $("ocrProgress")
                .style
                .width=p+"%";


              $("ocrStatus")
                .textContent=
                "読み取り中… "+p+"%";

            }

          }

        }
      );


    const text=
      result.data.text || "";


    $("ocrText").value=text;


    $("ocrProgress")
      .style
      .width="100%";


    $("ocrStatus")
      .textContent="読み取り完了";


    buildDetectedSchedules(text);


  }catch(e){

    $("ocrStatus")
      .textContent="";


    message(
      "imageScheduleMsg",
      "画像の読み取りに失敗しました。別の画像で試してください。",
      true
    );

  }

}


/* =========================
   OCR文字の整理
========================= */

function normalizeDigits(text){

  return text

    .replace(
      /[０-９]/g,
      c =>
      String.fromCharCode(
        c.charCodeAt(0)-0xfee0
      )
    )

    .replace(/[：]/g,":")
    .replace(/[／]/g,"/");

}


/* =========================
   OCR → 予定候補
========================= */

function buildDetectedSchedules(text){

  const lines=
    normalizeDigits(text)
      .split(/\r?\n/)
      .map(x=>x.trim())
      .filter(Boolean);


  const entries=[];

  const now=
    new Date();

  const currentYear=
    now.getFullYear();

  let currentMonth=null;


  for(
    const line of lines
  ){

    const monthMatch=
      line.match(
        /(?:^|[^\d])(\d{1,2})\s*(?:月|\/)/
      );


    if(
      monthMatch &&
      !line.match(
        /\d{1,2}\s*[:：]\s*\d{2}/
      )
    ){

      currentMonth=
        Number(
          monthMatch[1]
        );

    }


    const dates=[];


    let match;


    /* 〇月〇日 */

    const re1=
      /(\d{1,2})\s*月\s*(\d{1,2})\s*日/g;


    while(
      (match=re1.exec(line))
    ){

      dates.push([
        Number(match[1]),
        Number(match[2])
      ]);

    }


    /* 〇/〇 */

    const re2=
      /(\d{1,2})\s*\/\s*(\d{1,2})/g;


    while(
      (match=re2.exec(line))
    ){

      dates.push([
        Number(match[1]),
        Number(match[2])
      ]);

    }


    /* 〇日＋曜日 */

    if(
      !dates.length &&
      currentMonth
    ){

      const dayOnly=
        line.match(
          /(?:^|[^\d])(\d{1,2})(?:日)?\s*(?:\([月火水木金土日]\)|[月火水木金土日])/
        );


      if(dayOnly){

        dates.push([
          currentMonth,
          Number(dayOnly[1])
        ]);

      }

    }


    if(!dates.length)
      continue;


    /* 時間 */

    const timeRange=
      line.match(
        /(\d{1,2})\s*[:時]\s*(\d{2})?\s*(?:〜|-|~|～)\s*(\d{1,2})\s*[:時]\s*(\d{2})?/
      );


    const singleTime=
      line.match(
        /(\d{1,2})\s*[:時]\s*(\d{2})?/
      );


    let time="";


    if(timeRange){

      time=
        `${timeRange[1].padStart(2,"0")}:${(timeRange[2]||"00").padStart(2,"0")}〜${timeRange[3].padStart(2,"0")}:${(timeRange[4]||"00").padStart(2,"0")}`;

    }else if(singleTime){

      time=
        `${singleTime[1].padStart(2,"0")}:${(singleTime[2]||"00").padStart(2,"0")}`;

    }


    for(
      const [month,day]
      of dates
    ){

      if(
        month<1 ||
        month>12 ||
        day<1 ||
        day>31
      )
        continue;


      const date=
        `${currentYear}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;


      entries.push({

        date:date,

        time:time,

        place:""

      });

    }

  }


  /* 日付重複を削除 */

  const unique=[];

  const seen=
    new Set();


  for(
    const entry of entries
  ){

    if(
      seen.has(entry.date)
    )
      continue;


    seen.add(entry.date);

    unique.push(entry);

  }


  renderDetected(unique);

}


/* =========================
   読み取り結果表示
========================= */

function renderDetected(entries){

  $("detectedBox")
    .classList
    .remove("hidden");


  if(!entries.length){

    $("detectedSchedules").innerHTML=
      `
      <p class="small">
      日付を自動検出できませんでした。
      上の「読み取った文字」を確認して、
      下の手入力を使ってください。
      </p>
      `;

    return;

  }


  $("detectedSchedules").innerHTML=

    `
    <div class="schedule-grid">

      <div class="head">
        登録
      </div>

      <div class="head">
        日付
      </div>

      <div class="head">
        時間
      </div>

      <div class="head">
        場所
      </div>

      ${
        entries.map(
          (entry,index)=>

          `
          <input
            class="check"
            type="checkbox"
            id="use_${index}"
            checked
          >

          <input
            id="date_${index}"
            type="date"
            value="${entry.date}"
          >

          <input
            id="time_${index}"
            value="${esc(entry.time)}"
            placeholder="例 17:00〜19:00"
          >

          <input
            id="place_${index}"
            value=""
            placeholder="場所"
          >
          `
        ).join("")
      }

    </div>
    `;


  $("detectedSchedules")
    .dataset
    .count=entries.length;

}


/* =========================
   OCR結果をFirebase登録
========================= */

async function registerDetectedSchedules(){

  if(!(await isAdmin()))
    return;


  const count=
    Number(
      $("detectedSchedules")
        .dataset
        .count || 0
    );


  if(!count)
    return;


  let registered=0;


  for(
    let i=0;
    i<count;
    i++
  ){

    if(
      !$("use_"+i).checked
    )
      continue;


    const date=
      $("date_"+i).value;

    const time=
      $("time_"+i)
        .value
        .trim();

    const place=
      $("place_"+i)
        .value
        .trim();


    if(!date)
      continue;


    await set(
      ref(
        db,
        "schedules/"+date
      ),
      {
        time:time,
        place:place,
        updatedAt:Date.now()
      }
    );


    registered++;

  }


  message(
    "imageScheduleMsg",
    registered+"件の予定を登録しました。"
  );


  loadSchedules();

}


/* =========================
   手入力登録
========================= */

async function saveSchedule(){

  if(!(await isAdmin()))
    return;


  const date=
    $("sdate").value;

  const time=
    $("stime")
      .value
      .trim();

  const place=
    $("splace")
      .value
      .trim();


  if(!date){

    return message(
      "scheduleMsg",
      "日付を入力してください。",
      true
    );

  }


  await set(
    ref(
      db,
      "schedules/"+date
    ),
    {
      time:time,
      place:place,
      updatedAt:Date.now()
    }
  );


  message(
    "scheduleMsg",
    "保存しました。"
  );


  loadSchedules();

}


/* =========================
   予定一覧
========================= */

async function loadSchedules(){

  const s=
    await get(
      ref(
        db,
        "schedules"
      )
    );


  const v=
    s.exists()
      ? s.val()
      : {};


  const a=
    Object.entries(v)
      .sort();


  $("schedules").innerHTML=

    a.length

      ?

      a.map(
        ([date,x])=>

        `
        <div class="item">

          <strong>
            ${esc(date)}
          </strong>

          <br>

          ${esc(x.time||"")}

          <br>

          ${esc(x.place||"")}

          <div class="row">

            <button
              onclick="editSchedule('${date}')"
            >
              変更
            </button>

            <button
              class="danger"
              onclick="deleteSchedule('${date}')"
            >
              削除
            </button>

          </div>

        </div>
        `
      ).join("")

      :

      "<p class='small'>予定はありません。</p>";

}


/* =========================
   予定変更
========================= */

async function editSchedule(date){

  const s=
    await get(
      ref(
        db,
        "schedules/"+date
      )
    );


  if(!s.exists())
    return;


  const x=
    s.val();


  $("sdate").value=date;

  $("stime").value=
    x.time || "";

  $("splace").value=
    x.place || "";

}


/* =========================
   予定削除
========================= */

async function deleteSchedule(date){

  if(
    !confirm(
      date+"の予定を削除しますか？"
    )
  )
    return;


  await remove(
    ref(
      db,
      "schedules/"+date
    )
  );


  loadSchedules();

}
