<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>部活動欠席連絡｜清教学園ハンドベル部</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  background:#f5f7fb;
  color:#20242a
}

header{
  background:#fff;
  padding:14px 18px 12px;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #e7eaf0
}

/* =========================
   ヘッダー
========================= */

.header-top{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:flex-start;
  width:100%;
  min-height:0;
  gap:0
}

.header-brand{
  width:100%;
  text-align:center;
  cursor:pointer
}

.header-title{
  margin:0;
  width:100%;
  font-size:22px;
  font-weight:800;
  line-height:1.3;
  text-align:center;
  cursor:pointer;
  overflow-wrap:anywhere
}

.club{
  width:100%;
  text-align:center;
  color:#66717e;
  font-size:13px;
  line-height:1.4;
  margin:2px 0 11px
}

.header-user-row{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-width:0;
  margin-bottom:8px
}

.header-action-row{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-width:0
}

.header-side{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0
}

.profile-mini{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-width:0;
  max-width:100%
}

.profile-mini-text{
  min-width:0;
  max-width:calc(100vw - 90px);
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
  padding:8px 5px;
  border-radius:8px
}

.profile-mini-text:hover{
  background:#f1f5fb
}

.icon-button{
  width:40px;
  height:40px;
  padding:0;
  flex:none;
  border-radius:50%;
  background:#eef3fb;
  color:#333;
  font-size:22px;
  display:flex;
  align-items:center;
  justify-content:center
}

.header-actions{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  width:100%;
  max-width:520px;
  flex-wrap:wrap
}

.header-actions button{
  padding:7px 9px;
  font-size:12px;
  border-radius:9px;
  white-space:nowrap;
  flex:0 1 auto
}

.header-actions .logout{
  background:#fff;
  color:#555;
  border:1px solid #d9dee7
}

.header-login{
  width:100%;
  display:flex;
  justify-content:center
}

.header-login button{
  width:100%;
  max-width:180px
}

button{
  border:0;
  border-radius:12px;
  padding:12px 10px;
  font-size:15px;
  font-weight:700;
  cursor:pointer
}

main{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:18px
}

.card,
.panel{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0000000b
}

.hidden{
  display:none!important
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:14px 0 6px
}

input,
select,
textarea{
  width:100%;
  max-width:100%;
  min-width:0;
  padding:12px;
  border:1px solid #d9dee7;
  border-radius:10px;
  font-size:16px;
  background:#fff
}

textarea{
  min-height:85px;
  resize:vertical
}

.primary{
  width:100%;
  margin-top:16px;
  background:#1f6feb;
  color:#fff
}

.secondary{
  background:#eef3fb;
  color:#333
}

.danger{
  background:#fff0f0;
  color:#d33;
  border:1px solid #f0b8b8
}

.msg{
  padding:12px;
  border-radius:10px;
  background:#fff8df;
  color:#69520a;
  font-size:14px;
  margin-top:12px
}

.error{
  background:#fff0f0;
  color:#9b1c1c
}

.userbar{
  background:#f5f8ff;
  border-radius:12px;
  padding:12px;
  margin-bottom:14px
}

/* =========================
   カレンダー共通
========================= */

.week,
.days{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px
}

.week div{
  text-align:center;
  font-size:12px;
  color:#7b8490;
  padding:5px 0
}

.day{
  min-height:72px;
  background:#f8f9fb;
  border-radius:10px;
  padding:6px;
  cursor:pointer;
  overflow:hidden;
  border:2px solid transparent;
  transition:.15s
}

.day:hover{
  border-color:#dbe5f7
}

.day.empty{
  background:transparent;
  cursor:default;
  border-color:transparent
}

.day.off{
  opacity:.45
}

.day.club-day{
  background:#fff0f0;
  opacity:1
}

.day.selected-day{
  border-color:#1f6feb;
  background:#eaf2ff
}

.day.club-day.selected-day{
  background:#eaf2ff
}

.daynum{
  font-weight:700;
  font-size:14px
}

.count{
  display:inline-block;
  margin-top:8px;
  background:#e8f0ff;
  color:#1f6feb;
  border-radius:999px;
  padding:3px 7px;
  font-size:12px;
  font-weight:700
}

/* ホームカレンダーでは時間を表示しない */

.dot{
  display:block;
  margin-top:7px;
  font-size:11px;
  color:#64707d;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.monthbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  gap:8px
}

.monthbar button{
  background:#eef3fb;
  padding:8px 12px;
  flex:none
}

.month-center{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-width:0;
  flex:1
}

.month-title{
  font-size:18px;
  font-weight:800;
  white-space:nowrap
}

.today-button{
  background:#eef3fb!important;
  padding:7px 9px!important;
  font-size:12px!important;
  white-space:nowrap
}

/* =========================
   フォーム内カレンダー
========================= */

.form-calendar{
  margin-top:8px;
  padding:12px;
  background:#f8f9fb;
  border-radius:14px
}

.form-calendar .day{
  min-height:60px;
  padding:5px
}

.form-calendar .daynum{
  font-size:13px
}

.form-calendar .dot{
  font-size:10px
}

.selected-date-box{
  margin-top:10px;
  padding:11px 12px;
  background:#eef3fb;
  border-radius:10px;
  font-weight:700;
  font-size:14px
}

.item{
  border:1px solid #e3e7ed;
  border-radius:12px;
  padding:12px;
  margin:10px 0
}

.meta{
  font-size:13px;
  color:#66717e;
  margin-top:4px
}

.badge{
  display:inline-block;
  border-radius:999px;
  padding:4px 8px;
  background:#eef3fb;
  font-size:12px;
  font-weight:700
}

.row{
  display:flex;
  gap:8px;
  margin-top:10px
}

.row button{
  flex:1
}

.small{
  font-size:12px;
  color:#77818e
}

.page-back{
  margin-bottom:10px
}

.reason-note{
  font-size:12px;
  color:#77818e;
  margin-top:6px
}

/* =========================
   スマホ
========================= */

@media(max-width:480px){

  header{
    padding:12px 10px 10px
  }

  .header-title{
    font-size:21px;
    line-height:1.3
  }

  .club{
    font-size:12px;
    margin:2px 0 10px
  }

  .header-user-row{
    margin-bottom:8px
  }

  .profile-mini{
    width:100%;
    max-width:100%
  }

  .profile-mini-text{
    font-size:13px;
    max-width:calc(100vw - 70px)
  }

  .icon-button{
    width:38px;
    height:38px;
    font-size:21px
  }

  .header-actions{
    width:100%;
    gap:5px
  }

  .header-actions button{
    flex:1 1 auto;
    min-width:0;
    padding:8px 5px;
    font-size:12px
  }

  .header-login button{
    max-width:180px
  }

  main{
    padding:12px
  }

  .card,
  .panel{
    padding:13px;
    border-radius:15px
  }

  .form-calendar{
    padding:8px
  }

  .form-calendar .days{
    gap:3px
  }

  .form-calendar .day{
    min-height:55px;
    padding:4px
  }

  .form-calendar .daynum{
    font-size:12px
  }

  .form-calendar .dot{
    font-size:9px
  }

  .month-title{
    font-size:16px
  }

  .today-button{
    font-size:11px!important;
    padding:7px 7px!important
  }

}


/* =========================
   スマホ横向き・タブレット
========================= */

@media(min-width:481px) and (orientation:landscape){

  header{
    padding:10px 16px
  }

  .header-top{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
    grid-template-areas:
      "brand brand brand"
      "user actions login";
    align-items:center;
    column-gap:12px
  }

  .header-brand{
    grid-area:brand;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    margin-bottom:8px
  }

  .header-title{
    width:auto;
    font-size:20px;
    white-space:nowrap
  }

  .club{
    width:auto;
    margin:0;
    font-size:12px;
    white-space:nowrap
  }

  .header-user-row{
    grid-area:user;
    justify-content:flex-start;
    margin:0
  }

  .header-action-row{
    grid-area:actions;
    justify-content:center;
    margin:0
  }

  .header-actions{
    width:auto;
    max-width:none;
    flex-wrap:nowrap
  }

  .header-actions button{
    padding:6px 8px;
    font-size:11px
  }

  .header-login{
    grid-area:login;
    justify-content:flex-end
  }

  .header-login button{
    width:auto;
    min-width:100px
  }

  .profile-mini{
    justify-content:flex-start
  }

  .profile-mini-text{
    max-width:300px
  }

}


/* =========================
   かなり狭いスマホ
========================= */

@media(max-width:350px){

  .header-title{
    font-size:19px
  }

  .club{
    font-size:11px
  }

  .header-actions{
    gap:4px
  }

  .header-actions button{
    font-size:11px;
    padding:8px 3px
  }

  .day{
    min-height:65px;
    padding:5px
  }

  .daynum{
    font-size:13px
  }

  .count{
    font-size:10px;
    padding:3px 5px
  }

  .month-title{
    font-size:15px
  }

  .today-button{
    font-size:10px!important;
    padding:6px 6px!important
  }

}
</style>
</head>

<body>

<header>

  <div class="header-top">

    <!-- タイトル＋部活名 -->

    <div
      class="header-brand"
      onclick="backHome()"
    >

      <h1 class="header-title">
        部活動欠席連絡
      </h1>

      <div class="club">
        清教学園ハンドベル部
      </div>

    </div>


    <!-- ログイン中：マイページ＋名前 -->

    <div
      id="loggedInLeft"
      class="header-user-row hidden"
    >

      <div class="profile-mini">

        <button
          class="icon-button"
          onclick="showMyPage()"
          aria-label="マイページ"
        >
          👤
        </button>

        <div
          id="profileMiniText"
          class="profile-mini-text"
          onclick="showMyPage()"
          role="button"
          tabindex="0"
        ></div>

      </div>

    </div>


    <!-- ログアウト中 -->

    <div
      id="loggedOutLeft"
      class="header-user-row hidden"
    ></div>


    <!-- ログイン中：操作ボタン -->

    <div
      id="loggedInRight"
      class="header-action-row hidden"
    >

      <div class="header-actions">

        <button onclick="showForm()">
          欠席連絡
        </button>

        <button onclick="showEdit()">
          連絡を修正
        </button>

        <button
          class="logout"
          onclick="logout()"
        >
          ログアウト
        </button>

      </div>

    </div>


    <!-- ログアウト中：ログイン -->

    <div
      id="loggedOutRight"
      class="header-action-row"
    >

      <div class="header-login">

        <button onclick="showLogin()">
          ログイン
        </button>

      </div>

    </div>

  </div>

</header>


<main>

<section id="calendarView">

  <div class="card">

    <div class="monthbar">

      <button onclick="changeMonth(-1)">
        ‹
      </button>

      <div class="month-center">

        <div
          class="month-title"
          id="monthTitle"
        ></div>

        <button
          class="today-button"
          onclick="goCurrentMonth()"
        >
          今月に戻る
        </button>

      </div>

      <button onclick="changeMonth(1)">
        ›
      </button>

    </div>

    <div class="week">

      <div>月</div>
      <div>火</div>
      <div>水</div>
      <div>木</div>
      <div>金</div>
      <div>土</div>
      <div>日</div>

    </div>

    <div
      class="days"
      id="days"
    ></div>

  </div>

</section>


<section
  id="detailView"
  class="panel hidden"
>

  <button
    class="secondary"
    onclick="backHome()"
  >
    ← カレンダーに戻る
  </button>

  <div id="detail"></div>

</section>


<section
  id="loginView"
  class="panel hidden"
>

  <button
    class="secondary"
    onclick="backHome()"
  >
    ← 戻る
  </button>

  <h2>
    ログイン
  </h2>

  <label>
    学校ID
  </label>

  <input
    id="loginId"
    autocomplete="username"
  >

  <label>
    パスワード
  </label>

  <input
    id="loginPassword"
    type="password"
    autocomplete="current-password"
  >

  <button
    class="primary"
    onclick="login()"
  >
    ログイン
  </button>

  <div id="loginMsg"></div>

  <button
    class="secondary"
    style="width:100%;margin-top:12px"
    onclick="showSetup()"
  >
    初めてログインする方はこちら
  </button>

</section>


<section
  id="setupView"
  class="panel hidden"
>

  <button
    class="secondary"
    onclick="showLogin()"
  >
    ← ログインに戻る
  </button>

  <h2>
    初回パスワード設定
  </h2>

  <p class="small">
    管理者に登録された学校IDを入力して、自分でパスワードを設定します。
  </p>

  <label>
    学校ID
  </label>

  <input
    id="setupId"
  >

  <label>
    新しいパスワード（6文字以上）
  </label>

  <input
    id="setupPassword"
    type="password"
  >

  <label>
    確認
  </label>

  <input
    id="setupPassword2"
    type="password"
  >

  <button
    class="primary"
    onclick="setupPassword()"
  >
    設定する
  </button>

  <div id="setupMsg"></div>

</section>


<section
  id="myPageView"
  class="panel hidden"
>

  <button
    class="secondary page-back"
    onclick="backHome()"
  >
    ← ホームに戻る
  </button>

  <h2>
    マイページ
  </h2>

  <p class="small">
    学年・クラス・名前・パスワードを変更できます。
  </p>

  <label>
    学年
  </label>

  <select id="myGrade">

    <option value="">
      選択してください
    </option>

    <option value="中学1年">
      中学1年
    </option>

    <option value="中学2年">
      中学2年
    </option>

    <option value="中学3年">
      中学3年
    </option>

    <option value="高校1年">
      高校1年
    </option>

    <option value="高校2年">
      高校2年
    </option>

  </select>

  <label>
    クラス
  </label>

  <select id="myClass">

    <option value="">
      選択してください
    </option>

    <option value="A">A組</option>
    <option value="B">B組</option>
    <option value="C">C組</option>
    <option value="D">D組</option>
    <option value="E">E組</option>
    <option value="F">F組</option>
    <option value="G">G組</option>
    <option value="H">H組</option>
    <option value="I">I組</option>
    <option value="J">J組</option>
    <option value="K">K組</option>

  </select>

  <label>
    名前
  </label>

  <input
    id="myName"
  >

  <button
    class="primary"
    onclick="saveProfile()"
  >
    プロフィールを保存
  </button>

  <h3 style="margin-top:24px">
    パスワード変更
  </h3>

  <label>
    新しいパスワード（6文字以上）
  </label>

  <input
    id="myPassword"
    type="password"
  >

  <label>
    確認
  </label>

  <input
    id="myPassword2"
    type="password"
  >

  <button
    class="primary"
    onclick="changePassword()"
  >
    パスワードを変更
  </button>

  <div id="myPageMsg"></div>

</section>


<section
  id="formView"
  class="panel hidden"
>

  <button
    class="secondary"
    onclick="backFromForm()"
  >
    ← 戻る
  </button>

  <h2 id="formTitle">
    欠席連絡
  </h2>

  <div
    id="profileBox"
    class="userbar"
  ></div>


  <!-- 連絡の種類 -->

  <label>
    連絡の種類（必須）
  </label>

  <select id="noticeType">

    <option value="欠席">
      欠席
    </option>

    <option value="遅刻">
      遅刻
    </option>

    <option value="早退">
      早退
    </option>

    <option value="途中抜け">
      途中抜け
    </option>

  </select>


  <!-- 欠席理由 -->

  <label>
    欠席理由（必須）
  </label>

  <select
    id="reasonType"
    onchange="toggleOtherReason()"
  >

    <option value="">
      理由を選択してください
    </option>

    <option value="体調不良・けが">
      体調不良・けが
    </option>

    <option value="通院">
      通院
    </option>

    <option value="家庭の用事・旅行">
      家庭の用事・旅行
    </option>

    <option value="他の部活動">
      他の部活動
    </option>

    <option value="塾・習い事">
      塾・習い事
    </option>

    <option value="冠婚葬祭">
      冠婚葬祭
    </option>

    <option value="追試・補講・課題">
      追試・補講・課題
    </option>

    <option value="セミナー">
      セミナー
    </option>

    <option value="委員会・コアなどの仕事">
      委員会・コアなどの仕事
    </option>

    <option value="2者懇談・3者懇談">
      2者懇談・3者懇談
    </option>

    <option value="英検など">
      英検など
    </option>

    <option value="その他">
      その他
    </option>

  </select>


  <div
    id="otherReasonBox"
    class="hidden"
  >

    <label>
      その他の理由（必須）
    </label>

    <textarea
      id="otherReason"
      placeholder="理由を入力してください"
    ></textarea>

  </div>


  <!-- 日付 -->

  <label>
    日付（必須）
  </label>

  <div class="form-calendar">

    <div class="monthbar">

      <button
        type="button"
        onclick="changeFormMonth(-1)"
      >
        ‹
      </button>

      <div class="month-center">

        <div
          class="month-title"
          id="formMonthTitle"
        ></div>

      </div>

      <button
        type="button"
        onclick="changeFormMonth(1)"
      >
        ›
      </button>

    </div>

    <div class="week">

      <div>月</div>
      <div>火</div>
      <div>水</div>
      <div>木</div>
      <div>金</div>
      <div>土</div>
      <div>日</div>

    </div>

    <div
      class="days"
      id="formDays"
    ></div>

    <div
      id="selectedDateBox"
      class="selected-date-box"
    >
      日付を選択してください
    </div>

  </div>

  <div id="formNotice"></div>

  <button
    class="primary"
    onclick="saveNotice()"
  >
    登録する
  </button>

</section>

async function setupPassword(){

  let id =
    $("setupId")
      .value
      .trim();


  let p =
    $("setupPassword")
      .value;


  let p2 =
    $("setupPassword2")
      .value;


  if(
    !id ||
    p.length < 6 ||
    p !== p2
  ){

    $("setupMsg")
      .innerHTML =
        '<div class="msg error">入力内容を確認してください。</div>';


    return;

  }


  try{

    let exists =
      await get(
        ref(
          db,
          "memberIds/" +
          id
        )
      );


    if(!exists.exists())
      throw Error(
        "not-registered"
      );


    let reg =
      await get(
        ref(
          db,
          "memberRegistrations/" +
          id
        )
      );


    if(!reg.exists())
      throw Error(
        "no-data"
      );


    let data =
      reg.val();


    let cred =
      await createUserWithEmailAndPassword(
        auth,
        email(id),
        p
      );


    await set(
      ref(
        db,
        "members/" +
        cred.user.uid
      ),
      {
        schoolId:id,
        name:data.name,
        grade:data.grade,
        className:data.className
      }
    );


    await update(
      ref(
        db,
        "memberIds/" +
        id
      ),
      {
        accountCreated:true,
        uid:cred.user.uid
      }
    );


    backHome();


  }catch(e){

    console.error(e);


    $("setupMsg")
      .innerHTML =
        '<div class="msg error">そのIDが登録されていないか、すでに初回設定済みです。</div>';

  }

}

/* =========================

async function render(){

  let y =
    current.getFullYear();


  let m =
    current.getMonth();


  $("monthTitle")
    .textContent =
      `${y}年${m+1}月`;


  let ss =
    await get(
      ref(
        db,
        "schedules"
      )
    );


  let ns =
    await get(
      ref(
        db,
        "notices"
      )
    );


  let sch =
    ss.exists()
      ? ss.val()
      : {};


  let all =
    ns.exists()
      ? ns.val()
      : {};


  let first =
    (
      new Date(
        y,
        m,
        1
      ).getDay() +
      6
    ) % 7;


  let last =
    new Date(
      y,
      m+1,
      0
    ).getDate();


  let h =
    "";


  for(
    let i=0;
    i<first;
    i++
  ){

    h +=
      '<div class="day empty"></div>';

  }


  for(
    let d=1;
    d<=last;
    d++
  ){

    let date =
      ymd(
        y,
        m,
        d
      );


    let has =
      !!sch[date];


    let count =
      Object
        .values(all)
        .filter(
          n =>
            n.date === date
        )
        .length;


    /*
      ホームカレンダーでは
      部活時間を表示しない。
    */

    h += `

      <div
        class="day ${has ? "club-day" : "off"}"
        onclick="openDay('${date}')"
      >

        <div class="daynum">
          ${d}
        </div>

        ${
          count
            ?
            `<span class="count">
              ${count}件
            </span>`
            :
            ""
        }

      </div>

    `;

  }


  $("days")
    .innerHTML =
      h;

}

async function hasNoticeOnDate(
  date
){

  const s =
    await get(
      ref(
        db,
        "notices"
      )
    );


  if(!s.exists())
    return false;


  return Object
    .entries(
      s.val()
    )
    .some(
      ([id,n]) =>
        n.uid ===
          currentUser.uid &&

        n.date ===
          date &&

        id !==
          editingId
    );

}


/* =========================
   連絡保存
========================= */

async function saveNotice(){

  let d =
    selectedDate;


  let type =
    $("noticeType")
      .value;


  let reasonType =
    $("reasonType")
      .value;


  let otherReason =
    $("otherReason")
      .value
      .trim();


  let r =
    reasonType === "その他"
      ?
      otherReason
      :
      reasonType;


  if(
    !d ||
    !type ||
    !reasonType
  ){

    alert(
      "連絡の種類・日付・欠席理由は必須です。"
    );


    return;

  }


  if(
    reasonType === "その他" &&
    !otherReason
  ){

    alert(
      "その他の理由を入力してください。"
    );


    return;

  }


  let schedule =
    await get(
      ref(
        db,
        "schedules/" +
        d
      )
    );


  if(
    !schedule.exists()
  ){

    alert(
      "その日は部活動がありません。"
    );


    return;

  }


  if(
    await hasNoticeOnDate(
      d
    )
  ){

    alert(
      "この日はすでに連絡を登録しています。\n同じ日に2件は登録できません。"
    );


    return;

  }


  const wasEditing =
    !!editingId;


  if(wasEditing){

    await update(
      ref(
        db,
        "notices/" +
        editingId
      ),
      {

        type:
          type,

        reason:
          r,

        date:
          d,

        updatedAt:
          Date.now()

      }
    );


    alert(
      "変更しました。"
    );


    editingId =
      null;


    showEdit();


    return;

  }


  await set(
    push(
      ref(
        db,
        "notices"
      )
    ),
    {

      uid:
        currentUser.uid,

      schoolId:
        profile.schoolId,

      name:
        profile.name,

      type:
        type,

      reason:
        r,

      date:
        d,

      createdAt:
        Date.now(),

      updatedAt:
        Date.now()

    }
  );


  alert(
    "登録しました。"
  );


  /*
    登録後はフォームに残り、
    次の連絡を続けて登録できる。
  */

  $("noticeType")
    .value =
      "欠席";


  $("reasonType")
    .value =
      "";


  $("otherReason")
    .value =
      "";


  $("otherReasonBox")
    .classList
    .add("hidden");


  $("formNotice")
    .innerHTML =
      "";


  selectedDate =
    "";


  formCurrent =
    new Date();


  renderFormCalendar();

}

async function showEdit(){

  hide();

    await get(

    s.exists()

      :

      String(b[1].date)
        .localeCompare(
          String(a[1].date)

                  </button>

                  <button

                    onclick="deleteNotice('${id}')"
                  >
                    削除
                  </button>

                </div>

              `
          )
          .join("")

        :

        `
        <p class="small">
          登録された連絡がありません。
        </p>
        `;

}

async function editNotice(id){

  let s =
    await get(
      ref(
        db,
        "notices/" +
        id
      )
    );


  if(
    !s.exists() ||
    s.val().uid !==
      currentUser.uid
  )
    return;


  let n =
    s.val();


  editingId =
    id;


  hide();


  $("formView")
    .classList
    .remove("hidden");


  $("formTitle")
    .textContent =
      "連絡を修正";


  $("profileBox")
    .textContent =
      getProfileBoxDisplay();


  /*
    連絡の種類
  */

  const noticeTypes = [

    "欠席",
    "遅刻",
    "早退",
    "途中抜け"

  ];


  $("noticeType")
    .value =
      noticeTypes.includes(
        n.type
      )
        ?
        n.type
        :
        "欠席";


  /*
    理由
  */

  const reasonOptions = [

    "体調不良・けが",
    "通院",
    "家庭の用事・旅行",
    "他の部活動",
    "塾・習い事",
    "冠婚葬祭",
    "追試・補講・課題",
    "セミナー",
    "委員会・コアなどの仕事",
    "2者懇談・3者懇談",
    "英検など"

  ];


  if(
    reasonOptions.includes(
      n.reason
    )
  ){

    $("reasonType")
      .value =
        n.reason;


    $("otherReason")
      .value =
        "";

  }else{

    $("reasonType")
      .value =
        "その他";


    $("otherReason")
      .value =
        n.reason || "";

  }


  toggleOtherReason();


  if(n.date){

    let [
      y,
      m
    ] =
      n.date
        .split("-")
        .map(Number);


    formCurrent =
      new Date(
        y,
        m-1,
        1
      );


    selectedDate =
      n.date;

  }else{

    formCurrent =
      new Date();


    selectedDate =
      "";

  }


  renderFormCalendar();


  checkDate();

}


/* =========================
   連絡削除
========================= */

async function deleteNotice(id){

  if(
    !confirm(
      "この連絡を削除しますか？"
    )
  )
    return;


  let s =
    await get(
      ref(
        db,
        "notices/" +
        id
      )
    );


  if(
    s.exists() &&
    s.val().uid ===
      currentUser.uid
  ){

    await remove(
      ref(
        db,
        "notices/" +
        id
      )
    );

  }


  showEdit();

}


/* =========================
   マイページ
========================= */

async function showMyPage(){

  if(
    !currentUser ||
    !profile
  ){

    showLogin();

    return;

  }


  hide();


  $("myPageView")
    .classList
    .remove("hidden");


  /*
    管理者側と同じ値をセット
  */

  $("myGrade").value =
    String(
      profile.grade ??
      ""
    );


  $("myClass").value =
    getProfileClass();


  $("myName").value =
    profile.name ??
    "";


  $("myPassword").value =
    "";


  $("myPassword2").value =
    "";


  $("myPageMsg")
    .innerHTML =
      "";

}


/* =========================
   プロフィール保存
========================= */

async function saveProfile(){

  if(
    !currentUser ||
    !profile
  )
    return;


  const grade =
    $("myGrade")
      .value;


  const className =
    $("myClass")
      .value;


  const name =
    $("myName")
      .value
      .trim();


  if(
    !grade ||
    !className ||
    !name
  ){

    $("myPageMsg")
      .innerHTML =
        '<div class="msg error">学年・クラス・名前を入力してください。</div>';


    return;

  }


  try{

    await update(
      ref(
        db,
        "members/" +
        currentUser.uid
      ),
      {

        grade,
        className,
        name

      }
    );


    profile = {

      ...profile,

      grade,
      className,
      name

    };


    await loadProfile();


    $("myPageMsg")
      .innerHTML =
        '<div class="msg">プロフィールを保存しました。</div>';


  }catch(e){

    console.error(e);


    $("myPageMsg")
      .innerHTML =
        '<div class="msg error">保存できませんでした。</div>';

  }

}


/* =========================
   パスワード変更
========================= */

async function changePassword(){

  const p =
    $("myPassword")
      .value;


  const p2 =
    $("myPassword2")
      .value;


  if(
    p.length < 6 ||
    p !== p2
  ){

    $("myPageMsg")
      .innerHTML =
        '<div class="msg error">パスワードは6文字以上で、確認と一致させてください。</div>';


    return;

  }


  try{

    await updatePassword(
      currentUser,
      p
    );


    $("myPassword").value =
      "";


    $("myPassword2").value =
      "";


    $("myPageMsg")
      .innerHTML =
        '<div class="msg">パスワードを変更しました。</div>';


  }catch(e){

    console.error(e);


    $("myPageMsg")
      .innerHTML =
        '<div class="msg error">パスワードを変更できませんでした。いったんログアウトして再ログインしてから、もう一度お試しください。</div>';

  }

}
