<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベルちゃん</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
}

.bell-area{
  position:relative;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}

.bell{
  position:absolute;
  right:8px;
  bottom:4px;
  width:175px;
  max-width:62%;
  height:auto;
  filter:drop-shadow(0 12px 10px rgba(40,55,65,.15));
  cursor:pointer;
  user-select:none;
  transition:transform .15s ease;
}

.bell:active{
  transform:scale(.96);
}

/* ===== 吹き出しの位置 ===== */
/* leftを大きく → 右へ */
/* leftを小さく → 左へ */
/* topを大きく → 下へ */
/* topを小さく → 上へ */

.bubble{
  position:absolute;
  left:20px;
  top:20px;
  transform:none;

  width:220px;
  max-width:76%;
  background:#fff;
  border:2px solid #d9e5ed;
  border-radius:18px;
  padding:12px 15px;
  box-shadow:0 10px 24px rgba(48,72,92,.12);
  font-size:14px;
  line-height:1.55;
  animation:bubbleAppear .55s cubic-bezier(.2,.9,.25,1.2) both;
}

.bubble:after{
  content:"";
  position:absolute;
  right:-11px;
  bottom:24px;
  width:18px;
  height:18px;
  background:#fff;
  border-top:2px solid #d9e5ed;
  border-right:2px solid #d9e5ed;
  transform:rotate(45deg);
}

.bubble small{
  display:block;
  color:#84939d;
  font-size:10px;
  margin-bottom:3px;
}

@keyframes bubbleAppear{
  from{
    opacity:0;
    transform:scale(.9) translateY(7px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

@media(max-width:700px){

  .bell{
    width:140px;
    right:4px;
    bottom:4px;
  }

  .bubble{
    left:20px;
    top:20px;
    transform:none;
    width:185px;
    max-width:68%;
    font-size:12px;
    padding:10px 12px;
  }

  .bubble:after{
    right:-10px;
    bottom:21px;
    width:16px;
    height:16px;
  }
}
</style>

</head>

<body>

<div class="bell-area">

  <div class="bubble">
    <small>ベルちゃん</small>
    <span id="bellMessage">今日の部活は17:00〜19:00までだよ！</span>
  </div>

  <img
    class="bell"
    src="bell.png"
    alt="ベルちゃん"
    onclick="changeBellMessage()"
  >

</div>

<script>

const bellMessages=[
  "今月の活動回数は○回だね！",
  "今月は定期試験があるね。頑張ってね！",
  "今日の部活は○時〜○時までだよ！",
  "もうすぐ○○演奏会があるね！",
  "来週は文化祭だ〜♪",
  "今日も部活頑張ろうね！",
  "予定を確認してみてね！"
];

function changeBellMessage(){

  const message=document.getElementById("bellMessage");

  let next=Math.floor(Math.random()*bellMessages.length);

  message.textContent=bellMessages[next];

}

</script>

</body>
</html>
