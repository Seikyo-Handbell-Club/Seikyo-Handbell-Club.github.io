<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベルちゃん</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
.bell-area{position:relative;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.bell{position:absolute;right:8px;bottom:4px;width:175px;max-width:62%;height:auto;filter:none;cursor:pointer;user-select:none;transition:transform .15s ease}
.bell:active{transform:scale(.96)}
.bubble{position:absolute;right:166px;bottom:108px;width:220px;max-width:76%;background:#fff;border:2px solid #d9e5ed;border-radius:18px;padding:12px 15px;box-shadow:none;font-size:14px;line-height:1.55;animation:bubbleAppear .55s cubic-bezier(.2,.9,.25,1.2) both}
.bubble:after{content:"";position:absolute;right:-11px;bottom:24px;width:18px;height:18px;background:#fff;border-top:2px solid #d9e5ed;border-right:2px solid #d9e5ed;transform:rotate(45deg)}
.bubble small{display:block;color:#84939d;font-size:10px;margin-bottom:3px}
@keyframes bubbleAppear{from{opacity:0;transform:scale(.9) translateY(7px)}to{opacity:1;transform:scale(1) translateY(0)}}


/* 全画面共通：スマホ版サイズ */
.bell{width:125px;right:3px;bottom:3px}
.bubble{right:3px;bottom:42px;width:205px;max-width:calc(100vw - 8px);font-size:10px;padding:7px 8px}
.bubble:after{right:20px;bottom:-7px;width:12px;height:12px;background:#fff;border-top:0;border-right:2px solid #d9e5ed;border-bottom:2px solid #d9e5ed;transform:rotate(45deg)}
.bubble small{font-size:8px;margin-bottom:2px}
.logged-in .bell{width:145px}
.logged-in .bubble{width:215px;bottom:58px;max-width:calc(100vw - 8px)}

/* =====================================================
   キャラクター別サイズ設定
   ↓ ここを変えるとベルちゃんとチャイムくんを別々に調整できます
===================================================== */

/* 🔔 ベルちゃん・ログイン前 */
.bell-character{
  width:125px;
  right:3px;
  bottom:3px;
}

/* 🎵 チャイムくん・ログイン前 */
.chime-character{
  width:125px;
  right:3px;
  bottom:3px;
}

/* 🔔 ベルちゃん・ログイン後 */
.logged-in .bell-character{
  width:145px;
  right:3px;
  bottom:3px;
}

/* 🎵 チャイムくん・ログイン後 */
.logged-in .chime-character{
  width:145px;
  right:3px;
  bottom:3px;
}



/* =====================================================
   ベルちゃん・チャイムくん お祝いアニメーション
   クリック中は吹き出しを隠し、約1.8秒で2回ジャンプ＋ハート演出
===================================================== */
.bell-area{position:relative;overflow:visible}
.heart-container{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:visible;
  z-index:5;
}
.heart-effect{
  position:absolute;
  left:50%;
  bottom:30%;
  font-size:18px;
  line-height:1;
  opacity:0;
  transform:translate(-50%,0) scale(.5);
  animation:heartFly 1.05s ease-out forwards;
}
.bell-celebrating{
  animation:characterCelebrate 1.8s ease-in-out both;
}
.bubble.celebrating-hidden{
  opacity:0!important;
  visibility:hidden;
  transition:opacity .12s ease,visibility 0s linear .12s;
}
@keyframes characterCelebrate{
  0%{transform:translateY(0) rotate(0deg)}
  11%{transform:translateY(5px) rotate(0deg)}
  22%{transform:translateY(-25px) rotate(-4deg)}
  34%{transform:translateY(-4px) rotate(4deg)}
  46%{transform:translateY(0) rotate(0deg)}
  57%{transform:translateY(5px) rotate(0deg)}
  70%{transform:translateY(-32px) rotate(5deg)}
  82%{transform:translateY(-5px) rotate(-4deg)}
  92%{transform:translateY(2px) rotate(2deg)}
  100%{transform:translateY(0) rotate(0deg)}
}
@keyframes heartFly{
  0%{opacity:0;transform:translate(-50%,10px) scale(.35) rotate(-10deg)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-120px + var(--dy))) scale(1) rotate(var(--rot))}
}

</style>
</head>
<body>
<div class="bell-area">
  <div class="heart-container" id="heartContainer"></div>
  <div class="bubble"><small id="characterName">ベルちゃん</small><span id="bellMessage">予定を確認してるよ！</span></div>
  <img class="bell bell-character" src="bell.png" alt="ベルちゃん" id="bellImage">
</div>

<script type="module">
const message=document.getElementById("bellMessage");
const bellImage=document.getElementById("bellImage");
const characterName=document.getElementById("characterName");

const characterImages={
  bell:{src:"bell.png",name:"ベルちゃん"},
  chime:{src:"chime.png",name:"チャイムくん"}
};

let currentCharacter="bell";
let isCelebrating=false;

function setCharacter(character){
  const selected=character === "chime" ? "chime" : "bell";
  const data=characterImages[selected];
  if(!data)return;

  currentCharacter=selected;
  bellImage.src=data.src;
  bellImage.alt=data.name;
  bellImage.classList.remove("bell-character","chime-character");
  bellImage.classList.add(selected === "chime" ? "chime-character" : "bell-character");
  if(characterName) characterName.textContent=data.name;
}

function startHearts(){
  const container=document.getElementById("heartContainer");
  if(!container)return;

  container.innerHTML="";

  const hearts=[
    {delay:0,dx:"-42px",dy:"-10px",rot:"-18deg",size:"17px"},
    {delay:40,dx:"0px",dy:"-22px",rot:"8deg",size:"21px"},
    {delay:90,dx:"42px",dy:"-8px",rot:"20deg",size:"16px"},
    {delay:720,dx:"-48px",dy:"-14px",rot:"-24deg",size:"18px"},
    {delay:760,dx:"-4px",dy:"-32px",rot:"6deg",size:"23px"},
    {delay:810,dx:"46px",dy:"-16px",rot:"22deg",size:"17px"}
  ];

  hearts.forEach(h=>{
    const el=document.createElement("span");
    el.className="heart-effect";
    el.textContent="♥";
    el.style.setProperty("--dx",h.dx);
    el.style.setProperty("--dy",h.dy);
    el.style.setProperty("--rot",h.rot);
    el.style.fontSize=h.size;
    el.style.animationDelay=`${h.delay}ms`;
    container.appendChild(el);
  });
}

function celebrate(){
  if(isCelebrating)return;
  isCelebrating=true;

  const bubble=document.querySelector(".bubble");
  bellImage.classList.remove("bell-celebrating");
  void bellImage.offsetWidth;
  bellImage.classList.add("bell-celebrating");

  if(bubble) bubble.classList.add("celebrating-hidden");
  startHearts();

  setTimeout(()=>{
    bellImage.classList.remove("bell-celebrating");
    if(bubble) bubble.classList.remove("celebrating-hidden");
    isCelebrating=false;
    const container=document.getElementById("heartContainer");
    if(container) container.innerHTML="";
    changeBellMessage();
  },1800);
}

window.addEventListener("message",event=>{
  if(!event.data || event.data.type !== "handbell-character") return;
  setCharacter(event.data.character);
});

function updateLoginSize(){
  try{
    const parentDocument=window.parent.document;
    const loggedInElement=parentDocument.getElementById("loggedInLeft");
    const isLoggedIn=!!loggedInElement && !loggedInElement.classList.contains("hidden");
    document.body.classList.toggle("logged-in",isLoggedIn);
  }catch(error){
    document.body.classList.remove("logged-in");
  }
}

updateLoginSize();

bellImage.addEventListener("click",celebrate);

try{
  const parentDocument=window.parent.document;
  const loggedInElement=parentDocument.getElementById("loggedInLeft");
  if(loggedInElement){
    new MutationObserver(updateLoginSize).observe(loggedInElement,{attributes:true,attributeFilter:["class"]});
  }
}catch(error){}

let bellMessages=[];

const isEmbedded=window.parent !== window;
let parentSchedules={};

function setBellMessages(messages,preferred=null){
  const cleaned=[...new Set((messages || []).filter(v=>typeof v === "string" && v.trim()))];
  if(!cleaned.length)return;
  bellMessages=cleaned;
  showMessage(preferred && cleaned.includes(preferred) ? preferred : pickRandom(cleaned));
}

function receiveParentSchedules(schedules){
  parentSchedules=schedules || {};
  setBellMessages(buildBellMessages(parentSchedules));
}

window.addEventListener("message",event=>{
  if(!event.data)return;

  if(event.data.type==="handbell-schedules"){
    receiveParentSchedules(event.data.schedules || {});
  }

  if(event.data.type==="handbell-character"){
    setCharacter(event.data.character);
  }
});

function dateString(date){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,"0");
  const d=String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function getTomorrowString(date){
  const tomorrow=new Date(date);
  tomorrow.setDate(tomorrow.getDate()+1);
  return dateString(tomorrow);
}

function getNormalSchedulesForDate(values,date){
  return values.filter(s=>{
    if(!s || typeof s!=="object")return false;

    if(s.type==="normal"){
      return s.date===date;
    }

    return false;
  });
}

function getEventSchedulesForDate(values,date){
  return values.filter(s=>{
    if(!s || typeof s!=="object")return false;

    if(s.type==="concert" || s.type==="event"){
      return s.date===date;
    }

    return false;
  });
}

function getUpcomingEvents(values,today){
  return values
    .filter(s=>{
      if(!s || typeof s!=="object")return false;
      if(s.type!=="concert" && s.type!=="event")return false;
      return typeof s.date==="string" && s.date>today;
    })
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}

function getClubBeforeStartMessages(values,today,dateNow){
  const result=[];
  const schedules=getNormalSchedulesForDate(values,today);

  schedules.forEach(schedule=>{
    if(!schedule.startTime)return;

    const [h,m]=String(schedule.startTime).split(":").map(Number);
    if(!Number.isFinite(h) || !Number.isFinite(m))return;

    const start=new Date(dateNow);
    start.setHours(h,m,0,0);

    const diff=start-dateNow;

    if(diff>0 && diff<=3*60*60*1000){
      result.push("もうすぐ部活だね！準備はできた？");
      result.push("今日の部活、頑張ろう！");
      result.push("そろそろ部活の時間だよ！");
    }
  });

  return result;
}

function buildRegularMessages(values,dateNow){
  const hour=dateNow.getHours();
  const result=[];

  const today=dateString(dateNow);
  const tomorrow=getTomorrowString(dateNow);

  const todayNormal=getNormalSchedulesForDate(values,today);
  const tomorrowNormal=getNormalSchedulesForDate(values,tomorrow);

  const monthCount=values.filter(s=>{
    if(!s || typeof s!=="object")return false;
    if(s.type!=="normal")return false;
    return typeof s.date==="string" &&
      s.date.startsWith(`${dateNow.getFullYear()}-${String(dateNow.getMonth()+1).padStart(2,"0")}`);
  }).length;

  if(hour>=4 && hour<10){
    result.push(
      "おはよう！今日も頑張ろう！",
      "おはよう！今日の予定を確認した？",
      `おはよう！今月の部活は${monthCount}回だよ`
    );

    if(todayNormal.length>0){
      result.push("今日は部活の日だね！");
    }
  }

  if(hour>=10 && hour<17){
    result.push(
      "こんにちは！",
      "今日も元気に頑張ろう！",
      "予定を確認してみてね！"
    );

    if(todayNormal.length>0){
      result.push("今日は部活の日だね！");
    }
  }

  if(hour>=17 && hour<22){
    result.push(
      "こんばんは！",
      "今日もお疲れ様！",
      "こんばんは！自主練はもうやった？",
      `こんばんは！今月の部活は${monthCount}回だよ`
    );

    if(todayNormal.length>0){
      result.push("今日は部活お疲れ様！");
    }

    if(tomorrowNormal.length>0){
      result.push("明日も部活頑張ろう！");
    }
  }

  if(hour>=22 && hour<24){
    result.push(
      "こんばんは〜。そろそろ眠たくなっちゃった、、、",
      "こんばんは！夜遅くまでお疲れ様"
    );

    if(tomorrowNormal.length>0){
      result.push("こんばんは！明日も部活頑張ろう！");
    }
  }

  return result;
}

function buildBellMessages(schedules){
  const now=new Date();
  const today=dateString(now);
  const values=Object.values(schedules || {}).filter(s=>s && typeof s === "object");

  const regularMessages=buildRegularMessages(values,now);

  const todayEvents=getEventSchedulesForDate(values,today);
  const eventMessages=[];

  todayEvents.forEach(event=>{
    eventMessages.push(
      `今日は${event.title || (event.type==="concert" ? "演奏会" : "イベント")}だね！`
    );
  });

  const upcomingEvents=getUpcomingEvents(values,today);

  upcomingEvents.slice(0,3).forEach(event=>{
    eventMessages.push(
      `もうすぐ${event.title || (event.type==="concert" ? "演奏会" : "イベント")}だね！`
    );
  });

  const clubMessages=getClubBeforeStartMessages(values,today,now);

  return [
    ...regularMessages,
    ...eventMessages,
    ...clubMessages
  ];
}

function chooseBellMessage(schedules){
  const now=new Date();
  const today=dateString(now);
  const values=Object.values(schedules || {}).filter(s=>s && typeof s === "object");
  const regularMessages=buildRegularMessages(values,now);

  const todayEvents=getEventSchedulesForDate(values,today);
  if(todayEvents.length>0 && Math.random()<0.5){
    const event=todayEvents[Math.floor(Math.random()*todayEvents.length)];
    return `今日は${event.title || (event.type==="concert" ? "演奏会" : "イベント")}だね！`;
  }

  const upcomingEvents=getUpcomingEvents(values,today);
  if(upcomingEvents.length>0 && Math.random()<0.2){
    const event=upcomingEvents[0];
    return `もうすぐ${event.title || (event.type==="concert" ? "演奏会" : "イベント")}だね！`;
  }

  const clubMessages=getClubBeforeStartMessages(values,today,now);
  const combined=[...regularMessages,...clubMessages];
  return pickRandom(combined);
}

function showMessage(text){
  message.textContent=text;
}

function changeBellMessage(){
  if(!bellMessages.length)return;
  let next=pickRandom(bellMessages);
  if(bellMessages.length>1 && next===message.textContent){
    const other=bellMessages.filter(item=>item!==message.textContent);
    next=pickRandom(other);
  }
  showMessage(next);
}



/* 最初から現在の時間帯の複数セリフを使えるようにする。 */
setBellMessages(buildBellMessages({}));

/* 親ページに準備完了を知らせる。予定データは親から受け取る。 */
if(isEmbedded){
  setCharacter("bell");

  window.parent.postMessage({type:"handbell-ready"},"*");
}

bellImage.addEventListener("click",changeBellMessage);
</script>
</body>
</html>
