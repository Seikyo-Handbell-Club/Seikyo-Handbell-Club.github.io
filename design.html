<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベルちゃん</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
.bell-area{position:relative;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.bell{position:absolute;right:0px;bottom:50px;width:10px;max-width:62%;height:auto;filter:none;cursor:pointer;user-select:none;transition:transform .15s ease}
.bell:active{transform:scale(.96)}
.bubble{position:absolute;right:166px;bottom:150px;width:220px;max-width:76%;background:#fff;border:2px solid #d9e5ed;border-radius:18px;padding:12px 15px;box-shadow:none;font-size:14px;line-height:1.55;animation:bubbleAppear .55s cubic-bezier(.2,.9,.25,1.2) both}
.bubble:after{content:"";position:absolute;right:-11px;bottom:70px;width:18px;height:18px;background:#fff;border-top:2px solid #d9e5ed;border-right:2px solid #d9e5ed;transform:rotate(45deg)}
.bubble small{display:block;color:#84939d;font-size:10px;margin-bottom:3px}
@keyframes bubbleAppear{from{opacity:0;transform:scale(.9) translateY(7px)}to{opacity:1;transform:scale(1) translateY(0)}}


/* 全画面共通：スマホ版サイズ */
.bell{width:100px;right:-10px;bottom:10px}
.bubble{right:3px;bottom:100px;width:205px;max-width:calc(100vw - 8px);font-size:10px;padding:7px 8px}
.bubble:after{right:20px;bottom:-7px;width:12px;height:12px;background:#fff;border-top:0;border-right:2px solid #d9e5ed;border-bottom:2px solid #d9e5ed;transform:rotate(45deg)}
.bubble small{font-size:8px;margin-bottom:2px}
.logged-in .bell{width:145px}
.logged-in .bubble{width:215px;bottom:58px;max-width:calc(100vw - 8px)}

</style>
</head>
<body>
<div class="bell-area">
  <div class="bubble"><small>ベルちゃん</small><span id="bellMessage">予定を確認してるよ！</span></div>
  <img class="bell" src="bell.png" alt="ベルちゃん" id="bellImage">
</div>

<script type="module">
const message=document.getElementById("bellMessage");
const bellImage=document.getElementById("bellImage");

function updateLoginSize(){
  try{
    const parentDocument=window.parent.document;
    const loggedInElement=parentDocument.getElementById("loggedInLeft");
    const isLoggedIn=!!loggedInElement && !loggedInElement.classList.contains("hidden");
    document.body.classList.toggle("logged-in",isLoggedIn);
  }catch(error){
    document.body.classList.remove("logged-in");
  }
}

updateLoginSize();

try{
  const parentDocument=window.parent.document;
  const loggedInElement=parentDocument.getElementById("loggedInLeft");
  if(loggedInElement){
    new MutationObserver(updateLoginSize).observe(loggedInElement,{attributes:true,attributeFilter:["class"]});
  }
}catch(error){}

let bellMessages=[];

const isEmbedded=window.parent !== window;
let parentSchedules={};

function setBellMessages(messages,preferred=null){
  const cleaned=[...new Set((messages || []).filter(v=>typeof v === "string" && v.trim()))];
  if(!cleaned.length)return;
  bellMessages=cleaned;
  showMessage(preferred && cleaned.includes(preferred) ? preferred : pickRandom(cleaned));
}

function buildBellMessages(schedules){
  const now=new Date();
  const values=Object.entries(schedules || {})
    .filter(([,s])=>s && typeof s === "object")
    .map(([key,s])=>{
      /*
        カレンダーの通常予定は「2026-10-06」のような日付をキーにして
        保存されているため、ベルちゃん側でもそのキーをdateとして使う。
        既にdateを持っている予定は元の値をそのまま使う。
      */
      if((s.type==="normal" || !s.type) && typeof s.date !== "string"){
        return {...s,date:key};
      }
      return s;
    });

  /* 通常セリフは必ず先に作る。予定データがなくても2種類にはならない。 */
  const all=[...buildRegularMessages(values,now)];

  try{
    const today=dateString(now);
    all.push(...getClubBeforeStartMessages(values,today,now));
  }catch(error){
    console.warn("ベルちゃんの部活前メッセージを作成できませんでした",error);
  }

  try{
    const today=dateString(now);
    getEventSchedulesForDate(values,today).forEach(event=>{
      all.push(`今日は${event.title || (event.type==="concert" ? "演奏会" : "イベント")}だね！`);
    });
  }catch(error){
    console.warn("ベルちゃんの当日イベントメッセージを作成できませんでした",error);
  }

  try{
    const today=dateString(now);
    getUpcomingEvents(values,today).forEach(event=>{
      all.push(`もうすぐ${event.title || (event.type==="concert" ? "演奏会" : "イベント")}だね！`);
    });
  }catch(error){
    console.warn("ベルちゃんの予定メッセージを作成できませんでした",error);
  }

  return [...new Set(all)];
}

function receiveParentSchedules(schedules){
  parentSchedules=schedules && typeof schedules === "object" ? schedules : {};
  setBellMessages(buildBellMessages(parentSchedules));
}

window.addEventListener("message",event=>{
  if(!event.data || event.data.type !== "handbell-schedules")return;
  receiveParentSchedules(event.data.schedules);
});

function pad(n){
  return String(n).padStart(2,"0");
}

function dateString(date=new Date()){
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
}

function monthString(date=new Date()){
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}`;
}

function timeToMinutes(value){
  const match=String(value || "").match(/^(\d{1,2}):(\d{2})$/);
  if(!match)return null;
  return Number(match[1])*60+Number(match[2]);
}

function getGreeting(date=new Date()){
  const hour=date.getHours();
  if(hour>=4 && hour<10)return "おはよう！";
  if(hour>=10 && hour<17)return "こんにちは！";
  return "こんばんは！";
}

function greetingMessage(text,date=new Date()){
  return `${getGreeting(date)}${text}`;
}

function formatJapaneseTime(value){
  const match=String(value || "").match(/^(\d{1,2}):(\d{2})$/);
  if(!match)return String(value || "");
  return `${Number(match[1])}時${match[2]}分`;
}

function formatTimeRange(time){
  const value=String(time || "").trim();
  if(!value || value === "終日")return "";
  const match=value.match(/^(\d{1,2}:\d{2})\s*[〜~\-－]\s*(\d{1,2}:\d{2})$/);
  if(!match)return value;
  return `${formatJapaneseTime(match[1])}〜${formatJapaneseTime(match[2])}`;
}

function getStartTime(time){
  const value=String(time || "").trim();
  const match=value.match(/^(\d{1,2}:\d{2})\s*[〜~\-－]/);
  return match ? timeToMinutes(match[1]) : null;
}

function getTomorrowString(date=new Date()){
  const tomorrow=new Date(date.getFullYear(),date.getMonth(),date.getDate()+1);
  return dateString(tomorrow);
}

function daysFromToday(dateStringValue,today=new Date()){
  const target=new Date(`${dateStringValue}T00:00:00`);
  const base=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  return Math.round((target-base)/86400000);
}

function isUpcomingWithinDays(dateValue,today,days){
  if(!dateValue)return false;
  const diff=daysFromToday(dateValue,today);
  return diff>0 && diff<=days;
}

function getNormalSchedulesForDate(values,date){
  return values.filter(s=>s && s.type==="normal" && s.date===date);
}

function getEventSchedulesForDate(values,date){
  return values.filter(s=>
    s &&
    (s.type==="concert" || s.type==="event") &&
    s.date===date
  );
}

function getUpcomingEvents(values,today){
  return values
    .filter(s=>
      s &&
      (s.type==="concert" || s.type==="event") &&
      isUpcomingWithinDays(s.date,today,7)
    )
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}

function getMonthlyClubCount(values,today){
  const month=monthString(today);
  return values.filter(s=>
    s &&
    (s.type==="normal" || !s.type) &&
    typeof s.date==="string" &&
    s.date.startsWith(month)
  ).length;
}

function getClubBeforeStartMessages(values,today,dateNow){
  const todayNormal=getNormalSchedulesForDate(values,today)[0];
  if(!todayNormal)return [];

  const start=getStartTime(todayNormal.time);
  const nowMinutes=dateNow.getHours()*60+dateNow.getMinutes();
  if(start===null || nowMinutes>=start)return [];

  const range=formatTimeRange(todayNormal.time);
  const result=[];

  if(range){
    result.push(greetingMessage(`今日の部活は${range}だよ`,dateNow));
  }

  result.push(
    greetingMessage("今日の部活、頑張ろうね！",dateNow),
    greetingMessage("今日もみんなでハンドベル頑張ろうね！",dateNow),
    greetingMessage("今日の部活も楽しみだね！",dateNow),
    greetingMessage("今日はどんな曲を練習するのかな？",dateNow),
    greetingMessage("今日の部活も一緒に頑張ろうね！",dateNow)
  );

  return result;
}

function buildRegularMessages(values,dateNow){
  const result=[];
  const hour=dateNow.getHours();
  const greeting=getGreeting(dateNow);
  const monthCount=getMonthlyClubCount(values,dateNow);

  if(hour>=4 && hour<10){
    result.push(
      "おはよう！",
      "おはよう！今日も一日頑張ろうね！",
      "おはよう！無理せず頑張ろうね！",
      "おはよう！今日も楽しく過ごそうね！",
      "おはよう！予定を確認してみてね！",
      "おはよう！今月の予定もチェックしてみてね！",
      "おはよう！みんなで楽しく活動しようね！",
      "おはよう！今日も素敵な一日にしようね！",
      "おはよう！今日も予定を見にきてくれてありがとう",
      `おはよう！今月の部活は${monthCount}回だよ`
    );
    if(hour>=4 && hour<6.5)result.push("おはよう〜まだ眠いよ〜");
    if(hour>=5 && hour<7)result.push("おはよう！朝はやいね");
  }else if(hour>=10 && hour<17){
    result.push(
      "こんにちは！",
      "こんにちは！無理せず頑張ろうね！",
      "こんにちは！今日も楽しく過ごそうね！",
      "こんにちは！予定を確認してみてね！",
      "こんにちは！今月の予定もチェックしてみてね！",
      "こんにちは！みんなで楽しく活動しようね！",
      "こんにちは！今日も素敵な一日にしようね！",
      "こんにちは！今日も予定を見にきてくれてありがとう",
      `こんにちは！今月の部活は${monthCount}回だよ`
    );
    if(hour>=12 && hour<13)result.push("こんにちは！お昼ご飯はもう食べたかな？");
    if(hour>=12 && hour<15)result.push("こんにちは！今日のお昼ご飯なんだった？");
  }else{
    result.push(
      "こんばんは！",
      "こんばんは！予定を確認してみてね！",
      "こんばんは！今月の予定もチェックしてみてね！",
      "こんばんは！今日も予定を見にきてくれてありがとう",
      "こんばんは！今日はどんな1日だったかな？",
      "こんばんは！1日お疲れ様！",
      "こんばんは！明日も1日頑張ろう！",
      "こんばんは！自主練はもうやった？",
      `こんばんは！今月の部活は${monthCount}回だよ`
    );
    if(hour>=22 && hour<24)result.push("こんばんは〜。そろそろ眠たくなっちゃった、、、");
    if(getNormalSchedulesForDate(values,getTomorrowString(dateNow)).length>0){
      result.push("こんばんは！明日も部活頑張ろう！");
    }
    if(hour>=22 && hour<24)result.push("こんばんは！夜遅くまでお疲れ様");
  }

  return result;
}

function pickRandom(list){
  if(!list.length)return "予定を確認してみてね！";
  return list[Math.floor(Math.random()*list.length)];
}

function chooseBellMessage(schedules){
  const now=new Date();
  const today=dateString(now);
  const values=Object.values(schedules || {}).filter(s=>s && typeof s === "object");
  const regularMessages=buildRegularMessages(values,now);

  const todayEvents=getEventSchedulesForDate(values,today);
  if(todayEvents.length>0 && Math.random()<0.5){
    const event=todayEvents[Math.floor(Math.random()*todayEvents.length)];
    return `今日は${event.title || (event.type==="concert" ? "演奏会" : "イベント")}だね！`;
  }

  const upcomingEvents=getUpcomingEvents(values,today);
  if(upcomingEvents.length>0 && Math.random()<0.2){
    const event=upcomingEvents[0];
    return `もうすぐ${event.title || (event.type==="concert" ? "演奏会" : "イベント")}だね！`;
  }

  const clubMessages=getClubBeforeStartMessages(values,today,now);
  const combined=[...regularMessages,...clubMessages];
  return pickRandom(combined);
}

function showMessage(text){
  message.textContent=text;
}

function changeBellMessage(){
  if(!bellMessages.length)return;
  let next=pickRandom(bellMessages);
  if(bellMessages.length>1 && next===message.textContent){
    const other=bellMessages.filter(item=>item!==message.textContent);
    next=pickRandom(other);
  }
  showMessage(next);
}



/* 最初から現在の時間帯の複数セリフを使えるようにする。 */
setBellMessages(buildBellMessages({}));

/* 親ページに準備完了を知らせる。予定データは親から受け取る。 */
if(isEmbedded){
  window.parent.postMessage({type:"handbell-ready"},"*");
}

bellImage.addEventListener("click",changeBellMessage);
</script>
</body>
</html>
