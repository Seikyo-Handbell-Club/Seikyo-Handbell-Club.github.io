<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベルちゃん</title>

<style>

/* =====================================================
   共通設定
===================================================== */

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
}

.bell-area{
  position:absolute;
  width:220px;
  height:140px;
  right:0;
  bottom:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

/* =====================================================
   キャラクター共通
===================================================== */

.bell{
  position:absolute;
  max-width:62%;
  height:auto;

  border:none;
  outline:none;
  box-shadow:none;

  filter:none;

  cursor:pointer;
  user-select:none;

  transition:transform .15s ease;

  z-index:10;
}

.bell:active{
  transform:scale(.96);
}

/* =====================================================
   ベルちゃん
===================================================== */

body:not(.logged-in) .bell{
  width:85px;
  right:20px;
  bottom:12px;
}

body.logged-in .bell{
  width:90px;
  right:25px;
  bottom:0px;
}

/* =====================================================
   ★ チャイムくん専用設定 ★
===================================================== */

body:not(.logged-in) .bell.chime{
  width:80px;
  right:18px;
  bottom:10px;
}

body.logged-in .bell.chime{
  width:80px;
  right:18px;
  bottom:0px;
}

/* =====================================================
   吹き出し
===================================================== */

.bubble{
  position:absolute;

  max-width:calc(100vw - 8px);

  background:#fff;

  border:2px solid #d9e5ed;
  border-radius:18px;

  padding:7px 8px;

  box-shadow:none;

  font-size:10px;
  line-height:1.55;

  animation:
    bubbleAppear
    .55s
    cubic-bezier(.2,.9,.25,1.2)
    both;

  z-index:30;
}

.bubble small{
  display:block;

  color:#84939d;

  font-size:8px;

  margin-bottom:2px;
}

/* =====================================================
   アニメーション中は吹き出しを消す
===================================================== */

.bubble.bubble-hidden{
  visibility:hidden;
  opacity:0;
  pointer-events:none;
}

/* =====================================================
   ログイン前 吹き出し
===================================================== */

body:not(.logged-in) .bubble{
  min-width:105px;
  width:176px;
  max-width:198px;
  box-sizing:border-box;
  right:4px;
  bottom:92px;
}

body:not(.logged-in) .bubble:after{
  content:"";

  position:absolute;

  width:12px;
  height:12px;

  right:20px;
  bottom:-7px;

  background:#fff;

  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;

  transform:rotate(45deg);
}

/* =====================================================
   ログイン後 吹き出し
===================================================== */

body.logged-in .bubble{
  min-width:105px;
  width:176px;
  max-width:198px;
  box-sizing:border-box;
  right:6px;
  bottom:88px;
}

body.logged-in .bubble:after{
  content:"";

  position:absolute;

  width:12px;
  height:12px;

  right:20px;
  bottom:-7px;

  background:#fff;

  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;

  transform:rotate(45deg);
}

/* =====================================================
   吹き出し登場
===================================================== */

@keyframes bubbleAppear{

  from{
    opacity:0;

    transform:
      scale(.9)
      translateY(7px);
  }

  to{
    opacity:1;

    transform:
      scale(1)
      translateY(0);
  }

}

/* =====================================================
   ハートを出す場所
===================================================== */

.heart-container{
  position:absolute;

  left:50%;
  top:50%;

  width:0;
  height:0;

  pointer-events:none;

  z-index:20;

  overflow:visible;
}

/* =====================================================
   ハート
===================================================== */

.heart{
  position:absolute;

  left:0;
  top:0;

  color:#ff7eb9;

  font-size:18px;

  line-height:1;

  opacity:0;

  transform:
    translate(
      var(--start-x),
      var(--start-y)
    )
    scale(.4);

  animation:
    heartFly
    1.8s
    cubic-bezier(.2,.75,.25,1)
    forwards;
}

/* =====================================================
   ハートが飛び散る
===================================================== */

@keyframes heartFly{

  0%{
    opacity:0;

    transform:
      translate(
        var(--start-x),
        var(--start-y)
      )
      scale(.3)
      rotate(0deg);
  }

  12%{
    opacity:1;
  }

  45%{
    opacity:1;
  }

  100%{
    opacity:0;

    transform:
      translate(
        var(--end-x),
        var(--end-y)
      )
      scale(1)
      rotate(var(--rotate));
  }

}

/* =====================================================
   キャラクター喜びアニメーション
===================================================== */

.bell.celebrating{

  animation:
    bellCelebrate
    1.8s
    cubic-bezier(.2,.8,.25,1)
    both;

}

/* =====================================================
   2回ジャンプ
===================================================== */

@keyframes bellCelebrate{

  0%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }

  12%{
    transform:
      translateY(-18px)
      rotate(-8deg)
      scale(1.04);
  }

  24%{
    transform:
      translateY(-25px)
      rotate(8deg)
      scale(1.05);
  }

  38%{
    transform:
      translateY(0)
      rotate(-4deg)
      scale(1);
  }

  45%{
    transform:
      translateY(-6px)
      rotate(3deg)
      scale(1.02);
  }

  57%{
    transform:
      translateY(-22px)
      rotate(-9deg)
      scale(1.05);
  }

  69%{
    transform:
      translateY(-30px)
      rotate(9deg)
      scale(1.06);
  }

  83%{
    transform:
      translateY(0)
      rotate(-3deg)
      scale(1);
  }

  92%{
    transform:
      translateY(-3px)
      rotate(2deg)
      scale(1.01);
  }

  100%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }

}

</style>
</head>

<body>

<div class="bell-area">

  <div class="bubble">

    <small id="characterName">
      ベルちゃん
    </small>

    <span id="bellMessage">
      予定を確認してるよ！
    </span>

  </div>

  <div
    class="heart-container"
    id="heartContainer">
  </div>

  <img
    class="bell"
    src="bell.png"
    alt="ベルちゃん"
    id="bellImage"
  >

</div>

<script type="module">

/* =====================================================
   基本
===================================================== */

const message =
  document.getElementById(
    "bellMessage"
  );

const bellImage =
  document.getElementById(
    "bellImage"
  );

const characterName =
  document.getElementById(
    "characterName"
  );

const bubble =
  document.querySelector(
    ".bubble"
  );

const heartContainer =
  document.getElementById(
    "heartContainer"
  );

/* =====================================================
   キャラクター設定
===================================================== */

let currentCharacter="bell";

/* =====================================================
   通常キャラクター画像
===================================================== */

const characterImages={

  bell:{
    src:"bell.png",
    name:"ベルちゃん"
  },

  chime:{
    src:"chime.png",
    name:"チャイムくん"
  }

};

/* =====================================================
   ★ 特殊服画像
===================================================== */

const costumeImages={

  bell:{

    newyear:
      "costumes/bell-newyear.png",

    setsubun:
      "costumes/bell-setsubun.png",

    valentine:
      "costumes/bell-valentine.png",

    hinamatsuri:
      "costumes/bell-hinamatsuri.png",

    whiteday:
      "costumes/bell-whiteday.png",

    kodomonohi:
      "costumes/bell-kodomonohi.png",

    tanabata:
      "costumes/bell-tanabata.png",

    tsukimi:
      "costumes/bell-tsukimi.png",

    halloween:
      "costumes/bell-halloween.png",

    christmaseve:
      "costumes/bell-christmaseve.png",

    christmas:
      "costumes/bell-Christmas.png",

    winter:
      "costumes/bell-winter.png"

  },

  chime:{

    newyear:
      "costumes/chime-newyear.png",

    setsubun:
      "costumes/chime-setsubun.png",

    valentine:
      "costumes/chime-valentine.png",

    hinamatsuri:
      "costumes/chime-hinamatsuri.png",

    whiteday:
      "costumes/chime-whiteday.png",

    kodomonohi:
      "costumes/chime-kodomonohi.png",

    tanabata:
      "costumes/chime-tanabata.png",

    tsukimi:
      "costumes/chime-tsukimi.png",

    halloween:
      "costumes/chime-halloween.png",

    christmaseve:
      "costumes/chime-christmaseve.png",

    christmas:
      "costumes/chime-Christmas.png",

    winter:
      "costumes/chime-winter.png"

  }

};

/* =====================================================
   ★ コードからテスト日付を変更できます
   例："2026-12-25" → 2026年12月25日として動作
   通常の日付に戻す場合は null にしてください
===================================================== */

const TEST_DATE = "2026-12-25";

/* =====================================================
   十五夜の日
   handbell.htmlの元々の設定に合わせる
===================================================== */

const jugoyaDates={

  2026:"09-25",
  2027:"09-15",
  2028:"10-03",
  2029:"09-22",
  2030:"09-12",
  2031:"10-01",
  2032:"09-19",
  2033:"09-08",
  2034:"09-27",
  2035:"09-16",
  2036:"10-04"

};

/* =====================================================
   ★ テスト日付機能
   URLに ?testDate=2026-12-25 のように指定すると
   その日付として特殊服を判定する。
   指定しない場合は通常どおり今日の日付を使用。
===================================================== */

function getTestDate(){

  /* コードで指定したテスト日付を最優先 */
  if(TEST_DATE){
    try{
      if(/^\d{4}-\d{2}-\d{2}$/.test(TEST_DATE)){
        const testDate = new Date(`${TEST_DATE}T12:00:00`);
        if(
          !Number.isNaN(testDate.getTime()) &&
          testDate.getFullYear() === Number(TEST_DATE.slice(0,4)) &&
          testDate.getMonth()+1 === Number(TEST_DATE.slice(5,7)) &&
          testDate.getDate() === Number(TEST_DATE.slice(8,10))
        ){
          return testDate;
        }
      }
    }catch(error){
      console.warn("コード指定のテスト日付を読み込めませんでした",error);
    }
  }

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );

    const value =
      params.get("testDate");

    if(
      value &&
      /^\d{4}-\d{2}-\d{2}$/.test(value)
    ){

      const testDate =
        new Date(
          `${value}T12:00:00`
        );

      if(
        !Number.isNaN(
          testDate.getTime()
        ) &&
        testDate.getFullYear() ===
          Number(value.slice(0,4)) &&
        testDate.getMonth()+1 ===
          Number(value.slice(5,7)) &&
        testDate.getDate() ===
          Number(value.slice(8,10))
      ){

        return testDate;

      }

    }

  }catch(error){

    console.warn(
      "テスト日付を読み込めませんでした",
      error
    );

  }

  return null;

}

function getCurrentDate(){

  return getTestDate() || new Date();

}

/* =====================================================
   今日が特殊服の日か判定
===================================================== */

function getCostumeKey(
  date=getCurrentDate()
){

  const month =
    date.getMonth()+1;

  const day =
    date.getDate();

  /* ---------------------------------------------
     お正月
     1月1日〜1月5日
  --------------------------------------------- */

  if(
    month===1 &&
    day>=1 &&
    day<=5
  ){

    return "newyear";

  }

  /*
   * 1月6日〜1月31日は
   * 通常衣装のまま
   */

  /* ---------------------------------------------
     節分
  --------------------------------------------- */

  if(
    month===2 &&
    day===3
  ){

    return "setsubun";

  }

  /* ---------------------------------------------
     バレンタイン
  --------------------------------------------- */

  if(
    month===2 &&
    day===14
  ){

    return "valentine";

  }

  /* ---------------------------------------------
     ひな祭り
  --------------------------------------------- */

  if(
    month===3 &&
    day===3
  ){

    return "hinamatsuri";

  }

  /* ---------------------------------------------
     ホワイトデー
  --------------------------------------------- */

  if(
    month===3 &&
    day===14
  ){

    return "whiteday";

  }

  /* ---------------------------------------------
     こどもの日
  --------------------------------------------- */

  if(
    month===5 &&
    day===5
  ){

    return "kodomonohi";

  }

  /* ---------------------------------------------
     七夕
  --------------------------------------------- */

  if(
    month===7 &&
    day===7
  ){

    return "tanabata";

  }

  /* ---------------------------------------------
     十五夜
  --------------------------------------------- */

  const monthDay =
    `${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

  const jugoya =
    jugoyaDates[
      date.getFullYear()
    ];

  if(
    jugoya &&
    jugoya===monthDay
  ){

    return "tsukimi";

  }

  /* ---------------------------------------------
     ハロウィン
  --------------------------------------------- */

  if(
    month===10 &&
    day===31
  ){

    return "halloween";

  }

  /* ---------------------------------------------
     クリスマスイブ
  --------------------------------------------- */

  if(
    month===12 &&
    day===24
  ){

    return "christmaseve";

  }

  /* ---------------------------------------------
     クリスマス
  --------------------------------------------- */

  if(
    month===12 &&
    day===25
  ){

    return "christmas";

  }

  /* ---------------------------------------------
     大晦日
     → winter衣装
  --------------------------------------------- */

  if(
    month===12 &&
    day===31
  ){

    return "winter";

  }

  return null;

}

/* =====================================================
   今日のキャラクター画像を取得
===================================================== */

function getCharacterImage(
  character,
  date=getCurrentDate()
){

  const selected =
    character==="chime"
      ? "chime"
      : "bell";

  const costumeKey =
    getCostumeKey(date);

  /*
   * イベント日なら特殊服
   */

  if(
    costumeKey &&
    costumeImages[selected] &&
    costumeImages[selected][costumeKey]
  ){

    return costumeImages[selected][costumeKey];

  }

  /*
   * 通常日は通常画像
   */

  return characterImages[selected].src;

}

/* =====================================================
   キャラクター切り替え
===================================================== */

function setCharacter(
  character
){

  currentCharacter =
    character === "chime"
      ? "chime"
      : "bell";

  const data =
    characterImages[
      currentCharacter
    ];

  if(!data)return;

  /*
   * ★ここで特殊服を判定
   *
   * 特殊服画像が存在しない場合に
   * ブラウザの「？」表示にならないよう、
   * まず通常画像を確保してから特殊画像を読み込む。
   */
  const normalSrc = data.src;
  const costumeSrc = getCharacterImage(
    currentCharacter
  );

  bellImage.alt = data.name;

  bellImage.onerror = function(){
    /* 読み込み失敗時は必ず通常画像へ戻す */
    if(this.src !== new URL(normalSrc, window.location.href).href){
      this.src = normalSrc;
    }
  };

  if(costumeSrc === normalSrc){
    bellImage.src = normalSrc;
  }else{
    const testImage = new Image();

    testImage.onload = function(){
      /* 読み込み成功した特殊服だけ表示 */
      bellImage.src = costumeSrc;
    };

    testImage.onerror = function(){
      if(costumeSrc.endsWith("bell-Christmas.png")){
        const altImage=new Image();
        altImage.onload=()=>{bellImage.src="costumes/bell-christmas.png";};
        altImage.onerror=()=>{bellImage.src=normalSrc;};
        altImage.src="costumes/bell-christmas.png";
        return;
      }
      if(costumeSrc.endsWith("chime-Christmas.png")){
        const altImage=new Image();
        altImage.onload=()=>{bellImage.src="costumes/chime-christmas.png";};
        altImage.onerror=()=>{bellImage.src=normalSrc;};
        altImage.src="costumes/chime-christmas.png";
        return;
      }
      /* 特殊服がない場合は通常のベルちゃんを表示 */
      bellImage.src = normalSrc;
    };

    testImage.src = costumeSrc;
  }

  if(
    currentCharacter === "chime"
  ){

    bellImage.classList.add(
      "chime"
    );

  }else{

    bellImage.classList.remove(
      "chime"
    );

  }

  if(characterName){

    characterName.textContent =
      data.name;

  }

}

/* =====================================================
   日付が変わったら特殊服も切り替える
===================================================== */

let lastCostumeDate="";

function getTodayKey(){

  const now =
    getCurrentDate();

  return `${
    now.getFullYear()
  }-${
    String(
      now.getMonth()+1
    ).padStart(2,"0")
  }-${
    String(
      now.getDate()
    ).padStart(2,"0")
  }`;

}

function updateCostume(){

  const today =
    getTodayKey();

  if(
    today===lastCostumeDate
  ){

    return;

  }

  lastCostumeDate =
    today;

  /*
   * キャラクターはそのまま。
   * 今日の特殊服だけ再判定。
   */

  const costumeImage =
    getCharacterImage(
      currentCharacter
    );

  const normalImage =
    characterImages[currentCharacter].src;

  const normalUrl =
    new URL(
      normalImage,
      window.location.href
    ).href;

  const costumeUrl =
    new URL(
      costumeImage,
      window.location.href
    ).href;

  /* 通常画像ならそのまま */
  if(costumeUrl === normalUrl){
    if(bellImage.src !== normalUrl){
      bellImage.src = normalImage;
    }
    return;
  }

  /* 特殊服画像は、読み込めた場合だけ切り替える */
  const testImage = new Image();

  testImage.onload = function(){
    if(
      lastCostumeDate === today &&
      currentCharacter === currentCharacter
    ){
      bellImage.src = costumeImage;
    }
  };

  testImage.onerror = function(){
    if(costumeImage.endsWith("bell-Christmas.png")){
      const altImage=new Image();
      altImage.onload=()=>{bellImage.src="costumes/bell-christmas.png";};
      altImage.onerror=()=>{bellImage.src=normalImage;};
      altImage.src="costumes/bell-christmas.png";
      return;
    }
    if(costumeImage.endsWith("chime-Christmas.png")){
      const altImage=new Image();
      altImage.onload=()=>{bellImage.src="costumes/chime-christmas.png";};
      altImage.onerror=()=>{bellImage.src=normalImage;};
      altImage.src="costumes/chime-christmas.png";
      return;
    }
    /* 特殊服が存在しない場合は通常画像を維持 */
    bellImage.src = normalImage;
  };

  testImage.src = costumeImage;

}

/*
 * 初回判定
 */

updateCostume();

/*
 * ページを開いたまま日付が変わっても
 * 1分以内に切り替える
 */

setInterval(
  updateCostume,
  60000
);

/* =====================================================
   ログイン状態によるサイズ調整
===================================================== */

function updateLoginSize(){

  try{

    const parentDocument =
      window.parent.document;

    const loggedInElement =
      parentDocument.getElementById(
        "loggedInLeft"
      );

    const isLoggedIn =
      !!loggedInElement &&
      !loggedInElement.classList.contains(
        "hidden"
      );

    document.body.classList.toggle(
      "logged-in",
      isLoggedIn
    );

  }catch(error){

    document.body.classList.remove(
      "logged-in"
    );

  }

}

updateLoginSize();

try{

  const parentDocument =
    window.parent.document;

  const loggedInElement =
    parentDocument.getElementById(
      "loggedInLeft"
    );

  if(loggedInElement){

    new MutationObserver(
      updateLoginSize
    ).observe(
      loggedInElement,
      {
        attributes:true,
        attributeFilter:["class"]
      }
    );

  }

}catch(error){}

setInterval(
  updateLoginSize,
  500
);

/* =====================================================
   メッセージ関連
===================================================== */

let bellMessages=[];

const isEmbedded =
  window.parent !== window;

let parentSchedules={};

function setBellMessages(
  messages,
  preferred=null
){

  const cleaned=[
    ...new Set(
      (messages || [])
        .filter(
          v =>
            typeof v === "string" &&
            v.trim()
        )
    )
  ];

  if(!cleaned.length)return;

  bellMessages=cleaned;

  showMessage(
    preferred &&
    cleaned.includes(preferred)
      ? preferred
      : pickRandom(cleaned)
  );

}

function buildBellMessages(
  schedules
){

  const now =
    getCurrentDate();

  const values =
    Object.values(
      schedules || {}
    )
    .filter(
      s =>
        s &&
        typeof s === "object"
    );

  const all=[
    ...buildRegularMessages(
      values,
      now
    )
  ];

  try{

    const today =
      dateString(now);

    all.push(
      ...getClubBeforeStartMessages(
        values,
        today,
        now
      )
    );

  }catch(error){

    console.warn(
      "ベルちゃんの部活前メッセージを作成できませんでした",
      error
    );

  }

  try{

    const today =
      dateString(now);

    getEventSchedulesForDate(
      values,
      today
    ).forEach(
      event=>{

        all.push(
          `今日は${
            event.title ||
            (
              event.type==="concert"
                ? "演奏会"
                : "イベント"
            )
          }だね！`
        );

      }
    );

  }catch(error){

    console.warn(
      "ベルちゃんの当日イベントメッセージを作成できませんでした",
      error
    );

  }

  try{

    const today =
      dateString(now);

    getUpcomingEvents(
      values,
      today
    ).forEach(
      event=>{

        all.push(
          `もうすぐ${
            event.title ||
            (
              event.type==="concert"
                ? "演奏会"
                : "イベント"
            )
          }だね！`
        );

      }
    );

  }catch(error){

    console.warn(
      "ベルちゃんの予定メッセージを作成できませんでした",
      error
    );

  }

  return [
    ...new Set(all)
  ];

}

function receiveParentSchedules(
  schedules
){

  parentSchedules =
    schedules &&
    typeof schedules === "object"
      ? schedules
      : {};

  setBellMessages(
    buildBellMessages(
      parentSchedules
    )
  );

}

/* =====================================================
   日付・時間
===================================================== */

function pad(n){

  return String(n)
    .padStart(2,"0");

}

function dateString(
  date=getCurrentDate()
){

  return `${
    date.getFullYear()
  }-${
    pad(date.getMonth()+1)
  }-${
    pad(date.getDate())
  }`;

}

function monthString(
  date=getCurrentDate()
){

  return `${
    date.getFullYear()
  }-${
    pad(date.getMonth()+1)
  }`;

}

function timeToMinutes(
  value
){

  const match =
    String(value || "")
      .match(
        /^(\d{1,2}):(\d{2})$/
      );

  if(!match)return null;

  return (
    Number(match[1])*60 +
    Number(match[2])
  );

}

/* =====================================================
   挨拶
===================================================== */

function getGreeting(
  date=getCurrentDate()
){

  const hour =
    date.getHours();

  if(
    hour>=4 &&
    hour<10
  ){

    return "おはよう！";

  }

  if(
    hour>=10 &&
    hour<17
  ){

    return "こんにちは！";

  }

  return "こんばんは!";

}

function greetingMessage(
  text,
  date=getCurrentDate()
){

  return `${
    getGreeting(date)
  }${text}`;

}

/* =====================================================
   時刻表示
===================================================== */

function formatJapaneseTime(
  value
){

  const match =
    String(value || "")
      .match(
        /^(\d{1,2}):(\d{2})$/
      );

  if(!match){

    return String(
      value || ""
    );

  }

  return `${
    Number(match[1])
  }時${
    match[2]
  }分`;

}

function formatTimeRange(
  time
){

  const value =
    String(time || "")
      .trim();

  if(
    !value ||
    value==="終日"
  ){

    return "";

  }

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]\s*(\d{1,2}:\d{2})$/
    );

  if(!match){

    return value;

  }

  return `${
    formatJapaneseTime(match[1])
  }〜${
    formatJapaneseTime(match[2])
  }`;

}

function getStartTime(
  time
){

  const value =
    String(time || "")
      .trim();

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]/
    );

  return match
    ? timeToMinutes(match[1])
    : null;

}

/* =====================================================
   日付計算
===================================================== */

function getTomorrowString(
  date=getCurrentDate()
){

  const tomorrow =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()+1
    );

  return dateString(
    tomorrow
  );

}

function daysFromToday(
  dateStringValue,
  today=getCurrentDate()
){

  const target =
    new Date(
      `${dateStringValue}T00:00:00`
    );

  const base =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

  return Math.round(
    (
      target-base
    ) / 86400000
  );

}

function isUpcomingWithinDays(
  dateValue,
  today,
  days
){

  if(!dateValue)return false;

  const diff =
    daysFromToday(
      dateValue,
      today
    );

  return (
    diff>0 &&
    diff<=days
  );

}

/* =====================================================
   スケジュール
===================================================== */

function getNormalSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      s.type==="normal" &&
      s.date===date
  );

}

function getEventSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      (
        s.type==="concert" ||
        s.type==="event"
      ) &&
      s.date===date
  );

}

function getUpcomingEvents(
  values,
  today
){

  return values
    .filter(
      s =>
        s &&
        (
          s.type==="concert" ||
          s.type==="event"
        ) &&
        isUpcomingWithinDays(
          s.date,
          today,
          7
        )
    )
    .sort(
      (a,b)=>
        String(a.date)
          .localeCompare(
            String(b.date)
          )
    );

}

function getMonthlyClubCount(
  values,
  today
){

  const month =
    monthString(today);

  return values.filter(
    s =>
      s &&
      (
        s.type==="normal" ||
        !s.type
      ) &&
      typeof s.date === "string" &&
      s.date.startsWith(month)
  ).length;

}

/* =====================================================
   部活前メッセージ
===================================================== */

function getClubBeforeStartMessages(
  values,
  today,
  dateNow
){

  const todayNormal =
    getNormalSchedulesForDate(
      values,
      today
    )[0];

  if(!todayNormal)return [];

  const start =
    getStartTime(
      todayNormal.time
    );

  const nowMinutes =
    dateNow.getHours()*60 +
    dateNow.getMinutes();

  if(
    start===null ||
    nowMinutes>=start
  ){

    return [];

  }

  const range =
    formatTimeRange(
      todayNormal.time
    );

  const result=[];

  if(range){

    result.push(
      greetingMessage(
        `今日の部活は${range}だよ`,
        dateNow
      )
    );

  }

  result.push(

    greetingMessage(
      "今日の部活、頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日もみんなでハンドベル頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日の部活も楽しみだね！",
      dateNow
    ),

    greetingMessage(
      "今日はどんな曲を練習するのかな？",
      dateNow
    ),

    greetingMessage(
      "今日の部活も一緒に頑張ろうね！",
      dateNow
    )

  );

  return result;

}

/* =====================================================
   ランダム
===================================================== */

function pickRandom(
  list
){

  if(!list.length){

    return "予定を確認してみてね！";

  }

  return list[
    Math.floor(
      Math.random()*list.length
    )
  ];

}

/* =====================================================
   メッセージ表示
===================================================== */

function showMessage(
  text
){

  message.textContent =
    text;

}

function changeBellMessage(){

  if(!bellMessages.length)return;

  let next =
    pickRandom(
      bellMessages
    );

  if(
    bellMessages.length>1 &&
    next===message.textContent
  ){

    const other =
      bellMessages.filter(
        item =>
          item !==
          message.textContent
      );

    next =
      pickRandom(other);

  }

  showMessage(next);

}

function startHearts(){

  if(!heartContainer)return;

  const hearts=[];

  for(let i=0;i<14;i++){

    hearts.push({

      startX:
        -55 +
        Math.random()*110,

      startY:
        -10 +
        Math.random()*25,

      endX:
        -130 +
        Math.random()*260,

      endY:
        -120 -
        Math.random()*150

    });

  }

  for(let i=0;i<10;i++){

    hearts.push({

      startX:
        -35 -
        Math.random()*35,

      startY:
        -10 -
        Math.random()*35,

      endX:
        -100 -
        Math.random()*120,

      endY:
        -70 -
        Math.random()*120

    });

  }

  for(let i=0;i<10;i++){

    hearts.push({

      startX:
        35 +
        Math.random()*35,

      startY:
        -10 -
        Math.random()*35,

      endX:
        100 +
        Math.random()*120,

      endY:
        -70 -
        Math.random()*120

    });

  }

  for(let i=12;i--;){

    hearts.push({

      startX:
        -45 -
        Math.random()*20,

      startY:
        -40 +
        Math.random()*90,

      endX:
        -130 -
        Math.random()*140,

      endY:
        -70 +
        Math.random()*160

    });

  }

  for(let i=12;i--;){

    hearts.push({

      startX:
        45 +
        Math.random()*20,

      startY:
        -40 +
        Math.random()*90,

      endX:
        130 +
        Math.random()*140,

      endY:
        -70 +
        Math.random()*160

    });

  }

  for(let i=8;i--;){

    hearts.push({

      startX:
        -40 -
        Math.random()*25,

      startY:
        30 +
        Math.random()*25,

      endX:
        -100 -
        Math.random()*130,

      endY:
        50 +
        Math.random()*100

    });

  }

  for(let i=8;i--;){

    hearts.push({

      startX:
        40 +
        Math.random()*25,

      startY:
        30 +
        Math.random()*25,

      endX:
        100 +
        Math.random()*130,

      endY:
        50 +
        Math.random()*100

    });

  }

  hearts.forEach(
    (data,index)=>{

      const heart =
        document.createElement(
          "span"
        );

      heart.className =
        "heart";

      heart.textContent =
        index % 4 === 0
          ? "♡"
          : "♥";

      heart.style.setProperty(
        "--start-x",
        `${data.startX}px`
      );

      heart.style.setProperty(
        "--start-y",
        `${data.startY}px`
      );

        "--end-x",
        `${data.endX}px`
      );

      heart.style.setProperty(
        "--end-y",
        `${data.endY}px`
      );

      const rotation =
        -60 +
        Math.random()*120;

      heart.style.setProperty(
        "--rotate",
        `${rotation}deg`
      );

      const size =
        11 +
        Math.random()*13;

      heart.style.fontSize =
        `${size}px`;

      const delay =
        Math.random()*350;

      heart.style.animationDelay =
        `${delay}ms`;

      heartContainer.appendChild(
        heart
      );

      heart.addEventListener(
        "animationend",
        ()=>{
          heart.remove();
        }
      );

    }
  );

}

/* =====================================================

===================================================== */

let isAnimating=false;

/* =====================================================
   キャラクターをクリック
===================================================== */

function celebrate(){

  if(isAnimating)return;

  isAnimating=true;

  bubble.classList.add(
    "bubble-hidden"
  );

  bellImage.classList.remove(
    "celebrating"
  );

  void bellImage.offsetWidth;

  bellImage.classList.add(
    "celebrating"
  );

  setTimeout(
    ()=>{
      startHearts();
    },
    150
  );

  setTimeout(
    ()=>{
      startHearts();
    },
    950
  );

}

/* =====================================================
   アニメーション終了
===================================================== */

bellImage.addEventListener(
  "animationend",
  event=>{

    if(
      event.animationName !==
      "bellCelebrate"
    ){

      return;

    }

    bellImage.classList.remove(
      "celebrating"
    );

    changeBellMessage();

    bubble.classList.remove(
      "bubble-hidden"
    );

    bubble.style.animation="none";

    void bubble.offsetWidth;

    bubble.style.animation="";

    isAnimating=false;

  }
);
