<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベルちゃん</title>

<style>

/* =====================================================
   ベルちゃん共通設定
===================================================== */

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
}

.bell-area{
  position:relative;
  width:100%;
  height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

/* =====================================================
   ベルちゃん本体
===================================================== */

.bell{
  position:absolute;
  max-width:62%;
  height:auto;
  filter:none;
  cursor:pointer;
  user-select:none;
  transition:transform .15s ease;
  z-index:10;
}

.bell:active{
  transform:scale(.96);
}

/* =====================================================
   吹き出し
===================================================== */

.bubble{
  position:absolute;
  max-width:calc(100vw - 8px);
  background:#fff;
  border:2px solid #d9e5ed;
  border-radius:18px;
  padding:7px 8px;
  box-shadow:none;
  font-size:10px;
  line-height:1.55;
  animation:bubbleAppear .55s cubic-bezier(.2,.9,.25,1.2) both;
  z-index:20;
}

.bubble small{
  display:block;
  color:#84939d;
  font-size:8px;
  margin-bottom:2px;
}

/* =====================================================
   ログイン前
===================================================== */

body:not(.logged-in) .bell{
  width:100px;
  right:0px;
  bottom:0px;
}

body:not(.logged-in) .bubble{
  width:215px;
  right:3px;
  bottom:95px;
}

body:not(.logged-in) .bubble:after{
  content:"";
  position:absolute;
  width:12px;
  height:12px;
  right:20px;
  bottom:-7px;
  background:#fff;
  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;
  transform:rotate(45deg);
}

/* =====================================================
   ログイン後
===================================================== */

body.logged-in .bell{
  width:100px;
  right:0px;
  bottom:0px;
}

body.logged-in .bubble{
  width:215px;
  right:3px;
  bottom:95px;
}

body.logged-in .bubble:after{
  content:"";
  position:absolute;
  width:12px;
  height:12px;
  right:20px;
  bottom:-7px;
  background:#fff;
  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;
  transform:rotate(45deg);
}

/* =====================================================
   吹き出し表示アニメーション
===================================================== */

@keyframes bubbleAppear{
  from{
    opacity:0;
    transform:scale(.9) translateY(7px);
  }

  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

/* =====================================================
   喜び中は吹き出しを消す
===================================================== */

.bubble.bubble-hidden{
  visibility:hidden;
  opacity:0;
  pointer-events:none;
}

/* =====================================================
   ベルちゃん喜びアニメーション
   2回ジャンプ
===================================================== */

.bell.celebrating{
  animation:
    bellCelebrate 1.8s cubic-bezier(.35,.75,.45,1) both;
}

/* =====================================================
   喜びジャンプ
===================================================== */

@keyframes bellCelebrate{

  /* スタート */
  0%{
    transform:translateY(0) rotate(0deg) scale(1);
  }

  /* 1回目：勢いよくジャンプ */
  12%{
    transform:translateY(-16px)
      rotate(-7deg)
      scale(1.05);
  }

  /* 空中 */
  23%{
    transform:translateY(-30px)
      rotate(7deg)
      scale(1.08);
  }

  /* 着地 */
  34%{
    transform:translateY(0)
      rotate(-4deg)
      scale(.98);
  }

  /* 少し弾む */
  42%{
    transform:translateY(-7px)
      rotate(3deg)
      scale(1.02);
  }

  /* 2回目ジャンプ */
  52%{
    transform:translateY(-22px)
      rotate(-8deg)
      scale(1.07);
  }

  /* 2回目の頂点 */
  64%{
    transform:translateY(-38px)
      rotate(8deg)
      scale(1.1);
  }

  /* 着地 */
  77%{
    transform:translateY(0)
      rotate(-5deg)
      scale(.98);
  }

  /* 最後にぷるん */
  86%{
    transform:translateY(-5px)
      rotate(3deg)
      scale(1.03);
  }

  94%{
    transform:translateY(0)
      rotate(-1deg)
      scale(1);
  }

  /* 終了 */
  100%{
    transform:translateY(0)
      rotate(0deg)
      scale(1);
  }
}

/* =====================================================
   ハート
===================================================== */

.heart-container{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:visible;
  z-index:30;
}

.heart{
  position:absolute;
  color:#ff7eb9;
  font-size:16px;
  font-weight:bold;
  line-height:1;
  pointer-events:none;
  opacity:0;

  animation:
    heartFly var(--heart-duration)
    cubic-bezier(.2,.7,.35,1)
    var(--heart-delay)
    both;
}

/* =====================================================
   ハートがベルちゃんの周囲から飛ぶ
===================================================== */

@keyframes heartFly{

  0%{
    opacity:0;
    transform:
      translate(0,0)
      scale(.3)
      rotate(0deg);
  }

  10%{
    opacity:1;
  }

  35%{
    opacity:1;
  }

  70%{
    opacity:.9;
  }

  100%{
    opacity:0;
    transform:
      translate(
        var(--heart-x),
        var(--heart-y)
      )
      scale(var(--heart-scale))
      rotate(var(--heart-rotate));
  }
}

</style>
</head>


<body>

<div class="bell-area">

  <div class="bubble">
    <small>ベルちゃん</small>
    <span id="bellMessage">予定を確認してるよ！</span>
  </div>

  <img
    class="bell"
    src="bell.png"
    alt="ベルちゃん"
    id="bellImage"
  >

  <!-- ハートを出す場所 -->
  <div
    class="heart-container"
    id="heartContainer">
  </div>

</div>


<script type="module">

/* =====================================================
   基本要素
===================================================== */

const message =
  document.getElementById("bellMessage");

const bellImage =
  document.getElementById("bellImage");

const bubble =
  document.querySelector(".bubble");

const heartContainer =
  document.getElementById("heartContainer");


/* =====================================================
   ログイン状態によるサイズ調整
===================================================== */

function updateLoginSize(){

  try{

    const parentDocument =
      window.parent.document;

    const loggedInElement =
      parentDocument.getElementById("loggedInLeft");

    const isLoggedIn =
      !!loggedInElement &&
      !loggedInElement.classList.contains("hidden");

    document.body.classList.toggle(
      "logged-in",
      isLoggedIn
    );

  }catch(error){

    document.body.classList.remove(
      "logged-in"
    );

  }

}

updateLoginSize();


try{

  const parentDocument =
    window.parent.document;

  const loggedInElement =
    parentDocument.getElementById("loggedInLeft");

  if(loggedInElement){

    new MutationObserver(updateLoginSize)
      .observe(
        loggedInElement,
        {
          attributes:true,
          attributeFilter:["class"]
        }
      );

  }

}catch(error){}


setInterval(updateLoginSize,500);


/* =====================================================
   ベルちゃんメッセージ
===================================================== */

let bellMessages=[];

const isEmbedded =
  window.parent !== window;

let parentSchedules={};


function setBellMessages(
  messages,
  preferred=null
){

  const cleaned=[
    ...new Set(
      (messages || [])
        .filter(
          v =>
            typeof v === "string" &&
            v.trim()
        )
    )
  ];

  if(!cleaned.length)return;

  bellMessages=cleaned;

  showMessage(
    preferred &&
    cleaned.includes(preferred)
      ? preferred
      : pickRandom(cleaned)
  );

}


/* =====================================================
   メッセージ作成
===================================================== */

function buildBellMessages(schedules){

  const now=new Date();

  const values=
    Object.entries(schedules || {})
      .filter(
        ([,s]) =>
          s &&
          typeof s === "object"
      )
      .map(
        ([key,s])=>{

          if(
            (s.type==="normal" || !s.type) &&
            typeof s.date !== "string"
          ){

            return {
              ...s,
              date:key
            };

          }

          return s;

        }
      );

  const all=[
    ...buildRegularMessages(
      values,
      now
    )
  ];


  try{

    const today=
      dateString(now);

    all.push(
      ...getClubBeforeStartMessages(
        values,
        today,
        now
      )
    );

  }catch(error){

    console.warn(
      "ベルちゃんの部活前メッセージを作成できませんでした",
      error
    );

  }


  try{

    const today=
      dateString(now);

    getEventSchedulesForDate(
      values,
      today
    ).forEach(event=>{

      all.push(
        `今日は${
          event.title ||
          (
            event.type==="concert"
              ? "演奏会"
              : "イベント"
          )
        }だね！`
      );

    });

  }catch(error){

    console.warn(
      "ベルちゃんの当日イベントメッセージを作成できませんでした",
      error
    );

  }


  try{

    const today=
      dateString(now);

    getUpcomingEvents(
      values,
      today
    ).forEach(event=>{

      all.push(
        `もうすぐ${
          event.title ||
          (
            event.type==="concert"
              ? "演奏会"
              : "イベント"
          )
        }だね！`
      );

    });

  }catch(error){

    console.warn(
      "ベルちゃんの予定メッセージを作成できませんでした",
      error
    );

  }


  return [
    ...new Set(all)
  ];

}


function receiveParentSchedules(schedules){

  parentSchedules =
    schedules &&
    typeof schedules === "object"
      ? schedules
      : {};

  setBellMessages(
    buildBellMessages(
      parentSchedules
    )
  );

}


window.addEventListener(
  "message",
  event=>{

    if(
      !event.data ||
      event.data.type !==
        "handbell-schedules"
    )return;

    receiveParentSchedules(
      event.data.schedules
    );

  }
);


/* =====================================================
   日付・時間
===================================================== */

function pad(n){

  return String(n)
    .padStart(2,"0");

}


function dateString(
  date=new Date()
){

  return `${
    date.getFullYear()
  }-${
    pad(date.getMonth()+1)
  }-${
    pad(date.getDate())
  }`;

}


function monthString(
  date=new Date()
){

  return `${
    date.getFullYear()
  }-${
    pad(date.getMonth()+1)
  }`;

}


function timeToMinutes(value){

  const match =
    String(value || "")
      .match(
        /^(\d{1,2}):(\d{2})$/
      );

  if(!match)return null;

  return (
    Number(match[1])*60 +
    Number(match[2])
  );

}


/* =====================================================
   あいさつ
===================================================== */

function getGreeting(
  date=new Date()
){

  const hour =
    date.getHours();

  if(hour>=4 && hour<10)
    return "おはよう！";

  if(hour>=10 && hour<17)
    return "こんにちは！";

  return "こんばんは!";

}


function greetingMessage(
  text,
  date=new Date()
){

  return `${
    getGreeting(date)
  }${text}`;

}


function formatJapaneseTime(value){

  const match =
    String(value || "")
      .match(
        /^(\d{1,2}):(\d{2})$/
      );

  if(!match)
    return String(value || "");

  return `${
    Number(match[1])
  }時${
    match[2]
  }分`;

}


function formatTimeRange(time){

  const value =
    String(time || "").trim();

  if(
    !value ||
    value === "終日"
  )return "";

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]\s*(\d{1,2}:\d{2})$/
    );

  if(!match)
    return value;

  return `${
    formatJapaneseTime(match[1])
  }〜${
    formatJapaneseTime(match[2])
  }`;

}


function getStartTime(time){

  const value =
    String(time || "").trim();

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]/
    );

  return match
    ? timeToMinutes(match[1])
    : null;

}


function getTomorrowString(
  date=new Date()
){

  const tomorrow =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()+1
    );

  return dateString(
    tomorrow
  );

}


function daysFromToday(
  dateStringValue,
  today=new Date()
){

  const target =
    new Date(
      `${dateStringValue}T00:00:00`
    );

  const base =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

  return Math.round(
    (
      target-base
    )/86400000
  );

}


function isUpcomingWithinDays(
  dateValue,
  today,
  days
){

  if(!dateValue)
    return false;

  const diff =
    daysFromToday(
      dateValue,
      today
    );

  return (
    diff>0 &&
    diff<=days
  );

}


/* =====================================================
   予定取得
===================================================== */

function getNormalSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      s.type==="normal" &&
      s.date===date
  );

}


function getEventSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      (
        s.type==="concert" ||
        s.type==="event"
      ) &&
      s.date===date
  );

}


function getUpcomingEvents(
  values,
  today
){

  return values
    .filter(
      s =>
        s &&
        (
          s.type==="concert" ||
          s.type==="event"
        ) &&
        isUpcomingWithinDays(
          s.date,
          today,
          7
        )
    )
    .sort(
      (a,b)=>
        String(a.date)
          .localeCompare(
            String(b.date)
          )
    );

}


function getMonthlyClubCount(
  values,
  today
){

  const month =
    monthString(today);

  return values.filter(
    s =>
      s &&
      (
        s.type==="normal" ||
        !s.type
      ) &&
      typeof s.date==="string" &&
      s.date.startsWith(month)
  ).length;

}


/* =====================================================
   部活前メッセージ
===================================================== */

function getClubBeforeStartMessages(
  values,
  today,
  dateNow
){

  const todayNormal =
    getNormalSchedulesForDate(
      values,
      today
    )[0];

  if(!todayNormal)
    return [];

  const start =
    getStartTime(
      todayNormal.time
    );

  const nowMinutes =
    dateNow.getHours()*60 +
    dateNow.getMinutes();

  if(
    start===null ||
    nowMinutes>=start
  )return [];

  const range =
    formatTimeRange(
      todayNormal.time
    );

  const result=[];

  if(range){

    result.push(
      greetingMessage(
        `今日の部活は${range}だよ`,
        dateNow
      )
    );

  }

  result.push(

    greetingMessage(
      "今日の部活、頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日もみんなでハンドベル頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日の部活も楽しみだね！",
      dateNow
    ),

    greetingMessage(
      "今日はどんな曲を練習するのかな？",
      dateNow
    ),

    greetingMessage(
      "今日の部活も一緒に頑張ろうね！",
      dateNow
    )

  );

  return result;

}


/* =====================================================
   通常メッセージ
===================================================== */

function buildRegularMessages(
  values,
  dateNow
){

  const result=[];

  const hour =
    dateNow.getHours();

  const monthCount =
    getMonthlyClubCount(
      values,
      dateNow
    );


  if(
    hour>=4 &&
    hour<10
  ){

    result.push(

      "おはよう！",

      "おはよう！今日も一日頑張ろうね！",

      "おはよう！無理せず頑張ろうね！",

      "おはよう！今日も楽しく過ごそうね！",

      "おはよう！予定を確認してみてね！",

      "おはよう！今月の予定もチェックしてみてね！",

      "おはよう！みんなで楽しく活動しようね！",

      "おはよう！今日も素敵な一日にしようね！",

      "おはよう！今日も予定を見にきてくれてありがとう",

      `おはよう！今月の部活は${monthCount}回だよ`

    );


    if(
      hour>=4 &&
      hour<6.5
    ){

      result.push(
        "おはよう〜まだ眠いよ〜"
      );

    }


    if(
      hour>=5 &&
      hour<7
    ){

      result.push(
        "おはよう！朝はやいね"
      );

    }

  }

  else if(
    hour>=10 &&
    hour<17
  ){

    result.push(

      "こんにちは！",

      "こんにちは！無理せず頑張ろうね！",

      "こんにちは！今日も楽しく過ごそうね！",

      "こんにちは！予定を確認してみてね！",

      "こんにちは！今月の予定もチェックしてみてね！",

      "こんにちは！みんなで楽しく活動しようね！",

      "こんにちは！今日も素敵な一日にしようね！",

      "こんにちは！今日も予定を見にきてくれてありがとう",

      `こんにちは！今月の部活は${monthCount}回だよ`

    );


    if(
      hour>=12 &&
      hour<13
    ){

      result.push(
        "こんにちは！お昼ご飯はもう食べたかな？"
      );

    }


    if(
      hour>=12 &&
      hour<15
    ){

      result.push(
        "こんにちは！今日のお昼ご飯なんだった？"
      );

    }

  }

  else{

    result.push(

      "こんばんは！",

      "こんばんは！予定を確認してみてね！",

      "こんばんは！今月の予定もチェックしてみてね！",

      "こんばんは！今日も予定を見にきてくれてありがとう",

      "こんばんは！今日はどんな1日だったかな？",

      "こんばんは！1日お疲れ様！",

      "こんばんは！明日も1日頑張ろう！",

      "こんばんは！自主練はもうやった？",

      `こんばんは！今月の部活は${monthCount}回だよ`

    );


    if(
      hour>=22 &&
      hour<24
    ){

      result.push(
        "こんばんは〜。そろそろ眠たくなっちゃった、、、"
      );

    }


    if(
      getNormalSchedulesForDate(
        values,
        getTomorrowString(dateNow)
      ).length>0
    ){

      result.push(
        "こんばんは！明日も部活頑張ろう！"
      );

    }


    if(
      hour>=22 &&
      hour<24
    ){

      result.push(
        "こんばんは！夜遅くまでお疲れ様"
      );

    }

  }


  return result;

}


/* =====================================================
   ランダム
===================================================== */

function pickRandom(list){

  if(!list.length)
    return "予定を確認してみてね！";

  return list[
    Math.floor(
      Math.random()*list.length
    )
  ];

}


function chooseBellMessage(
  schedules
){

  const now =
    new Date();

  const today =
    dateString(now);

  const values =
    Object.values(
      schedules || {}
    ).filter(
      s =>
        s &&
        typeof s === "object"
    );

  const regularMessages =
    buildRegularMessages(
      values,
      now
    );

  const todayEvents =
    getEventSchedulesForDate(
      values,
      today
    );


  if(
    todayEvents.length>0 &&
    Math.random()<0.5
  ){

    const event =
      todayEvents[
        Math.floor(
          Math.random()*
          todayEvents.length
        )
      ];

    return `今日は${
      event.title ||
      (
        event.type==="concert"
          ? "演奏会"
          : "イベント"
      )
    }だね！`;

  }


  const upcomingEvents =
    getUpcomingEvents(
      values,
      today
    );


  if(
    upcomingEvents.length>0 &&
    Math.random()<0.2
  ){

    const event =
      upcomingEvents[0];

    return `もうすぐ${
      event.title ||
      (
        event.type==="concert"
          ? "演奏会"
          : "イベント"
      )
    }だね！`;

  }


  const clubMessages =
    getClubBeforeStartMessages(
      values,
      today,
      now
    );

  const combined=[
    ...regularMessages,
    ...clubMessages
  ];

  return pickRandom(
    combined
  );

}


/* =====================================================
   メッセージ表示
===================================================== */

function showMessage(text){

  message.textContent =
    text;

}


function changeBellMessage(){

  if(!bellMessages.length)
    return;

  let next =
    pickRandom(
      bellMessages
    );


  if(
    bellMessages.length>1 &&
    next===message.textContent
  ){

    const other =
      bellMessages.filter(
        item =>
          item !==
          message.textContent
      );

    next =
      pickRandom(other);

  }


  showMessage(next);

}


/* =====================================================
   ハート生成
   ベルちゃんの周囲から大量に飛ばす
===================================================== */

function createHeart(){

  const heart =
    document.createElement("span");

  heart.className="heart";

  /* ハートの種類 */
  heart.textContent =
    Math.random()<0.5
      ? "♥"
      : "♡";


  /*
    ベルちゃんが右下にいるので、
    その周辺を中心にランダム配置
  */

  const side =
    Math.floor(
      Math.random()*5
    );


  let startX;
  let startY;


  if(side===0){

    /* 左側 */
    startX =
      40 +
      Math.random()*25;

    startY =
      55 +
      Math.random()*35;

  }

  else if(side===1){

    /* 上左 */
    startX =
      55 +
      Math.random()*20;

    startY =
      35 +
      Math.random()*25;

  }

  else if(side===2){

    /* 上 */
    startX =
      70 +
      Math.random()*20;

    startY =
      25 +
      Math.random()*25;

  }

  else if(side===3){

    /* 右側 */
    startX =
      82 +
      Math.random()*15;

    startY =
      45 +
      Math.random()*35;

  }

  else{

    /* 足元 */
    startX =
      65 +
      Math.random()*30;

    startY =
      65 +
      Math.random()*30;

  }


  /* 飛んでいく方向 */

  const moveX =
    (Math.random()*2-1)*80;

  const moveY =
    -(70 + Math.random()*130);


  const scale =
    0.7 +
    Math.random()*0.8;


  const rotate =
    -35 +
    Math.random()*70;


  const duration =
    1.4 +
    Math.random()*1.0;


  const delay =
    Math.random()*0.9;


  heart.style.left =
    `${startX}%`;

  heart.style.top =
    `${startY}%`;

  heart.style.fontSize =
    `${13 + Math.random()*11}px`;

  heart.style.setProperty(
    "--heart-x",
    `${moveX}px`
  );

  heart.style.setProperty(
    "--heart-y",
    `${moveY}px`
  );

  heart.style.setProperty(
    "--heart-scale",
    scale
  );

  heart.style.setProperty(
    "--heart-rotate",
    `${rotate}deg`
  );

  heart.style.setProperty(
    "--heart-duration",
    `${duration}s`
  );

  heart.style.setProperty(
    "--heart-delay",
    `${delay}s`
  );


  heartContainer.appendChild(
    heart
  );


  heart.addEventListener(
    "animationend",
    ()=>{
      heart.remove();
    },
    {
      once:true
    }
  );

}


/* =====================================================
   大量のハートを発生
===================================================== */

function startHearts(){

  /*
    20個を一気に作る
  */

  for(
    let i=0;
    i<20;
    i++
  ){

    createHeart();

  }

}


/* =====================================================
   喜びアニメーション
===================================================== */

let isAnimating=false;


function celebrate(){

  if(isAnimating)
    return;


  isAnimating=true;


  /* 吹き出しを消す */
  bubble.classList.add(
    "bubble-hidden"
  );


  /* ベルちゃんを喜ばせる */
  bellImage.classList.add(
    "celebrating"
  );


  /* ハート大量発射 */
  startHearts();


  /*
    ベルちゃん本体の
    1.8秒アニメーション終了後
  */

  bellImage.addEventListener(
    "animationend",
    ()=>{

      bellImage.classList.remove(
        "celebrating"
      );

      /* 新しいメッセージ */
      changeBellMessage();

      /* 吹き出しを再表示 */
      bubble.classList.remove(
        "bubble-hidden"
      );

      /* 吹き出し再アニメーション */
      bubble.style.animation="none";

      void bubble.offsetWidth;

      bubble.style.animation =
        "bubbleAppear .55s cubic-bezier(.2,.9,.25,1.2) both";


      isAnimating=false;

    },
    {
      once:true
    }
  );

}


/* =====================================================
   初期化
===================================================== */

setBellMessages(
  buildBellMessages({})
);


/* =====================================================
   親ページとの通信
===================================================== */

if(isEmbedded){

  window.parent.postMessage(
    {
      type:"handbell-ready"
    },
    "*"
  );

}


/* =====================================================
   ベルちゃんをクリック
===================================================== */

bellImage.addEventListener(
  "click",
  celebrate
);

</script>
