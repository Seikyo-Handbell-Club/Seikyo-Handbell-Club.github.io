<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベルちゃん</title>

<style>

/* =====================================================
   ベルちゃん共通設定
===================================================== */

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
}

.bell-area{
  position:relative;
  width:100%;
  height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.bell{
  position:absolute;
  max-width:62%;
  height:auto;
  filter:none;
  cursor:pointer;
  user-select:none;
  z-index:10;
  transform-origin:center bottom;
}

.bell:active{
  transform:scale(.96);
}


/* =====================================================
   吹き出し
===================================================== */

.bubble{
  position:absolute;
  max-width:calc(100vw - 8px);
  background:#fff;
  border:2px solid #d9e5ed;
  border-radius:18px;
  padding:7px 8px;
  box-shadow:none;
  font-size:10px;
  line-height:1.55;
  animation:
    bubbleAppear
    .55s
    cubic-bezier(.2,.9,.25,1.2)
    both;
  z-index:20;
}

.bubble small{
  display:block;
  color:#84939d;
  font-size:8px;
  margin-bottom:2px;
}


/* =====================================================
   ログイン前
===================================================== */

body:not(.logged-in) .bell{
  width:100px;
  right:0px;
  bottom:0px;
}

body:not(.logged-in) .bubble{
  width:215px;
  right:3px;
  bottom:90px;
}

body:not(.logged-in) .bubble:after{
  content:"";
  position:absolute;

  width:12px;
  height:12px;

  right:20px;
  bottom:-7px;

  background:#fff;

  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;

  transform:rotate(45deg);
}


/* =====================================================
   ログイン後
===================================================== */

body.logged-in .bell{
  width:100px;
  right:0px;
  bottom:0px;
}

body.logged-in .bubble{
  width:215px;
  right:3px;
  bottom:90px;
}

body.logged-in .bubble:after{
  content:"";
  position:absolute;

  width:12px;
  height:12px;

  right:20px;
  bottom:-7px;

  background:#fff;

  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;

  transform:rotate(45deg);
}


/* =====================================================
   吹き出し表示アニメーション
===================================================== */

@keyframes bubbleAppear{

  from{
    opacity:0;
    transform:
      scale(.9)
      translateY(7px);
  }

  to{
    opacity:1;
    transform:
      scale(1)
      translateY(0);
  }

}


/* =====================================================
   吹き出しを消す
===================================================== */

.bubble.celebration-hidden{
  opacity:0 !important;
  visibility:hidden !important;
  pointer-events:none !important;
}


/* =====================================================
   吹き出しを再表示
===================================================== */

.bubble.celebration-show{
  animation:
    bubbleAppear
    .55s
    cubic-bezier(.2,.9,.25,1.2)
    both;
}


/* =====================================================
   ベルちゃん お祝いアニメーション
===================================================== */

/*
   ここがクリック時のメインアニメーション。

   2回ジャンプ
   ↓
   左右に大きく揺れる
   ↓
   最後に着地
*/

.bell.celebrating{
  pointer-events:none;
  cursor:default;

  animation:
    bellCelebrate
    1.8s
    ease-in-out
    forwards;
}


@keyframes bellCelebrate{

  /* スタート */
  0%{
    transform:
      translate3d(0,0,0)
      rotate(0deg)
      scale(1);
  }


  /* -------------------------
     1回目ジャンプ
  ------------------------- */

  8%{
    transform:
      translate3d(-8px,-8px,0)
      rotate(-8deg)
      scale(1.04);
  }

  16%{
    transform:
      translate3d(10px,-45px,0)
      rotate(10deg)
      scale(1.08);
  }

  23%{
    transform:
      translate3d(-9px,-65px,0)
      rotate(-12deg)
      scale(1.1);
  }

  30%{
    transform:
      translate3d(8px,-32px,0)
      rotate(9deg)
      scale(1.06);
  }

  36%{
    transform:
      translate3d(0,0,0)
      rotate(-5deg)
      scale(1.02);
  }


  /* -------------------------
     2回目ジャンプ
  ------------------------- */

  43%{
    transform:
      translate3d(-10px,-10px,0)
      rotate(-9deg)
      scale(1.05);
  }

  51%{
    transform:
      translate3d(12px,-55px,0)
      rotate(12deg)
      scale(1.1);
  }

  59%{
    transform:
      translate3d(-10px,-82px,0)
      rotate(-14deg)
      scale(1.13);
  }

  67%{
    transform:
      translate3d(10px,-38px,0)
      rotate(11deg)
      scale(1.07);
  }

  73%{
    transform:
      translate3d(0,0,0)
      rotate(-7deg)
      scale(1.03);
  }


  /* -------------------------
     着地後のバタバタ
  ------------------------- */

  78%{
    transform:
      translate3d(-8px,-3px,0)
      rotate(-10deg)
      scale(1.02);
  }

  82%{
    transform:
      translate3d(8px,0,0)
      rotate(10deg)
      scale(1.02);
  }

  86%{
    transform:
      translate3d(-7px,-2px,0)
      rotate(-8deg)
      scale(1.01);
  }

  90%{
    transform:
      translate3d(6px,0,0)
      rotate(7deg)
      scale(1.01);
  }

  94%{
    transform:
      translate3d(-3px,0,0)
      rotate(-3deg)
      scale(1);
  }

  100%{
    transform:
      translate3d(0,0,0)
      rotate(0deg)
      scale(1);
  }

}


/* =====================================================
   ハート
===================================================== */

.heart{
  position:absolute;

  width:20px;
  height:20px;

  margin-left:-10px;
  margin-top:-10px;

  color:#ff8fb3;

  font-size:20px;
  line-height:20px;
  text-align:center;

  pointer-events:none;
  user-select:none;

  z-index:30;

  animation:
    heartFly
    1.2s
    ease-out
    forwards;
}


@keyframes heartFly{

  0%{
    opacity:0;
    transform:
      translate3d(0,0,0)
      scale(.3)
      rotate(0deg);
  }

  15%{
    opacity:1;
    transform:
      translate3d(
        var(--x1),
        -20px,
        0
      )
      scale(1.15)
      rotate(var(--r1));
  }

  45%{
    opacity:1;
    transform:
      translate3d(
        var(--x2),
        -55px,
        0
      )
      scale(1)
      rotate(var(--r2));
  }

  75%{
    opacity:.8;
    transform:
      translate3d(
        var(--x3),
        -90px,
        0
      )
      scale(.85)
      rotate(var(--r3));
  }

  100%{
    opacity:0;
    transform:
      translate3d(
        var(--x4),
        -125px,
        0
      )
      scale(.55)
      rotate(var(--r4));
  }

}

</style>
</head>


<body>

<div class="bell-area">

  <div class="bubble">
    <small>ベルちゃん</small>
    <span id="bellMessage">
      予定を確認してるよ！
    </span>
  </div>

  <img
    class="bell"
    src="bell.png"
    alt="ベルちゃん"
    id="bellImage"
  >

</div>


<script type="module">

const message =
  document.getElementById("bellMessage");

const bellImage =
  document.getElementById("bellImage");

const bubble =
  document.querySelector(".bubble");

const bellArea =
  document.querySelector(".bell-area");


/* =====================================================
   ログイン状態
===================================================== */

function updateLoginSize(){

  try{

    const parentDocument =
      window.parent.document;

    const loggedInElement =
      parentDocument.getElementById(
        "loggedInLeft"
      );

    const isLoggedIn =
      !!loggedInElement &&
      !loggedInElement.classList.contains(
        "hidden"
      );

    document.body.classList.toggle(
      "logged-in",
      isLoggedIn
    );

  }catch(error){

    document.body.classList.remove(
      "logged-in"
    );

  }

}


updateLoginSize();


try{

  const parentDocument =
    window.parent.document;

  const loggedInElement =
    parentDocument.getElementById(
      "loggedInLeft"
    );

  if(loggedInElement){

    new MutationObserver(
      updateLoginSize
    ).observe(
      loggedInElement,
      {
        attributes:true,
        attributeFilter:["class"]
      }
    );

  }

}catch(error){}


setInterval(
  updateLoginSize,
  500
);


/* =====================================================
   セリフ
===================================================== */

let bellMessages=[];

const isEmbedded =
  window.parent !== window;

let parentSchedules={};


function setBellMessages(
  messages,
  preferred=null
){

  const cleaned=[
    ...new Set(
      (messages || [])
        .filter(
          v =>
            typeof v === "string" &&
            v.trim()
        )
    )
  ];

  if(!cleaned.length)return;

  bellMessages =
    cleaned;

  showMessage(
    preferred &&
    cleaned.includes(preferred)
      ? preferred
      : pickRandom(cleaned)
  );

}


function buildBellMessages(
  schedules
){

  const now =
    new Date();

  const values =
    Object.entries(
      schedules || {}
    )
    .filter(
      ([,s]) =>
        s &&
        typeof s === "object"
    )
    .map(
      ([key,s]) => {

        if(
          (s.type==="normal" || !s.type) &&
          typeof s.date !== "string"
        ){

          return {
            ...s,
            date:key
          };

        }

        return s;

      }
    );


  const all=[
    ...buildRegularMessages(
      values,
      now
    )
  ];


  try{

    const today =
      dateString(now);

    all.push(
      ...getClubBeforeStartMessages(
        values,
        today,
        now
      )
    );

  }catch(error){

    console.warn(
      "ベルちゃんの部活前メッセージを作成できませんでした",
      error
    );

  }


  try{

    const today =
      dateString(now);

    getEventSchedulesForDate(
      values,
      today
    ).forEach(
      event => {

        all.push(
          `今日は${
            event.title ||
            (
              event.type==="concert"
                ? "演奏会"
                : "イベント"
            )
          }だね！`
        );

      }
    );

  }catch(error){

    console.warn(
      "ベルちゃんの当日イベントメッセージを作成できませんでした",
      error
    );

  }


  try{

    const today =
      dateString(now);

    getUpcomingEvents(
      values,
      today
    ).forEach(
      event => {

        all.push(
          `もうすぐ${
            event.title ||
            (
              event.type==="concert"
                ? "演奏会"
                : "イベント"
            )
          }だね！`
        );

      }
    );

  }catch(error){

    console.warn(
      "ベルちゃんの予定メッセージを作成できませんでした",
      error
    );

  }


  return [
    ...new Set(all)
  ];

}


function receiveParentSchedules(
  schedules
){

  parentSchedules =
    schedules &&
    typeof schedules === "object"
      ? schedules
      : {};

  setBellMessages(
    buildBellMessages(
      parentSchedules
    )
  );

}


window.addEventListener(
  "message",
  event => {

    if(
      !event.data ||
      event.data.type !==
        "handbell-schedules"
    )return;

    receiveParentSchedules(
      event.data.schedules
    );

  }
);


/* =====================================================
   日付・時間
===================================================== */

function pad(n){

  return String(n)
    .padStart(2,"0");

}


function dateString(
  date=new Date()
){

  return `${
    date.getFullYear()
  }-${
    pad(date.getMonth()+1)
  }-${
    pad(date.getDate())
  }`;

}


function monthString(
  date=new Date()
){

  return `${
    date.getFullYear()
  }-${
    pad(date.getMonth()+1)
  }`;

}


function timeToMinutes(
  value
){

  const match =
    String(value || "")
      .match(
        /^(\d{1,2}):(\d{2})$/
      );

  if(!match)return null;

  return (
    Number(match[1])*60 +
    Number(match[2])
  );

}


function getGreeting(
  date=new Date()
){

  const hour =
    date.getHours();

  if(
    hour>=4 &&
    hour<10
  )
    return "おはよう！";

  if(
    hour>=10 &&
    hour<17
  )
    return "こんにちは！";

  return "こんばんは！";

}


function greetingMessage(
  text,
  date=new Date()
){

  return `${
    getGreeting(date)
  }${text}`;

}


function formatJapaneseTime(
  value
){

  const match =
    String(value || "")
      .match(
        /^(\d{1,2}):(\d{2})$/
      );

  if(!match)
    return String(value || "");

  return `${
    Number(match[1])
  }時${
    match[2]
  }分`;

}


function formatTimeRange(
  time
){

  const value =
    String(time || "").trim();

  if(
    !value ||
    value === "終日"
  )
    return "";

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]\s*(\d{1,2}:\d{2})$/
    );

  if(!match)
    return value;

  return `${
    formatJapaneseTime(match[1])
  }〜${
    formatJapaneseTime(match[2])
  }`;

}


function getStartTime(
  time
){

  const value =
    String(time || "").trim();

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]/
    );

  return match
    ? timeToMinutes(match[1])
    : null;

}


function getTomorrowString(
  date=new Date()
){

  const tomorrow =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()+1
    );

  return dateString(
    tomorrow
  );

}


function daysFromToday(
  dateStringValue,
  today=new Date()
){

  const target =
    new Date(
      `${dateStringValue}T00:00:00`
    );

  const base =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

  return Math.round(
    (target-base)/86400000
  );

}


function isUpcomingWithinDays(
  dateValue,
  today,
  days
){

  if(!dateValue)return false;

  const diff =
    daysFromToday(
      dateValue,
      today
    );

  return (
    diff>0 &&
    diff<=days
  );

}


/* =====================================================
   予定
===================================================== */

function getNormalSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      s.type==="normal" &&
      s.date===date
  );

}


function getEventSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      (
        s.type==="concert" ||
        s.type==="event"
      ) &&
      s.date===date
  );

}


function getUpcomingEvents(
  values,
  today
){

  return values
    .filter(
      s =>
        s &&
        (
          s.type==="concert" ||
          s.type==="event"
        ) &&
        isUpcomingWithinDays(
          s.date,
          today,
          7
        )
    )
    .sort(
      (a,b) =>
        String(a.date)
          .localeCompare(
            String(b.date)
          )
    );

}


function getMonthlyClubCount(
  values,
  today
){

  const month =
    monthString(today);

  return values.filter(
    s =>
      s &&
      (
        s.type==="normal" ||
        !s.type
      ) &&
      typeof s.date==="string" &&
      s.date.startsWith(month)
  ).length;

}


function getClubBeforeStartMessages(
  values,
  today,
  dateNow
){

  const todayNormal =
    getNormalSchedulesForDate(
      values,
      today
    )[0];

  if(!todayNormal)return [];

  const start =
    getStartTime(
      todayNormal.time
    );

  const nowMinutes =
    dateNow.getHours()*60 +
    dateNow.getMinutes();

  if(
    start===null ||
    nowMinutes>=start
  )
    return [];


  const range =
    formatTimeRange(
      todayNormal.time
    );

  const result=[];


  if(range){

    result.push(
      greetingMessage(
        `今日の部活は${range}だよ`,
        dateNow
      )
    );

  }


  result.push(

    greetingMessage(
      "今日の部活、頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日もみんなでハンドベル頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日の部活も楽しみだね！",
      dateNow
    ),

    greetingMessage(
      "今日はどんな曲を練習するのかな？",
      dateNow
    ),

    greetingMessage(
      "今日の部活も一緒に頑張ろうね！",
      dateNow
    )

  );


  return result;

}


/* =====================================================
   通常メッセージ
===================================================== */

function buildRegularMessages(
  values,
  dateNow
){

  const result=[];

  const hour =
    dateNow.getHours();

  const monthCount =
    getMonthlyClubCount(
      values,
      dateNow
    );


  if(
    hour>=4 &&
    hour<10
  ){

    result.push(

      "おはよう！",

      "おはよう！今日も一日頑張ろうね！",

      "おはよう！無理せず頑張ろうね！",

      "おはよう！今日も楽しく過ごそうね！",

      "おはよう！予定を確認してみてね！",

      "おはよう！今月の予定もチェックしてみてね！",

      "おはよう！みんなで楽しく活動しようね！",

      "おはよう！今日も素敵な一日にしようね！",

      "おはよう！今日も予定を見にきてくれてありがとう",

      `おはよう！今月の部活は${monthCount}回だよ`

    );


    if(
      hour>=4 &&
      hour<6.5
    ){

      result.push(
        "おはよう〜まだ眠いよ〜"
      );

    }


    if(
      hour>=5 &&
      hour<7
    ){

      result.push(
        "おはよう！朝はやいね"
      );

    }

  }else if(
    hour>=10 &&
    hour<17
  ){

    result.push(

      "こんにちは！",

      "こんにちは！無理せず頑張ろうね！",

      "こんにちは！今日も楽しく過ごそうね！",

      "こんにちは！予定を確認してみてね！",

      "こんにちは！今月の予定もチェックしてみてね！",

      "こんにちは！みんなで楽しく活動しようね！",

      "こんにちは！今日も素敵な一日にしようね！",

      "こんにちは！今日も予定を見にきてくれてありがとう",

      `こんにちは！今月の部活は${monthCount}回だよ`

    );


    if(
      hour>=12 &&
      hour<13
    ){

      result.push(
        "こんにちは！お昼ご飯はもう食べたかな？"
      );

    }


    if(
      hour>=12 &&
      hour<15
    ){

      result.push(
        "こんにちは！今日のお昼ご飯なんだった？"
      );

    }

  }else{

    result.push(

      "こんばんは！",

      "こんばんは！予定を確認してみてね！",

      "こんばんは！今月の予定もチェックしてみてね！",

      "こんばんは！今日も予定を見にきてくれてありがとう",

      "こんばんは！今日はどんな1日だったかな？",

      "こんばんは！1日お疲れ様！",

      "こんばんは！明日も1日頑張ろう！",

      "こんばんは！自主練はもうやった？",

      `こんばんは！今月の部活は${monthCount}回だよ`

    );


    if(
      hour>=22 &&
      hour<24
    ){

      result.push(
        "こんばんは〜。そろそろ眠たくなっちゃった、、、"
      );

    }


    if(
      getNormalSchedulesForDate(
        values,
        getTomorrowString(dateNow)
      ).length>0
    ){

      result.push(
        "こんばんは！明日も部活頑張ろう！"
      );

    }


    if(
      hour>=22 &&
      hour<24
    ){

      result.push(
        "こんばんは！夜遅くまでお疲れ様"
      );

    }

  }


  return result;

}


/* =====================================================
   セリフ選択
===================================================== */

function pickRandom(list){

  if(!list.length)
    return "予定を確認してみてね！";

  return list[
    Math.floor(
      Math.random()*list.length
    )
  ];

}


function chooseBellMessage(
  schedules
){

  const now =
    new Date();

  const today =
    dateString(now);

  const values =
    Object.values(
      schedules || {}
    ).filter(
      s =>
        s &&
        typeof s === "object"
    );


  const regularMessages =
    buildRegularMessages(
      values,
      now
    );


  const todayEvents =
    getEventSchedulesForDate(
      values,
      today
    );


  if(
    todayEvents.length>0 &&
    Math.random()<0.5
  ){

    const event =
      todayEvents[
        Math.floor(
          Math.random()*
          todayEvents.length
        )
      ];

    return `今日は${
      event.title ||
      (
        event.type==="concert"
          ? "演奏会"
          : "イベント"
      )
    }だね！`;

  }


  const upcomingEvents =
    getUpcomingEvents(
      values,
      today
    );


  if(
    upcomingEvents.length>0 &&
    Math.random()<0.2
  ){

    const event =
      upcomingEvents[0];

    return `もうすぐ${
      event.title ||
      (
        event.type==="concert"
          ? "演奏会"
          : "イベント"
      )
    }だね！`;

  }


  const clubMessages =
    getClubBeforeStartMessages(
      values,
      today,
      now
    );


  const combined=[
    ...regularMessages,
    ...clubMessages
  ];


  return pickRandom(
    combined
  );

}


function showMessage(text){

  message.textContent =
    text;

}


function changeBellMessage(){

  if(!bellMessages.length)return;

  let next =
    pickRandom(
      bellMessages
    );


  if(
    bellMessages.length>1 &&
    next===message.textContent
  ){

    const other =
      bellMessages.filter(
        item =>
          item!==message.textContent
      );

    next =
      pickRandom(
        other
      );

  }


  showMessage(next);

}


/* =====================================================
   ハート生成
===================================================== */

function createHeart(){

  const rect =
    bellImage.getBoundingClientRect();

  const areaRect =
    bellArea.getBoundingClientRect();


  const heart =
    document.createElement("span");

  heart.className =
    "heart";

  heart.textContent =
    "♥";


  /*
     ベルちゃんの上あたりから出す
  */

  const x =
    rect.left -
    areaRect.left +
    rect.width/2 +
    (-25 + Math.random()*50);

  const y =
    rect.top -
    areaRect.top +
    rect.height*0.2;


  heart.style.left =
    `${x}px`;

  heart.style.top =
    `${y}px`;


  /*
     ハートごとに飛ぶ方向を変える
  */

  heart.style.setProperty(
    "--x1",
    `${-15 + Math.random()*30}px`
  );

  heart.style.setProperty(
    "--x2",
    `${-45 + Math.random()*90}px`
  );

  heart.style.setProperty(
    "--x3",
    `${-70 + Math.random()*140}px`
  );

  heart.style.setProperty(
    "--x4",
    `${-100 + Math.random()*200}px`
  );

  heart.style.setProperty(
    "--r1",
    `${-20 + Math.random()*40}deg`
  );

  heart.style.setProperty(
    "--r2",
    `${-40 + Math.random()*80}deg`
  );

  heart.style.setProperty(
    "--r3",
    `${-60 + Math.random()*120}deg`
  );

  heart.style.setProperty(
    "--r4",
    `${-80 + Math.random()*160}deg`
  );


  bellArea.appendChild(
    heart
  );


  heart.addEventListener(
    "animationend",
    () => {
      heart.remove();
    },
    {once:true}
  );

}


/*
   ハートを一気に出す
*/

function createHeartBurst(){

  /*
     1回目
  */

  for(
    let i=0;
    i<7;
    i++
  ){

    setTimeout(
      createHeart,
      i*45
    );

  }


  /*
     2回目
  */

  setTimeout(
    () => {

      if(!isCelebrating)return;

      for(
        let i=0;
        i<9;
        i++
      ){

        setTimeout(
          createHeart,
          i*40
        );

      }

    },
    650
  );

}


/* =====================================================
   お祝いアニメーション
===================================================== */

let isCelebrating =
  false;


function hideBubble(){

  bubble.classList.remove(
    "celebration-show"
  );

  bubble.classList.add(
    "celebration-hidden"
  );

}


function showBubbleAgain(){

  bubble.classList.remove(
    "celebration-hidden"
  );

  bubble.classList.remove(
    "celebration-show"
  );

  /*
     アニメーションを確実に最初から再生
  */

  void bubble.offsetWidth;

  bubble.classList.add(
    "celebration-show"
  );

}


function startCelebration(){

  /*
     連打防止
  */

  if(isCelebrating)return;

  isCelebrating =
    true;


  /*
     ① 吹き出しを即消す
  */

  hideBubble();


  /*
     ② ベルちゃんのアニメーションをリセット
  */

  bellImage.classList.remove(
    "celebrating"
  );

  void bellImage.offsetWidth;


  /*
     ③ アニメーション開始
  */

  bellImage.classList.add(
    "celebrating"
  );


  /*
     ④ ハート
  */

  createHeartBurst();


  /*
     ⑤ アニメーション終了後
  */

  bellImage.addEventListener(
    "animationend",
    () => {

      /*
         新しいセリフ
      */

      changeBellMessage();


      /*
         吹き出しを再表示
      */

      showBubbleAgain();


      /*
         アニメーション終了
      */

      bellImage.classList.remove(
        "celebrating"
      );


      isCelebrating =
        false;

    },
    {once:true}
  );

}


/* =====================================================
   初期化
===================================================== */

setBellMessages(
  buildBellMessages({})
);


/* =====================================================
   親ページへ準備完了通知
===================================================== */

if(isEmbedded){

  window.parent.postMessage(
    {
      type:"handbell-ready"
    },
    "*"
  );

}


/* =====================================================
   ベルちゃんクリック
===================================================== */

bellImage.addEventListener(
  "click",
  startCelebration
);

</script>
