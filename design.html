<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベルちゃん</title>

<style>

/* =====================================================
   ベルちゃん共通設定
===================================================== */

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
}

.bell-area{
  position:relative;
  width:100%;
  height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}


/* =====================================================
   ベルちゃん
===================================================== */

.bell{
  position:absolute;
  max-width:62%;
  height:auto;

  border:none;
  outline:none;
  box-shadow:none;

  filter:none;

  cursor:pointer;
  user-select:none;

  transition:transform .15s ease;

  z-index:10;
}

.bell:active{
  transform:scale(.96);
}


/* =====================================================
   吹き出し
===================================================== */

.bubble{
  position:absolute;

  max-width:calc(100vw - 8px);

  background:#fff;

  border:2px solid #d9e5ed;
  border-radius:18px;

  padding:7px 8px;

  box-shadow:none;

  font-size:10px;
  line-height:1.55;

  animation:
    bubbleAppear
    .55s
    cubic-bezier(.2,.9,.25,1.2)
    both;

  z-index:30;
}

.bubble small{
  display:block;

  color:#84939d;

  font-size:8px;

  margin-bottom:2px;
}


/* =====================================================
   アニメーション中は吹き出しを消す
===================================================== */

.bubble.bubble-hidden{
  visibility:hidden;
  opacity:0;
  pointer-events:none;
}


/* =====================================================
   ログイン前
===================================================== */

body:not(.logged-in) .bell{
  width:100px;
  right:0px;
  bottom:100px;
}

body:not(.logged-in) .bubble{
  width:215px;
  right:3px;
  bottom:195px;
}

body:not(.logged-in) .bubble:after{
  content:"";

  position:absolute;

  width:12px;
  height:12px;

  right:20px;
  bottom:-7px;

  background:#fff;

  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;

  transform:rotate(45deg);
}


/* =====================================================
   ログイン後
===================================================== */

body.logged-in .bell{
  width:100px;
  right:0px;
  bottom:100px;
}

body.logged-in .bubble{
  width:215px;
  right:3px;
  bottom:195px;
}

body.logged-in .bubble:after{
  content:"";

  position:absolute;

  width:12px;
  height:12px;

  right:20px;
  bottom:-7px;

  background:#fff;

  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;

  transform:rotate(45deg);
}


/* =====================================================
   吹き出し登場
===================================================== */

@keyframes bubbleAppear{

  from{
    opacity:0;

    transform:
      scale(.9)
      translateY(7px);
  }

  to{
    opacity:1;

    transform:
      scale(1)
      translateY(0);
  }

}


/* =====================================================
   ハートを出す場所
===================================================== */

.heart-container{
  position:absolute;

  left:50%;
  top:50%;

  width:0;
  height:0;

  pointer-events:none;

  z-index:20;

  overflow:visible;
}


/* =====================================================
   ハート
===================================================== */

.heart{
  position:absolute;

  left:0;
  top:0;

  color:#ff7eb9;

  font-size:18px;

  line-height:1;

  opacity:0;

  transform:
    translate(
      var(--start-x),
      var(--start-y)
    )
    scale(.4);

  animation:
    heartFly
    1.8s
    cubic-bezier(.2,.75,.25,1)
    forwards;
}


/* =====================================================
   ハートが飛び散る
===================================================== */

@keyframes heartFly{

  0%{
    opacity:0;

    transform:
      translate(
        var(--start-x),
        var(--start-y)
      )
      scale(.3)
      rotate(0deg);
  }

  12%{
    opacity:1;
  }

  45%{
    opacity:1;
  }

  100%{
    opacity:0;

    transform:
      translate(
        var(--end-x),
        var(--end-y)
      )
      scale(1)
      rotate(var(--rotate));
  }

}


/* =====================================================
   ベルちゃん喜びアニメーション
===================================================== */

.bell.celebrating{

  animation:
    bellCelebrate
    1.8s
    cubic-bezier(.2,.8,.25,1)
    both;

}


/* =====================================================
   2回ジャンプ
===================================================== */

@keyframes bellCelebrate{

  /* 最初 */
  0%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }

  /* 1回目：ジャンプ */
  12%{
    transform:
      translateY(-18px)
      rotate(-8deg)
      scale(1.04);
  }

  /* 1回目の頂点 */
  24%{
    transform:
      translateY(-25px)
      rotate(8deg)
      scale(1.05);
  }

  /* 1回目着地 */
  38%{
    transform:
      translateY(0)
      rotate(-4deg)
      scale(1);
  }

  /* 少し跳ねる */
  45%{
    transform:
      translateY(-6px)
      rotate(3deg)
      scale(1.02);
  }

  /* 2回目ジャンプ */
  57%{
    transform:
      translateY(-22px)
      rotate(-9deg)
      scale(1.05);
  }

  /* 2回目の頂点 */
  69%{
    transform:
      translateY(-30px)
      rotate(9deg)
      scale(1.06);
  }

  /* 2回目着地 */
  83%{
    transform:
      translateY(0)
      rotate(-3deg)
      scale(1);
  }

  /* 最後に少しぷるん */
  92%{
    transform:
      translateY(-3px)
      rotate(2deg)
      scale(1.01);
  }

  100%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }

}

</style>
</head>


<body>

<div class="bell-area">

  <!-- 吹き出し -->
  <div class="bubble">

    <small>ベルちゃん</small>

    <span id="bellMessage">
      予定を確認してるよ！
    </span>

  </div>


  <!-- ハート -->
  <div
    class="heart-container"
    id="heartContainer">
  </div>


  <!-- ベルちゃん -->
  <img
    class="bell"
    src="bell.png"
    alt="ベルちゃん"
    id="bellImage"
  >

</div>


<script type="module">


/* =====================================================
   基本
===================================================== */

const message =
  document.getElementById(
    "bellMessage"
  );

const bellImage =
  document.getElementById(
    "bellImage"
  );

const bubble =
  document.querySelector(
    ".bubble"
  );

const heartContainer =
  document.getElementById(
    "heartContainer"
  );


/* =====================================================
   ログイン状態によるサイズ調整
===================================================== */

function updateLoginSize(){

  try{

    const parentDocument =
      window.parent.document;

    const loggedInElement =
      parentDocument.getElementById(
        "loggedInLeft"
      );

    const isLoggedIn =
      !!loggedInElement &&
      !loggedInElement.classList.contains(
        "hidden"
      );

    document.body.classList.toggle(
      "logged-in",
      isLoggedIn
    );

  }catch(error){

    document.body.classList.remove(
      "logged-in"
    );

  }

}


updateLoginSize();


try{

  const parentDocument =
    window.parent.document;

  const loggedInElement =
    parentDocument.getElementById(
      "loggedInLeft"
    );

  if(loggedInElement){

    new MutationObserver(
      updateLoginSize
    ).observe(
      loggedInElement,
      {
        attributes:true,
        attributeFilter:["class"]
      }
    );

  }

}catch(error){}


setInterval(
  updateLoginSize,
  500
);


/* =====================================================
   メッセージ関連
===================================================== */

let bellMessages=[];

const isEmbedded =
  window.parent !== window;

let parentSchedules={};


function setBellMessages(
  messages,
  preferred=null
){

  const cleaned=[
    ...new Set(
      (messages || [])
        .filter(
          v =>
            typeof v === "string" &&
            v.trim()
        )
    )
  ];

  if(!cleaned.length)return;

  bellMessages=cleaned;

  showMessage(
    preferred &&
    cleaned.includes(preferred)
      ? preferred
      : pickRandom(cleaned)
  );

}


function buildBellMessages(
  schedules
){

  const now =
    new Date();

  const values =
    Object.entries(
      schedules || {}
    )
    .filter(
      ([,s]) =>
        s &&
        typeof s === "object"
    )
    .map(
      ([key,s])=>{

        if(
          (s.type==="normal" || !s.type) &&
          typeof s.date !== "string"
        ){

          return {
            ...s,
            date:key
          };

        }

        return s;

      }
    );


  const all=[
    ...buildRegularMessages(
      values,
      now
    )
  ];


  try{

    const today =
      dateString(now);

    all.push(
      ...getClubBeforeStartMessages(
        values,
        today,
        now
      )
    );

  }catch(error){

    console.warn(
      "ベルちゃんの部活前メッセージを作成できませんでした",
      error
    );

  }


  try{

    const today =
      dateString(now);

    getEventSchedulesForDate(
      values,
      today
    ).forEach(
      event=>{

        all.push(
          `今日は${
            event.title ||
            (
              event.type==="concert"
                ? "演奏会"
                : "イベント"
            )
          }だね！`
        );

      }
    );

  }catch(error){

    console.warn(
      "ベルちゃんの当日イベントメッセージを作成できませんでした",
      error
    );

  }


  try{

    const today =
      dateString(now);

    getUpcomingEvents(
      values,
      today
    ).forEach(
      event=>{

        all.push(
          `もうすぐ${
            event.title ||
            (
              event.type==="concert"
                ? "演奏会"
                : "イベント"
            )
          }だね！`
        );

      }
    );

  }catch(error){

    console.warn(
      "ベルちゃんの予定メッセージを作成できませんでした",
      error
    );

  }


  return [
    ...new Set(all)
  ];

}


function receiveParentSchedules(
  schedules
){

  parentSchedules =
    schedules &&
    typeof schedules === "object"
      ? schedules
      : {};

  setBellMessages(
    buildBellMessages(
      parentSchedules
    )
  );

}


window.addEventListener(
  "message",
  event=>{

    if(
      !event.data ||
      event.data.type !==
        "handbell-schedules"
    ){

      return;

    }

    receiveParentSchedules(
      event.data.schedules
    );

  }
);


/* =====================================================
   日付・時間
===================================================== */

function pad(n){

  return String(n)
    .padStart(2,"0");

}


function dateString(
  date=new Date()
){

  return `${
    date.getFullYear()
  }-${
    pad(date.getMonth()+1)
  }-${
    pad(date.getDate())
  }`;

}


function monthString(
  date=new Date()
){

  return `${
    date.getFullYear()
  }-${
    pad(date.getMonth()+1)
  }`;

}


function timeToMinutes(
  value
){

  const match =
    String(value || "")
      .match(
        /^(\d{1,2}):(\d{2})$/
      );

  if(!match)return null;

  return (
    Number(match[1])*60 +
    Number(match[2])
  );

}


/* =====================================================
   挨拶
===================================================== */

function getGreeting(
  date=new Date()
){

  const hour =
    date.getHours();

  if(
    hour>=4 &&
    hour<10
  ){

    return "おはよう！";

  }

  if(
    hour>=10 &&
    hour<17
  ){

    return "こんにちは！";

  }

  return "こんばんは！";

}


function greetingMessage(
  text,
  date=new Date()
){

  return `${
    getGreeting(date)
  }${text}`;

}


/* =====================================================
   時刻表示
===================================================== */

function formatJapaneseTime(
  value
){

  const match =
    String(value || "")
      .match(
        /^(\d{1,2}):(\d{2})$/
      );

  if(!match){

    return String(
      value || ""
    );

  }

  return `${
    Number(match[1])
  }時${
    match[2]
  }分`;

}


function formatTimeRange(
  time
){

  const value =
    String(time || "")
      .trim();

  if(
    !value ||
    value==="終日"
  ){

    return "";

  }

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]\s*(\d{1,2}:\d{2})$/
    );

  if(!match){

    return value;

  }

  return `${
    formatJapaneseTime(match[1])
  }〜${
    formatJapaneseTime(match[2])
  }`;

}


function getStartTime(
  time
){

  const value =
    String(time || "")
      .trim();

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]/
    );

  return match
    ? timeToMinutes(match[1])
    : null;

}


/* =====================================================
   日付計算
===================================================== */

function getTomorrowString(
  date=new Date()
){

  const tomorrow =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()+1
    );

  return dateString(
    tomorrow
  );

}


function daysFromToday(
  dateStringValue,
  today=new Date()
){

  const target =
    new Date(
      `${dateStringValue}T00:00:00`
    );

  const base =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

  return Math.round(
    (
      target-base
    ) / 86400000
  );

}


function isUpcomingWithinDays(
  dateValue,
  today,
  days
){

  if(!dateValue)return false;

  const diff =
    daysFromToday(
      dateValue,
      today
    );

  return (
    diff>0 &&
    diff<=days
  );

}


/* =====================================================
   スケジュール
===================================================== */

function getNormalSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      s.type==="normal" &&
      s.date===date
  );

}


function getEventSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      (
        s.type==="concert" ||
        s.type==="event"
      ) &&
      s.date===date
  );

}


function getUpcomingEvents(
  values,
  today
){

  return values
    .filter(
      s =>
        s &&
        (
          s.type==="concert" ||
          s.type==="event"
        ) &&
        isUpcomingWithinDays(
          s.date,
          today,
          7
        )
    )
    .sort(
      (a,b)=>
        String(a.date)
          .localeCompare(
            String(b.date)
          )
    );

}


function getMonthlyClubCount(
  values,
  today
){

  const month =
    monthString(today);

  return values.filter(
    s =>
      s &&
      (
        s.type==="normal" ||
        !s.type
      ) &&
      typeof s.date === "string" &&
      s.date.startsWith(month)
  ).length;

}


/* =====================================================
   部活前メッセージ
===================================================== */

function getClubBeforeStartMessages(
  values,
  today,
  dateNow
){

  const todayNormal =
    getNormalSchedulesForDate(
      values,
      today
    )[0];

  if(!todayNormal)return [];

  const start =
    getStartTime(
      todayNormal.time
    );

  const nowMinutes =
    dateNow.getHours()*60 +
    dateNow.getMinutes();

  if(
    start===null ||
    nowMinutes>=start
  ){

    return [];

  }

  const range =
    formatTimeRange(
      todayNormal.time
    );

  const result=[];


  if(range){

    result.push(
      greetingMessage(
        `今日の部活は${range}だよ`,
        dateNow
      )
    );

  }


  result.push(

    greetingMessage(
      "今日の部活、頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日もみんなでハンドベル頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日の部活も楽しみだね！",
      dateNow
    ),

    greetingMessage(
      "今日はどんな曲を練習するのかな？",
      dateNow
    ),

    greetingMessage(
      "今日の部活も一緒に頑張ろうね！",
      dateNow
    )

  );


  return result;

}


/* =====================================================
   通常メッセージ
===================================================== */

function buildRegularMessages(
  values,
  dateNow
){

  const result=[];

  const hour =
    dateNow.getHours();

  const monthCount =
    getMonthlyClubCount(
      values,
      dateNow
    );


  if(
    hour>=4 &&
    hour<10
  ){

    result.push(

      "おはよう！",

      "おはよう！今日も一日頑張ろうね！",

      "おはよう！無理せず頑張ろうね！",

      "おはよう！今日も楽しく過ごそうね！",

      "おはよう！予定を確認してみてね！",

      "おはよう！今月の予定もチェックしてみてね！",

      "おはよう！みんなで楽しく活動しようね！",

      "おはよう！今日も素敵な一日にしようね！",

      "おはよう！今日も予定を見にきてくれてありがとう",

      `おはよう！今月の部活は${monthCount}回だよ`

    );


    if(
      hour>=4 &&
      hour<6.5
    ){

      result.push(
        "おはよう〜まだ眠いよ〜"
      );

    }


    if(
      hour>=5 &&
      hour<7
    ){

      result.push(
        "おはよう！朝はやいね"
      );

    }


  }else if(
    hour>=10 &&
    hour<17
  ){

    result.push(

      "こんにちは！",

      "こんにちは！無理せず頑張ろうね！",

      "こんにちは！今日も楽しく過ごそうね！",

      "こんにちは！予定を確認してみてね！",

      "こんにちは！今月の予定もチェックしてみてね！",

      "こんにちは！みんなで楽しく活動しようね！",

      "こんにちは！今日も素敵な一日にしようね！",

      "こんにちは！今日も予定を見にきてくれてありがとう",

      `こんにちは！今月の部活は${monthCount}回だよ`

    );


    if(
      hour>=12 &&
      hour<13
    ){

      result.push(
        "こんにちは！お昼ご飯はもう食べたかな？"
      );

    }


    if(
      hour>=12 &&
      hour<15
    ){

      result.push(
        "こんにちは！今日のお昼ご飯なんだった？"
      );

    }


  }else{

    result.push(

      "こんばんは！",

      "こんばんは！予定を確認してみてね！",

      "こんばんは！今月の予定もチェックしてみてね！",

      "こんばんは！今日も予定を見にきてくれてありがとう",

      "こんばんは！今日はどんな1日だったかな？",

      "こんばんは！1日お疲れ様！",

      "こんばんは！明日も1日頑張ろう！",

      "こんばんは！自主練はもうやった？",

      `こんばんは！今月の部活は${monthCount}回だよ`

    );


    if(
      hour>=22 &&
      hour<24
    ){

      result.push(
        "こんばんは〜。そろそろ眠たくなっちゃった、、、"
      );

    }


    if(
      getNormalSchedulesForDate(
        values,
        getTomorrowString(dateNow)
      ).length>0
    ){

      result.push(
        "こんばんは！明日も部活頑張ろう！"
      );

    }


    if(
      hour>=22 &&
      hour<24
    ){

      result.push(
        "こんばんは！夜遅くまでお疲れ様"
      );

    }

  }


  return result;

}


/* =====================================================
   ランダム
===================================================== */

function pickRandom(
  list
){

  if(!list.length){

    return "予定を確認してみてね！";

  }

  return list[
    Math.floor(
      Math.random()*list.length
    )
  ];

}


/* =====================================================
   メッセージ表示
===================================================== */

function showMessage(
  text
){

  message.textContent =
    text;

}


function changeBellMessage(){

  if(!bellMessages.length)return;

  let next =
    pickRandom(
      bellMessages
    );


  if(
    bellMessages.length>1 &&
    next===message.textContent
  ){

    const other =
      bellMessages.filter(
        item =>
          item !==
          message.textContent
      );

    next =
      pickRandom(other);

  }


  showMessage(next);

}


/* =====================================================
   大量のハート
===================================================== */

function startHearts(){

  if(!heartContainer)return;


  const hearts=[];


  /* =================================================
     上方向
  ================================================= */

  for(let i=0;i<14;i++){

    hearts.push({

      startX:
        -55 +
        Math.random()*110,

      startY:
        -10 +
        Math.random()*25,

      endX:
        -130 +
        Math.random()*260,

      endY:
        -120 -
        Math.random()*150

    });

  }


  /* =================================================
     左上
  ================================================= */

  for(let i=0;i<10;i++){

    hearts.push({

      startX:
        -35 -
        Math.random()*35,

      startY:
        -10 -
        Math.random()*35,

      endX:
        -100 -
        Math.random()*120,

      endY:
        -70 -
        Math.random()*120

    });

  }


  /* =================================================
     右上
  ================================================= */

  for(let i=0;i<10;i++){

    hearts.push({

      startX:
        35 +
        Math.random()*35,

      startY:
        -10 -
        Math.random()*35,

      endX:
        100 +
        Math.random()*120,

      endY:
        -70 -
        Math.random()*120

    });

  }


  /* =================================================
     左
  ================================================= */

  for(let i=12;i--;){

    hearts.push({

      startX:
        -45 -
        Math.random()*20,

      startY:
        -40 +
        Math.random()*90,

      endX:
        -130 -
        Math.random()*140,

      endY:
        -70 +
        Math.random()*160

    });

  }


  /* =================================================
     右
  ================================================= */

  for(let i=12;i--;){

    hearts.push({

      startX:
        45 +
        Math.random()*20,

      startY:
        -40 +
        Math.random()*90,

      endX:
        130 +
        Math.random()*140,

      endY:
        -70 +
        Math.random()*160

    });

  }


  /* =================================================
     左下
  ================================================= */

  for(let i=8;i--;){

    hearts.push({

      startX:
        -40 -
        Math.random()*25,

      startY:
        30 +
        Math.random()*25,

      endX:
        -100 -
        Math.random()*130,

      endY:
        50 +
        Math.random()*100

    });

  }


  /* =================================================
     右下
  ================================================= */

  for(let i=8;i--;){

    hearts.push({

      startX:
        40 +
        Math.random()*25,

      startY:
        30 +
        Math.random()*25,

      endX:
        100 +
        Math.random()*130,

      endY:
        50 +
        Math.random()*100

    });

  }


  /* =================================================
     ハート生成
  ================================================= */

  hearts.forEach(
    (data,index)=>{

      const heart =
        document.createElement(
          "span"
        );


      heart.className =
        "heart";


      heart.textContent =
        index % 4 === 0
          ? "♡"
          : "♥";


      heart.style.setProperty(
        "--start-x",
        `${data.startX}px`
      );


      heart.style.setProperty(
        "--start-y",
        `${data.startY}px`
      );


      heart.style.setProperty(
        "--end-x",
        `${data.endX}px`
      );


      heart.style.setProperty(
        "--end-y",
        `${data.endY}px`
      );


      const rotation =
        -60 +
        Math.random()*120;


      heart.style.setProperty(
        "--rotate",
        `${rotation}deg`
      );


      const size =
        11 +
        Math.random()*13;


      heart.style.fontSize =
        `${size}px`;


      /*
       * 少しずつタイミングをずらす
       */
      const delay =
        Math.random()*350;


      heart.style.animationDelay =
        `${delay}ms`;


      heartContainer.appendChild(
        heart
      );


      heart.addEventListener(
        "animationend",
        ()=>{
          heart.remove();
        }
      );

    }
  );

}


/* =====================================================
   アニメーション中かどうか
===================================================== */

let isAnimating=false;


/* =====================================================
   ベルちゃんをクリック
===================================================== */

function celebrate(){

  if(isAnimating)return;

  isAnimating=true;


  /* ---------------------------------------------
     吹き出しを消す
  --------------------------------------------- */

  bubble.classList.add(
    "bubble-hidden"
  );


  /* ---------------------------------------------
     アニメーションをリセット
  --------------------------------------------- */

  bellImage.classList.remove(
    "celebrating"
  );

  void bellImage.offsetWidth;


  /* ---------------------------------------------
     喜びアニメーション開始
  --------------------------------------------- */

  bellImage.classList.add(
    "celebrating"
  );


  /* =================================================
     1回目のジャンプ
     → 大量のハート
  ================================================= */

  setTimeout(
    ()=>{
      startHearts();
    },
    150
  );


  /* =================================================
     2回目のジャンプ
     → もう一度大量のハート
  ================================================= */

  setTimeout(
    ()=>{
      startHearts();
    },
    950
  );

}


/* =====================================================
   アニメーション終了
===================================================== */

bellImage.addEventListener(
  "animationend",
  event=>{

    if(
      event.animationName !==
      "bellCelebrate"
    ){

      return;

    }


    bellImage.classList.remove(
      "celebrating"
    );


    /* メッセージ変更 */
    changeBellMessage();


    /* 吹き出し再表示 */
    bubble.classList.remove(
      "bubble-hidden"
    );


    /* 吹き出しアニメーションを再実行 */

    bubble.style.animation="none";

    void bubble.offsetWidth;

    bubble.style.animation="";


    isAnimating=false;

  }
);


/* =====================================================
   初期メッセージ
===================================================== */

setBellMessages(
  buildBellMessages({})
);


/* =====================================================
   親ページへ準備完了を通知
===================================================== */

if(isEmbedded){

  window.parent.postMessage(
    {
      type:"handbell-ready"
    },
    "*"
  );

}


/* =====================================================
   クリックイベント
===================================================== */

bellImage.addEventListener(
  "click",
  celebrate
);

</script>
