<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>清教学園ハンドベル部予定表 - デザイン試作</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  background: linear-gradient(
    135deg,
    #f7fbff 0%,
    #eef5fb 55%,
    #f9f5ef 100%
  );
  color: #263746;
}

.page {
  width: min(1100px, calc(100% - 32px));
  margin: 0 auto;
  padding: 24px 0 80px;
}

header {
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid #dce5eb;
  border-radius: 24px;
  padding: 20px 26px;
  box-shadow: 0 12px 35px rgba(48, 72, 92, 0.08);
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 0.12em;
  color: #6d8291;
  margin-bottom: 5px;
}

h1 {
  margin: 0;
  font-size: clamp(23px, 4vw, 34px);
  letter-spacing: 0.03em;
}

.sub {
  margin: 7px 0 0;
  color: #71818d;
  font-size: 13px;
}

.header-buttons {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.header-buttons button {
  border: 1px solid #d7e1e8;
  background: white;
  color: #526572;
  border-radius: 12px;
  padding: 9px 13px;
  font-size: 13px;
  cursor: pointer;
}

.main {
  margin-top: 18px;
  background: white;
  border-radius: 24px;
  padding: 24px;
  min-height: 560px;
  box-shadow: 0 12px 35px rgba(48, 72, 92, 0.08);
  position: relative;
  overflow: hidden;
}

.calendar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.calendar-title {
  margin: 0;
  font-size: 24px;
}

.month-buttons {
  display: flex;
  gap: 7px;
}

.month-buttons button {
  width: 38px;
  height: 38px;
  border: 1px solid #d9e3e9;
  background: #f8fafc;
  border-radius: 11px;
  font-size: 20px;
  color: #5d707c;
  cursor: pointer;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  max-width: 820px;
}

.week {
  text-align: center;
  font-size: 12px;
  color: #8796a0;
  padding: 3px 0 4px;
}

.day {
  min-height: 68px;
  border-radius: 13px;
  background: #f5f8fa;
  padding: 9px;
  color: #657681;
  position: relative;
  cursor: pointer;
  transition: transform 0.12s ease;
}

.day:active {
  transform: scale(0.97);
}

.day-number {
  font-size: 14px;
  font-weight: 600;
}

.day.club {
  background: #e8f2ff;
  color: #4774a2;
}

.day.exam {
  background: #e9f5eb;
  color: #4e875d;
}

.day.concert {
  background: #f0e9fb;
  color: #7955a2;
}

.day.event {
  background: #fff1e3;
  color: #bd7540;
}

.day.off {
  background: #fff0f0;
  color: #c66565;
}

.schedule-label {
  margin-top: 7px;
  font-size: 11px;
  line-height: 1.35;
  font-weight: 600;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.legend {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
  font-size: 12px;
  color: #667781;
}

.legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}

.blue {
  background: #5d9be6;
}

.green {
  background: #67ad72;
}

.purple {
  background: #9b70c9;
}

.orange {
  background: #e8a15a;
}

.red {
  background: #dd6a6a;
}


/* =========================
   ベルちゃん
   ========================= */

.bell {
  position: absolute;
  right: 18px;
  bottom: 14px;
  width: min(175px, 18vw);
  min-width: 125px;
  filter: drop-shadow(
    0 12px 10px rgba(40, 55, 65, 0.15)
  );
  user-select: none;
  cursor: pointer;
  transition: transform 0.15s ease;
}

.bell:active {
  transform: scale(0.96);
}


/* =========================
   ベルちゃんの吹き出し
   ========================= */

.bubble {
  position: absolute;
  right: 165px;
  bottom: 108px;
  width: 225px;
  background: white;
  border: 2px solid #d9e5ed;
  border-radius: 18px;
  padding: 12px 15px;
  box-shadow:
    0 10px 24px rgba(48, 72, 92, 0.12);
  font-size: 14px;
  line-height: 1.55;
  animation:
    bubbleAppear
    0.55s
    cubic-bezier(0.2, 0.9, 0.25, 1.2)
    both;
}

.bubble::after {
  content: "";
  position: absolute;
  right: -11px;
  bottom: 24px;
  width: 18px;
  height: 18px;
  background: white;
  border-top: 2px solid #d9e5ed;
  border-right: 2px solid #d9e5ed;
  transform: rotate(45deg);
}

.bubble small {
  display: block;
  color: #84939d;
  font-size: 10px;
  margin-bottom: 3px;
}

@keyframes bubbleAppear {
  from {
    opacity: 0;
    transform: scale(0.9) translateY(7px);
  }

  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}


/* =========================
   スマホ
   ========================= */

@media (max-width: 700px) {

  .page {
    width: calc(100% - 16px);
    padding-top: 10px;
  }

  header,
  .main {
    border-radius: 18px;
    padding: 18px;
  }

  .header-top {
    align-items: flex-start;
  }

  .header-buttons {
    display: none;
  }

  .main {
    padding-bottom: 225px;
  }

  .calendar {
    gap: 5px;
  }

  .day {
    min-height: 52px;
    padding: 7px;
  }

  .schedule-label {
    font-size: 9px;
  }

  .bell {
    width: 140px;
    right: 10px;
    bottom: 9px;
  }

  .bubble {
    right: 130px;
    bottom: 105px;
    width: 190px;
    font-size: 12px;
    padding: 10px 12px;
  }

  .bubble::after {
    right: -10px;
    bottom: 21px;
    width: 16px;
    height: 16px;
  }
}
</style>
</head>


<body>

<div class="page">

  <header>

    <div class="header-top">

      <div>

        <div class="eyebrow">
          SEIKYO HANDBELL CLUB
        </div>

        <h1>
          清教学園ハンドベル部予定表
        </h1>

        <p class="sub">
          部員用サイト デザイン試作
        </p>

      </div>


      <div class="header-buttons">

        <button>
          欠席連絡
        </button>

        <button>
          修正
        </button>

      </div>

    </div>

  </header>


  <main class="main">

    <div class="calendar-head">

      <h2 class="calendar-title">
        2026年9月
      </h2>

      <div class="month-buttons">

        <button aria-label="前の月">
          ‹
        </button>

        <button aria-label="次の月">
          ›
        </button>

      </div>

    </div>


    <div class="calendar">

      <div class="week">日</div>
      <div class="week">月</div>
      <div class="week">火</div>
      <div class="week">水</div>
      <div class="week">木</div>
      <div class="week">金</div>
      <div class="week">土</div>


      <div class="day off">
        <div class="day-number">1</div>
      </div>

      <div class="day club">
        <div class="day-number">2</div>
      </div>

      <div class="day club">
        <div class="day-number">3</div>
      </div>

      <div class="day concert">

        <div class="day-number">
          4
        </div>

        <div class="schedule-label">
          ○○演奏会
        </div>

      </div>

      <div class="day club">
        <div class="day-number">5</div>
      </div>

      <div class="day exam">

        <div class="day-number">
          6
        </div>

        <div class="schedule-label">
          定期試験
        </div>

      </div>

      <div class="day off">
        <div class="day-number">7</div>
      </div>


      <div class="day off">
        <div class="day-number">8</div>
      </div>

      <div class="day club">
        <div class="day-number">9</div>
      </div>

      <div class="day club">
        <div class="day-number">10</div>
      </div>

      <div class="day club">
        <div class="day-number">11</div>
      </div>

      <div class="day event">

        <div class="day-number">
          12
        </div>

        <div class="schedule-label">
          文化祭
        </div>

      </div>

      <div class="day club">
        <div class="day-number">13</div>
      </div>

      <div class="day off">
        <div class="day-number">14</div>
      </div>


      <div class="day off">
        <div class="day-number">15</div>
      </div>

      <div class="day club">
        <div class="day-number">16</div>
      </div>

      <div class="day club">
        <div class="day-number">17</div>
      </div>

      <div class="day club">
        <div class="day-number">18</div>
      </div>

      <div class="day club">
        <div class="day-number">19</div>
      </div>

      <div class="day club">
        <div class="day-number">20</div>
      </div>

      <div class="day off">
        <div class="day-number">21</div>
      </div>

    </div>


    <div class="legend">

      <span>
        <i class="dot blue"></i>
        部活動
      </span>

      <span>
        <i class="dot green"></i>
        試験期間
      </span>

      <span>
        <i class="dot purple"></i>
        演奏会
      </span>

      <span>
        <i class="dot red"></i>
        学校が休み
      </span>

      <span>
        <i class="dot orange"></i>
        その他のイベント
      </span>

    </div>


    <!-- ベルちゃんの吹き出し -->

    <div class="bubble">

      <small>
        ベルちゃん
      </small>

      <span id="bellMessage">
        今日の部活は17:00〜19:00までだよ！
      </span>

    </div>


    <!-- ベルちゃん -->

    <img
      class="bell"
      src="bell.png"
      alt="ベルちゃん"
      onclick="changeBellMessage()"
    >

  </main>

</div>


<script>

const bellMessages = [

  "今月の活動回数は○回だね！",

  "今月は定期試験があるね。頑張ってね！",

  "今日の部活は○時〜○時までだよ！",

  "もうすぐ○○演奏会があるね！",

  "来週は文化祭だ〜♪",

  "今日も部活頑張ろうね！",

  "予定を確認してみてね！"

];


function changeBellMessage() {

  const message =
    document.getElementById("bellMessage");

  const randomIndex =
    Math.floor(
      Math.random() * bellMessages.length
    );

  message.textContent =
    bellMessages[randomIndex];

}

</script>

</body>
</html>
