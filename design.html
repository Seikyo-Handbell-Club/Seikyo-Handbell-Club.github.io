<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベルちゃん</title>

<style>

/* =====================================================
   共通設定
===================================================== */

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:visible;
}

.bell-area{
  position:absolute;
  width:220px;
  height:140px;
  right:0;
  top:3px;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

/* =====================================================
   キャラクター共通
===================================================== */

.bell{
  position:absolute;
  max-width:62%;
  height:auto;

  border:none;
  outline:none;
  box-shadow:none;

  filter:none;

  cursor:pointer;
  user-select:none;

  transition:transform .15s ease;

  z-index:10;
}

.bell:active{
  transform:scale(.96);
}

/* =====================================================
   ベルちゃん
===================================================== */

body:not(.logged-in) .bell{
  width:85px;
  right:20px;
  bottom:0px;
}

body.logged-in .bell{
  width:90px;
  right:25px;
  bottom:0px;
}

/* =====================================================
   ★ チャイムくん専用設定 ★
===================================================== */

body:not(.logged-in) .bell.chime{
  width:80px;
  right:18px;
  top:10px;
}

body.logged-in .bell.chime{
  width:80px;
  right:18px;
  top:0px;
}

/* =====================================================
   吹き出し
===================================================== */

.bubble{
  position:absolute;

  max-width:calc(100vw - 8px);

  background:#fff;

  border:2px solid #d9e5ed;
  border-radius:18px;

  padding:7px 8px;

  box-shadow:none;

  font-size:10px;
  line-height:1.55;

  animation:
    bubbleAppear
    .55s
    cubic-bezier(.2,.9,.25,1.2)
    both;

  z-index:30;
}

.bubble small{
  display:block;

  color:#84939d;

  font-size:8px;

  margin-bottom:2px;
}

/* =====================================================
   アニメーション中は吹き出しを消す
===================================================== */

.bubble.bubble-hidden{
  visibility:hidden;
  opacity:0;
  pointer-events:none;
}

/* =====================================================
   ログイン前 吹き出し
===================================================== */

body:not(.logged-in) .bubble{
  min-width:105px;
  width:176px;
  max-width:198px;
  box-sizing:border-box;
  right:4px;
  top:10px;
}

body:not(.logged-in) .bubble:after{
  content:"";

  position:absolute;

  width:12px;
  height:12px;

  right:20px;
  bottom:-7px;

  background:#fff;

  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;

  transform:rotate(45deg);
}

/* =====================================================
   ログイン後 吹き出し
===================================================== */

body.logged-in .bubble{
  min-width:105px;
  width:176px;
  max-width:198px;
  box-sizing:border-box;
  right:6px;
  top:10px;
}

body.logged-in .bubble:after{
  content:"";

  position:absolute;

  width:12px;
  height:12px;

  right:20px;
  bottom:-7px;

  background:#fff;

  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;

  transform:rotate(45deg);
}

/* =====================================================
   吹き出し登場
===================================================== */

@keyframes bubbleAppear{

  from{
    opacity:0;

    transform:
      scale(.9)
      translateY(7px);
  }

  to{
    opacity:1;

    transform:
      scale(1)
      translateY(0);
  }

}

/* =====================================================
   ハートを出す場所
===================================================== */

.heart-container{
  position:absolute;

  left:50%;
  top:50%;

  width:0;
  height:0;

  pointer-events:none;

  z-index:20;

  overflow:visible;
}

/* =====================================================
   ハート
===================================================== */

.heart{
  position:absolute;

  left:0;
  top:0;

  color:#ff7eb9;

  font-size:18px;

  line-height:1;

  opacity:0;

  transform:
    translate(
      var(--start-x),
      var(--start-y)
    )
    scale(.4);

  animation:
    heartFly
    1.8s
    cubic-bezier(.2,.75,.25,1)
    forwards;
}

/* =====================================================
   シークレット用：三日月
   ハートとまったく同じ飛び方・タイミングを使用
===================================================== */

.crescent-moon{
  position:absolute;

  left:0;
  top:0;

  color:#FFD700;

  text-shadow:
    0 0 5px #FFD700;

  font-size:18px;

  line-height:1;

  opacity:0;

  transform:
    translate(
      var(--start-x),
      var(--start-y)
    )
    scale(.4);

  animation:
    heartFly
    1.8s
    cubic-bezier(.2,.75,.25,1)
    forwards;
}
/* =====================================================
   ハートが飛び散る
===================================================== */

@keyframes heartFly{

  0%{
    opacity:0;

    transform:
      translate(
        var(--start-x),
        var(--start-y)
      )
      scale(.3)
      rotate(0deg);
  }

  12%{
    opacity:1;
  }

  45%{
    opacity:1;
  }

  100%{
    opacity:0;

    transform:
      translate(
        var(--end-x),
        var(--end-y)
      )
      scale(1)
      rotate(var(--rotate));
  }

}

/* =====================================================
   キャラクター喜びアニメーション
===================================================== */

.bell.celebrating{

  animation:
    bellCelebrate
    1.8s
    cubic-bezier(.2,.8,.25,1)
    both;

}

/* =====================================================
   2回ジャンプ
===================================================== */

@keyframes bellCelebrate{

  0%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }

  12%{
    transform:
      translateY(-18px)
      rotate(-8deg)
      scale(1.04);
  }

  24%{
    transform:
      translateY(-25px)
      rotate(8deg)
      scale(1.05);
  }

  38%{
    transform:
      translateY(0)
      rotate(-4deg)
      scale(1);
  }

  45%{
    transform:
      translateY(-6px)
      rotate(3deg)
      scale(1.02);
  }

  57%{
    transform:
      translateY(-22px)
      rotate(-9deg)
      scale(1.05);
  }

  69%{
    transform:
      translateY(-30px)
      rotate(9deg)
      scale(1.06);
  }

  83%{
    transform:
      translateY(0)
      rotate(-3deg)
      scale(1);
  }

  92%{
    transform:
      translateY(-3px)
      rotate(2deg)
      scale(1.01);
  }

  100%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }

}

/* =====================================================
   シークレット衣装（7レイヤー）
   通常のベルちゃんと同じ85px / 90pxの座標系で重ねる
===================================================== */

.secret-costume{
  position:absolute;
  width:var(--bell-size,90px) !important;
  height:var(--bell-size,90px) !important;
  right:var(--bell-right,25px) !important;
  top:var(--bell-top,30px) !important;
  z-index:11;
  pointer-events:none;
  user-select:none;
  display:none;
  overflow:visible;
  box-sizing:border-box;
}

.secret-costume.show{
  display:block;
}

/*
 * レイヤー画像本体。
 * サイズ・位置・角度はwrapper側で個別設定する。
 */
.secret-costume img{
  position:absolute !important;

  left:0 !important;
  top:0 !important;

  width:100% !important;
  height:100% !important;

  min-width:0 !important;
  min-height:0 !important;

  max-width:none !important;
  max-height:none !important;

  object-fit:contain !important;
  object-position:center center !important;

  margin:0 !important;
  padding:0 !important;

  border:0 !important;
  outline:0 !important;
  box-shadow:none !important;

  pointer-events:none;
  user-select:none;

  display:block;
}

body:not(.logged-in){
  --bell-size:85px;
  --bell-right:20px;
  --bell-top:12px;
}

body.logged-in{
  --bell-size:90px;
  --bell-right:25px;
  --bell-top:0px;
}

body:not(.logged-in) .secret-costume{
  right:20px !important;
  top:12px !important;
}

body.logged-in .secret-costume{
  right:25px !important;
  bottom:0 !important;
}

/* =====================================================
 * シークレット衣装：常時アニメーション
 *
 * ★ 位置がずれない仕組み
 *   各レイヤーのwrapperは拡大率・角度が違うため、
 *   レイヤー個別に translate / scale を動かすとズレる。
 *   そこで全体の動き（呼吸・光）は、全レイヤーをまとめた
 *   .secret-body に1回だけ付ける。
 *   レイヤー個別に付けるのは「小さな回転のゆれ」だけ。
 *
 *  ① 呼吸    … 全体が上下＋ほんの少し拡大（.secret-body）
 *  ② 光      … 全体に金色の光が脈打つ（.secret-body）
 *  ③ ゆれ    … リボンなどの別パーツだけ左右に揺れる
 *  ④ きらめき … 衣装の周りで星が交互に瞬く
 *
 * クラス名の対応（SECRET_BELL_LAYERSの順番）
 *   0=base→secret-layer-00 / 1=main→secret-layer-main
 *   2=layer-01→secret-layer-02 / 3→03 / 4→04 / 5→05
===================================================== */

.secret-costume .secret-body{
  transform-origin:50% 90%;
  animation:
    secretBreath 3s ease-in-out infinite,
    secretGlow 2.6s ease-in-out infinite;
}

/* base と main は動かさない（全体と一緒に動く） */

/* 別パーツのゆれ（回転だけ）。
   transform-origin は各画像の「付け根」の位置（画像全体を100%とした割合）。
   画像から計算した値なので、パーツが浮かず付け根を支点に揺れる。 */

/* layer-01（スカートのフリル）= secret-layer-02 */
.secret-costume .secret-layer-02{
  transform-origin:17% 32%;
  animation:secretSwayR 2.2s ease-in-out infinite;
}

/* layer-02（右上のリボン）= secret-layer-03 */
.secret-costume .secret-layer-03{
  transform-origin:18% 13%;
  animation:secretRibbon 2.6s ease-in-out infinite;
}

/* layer-03（長いリボン）= secret-layer-04 */
.secret-costume .secret-layer-04{
  transform-origin:88% 12%;
  animation:secretSwayL 2.8s ease-in-out infinite;
}

/* layer-04（光るフリル）= secret-layer-05 */
.secret-costume .secret-layer-05{
  transform-origin:18% 28%;
  animation:secretSwayR 2.4s ease-in-out .3s infinite;
}

/* layer-05（大きな蝶結び）= secret-layer-06：付け根を支点に、ゆっくり揺れる */
.secret-costume .secret-layer-06{
  transform-origin:30% 20%;
  animation:secretRibbon 3.2s ease-in-out infinite;
}

/* きらめき（衣装が表示されている間だけ） */
.secret-costume::before,
.secret-costume::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#fff;
  opacity:0;
  pointer-events:none;
  z-index:5;
}

.secret-costume::before{
  box-shadow:
    -40px -30px 3px 1px #ffe08a,
    30px -42px 3px 0 #fff,
    42px -4px 3px 1px #ffd1e8,
    -42px 14px 3px 0 #fff;
  animation:secretTwinkle 2.4s ease-in-out infinite;
}

.secret-costume::after{
  box-shadow:
    -24px -44px 3px 0 #fff,
    44px -26px 3px 1px #ffe08a,
    -44px -6px 3px 0 #bfe6ff,
    34px 20px 3px 1px #fff;
  animation:secretTwinkle 2.4s ease-in-out 1.2s infinite;
}

.secret-costume.celebrating{
  animation:
    bellCelebrate
    1.8s
    cubic-bezier(.2,.8,.25,1)
    both;
}

@keyframes secretBreath{
  0%,100%{translate:0 0;scale:1;}
  50%{translate:0 -3px;scale:1.02;}
}

@keyframes secretSwayR{
  0%,100%{rotate:0deg;}
  50%{rotate:2.5deg;}
}

@keyframes secretSwayL{
  0%,100%{rotate:0deg;}
  50%{rotate:-3.5deg;}
}

@keyframes secretRibbon{
  0%,100%{rotate:0deg;}
  50%{rotate:-3deg;}
}

@keyframes secretGlow{
  0%,100%{filter:drop-shadow(0 0 0 rgba(255,214,102,0));}
  50%{filter:drop-shadow(0 0 6px rgba(255,214,102,.9));}
}

@keyframes secretTwinkle{
  0%,100%{opacity:0;}
  50%{opacity:1;}
}

/* 動きを減らす設定の端末では、きらめきと光を止める */
@media (prefers-reduced-motion:reduce){
  .secret-costume::before,
  .secret-costume::after{display:none;}
  .secret-costume .secret-body,
  .secret-costume .secret-layer{animation:none;}
}

</style>
</head>

<body>

<div class="bell-area">

  <div class="bubble">

    <small id="characterName">
      ベルちゃん
    </small>

    <span id="bellMessage">
      予定を確認してるよ！
    </span>

  </div>

  <div
    class="heart-container"
    id="heartContainer">
  </div>

  <img
    class="bell"
    src="bell.png"
    alt="ベルちゃん"
    id="bellImage"
  >

  <div
    id="secretCostume"
    class="secret-costume"
    aria-hidden="true">
  </div>

</div>

<script type="module">

/* =====================================================
   基本
===================================================== */

const message =
  document.getElementById(
    "bellMessage"
  );

const bellImage =
  document.getElementById(
    "bellImage"
  );

const characterName =
  document.getElementById(
    "characterName"
  );

const bubble =
  document.querySelector(
    ".bubble"
  );

const heartContainer =
  document.getElementById(
    "heartContainer"
  );

const secretCostume =
  document.getElementById(
    "secretCostume"
  );

const SECRET_COSTUME_IDS = {

  bell:[
    "secret-bell",
    "secret_bell_rare_costume"
  ],

  chime:[
    "secret-chime",
    "secret_chime_rare_costume"
  ]

};

const SECRET_BELL_LAYERS = [

  "costumes/bell-secret-base.png",

  "costumes/bell-secret-main.png",

  "costumes/bell-secret-layer-01.png",

  "costumes/bell-secret-layer-02.png",

  "costumes/bell-secret-layer-03.png",

  "costumes/bell-secret-layer-04.png",

  "costumes/bell-secret-layer-05.png"

];

/* =====================================================
   ★ シークレット衣装 7レイヤー位置設定 ★
   x：右へ動かすとプラス / 左へ動かすとマイナス
   y：下へ動かすとプラス / 上へ動かすとマイナス
   それぞれのレイヤーを個別に調整できます。
===================================================== */

const SECRET_LAYER_POSITIONS = [
  {x:-5.1,y:-9.9}, // 1 base（完成形の絵に合わせた値）
  {x:-4,y:30}, // 2 main（完成形の絵に合わせた値）
  {x:0,y:0}, // 3
  {x:25,y:35}, // 4
  {x:-62,y:35}, // 5
  {x:0,y:0}, // 6
  {x:32.5,y:4.9} // 7 layer-05 蝶結び（完成形の絵に合わせた値）
];

/* =====================================================
   ★ シークレット衣装 7レイヤー大きさ設定 ★
   width：横幅（100 = 通常）
   height：高さ（100 = 通常）
   scale：全体サイズ（1.00 = 通常）
   angle：角度（0 = 通常 / プラスで時計回り / マイナスで反時計回り）
   それぞれのレイヤーを個別に調整できます。
===================================================== */

const SECRET_LAYER_SIZES = [
  {width:100,height:100,scale:1.1,angle:-3.9}, // 1 base
  {width:100,height:100,scale:1.45,angle:0}, // 2 main
  {width:100,height:100,scale:1,angle:0}, // 3
  {width:100,height:100,scale:1,angle:0}, // 4
  {width:100,height:100,scale:1,angle:0}, // 5
  {width:100,height:100,scale:1,angle:0}, // 6
  {width:100,height:100,scale:0.96,angle:10.3} // 7 layer-05
];

/* =====================================================
   ★ シークレット衣装 7レイヤー ON / OFF ★
   true  = 表示する
   false = 表示しない
   PNGファイル自体はcostumesフォルダに残しておいてOK。
===================================================== */

const SECRET_LAYER_ENABLED = [
  true, // 1
  true, // 2
  false, // 3
  true, // 4
  true, // 5
  false, // 6
  true // 7
];

/*
 * =====================================================
 * シークレット衣装 全体調整
 * =====================================================
 * 7枚のレイヤーをまとめて移動・拡大縮小・回転できます。
 *
 * x / y     : 全体の位置
 * scale     : 全体の大きさ
 * angle     : 全体の回転角度
 *
 * 各レイヤーの個別調整は、これまで通り
 * SECRET_LAYER_POSITIONS / SECRET_LAYER_SIZES で行います。
 */
const SECRET_COSTUME_GLOBAL = {
  x: 0,
  y: 0,
  scale: 1,
  angle: 0
};

function isSecretCostumeId(
  id,
  character
){

  return !!id &&
    SECRET_COSTUME_IDS[character]?.includes(id);

}

function isSecretEquipped(
  character
){

  return isSecretCostumeId(
    equippedCostumes?.[character] || null,
    character
  );

}

let secretRenderToken=0;

/*
 * シークレット画像の周囲に残っている白・薄灰色・チェック柄系の
 * 背景だけを、画像の外周からたどって透明化する。
 * 衣装内部の白い部分は外周とつながっていなければ残す。
 */
async function prepareSecretLayer(
  src
){

  const image =
    new Image();

  image.src =
    src;

  await new Promise(
    (resolve,reject)=>{

      image.onload =
        resolve;

      image.onerror =
        reject;

    }
  );

  const width =
    image.naturalWidth;

  const height =
    image.naturalHeight;

  if(
    !width ||
    !height
  ){

    throw new Error(
      "シークレット画像のサイズを取得できません"
    );

  }

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    width;

  canvas.height =
    height;

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );

  if(!ctx)return src;

  ctx.drawImage(
    image,
    0,
    0
  );

  const imageData =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );

  const pixels =
    imageData.data;

  const visited =
    new Uint8Array(
      width*height
    );

  const queue =
    new Int32Array(
      width*height
    );

  let head=0;
  let tail=0;

  const isBackground =
    (pixelIndex)=>{

      const p =
        pixelIndex*4;

      const alpha =
        pixels[p+3];

      if(alpha===0)return true;

      const r =
        pixels[p];

      const g =
        pixels[p+1];

      const b =
        pixels[p+2];

      const max =
        Math.max(
          r,
          g,
          b
        );

      const min =
        Math.min(
          r,
          g,
          b
        );

      const chroma =
        max-min;

      /* 白〜薄い灰色の背景を対象にする */
      return (
        min>=215 &&
        chroma<=28
      );

    };

  const enqueue =
    (pixelIndex)=>{

      if(
        pixelIndex<0 ||
        pixelIndex>=width*height
      ){

        return;

      }

      if(
        visited[pixelIndex]
      ){

        return;

      }

      if(
        !isBackground(
          pixelIndex
        )
      ){

        return;

      }

      visited[pixelIndex]=1;

      queue[tail++]=
        pixelIndex;

    };

  /* 外周から背景領域を開始 */

  for(
    let x=0;
    x<width;
    x++
  ){

    enqueue(x);

    enqueue(
      (height-1)*width+x
    );

  }

  for(
    let y=1;
    y<height-1;
    y++
  ){

    enqueue(
      y*width
    );

    enqueue(
      y*width+(width-1)
    );

  }

  while(
    head<tail
  ){

    const index =
      queue[head++];

    const x =
      index%width;

    const y =
      Math.floor(
        index/width
      );

    if(x>0){

      enqueue(
        index-1
      );

    }

    if(x<width-1){

      enqueue(
        index+1
      );

    }

    if(y>0){

      enqueue(
        index-width
      );

    }

    if(y<height-1){

      enqueue(
        index+width
      );

    }

  }

  for(
    let i=0;
    i<visited.length;
    i++
  ){

    if(
      visited[i]
    ){

      pixels[
        i*4+3
      ]=0;

    }

  }

  ctx.putImageData(
    imageData,
    0,
    0
  );

  return canvas.toDataURL(
    "image/png"
  );

}

function renderSecretCostume(
  character
){

  if(!secretCostume)return;

  const renderToken =
    ++secretRenderToken;

  secretCostume.innerHTML="";

  secretCostume.classList.remove(
    "show",
    "celebrating"
  );

  secretCostume.setAttribute(
    "aria-hidden",
    "true"
  );

  /* 通常衣装ではベルちゃん本体をそのまま表示 */

  bellImage.style.visibility =
    "visible";

  bellImage.style.opacity =
    "1";

  /*
   * 現在レイヤー画像が用意されているのはベルちゃん
   */

  if(
    character!=="bell" ||
    !isSecretEquipped("bell")
  ){

    return;

  }

  let loadedCount=0;
  let failed=false;

  /*
   * 全レイヤーをまとめる「本体グループ」。
   * 呼吸・光などの全体の動きはここに付けるので、
   * 7枚のレイヤーが同じ量・同じ向きで動き、位置がずれない。
   */
  const secretBody =
    document.createElement("div");

  secretBody.className =
    "secret-body";

  secretBody.style.cssText =
    "position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;";

  /*
   * 7レイヤーをまとめて動かすための全体Transform。
   * 個別レイヤーのTransformとは独立しているので、
   * SECRET_LAYER_POSITIONS / SECRET_LAYER_SIZES を壊しません。
   */
  secretBody.style.transform =
    `translate(${SECRET_COSTUME_GLOBAL.x}px, ${SECRET_COSTUME_GLOBAL.y}px) scale(${SECRET_COSTUME_GLOBAL.scale}) rotate(${SECRET_COSTUME_GLOBAL.angle}deg)`;

  secretBody.style.transformOrigin =
    "center center";

  secretCostume.appendChild(
    secretBody
  );

  const enabledLayerCount =
    SECRET_BELL_LAYERS.filter(
      (_,index)=>
        SECRET_LAYER_ENABLED[index]===true
    ).length;

  if(
    enabledLayerCount===0
  ){

    bellImage.style.visibility =
      "visible";

    bellImage.style.opacity =
      "0";

    secretCostume.classList.add(
      "show"
    );

    secretCostume.setAttribute(
      "aria-hidden",
      "false"
    );

    return;

  }

  SECRET_BELL_LAYERS.forEach(
    (src,index)=>{

      if(
        SECRET_LAYER_ENABLED[index]!==true
      ){

        return;

      }

      /*
       * wrapperをレイヤーごとに作る。
       * サイズ・位置・角度はすべてこのwrapperで独立管理する。
       */
      const layerWrap =
        document.createElement(
          "div"
        );

      layerWrap.className =
        `secret-layer-wrap secret-layer-wrap-${index}`;

      layerWrap.style.position =
        "absolute";

      layerWrap.style.width =
        "100%";

      layerWrap.style.height =
        "100%";

      layerWrap.style.left =
        "0";

      layerWrap.style.top =
        "0";

      layerWrap.style.pointerEvents =
        "none";

      layerWrap.style.userSelect =
        "none";

      layerWrap.style.overflow =
        "visible";

      const img =
        document.createElement(
          "img"
        );

      img.alt="";
      img.draggable=false;

      img.className =
        `secret-layer secret-layer-${
          index===1
            ? "main"
            : String(index).padStart(2,"0")
        }`;

      /*
       * 必ず通常ベルちゃんと同じ座標系に固定
       */

      const layerPosition =
        SECRET_LAYER_POSITIONS[index] ||
        {
          x:0,
          y:0
        };

      const layerSize =
        SECRET_LAYER_SIZES[index] ||
        {
          width:100,
          height:100,
          scale:1,
          angle:0
        };

      /*
       * 横幅・高さ・全体サイズ・角度は個別指定。
       *
       * position の x/y はレイヤー本体の中心位置を基準にする。
       *
       * scale と angle はwrapperに適用するため、
       * レイヤー画像側のアニメーションと分離できます。
       */

      layerWrap.style.width =
        `${layerSize.width}%`;

      layerWrap.style.height =
        `${layerSize.height}%`;

      layerWrap.style.left =
  `${(100-layerSize.width)/2}%`;

layerWrap.style.top =
  `${(100-layerSize.height)/2}%`;

layerWrap.style.transform =
  `translate(${layerPosition.x}px, ${layerPosition.y}px) scale(${layerSize.scale}) rotate(${layerSize.angle}deg)`;
      layerWrap.style.transformOrigin =
        "center center";

      img.style.width =
        "100%";

      img.style.height =
        "100%";

      img.style.maxWidth =
        "none";

      img.style.maxHeight =
        "none";

      img.style.position =
        "absolute";

      img.style.left =
        "0";

      img.style.top =
        "0";

      img.style.objectFit =
        "contain";

      img.style.objectPosition =
        "center center";

      img.onload =
        ()=>{

          if(
            renderToken!==secretRenderToken
          ){

            return;

          }

          loadedCount++;

          if(
            loadedCount===
              enabledLayerCount &&
            !failed
          ){

            /*
             * シークレット衣装表示中は
             * 通常ベルちゃんを透明にする。
             *
             * opacity:0 にするだけなので、
             * 通常ベルちゃんのクリックや
             * アニメーション処理は維持される。
             */

            bellImage.style.visibility =
              "visible";

            bellImage.style.opacity =
              "0";

            secretCostume.classList.add(
              "show"
            );

            secretCostume.setAttribute(
              "aria-hidden",
              "false"
            );

            requestAnimationFrame(sendBellHitBounds);

          }

        };

      img.onerror =
        ()=>{

          if(
            renderToken!==secretRenderToken
          ){

            return;

          }

          failed=true;

          console.error(
            "シークレット衣装画像の読み込み失敗:",
            src
          );

          secretCostume.classList.remove(
            "show",
            "celebrating"
          );

          secretCostume.setAttribute(
            "aria-hidden",
            "true"
          );

          secretCostume.innerHTML="";

          bellImage.style.visibility =
            "visible";

          bellImage.style.opacity =
            "1";

          requestAnimationFrame(sendBellHitBounds);

        };

      layerWrap.appendChild(
        img
      );

      secretBody.appendChild(
        layerWrap
      );

      /*
       * 背景透明化後の画像を設定
       */

      prepareSecretLayer(src)
        .then(
          preparedSrc=>{

            if(
              renderToken!==secretRenderToken
            ){

              return;

            }

            img.src =
              preparedSrc;

          }
        )
        .catch(
          error=>{

            if(
              renderToken!==secretRenderToken
            ){

              return;

            }

            console.error(
              "シークレット衣装画像の加工に失敗:",
              src,
              error
            );

            /*
             * 加工できない場合は元画像を表示
             */
            img.src =
              src;

          }
        );

    }
  );

}

===================================================== */

const TEST_DATE = null;

===================================================== */

const jugoyaDates = {

  2026:"09-25",

  2030:"09-12",
  2031:"10-01",

/* =====================================================
   ★ テスト日付機能
   URLに ?testDate=2026-12-25 のように指定すると
   その日付として特殊服を判定する。
   指定しない場合は通常どおり今日の日付を使用。
===================================================== */

function getTestDate(){

  /* コード指定のテスト日付を最優先 */

  if(TEST_DATE){

    try{

      if(
        /^\d{4}-\d{2}-\d{2}$/.test(
          TEST_DATE
        )
      ){

        const testDate =
          new Date(
            `${TEST_DATE}T12:00:00`
          );

        if(
          !Number.isNaN(
            testDate.getTime()
          ) &&
          testDate.getFullYear() ===
            Number(
              TEST_DATE.slice(0,4)
            ) &&
          testDate.getMonth()+1 ===
            Number(
              TEST_DATE.slice(5,7)
            ) &&
          testDate.getDate() ===
            Number(
              TEST_DATE.slice(8,10)
            )
        ){

          return testDate;

        }

      }

    }catch(error){

      console.warn(
        "コード指定のテスト日付を読み込めませんでした",
        error
      );

    }

  }

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );

    const value =
      params.get(
        "testDate"
      );

    if(
      value &&
      /^\d{4}-\d{2}-\d{2}$/.test(
        value
      )
    ){

      const testDate =
        new Date(
          `${value}T12:00:00`
        );

      if(
        !Number.isNaN(
          testDate.getTime()
        ) &&
        testDate.getFullYear() ===
          Number(
            value.slice(0,4)
          ) &&
        testDate.getMonth()+1 ===
          Number(
            value.slice(5,7)
          ) &&
        testDate.getDate() ===
          Number(
            value.slice(8,10)
          )
      ){

        return testDate;

      }

    }

  }catch(error){

    console.warn(
      "テスト日付を読み込めませんでした",
      error
    );

  }

  return null;

}

function getCurrentDate(){

  return getTestDate() ||
    new Date();

}

/* =====================================================
   今日が特殊服の日か判定
===================================================== */

function getCostumeKey(
  date=getCurrentDate()
){

  const month =
    date.getMonth()+1;

  const day =
    date.getDate();

  /* ---------------------------------------------
     お正月
     1月1日〜1月5日
  --------------------------------------------- */

  if(
    month===1 &&
    day>=1 &&
    day<=5
  ){

    return "newyear";

  }

  /*
   * 1月6日〜1月31日は
   * 通常衣装のまま
   */

  /* ---------------------------------------------
     節分
  --------------------------------------------- */

  if(
    month===2 &&
    day===3
  ){

    return "setsubun";

  }

  /* ---------------------------------------------
     バレンタイン
  --------------------------------------------- */

  if(
    month===2 &&
    day===14
  ){

    return "valentine";

  }

  /* ---------------------------------------------
     ひな祭り
  --------------------------------------------- */

  if(
    month===3 &&
    day===3
  ){

    return "hinamatsuri";

  }

  /* ---------------------------------------------
     ホワイトデー
  --------------------------------------------- */

  if(
    month===3 &&
    day===14
  ){

    return "whiteday";

  }

  /* ---------------------------------------------
     こどもの日
  --------------------------------------------- */

  if(
    month===5 &&
    day===5
  ){

    return "kodomonohi";

  }

  /* ---------------------------------------------
     七夕
  --------------------------------------------- */

  if(
    month===7 &&
    day===7
  ){

    return "tanabata";

  }

  /* ---------------------------------------------
     十五夜
  --------------------------------------------- */

  const monthDay =
    `${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

  const jugoya =
    jugoyaDates[
      date.getFullYear()
    ];

  if(
    jugoya &&
    jugoya===monthDay
  ){

    return "tsukimi";

  }

  /* ---------------------------------------------
     ハロウィン
  --------------------------------------------- */

  if(
    month===10 &&
    day===31
  ){

    return "halloween";

  }

  /* ---------------------------------------------
     クリスマスイブ
  --------------------------------------------- */

  if(
    month===12 &&
    day===24
  ){

    return "christmaseve";

  }

  /* ---------------------------------------------
     クリスマス
  --------------------------------------------- */

  if(
    month===12 &&
    day===25
  ){

    return "christmas";

  }

  /* ---------------------------------------------
     大晦日
     → winter衣装
  --------------------------------------------- */

  if(
    month===12 &&
    day===31
  ){

    return "winter";

  }

  return null;

}

/* =====================================================
   今日のキャラクター画像を取得
===================================================== */

function getCharacterImage(
  character,
  date=getCurrentDate()
){

  const selected =
    character === "chime"
      ? "chime"
      : "bell";

  /* ---------------------------------------------
     ① シークレット衣装
     シークレットは最優先
  --------------------------------------------- */

  if(
    isSecretEquipped(
      selected
    )
  ){

    return characterImages[
      selected
    ].src;

  }

  /*
   * 衣装の優先順位
   *
   * 1. ユーザーが「着替える」で選んだ衣装
   * 2. イベント日の衣装
   * 3. 通常のベルちゃん
   *
   * イベント日は強制衣装ではありません。
   */

  /* ---------------------------------------------
     ② ユーザーが選択した衣装
  --------------------------------------------- */

  const equipped =
    equippedCostumes?.[selected] ||
    null;

  const equippedImage =
    getCostumeImageFromId(
      equipped,
      selected
    );

  if(equippedImage){

    return equippedImage;

  }

  /* ---------------------------------------------
     ③ イベント衣装
  --------------------------------------------- */

  const costumeKey =
    getCostumeKey(date);

  if(costumeKey){

    const override =
      eventCostumeOverrides?.[
        costumeKey
      ]?.[selected] ||
      null;

    if(override){

      const overrideImage =
        getCostumeImageFromId(
          override,
          selected
        );

      if(overrideImage){

        return overrideImage;

      }

    }

    if(
      costumeImages[
        selected
      ]?.[costumeKey]
    ){

      return costumeImages[
        selected
      ][costumeKey];

    }

  }

  /* ---------------------------------------------
     ④ 通常
  --------------------------------------------- */

  return characterImages[
    selected
  ].src;

}

function getCostumeImageFromId(
  costumeId,
  character
){

  if(!costumeId){

    return null;

  }

  if(
    costumeId ===
    "daily-costume-01"
  ){

    return "costumes/daily-costume-01.png";

  }

  if(
    costumeId ===
    "daily-costume-02"
  ){

    return "costumes/daily-costume-02.png";

  }

  if(
    costumeId.startsWith(
      "event_"
    )
  ){

    const suffix =
      character === "chime"
        ? "_chime"
        : "_bell";

    if(
      !costumeId.endsWith(
        suffix
      )
    ){

      return null;

    }

    let key =
      costumeId.slice(
        6,
        -suffix.length
      );

    if(
      key ===
      "newyearseve"
    ){

      key =
        "winter";

    }

    return (
      costumeImages
        ?.[character]
        ?.[key] ||
      null
    );

  }

  return null;

}

/* =====================================================
   キャラクター切り替え
===================================================== */

function setCharacter(
  character
){

  currentCharacter =
    character === "chime"
      ? "chime"
      : "bell";

  const data =
    characterImages[
      currentCharacter
    ];

  if(!data)return;

  /*
   * ★ここで特殊服を判定
   *
   * 特殊服画像が存在しない場合に
   * ブラウザの「？」表示にならないよう、
   * まず通常画像を確保してから特殊画像を読み込む。
   */

  const normalSrc =
    data.src;

  const costumeSrc =
    getCharacterImage(
      currentCharacter
    );

  bellImage.alt =
    data.name;

  bellImage.onerror =
    function(){

      /*
       * 読み込み失敗時は必ず通常画像へ戻す
       */

      if(
        this.src !==
        new URL(
          normalSrc,
          window.location.href
        ).href
      ){

        this.src =
          normalSrc;

      }

    };

  if(
    costumeSrc ===
    normalSrc
  ){

    bellImage.src =
      normalSrc;

  }else{

    const testImage =
      new Image();

    testImage.onload =
      function(){

        /*
         * 読み込み成功した特殊服だけ表示
         */

        bellImage.src =
          costumeSrc;

      };

    testImage.onerror =
      function(){

        /*
         * 特殊服がない場合は通常のベルちゃんを表示
         */

        bellImage.src =
          normalSrc;

      };

    testImage.src =
      costumeSrc;

  }

  if(
    currentCharacter ===
    "chime"
  ){

    bellImage.classList.add(
      "chime"
    );

  }else{

    bellImage.classList.remove(
      "chime"
    );

  }

  if(characterName){

    characterName.textContent =
      data.name;

  }

  renderSecretCostume(
    currentCharacter
  );

}

let lastCostumeDate="";

function getTodayKey(){

  const now =
    getCurrentDate();

  return `${
    now.getFullYear()
  }-${
    String(
      now.getMonth()+1
    ).padStart(2,"0")
  }-${
    String(
      now.getDate()
    ).padStart(2,"0")
  }`;

}

function updateCostume(){

  const today =
    getTodayKey();

  if(
    today ===
    lastCostumeDate
  ){

    return;

  }

  lastCostumeDate =
    today;

  /*
   * この処理を開始した時点のキャラクターを保存。
   * 非同期の画像読み込み中にキャラクターが変わっても、
   * 古い画像が新しいキャラクターへ反映されないようにする。
   */

  const characterAtStart =
    currentCharacter;

  /*
   * キャラクターはそのまま。
   * 今日の特殊服だけ再判定。
   */

  const costumeImage =
    getCharacterImage(
      characterAtStart
    );

  const normalImage =
    characterImages[
      characterAtStart
    ].src;

  const normalUrl =
    new URL(
      normalImage,
      window.location.href
    ).href;

  const costumeUrl =
    new URL(
      costumeImage,
      window.location.href
    ).href;

  /*
   * シークレットの場合は
   * レイヤー側が表示を担当するので、
   * 通常画像を勝手にイベント衣装へ変更しない。
   */

  if(
    isSecretEquipped(
      characterAtStart
    )
  ){

    renderSecretCostume(
      characterAtStart
    );

    return;

  }

  /* 通常画像ならそのまま */

  if(
    costumeUrl ===
    normalUrl
  ){

    if(
      bellImage.src !==
      normalUrl
    ){

      bellImage.src =
        normalImage;

    }

    return;

  }

  /*
   * 特殊服画像は、読み込めた場合だけ切り替える
   */

  const testImage =
    new Image();

  testImage.onload =
    function(){

      if(
        lastCostumeDate === today &&
        currentCharacter ===
          characterAtStart
      ){

        bellImage.src =
          costumeImage;

      }

    };

  testImage.onerror =
    function(){

      /*
       * 特殊服が存在しない場合は通常画像を維持
       */

      if(
        currentCharacter ===
        characterAtStart
      ){

        bellImage.src =
          normalImage;

      }

    };

  testImage.src =
    costumeImage;

}

let parentSchedules={};

function setBellMessages(
  messages,
  preferred=null
){

  const cleaned = [
    ...new Set(
      (messages || [])
        .filter(
          v =>
            typeof v ===
              "string" &&
            v.trim()
        )
    )
  ];

  if(
    !cleaned.length
  ){

    return;

  }

  bellMessages =
    cleaned;

  showMessage(
    preferred &&
    cleaned.includes(
      preferred
    )
      ? preferred
      : pickRandom(
          cleaned
        )
  );

}

function buildBellMessages(
  schedules
){

  const now =
    getCurrentDate();

  const values =
    Object.values(
      schedules || {}
    )
    .filter(
      s =>
        s &&
        typeof s ===
          "object"
    );

  const all = [
    ...buildRegularMessages(
      values,
      now
    )
  ];

  try{

    const today =
      dateString(
        now
      );

    all.push(
      ...getClubBeforeStartMessages(
        values,
        today,
        now
      )
    );

  }catch(error){

    console.warn(
      "ベルちゃんの部活前メッセージを作成できませんでした",
      error
    );

  }

  try{

    const today =
      dateString(
        now
      );

    getEventSchedulesForDate(
      values,
      today
    ).forEach(
      event=>{

        all.push(
          `今日は${
            event.title ||
            (
              event.type ===
                "concert"
                ? "演奏会"
                : "イベント"
            )
          }だね！`
        );

      }
    );

  }catch(error){

    console.warn(
      "ベルちゃんの当日イベントメッセージを作成できませんでした",
      error
    );

  }

  try{

    const today =
      dateString(
        now
      );

    getUpcomingEvents(
      values,
      today
    ).forEach(
      event=>{

        all.push(
          `もうすぐ${
            event.title ||
            (
              event.type ===
                "concert"
                ? "演奏会"
                : "イベント"
            )
          }だね！`
        );

      }
    );

  }catch(error){

    console.warn(
      "ベルちゃんの予定メッセージを作成できませんでした",
      error
    );

  }

  return [
    ...new Set(
      all
    )
  ];

}

function receiveParentSchedules(
  schedules
){

  parentSchedules =
    schedules &&
    typeof schedules ===
      "object"
      ? schedules
      : {};

  setBellMessages(
    buildBellMessages(
      parentSchedules
    )
  );

}

function sendBellHitBounds(){
  if(!isEmbedded || !bellImage || !secretCostume) return;

  const targets=[];
  if(secretCostume.classList.contains("show")){
    secretCostume.querySelectorAll(".secret-layer-wrap").forEach(el=>targets.push(el));
  }else{
    targets.push(bellImage);
  }

  const rects=targets.map(el=>el.getBoundingClientRect()).filter(rect=>rect.width>0 && rect.height>0);
  if(!rects.length) return;

  const left=Math.min(...rects.map(r=>r.left));
  const top=Math.min(...rects.map(r=>r.top));
  const right=Math.max(...rects.map(r=>r.right));
  const bottom=Math.max(...rects.map(r=>r.bottom));

  window.parent.postMessage({
    type:"handbell-bell-hit-bounds",
    bounds:{left,top,width:right-left,height:bottom-top}
  },"*");
}

      equippedCostumes = {

          null

      };

      setCharacter(

      );

      );

    ){

/* =====================================================
   日付・時間
===================================================== */

function pad(n){

  return String(
    n
  ).padStart(
    2,
    "0"
  );

}

function dateString(
  date=getCurrentDate()
){

  return `${
    date.getFullYear()
  }-${
    pad(
      date.getMonth()+1
    )
  }-${
    pad(
      date.getDate()
    )
  }`;

}

function monthString(
  date=getCurrentDate()
){

  return `${
    date.getFullYear()
  }-${
    pad(
      date.getMonth()+1
    )
  }`;

}

function timeToMinutes(
  value
){

  const match =
    String(
      value || ""
    )
    .match(
      /^(\d{1,2}):(\d{2})$/
    );

  if(!match){

    return null;

  }

  return (
    Number(match[1])*60 +
    Number(match[2])
  );

}

/* =====================================================
   挨拶
===================================================== */

function getGreeting(
  date=getCurrentDate()
){

  const hour =
    date.getHours();

  if(
    hour>=4 &&
    hour<10
  ){

    return "おはよう！";

  }

  if(
    hour>=10 &&
    hour<17
  ){

    return "こんにちは！";

  }

  return "こんばんは!";

}

function greetingMessage(
  text,
  date=getCurrentDate()
){

  return `${
    getGreeting(
      date
    )
  }${text}`;

}

/* =====================================================
   時刻表示
===================================================== */

function formatJapaneseTime(
  value
){

  const match =
    String(
      value || ""
    )
    .match(
      /^(\d{1,2}):(\d{2})$/
    );

  if(!match){

    return String(
      value || ""
    );

  }

  return `${
    Number(
      match[1]
    )
  }時${
    match[2]
  }分`;

}

function formatTimeRange(
  time
){

  const value =
    String(
      time || ""
    ).trim();

  if(
    !value ||
    value ===
      "終日"
  ){

    return "";

  }

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]\s*(\d{1,2}:\d{2})$/
    );

  if(!match){

    return value;

  }

  return `${
    formatJapaneseTime(
      match[1]
    )
  }〜${
    formatJapaneseTime(
      match[2]
    )
  }`;

}

function getStartTime(
  time
){

  const value =
    String(
      time || ""
    ).trim();

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]/
    );

  return match
    ? timeToMinutes(
        match[1]
      )
    : null;

}

/* =====================================================
   日付計算
===================================================== */

function getTomorrowString(
  date=getCurrentDate()
){

  const tomorrow =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()+1
    );

  return dateString(
    tomorrow
  );

}

function daysFromToday(
  dateStringValue,
  today=getCurrentDate()
){

  const target =
    new Date(
      `${dateStringValue}T00:00:00`
    );

  const base =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

  return Math.round(
    (
      target-base
    ) / 86400000
  );

}

function isUpcomingWithinDays(
  dateValue,
  today,
  days
){

  if(!dateValue){

    return false;

  }

  const diff =
    daysFromToday(
      dateValue,
      today
    );

  return (
    diff>0 &&
    diff<=days
  );

}

/* =====================================================
   スケジュール
===================================================== */

function getNormalSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      s.type ===
        "normal" &&
      s.date ===
        date
  );

}

function getEventSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      (
        s.type ===
          "concert" ||
        s.type ===
          "event"
      ) &&
      s.date ===
        date
  );

}

function getUpcomingEvents(
  values,
  today
){

  return values
    .filter(
      s =>
        s &&
        (
          s.type ===
            "concert" ||
          s.type ===
            "event"
        ) &&
        isUpcomingWithinDays(
          s.date,
          today,
          7
        )
    )
    .sort(
      (a,b)=>
        String(
          a.date
        )
        .localeCompare(
          String(
            b.date
          )
        )
    );

}

function getMonthlyClubCount(
  values,
  today
){

  const month =
    monthString(
      today
    );

  return values.filter(
    s =>
      s &&
      (
        s.type ===
          "normal" ||
        !s.type
      ) &&
      typeof s.date ===
        "string" &&
      s.date.startsWith(
        month
      )
  ).length;

}

function getClubBeforeStartMessages(
  values,
  today,
  dateNow
){

  const todayNormal =
    getNormalSchedulesForDate(
      values,
      today
    )[0];

  if(
    !todayNormal
  ){

    return [];

  }

  const start =
    getStartTime(
      todayNormal.time
    );

  const nowMinutes =
    dateNow.getHours()*60 +
    dateNow.getMinutes();

  if(
    start===null ||
    nowMinutes>=start
  ){

    return [];

  }

  const range =
    formatTimeRange(
      todayNormal.time
    );

  const result=[];

  if(range){

    result.push(
      greetingMessage(
        `今日の部活は${range}だよ`,
        dateNow
      )
    );

  result.push(

    greetingMessage(
      "今日の部活、頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日もみんなでハンドベル頑張ろうね！",

      dateNow

  );

  return result;

function pickRandom(
  list
){

  if(
    !list.length
  ){

    return "予定を確認してみてね！";

  }

  return list[
    Math.floor(
      Math.random()*
      list.length
    )
  ];

}

){

function changeBellMessage(){

  if(
    !bellMessages.length
  ){

    return;

  }

  let next =
    pickRandom(
      bellMessages
    );

  if(
    bellMessages.length>1 &&
    next ===
      message.textContent
  ){

    const other =
      bellMessages.filter(
        item =>
          item !==
            message.textContent
      );

    next =
      pickRandom(
        other
      );

  }

  showMessage(
    next
  );

}

function startSecretMoon(){

  /*
   * シークレット専用クリック演出。
   * 月夜は別HTMLに完全分離しているので、
   * ここでは表示・終了通知だけを担当する。
   */

  if(
    document.getElementById(
      "secretMoonFrame"
    )
  ){

    return;

  }

  /*
   * 月夜の最後に衣装が「戻る場所」を、広げる前に測っておく。
   * 外側のページ（画面全体）基準の中心座標と大きさを渡す。
   */
  try{

    const homeEl =
      document.getElementById(
        "secretCostume"
      );

    const homeRect =
      homeEl.getBoundingClientRect();

    const outer =
      window.frameElement
        ? window.frameElement.getBoundingClientRect()
        : {left:0,top:0};

    window.__secretMoonHome = {
      cx:outer.left+homeRect.left+homeRect.width/2,
      cy:outer.top+homeRect.top+homeRect.height/2,
      size:homeRect.width
    };

  }catch(e){

    window.__secretMoonHome = null;

  }

  /*
   * design.html は handbell.html の小さなiframe（202×160）の中にある。
   * このままだと 100vw×100vh が202×160になり、月夜が小さく切れてしまう。
   * そこで月夜の間だけ、自分を包んでいるiframeを画面全体に広げる。
   * （すでに大きい場合は何もしない）
   */
  const hostFrame = window.frameElement;

  if(
    hostFrame &&
    window.innerWidth < 600 &&
    hostFrame.dataset.secretMoonSaved === undefined
  ){

    hostFrame.dataset.secretMoonSaved =
      hostFrame.style.cssText;

    [
      ["position","fixed"],
      ["left","0"],
      ["top","0"],
      ["right","auto"],
      ["bottom","auto"],
      ["width","100vw"],
      ["height","100vh"],
      ["z-index","99999"]
    ].forEach(([k,v])=>{
      hostFrame.style.setProperty(k,v,"important");
    });

  }

  const frame =
    document.createElement("iframe");

  frame.id =
    "secretMoonFrame";

  /* 古い版が残らないよう、毎回URLを変えて読み込む */
  frame.src =
    "secret_moon.html?v=" + Date.now();

  frame.title =
    "シークレット月夜演出";

  frame.setAttribute(
    "aria-hidden",
    "true"
  );

  frame.style.position =
    "fixed";

  frame.style.left =
    "0";

  frame.style.top =
    "0";

  frame.style.width =
    "100vw";

  frame.style.height =
    "100vh";

  frame.style.border =
    "0";

  frame.style.margin =
    "0";

  frame.style.padding =
    "0";

  frame.style.background =
    "transparent";

  frame.style.zIndex =
    "99999";

  frame.style.pointerEvents =
    "auto";

  frame.style.display =
    "block";

  /* 月夜のあいだ、本物のベルちゃんは隠す（終わったら戻す） */
  frame.style.visibility =
    "visible";

  document.body.style.visibility =
    "hidden";

  document.body.appendChild(
    frame
  );

}

/* =====================================================
   キャラクターをクリック
===================================================== */

function celebrate(){

  if(
    isAnimating
  ){

    return;

  }

  /*
   * ★ シークレット衣装 ★
   *
   * 通常の「2回ジャンプ＋ハート」は絶対に実行しない。
   * シークレットのときだけ専用の月夜演出へ分岐する。
   */
  if(
    isSecretEquipped(
      currentCharacter
    ) &&
    secretCostume &&
    secretCostume.classList.contains(
      "show"
    )
  ){

    isAnimating=true;

    bubble.classList.add(
      "bubble-hidden"
    );

    /* ノーマルと同じ2回ジャンプ。出すものだけ三日月に変更 */
    secretCostume.classList.remove(
      "celebrating"
    );

    void secretCostume.offsetWidth;

    secretCostume.classList.add(
      "celebrating"
    );

    setTimeout(
      ()=>{
        startHearts("crescent");
      },
      150
    );

    setTimeout(
      ()=>{
        startHearts("crescent");
      },
      950
    );

    setTimeout(
      ()=>{

        secretCostume.classList.remove(
          "celebrating"
        );

        changeBellMessage();

        bubble.classList.remove(
          "bubble-hidden"
        );

        bubble.style.animation =
          "none";

        void bubble.offsetWidth;

        bubble.style.animation =
          "";

        isAnimating=false;

      },
      1800
    );

    return;

  }

  /* ===== 通常衣装は今まで通り ===== */

  isAnimating=true;

  bubble.classList.add(
    "bubble-hidden"
  );

  bellImage.classList.remove(
    "celebrating"
  );

  void bellImage.offsetWidth;

  bellImage.classList.add(
    "celebrating"
  );

  setTimeout(
    ()=>{
      startHearts();
    },
    150
  );

  setTimeout(
    ()=>{
      startHearts();
    },
    950
  );

}

/* =====================================================
   アニメーション終了
===================================================== */

bellImage.addEventListener(
  "animationend",
  event=>{

    if(
      event.animationName !==
      "bellCelebrate"
    ){

      return;

    }

    bellImage.classList.remove(
      "celebrating"
    );

    if(secretCostume){

      secretCostume.classList.remove(
        "celebrating"
      );

    }

    changeBellMessage();

    bubble.classList.remove(
      "bubble-hidden"
    );

    bubble.style.animation =
      "none";

    void bubble.offsetWidth;

    bubble.style.animation =
      "";

    isAnimating=false;

  }
);

/* =====================================================
   初期キャラクター
===================================================== */

/*
 * 初期表示でも画像エラーを
 * 「？」のままにしない。
 */

bellImage.addEventListener(
  "error",
  ()=>{

    const fallback =
      characterImages[
        currentCharacter
      ]?.src ||
      "bell.png";

    if(
      !bellImage.src.endsWith(
        fallback
      )
    ){

      bellImage.src =
        fallback;

    }

  }
);

setCharacter(
  "bell"
);

if(isEmbedded){
  requestAnimationFrame(sendBellHitBounds);
}

/* =====================================================
   初期メッセージ
===================================================== */

setBellMessages(
  buildBellMessages(
    {}
  )
);

/* =====================================================
   親ページへ準備完了を通知
===================================================== */

if(
  isEmbedded
){

  window.parent.postMessage(
    {
      type:
        "handbell-ready"
    },
    "*"
  );

}

/* =====================================================
   クリックイベント
===================================================== */

bellImage.addEventListener(
  "click",
  celebrate
);

window.addEventListener("resize",sendBellHitBounds);

/* =====================================================
   シークレット月夜演出の終了通知
===================================================== */

window.addEventListener(
  "message",
  event=>{

    if(
      !event.data ||
      event.data.type !==
        "secret-moon-finished"
    ){

      return;

    }

    const frame =
      document.getElementById(
        "secretMoonFrame"
      );

    if(frame){
      frame.remove();
    }

    /* 広げていた外側のiframeを元の大きさに戻す */
    const hostFrame = window.frameElement;

    if(
      hostFrame &&
      hostFrame.dataset.secretMoonSaved !== undefined
    ){

      hostFrame.style.cssText =
        hostFrame.dataset.secretMoonSaved;

      delete hostFrame.dataset.secretMoonSaved;

    }

    document.body.style.visibility =
      "";

    window.__secretMoonHome = null;

    changeBellMessage();

    bubble.classList.remove(
      "bubble-hidden"
    );

    bubble.style.animation =
      "none";

    void bubble.offsetWidth;

    bubble.style.animation =
      "";

    isAnimating=false;

  }
);


/* =====================================================
   位置調整モード：design.html?edit=1 で直接開くと使える
   画面を見ながら7レイヤーの位置・大きさ・角度を調整し、
   最後に「コピー」で数値をそのまま貼り付けられる。
   通常表示（iframe）には一切影響しない。
===================================================== */
if(new URLSearchParams(location.search).get("edit")==="1"){
(function(){

  const NAMES=["1 base","2 main","3 layer-01","4 layer-02","5 layer-03","6 layer-04","7 layer-05"];

  /* 全レイヤーを表示して、ベルちゃんのシークレット衣装を出す */
  for(let i=0;i<7;i++) SECRET_LAYER_ENABLED[i]=true;
  document.body.classList.add("logged-in","edit-static");
  equippedCostumes={bell:"secret-bell",chime:null};
  currentCharacter="bell";

  const css=document.createElement("style");
  css.textContent=`
    .bell-area{transform:scale(3);transform-origin:right bottom}
    body.edit-static .secret-body,
    body.edit-static .secret-layer,
    body.edit-static .secret-costume::before,
    body.edit-static .secret-costume::after{animation:none!important}
    #editPanel{position:fixed;left:8px;top:8px;width:290px;max-height:calc(100% - 16px);
      overflow:auto;background:rgba(255,255,255,.96);border:1px solid #cfd5df;border-radius:14px;
      padding:10px;z-index:99999;font:13px/1.5 -apple-system,"Hiragino Sans",sans-serif;color:#20242a}
    #editPanel button{border:1px solid #cfd5df;background:#f3f6fb;border-radius:8px;
      min-height:38px;padding:0 8px;font-size:13px;font-weight:700;color:#20242a}
    #editPanel button.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
    #editPanel .row{display:flex;gap:4px;align-items:center;margin:5px 0}
    #editPanel .row b{width:46px;flex:none}
    #editPanel .row button{flex:1}
    #editPanel .layers{display:grid;grid-template-columns:1fr 1fr;gap:4px}
    #editPanel textarea{width:100%;height:150px;font:11px/1.4 monospace;box-sizing:border-box}
  `;
  document.head.appendChild(css);

  /* 元の値を控える（リセット用） */
  const snap=JSON.stringify({
    pos:SECRET_LAYER_POSITIONS,size:SECRET_LAYER_SIZES,en:SECRET_LAYER_ENABLED
  });

  let cur=0, solo=false;

  function apply(){
    for(let i=0;i<7;i++){
      const w=secretCostume.querySelector(".secret-layer-wrap-"+i);
      if(!w) continue;
      const p=SECRET_LAYER_POSITIONS[i], z=SECRET_LAYER_SIZES[i];
      w.style.transform=`translate(${p.x}px, ${p.y}px) scale(${z.scale}) rotate(${z.angle}deg)`;
      w.style.display=SECRET_LAYER_ENABLED[i]?"":"none";
      w.style.opacity=(solo && i!==cur)?"0.15":"1";
      const img=w.querySelector("img");
      if(img) img.style.filter=(i===cur)?"drop-shadow(0 0 2px #e0218a)":"";
    }
  }

  function fmt(){
    const L=(arr,f)=>arr.map((v,i)=>"  "+f(v)+(i<6?",":"")+" // "+(i+1)).join("\n");
    return "const SECRET_LAYER_POSITIONS = [\n"+
      L(SECRET_LAYER_POSITIONS,v=>`{x:${v.x},y:${v.y}}`)+"\n];\n\n"+
      "const SECRET_LAYER_SIZES = [\n"+
      L(SECRET_LAYER_SIZES,v=>`{width:${v.width},height:${v.height},scale:${v.scale},angle:${v.angle}}`)+"\n];\n\n"+
      "const SECRET_LAYER_ENABLED = [\n"+
      L(SECRET_LAYER_ENABLED,v=>String(v))+"\n];";
  }

  const panel=document.createElement("div");
  panel.id="editPanel";
  document.body.appendChild(panel);

  const round=v=>Math.round(v*100)/100;

  function build(){
    panel.innerHTML="";
    const title=document.createElement("div");
    title.innerHTML="<b>位置調整モード</b>（動きは停止中）";
    panel.appendChild(title);

    const layers=document.createElement("div");
    layers.className="layers";
    NAMES.forEach((n,i)=>{
      const b=document.createElement("button");
      b.textContent=(SECRET_LAYER_ENABLED[i]?"":"✕ ")+n;
      if(i===cur) b.className="on";
      b.onclick=()=>{cur=i;build();apply();};
      layers.appendChild(b);
    });
    panel.appendChild(layers);

    const tog=document.createElement("div");
    tog.className="row";
    const vis=document.createElement("button");
    vis.textContent=SECRET_LAYER_ENABLED[cur]?"このレイヤーを隠す":"このレイヤーを表示";
    vis.onclick=()=>{SECRET_LAYER_ENABLED[cur]=!SECRET_LAYER_ENABLED[cur];build();apply();};
    const so=document.createElement("button");
    so.textContent="他を薄くする"; if(solo) so.className="on";
    so.onclick=()=>{solo=!solo;build();apply();};
    tog.append(vis,so);
    panel.appendChild(tog);

    const defs=[
      ["x（右＋）",SECRET_LAYER_POSITIONS[cur],"x",[-5,-1,1,5]],
      ["y（下＋）",SECRET_LAYER_POSITIONS[cur],"y",[-5,-1,1,5]],
      ["大きさ",SECRET_LAYER_SIZES[cur],"scale",[-0.05,-0.01,0.01,0.05]],
      ["角度",SECRET_LAYER_SIZES[cur],"angle",[-5,-1,1,5]]
    ];
    defs.forEach(([label,obj,key,steps])=>{
      const row=document.createElement("div");
      row.className="row";
      const name=document.createElement("b");
      name.textContent=label;
      row.appendChild(name);
      const val=document.createElement("span");
      val.style.cssText="width:44px;text-align:center;flex:none";
      val.textContent=obj[key];
      steps.forEach(st=>{
        const b=document.createElement("button");
        b.textContent=(st>0?"+":"")+st;
        b.onclick=()=>{obj[key]=round(obj[key]+st);val.textContent=obj[key];apply();out.value=fmt();};
        row.appendChild(b);
        if(st===-1||st===-0.01) row.appendChild(val);
      });
      panel.appendChild(row);
    });

    const out=document.createElement("textarea");
    out.readOnly=true; out.value=fmt();

    const act=document.createElement("div");
    act.className="row";
    const cp=document.createElement("button");
    cp.textContent="数値をコピー";
    cp.onclick=()=>{
      out.value=fmt();
      (navigator.clipboard?navigator.clipboard.writeText(out.value):Promise.reject())
        .catch(()=>{out.select();document.execCommand("copy");});
      cp.textContent="コピーしました";
      setTimeout(()=>cp.textContent="数値をコピー",1500);
    };
    const rs=document.createElement("button");
    rs.textContent="最初に戻す";
    rs.onclick=()=>{
      const o=JSON.parse(snap);
      o.pos.forEach((v,i)=>Object.assign(SECRET_LAYER_POSITIONS[i],v));
      o.size.forEach((v,i)=>Object.assign(SECRET_LAYER_SIZES[i],v));
      o.en.forEach((v,i)=>SECRET_LAYER_ENABLED[i]=v);
      build();apply();
    };
    act.append(cp,rs);
    panel.appendChild(act);
    panel.appendChild(out);
  }

  /* 衣装を描画してからパネルを出す */
  setCharacter("bell");
  build();
  apply();
  setTimeout(apply,600);
  setTimeout(apply,1500);

})();
}

</script>

</body>
