<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベルちゃん</title>

<style>

/* =====================================================
   共通設定
===================================================== */

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:visible;
}

.bell-area{
  position:absolute;
  width:220px;
  height:140px;
  right:0;
  bottom:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

/* =====================================================
   キャラクター共通
===================================================== */

.bell{
  position:absolute;
  max-width:62%;
  height:auto;

  border:none;
  outline:none;
  box-shadow:none;

  filter:none;

  cursor:pointer;
  user-select:none;

  transition:transform .15s ease;

  z-index:10;
}

.bell:active{
  transform:scale(.96);
}

/* =====================================================
   ベルちゃん
===================================================== */

body:not(.logged-in) .bell{
  width:85px;
  right:20px;
  bottom:12px;
}

body.logged-in .bell{
  width:90px;
  right:25px;
  bottom:0px;
}

/* =====================================================
   ★ チャイムくん専用設定 ★
===================================================== */

body:not(.logged-in) .bell.chime{
  width:80px;
  right:18px;
  bottom:10px;
}

body.logged-in .bell.chime{
  width:80px;
  right:18px;
  bottom:0px;
}

/* =====================================================
   吹き出し
===================================================== */

.bubble{
  position:absolute;

  max-width:calc(100vw - 8px);

  background:#fff;

  border:2px solid #d9e5ed;
  border-radius:18px;

  padding:7px 8px;

  box-shadow:none;

  font-size:10px;
  line-height:1.55;

  animation:
    bubbleAppear
    .55s
    cubic-bezier(.2,.9,.25,1.2)
    both;

  z-index:30;
}

.bubble small{
  display:block;

  color:#84939d;

  font-size:8px;

  margin-bottom:2px;
}

/* =====================================================
   アニメーション中は吹き出しを消す
===================================================== */

.bubble.bubble-hidden{
  visibility:hidden;
  opacity:0;
  pointer-events:none;
}

/* =====================================================
   ログイン前 吹き出し
===================================================== */

body:not(.logged-in) .bubble{
  min-width:105px;
  width:176px;
  max-width:198px;
  box-sizing:border-box;
  right:4px;
  bottom:92px;
}

body:not(.logged-in) .bubble:after{
  content:"";

  position:absolute;

  width:12px;
  height:12px;

  right:20px;
  bottom:-7px;

  background:#fff;

  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;

  transform:rotate(45deg);
}

/* =====================================================
   ログイン後 吹き出し
===================================================== */

body.logged-in .bubble{
  min-width:105px;
  width:176px;
  max-width:198px;
  box-sizing:border-box;
  right:6px;
  bottom:88px;
}

body.logged-in .bubble:after{
  content:"";

  position:absolute;

  width:12px;
  height:12px;

  right:20px;
  bottom:-7px;

  background:#fff;

  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;

  transform:rotate(45deg);
}

/* =====================================================
   吹き出し登場
===================================================== */

@keyframes bubbleAppear{

  from{
    opacity:0;

    transform:
      scale(.9)
      translateY(7px);
  }

  to{
    opacity:1;

    transform:
      scale(1)
      translateY(0);
  }

}

/* =====================================================
   ハートを出す場所
===================================================== */

.heart-container{
  position:absolute;

  left:50%;
  top:50%;

  width:0;
  height:0;

  pointer-events:none;

  z-index:20;

  overflow:visible;
}

/* =====================================================
   ハート
===================================================== */

.heart{
  position:absolute;

  left:0;
  top:0;

  color:#ff7eb9;

  font-size:18px;

  line-height:1;

  opacity:0;

  transform:
    translate(
      var(--start-x),
      var(--start-y)
    )
    scale(.4);

  animation:
    heartFly
    1.8s
    cubic-bezier(.2,.75,.25,1)
    forwards;
}

/* =====================================================
   ハートが飛び散る
===================================================== */

@keyframes heartFly{

  0%{
    opacity:0;

    transform:
      translate(
        var(--start-x),
        var(--start-y)
      )
      scale(.3)
      rotate(0deg);
  }

  12%{
    opacity:1;
  }

  45%{
    opacity:1;
  }

  100%{
    opacity:0;

    transform:
      translate(
        var(--end-x),
        var(--end-y)
      )
      scale(1)
      rotate(var(--rotate));
  }

}

/* =====================================================
   キャラクター喜びアニメーション
===================================================== */

.bell.celebrating{

  animation:
    bellCelebrate
    1.8s
    cubic-bezier(.2,.8,.25,1)
    both;

}

/* =====================================================
   2回ジャンプ
===================================================== */

@keyframes bellCelebrate{

  0%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }

  12%{
    transform:
      translateY(-18px)
      rotate(-8deg)
      scale(1.04);
  }

  24%{
    transform:
      translateY(-25px)
      rotate(8deg)
      scale(1.05);
  }

  38%{
    transform:
      translateY(0)
      rotate(-4deg)
      scale(1);
  }

  45%{
    transform:
      translateY(-6px)
      rotate(3deg)
      scale(1.02);
  }

  57%{
    transform:
      translateY(-22px)
      rotate(-9deg)
      scale(1.05);
  }

  69%{
    transform:
      translateY(-30px)
      rotate(9deg)
      scale(1.06);
  }

  83%{
    transform:
      translateY(0)
      rotate(-3deg)
      scale(1);
  }

  92%{
    transform:
      translateY(-3px)
      rotate(2deg)
      scale(1.01);
  }

  100%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }

}

/* =====================================================
   シークレット衣装（7レイヤー）
   通常のベルちゃんと同じ85px / 90pxの座標系で重ねる
===================================================== */

.secret-costume{
  position:absolute;
  width:var(--bell-size,90px) !important;
  height:var(--bell-size,90px) !important;
  right:var(--bell-right,25px) !important;
  bottom:var(--bell-bottom,0px) !important;
  z-index:11;
  pointer-events:none;
  user-select:none;
  display:none;
  overflow:visible;
  box-sizing:border-box;
}

.secret-costume.show{
  display:block;
}

/*
 * レイヤー画像本体。
 * サイズ・位置・角度はwrapper側で個別設定する。
 */
.secret-costume img{
  position:absolute !important;

  left:0 !important;
  top:0 !important;

  width:100% !important;
  height:100% !important;

  min-width:0 !important;
  min-height:0 !important;

  max-width:none !important;
  max-height:none !important;

  object-fit:contain !important;
  object-position:center center !important;

  margin:0 !important;
  padding:0 !important;

  border:0 !important;
  outline:0 !important;
  box-shadow:none !important;

  pointer-events:none;
  user-select:none;

  display:block;
}

body:not(.logged-in){
  --bell-size:85px;
  --bell-right:20px;
  --bell-bottom:12px;
}

body.logged-in{
  --bell-size:90px;
  --bell-right:25px;
  --bell-bottom:0px;
}

body:not(.logged-in) .secret-costume{
  right:20px !important;
  bottom:12px !important;
}

body.logged-in .secret-costume{
  right:25px !important;
  bottom:0 !important;
}

/*
 * シークレット衣装のレイヤーごとのアニメーション。
 * 個別のサイズ・位置・角度はwrapper側に設定するため、
 * ここでは画像そのものを直接transformしない。
 */
.secret-costume .secret-layer-main{
  animation:secretFloat 2.8s ease-in-out infinite;
}

.secret-costume .secret-layer-01{
  animation:secretWaveLeft 2.2s ease-in-out infinite;
}

.secret-costume .secret-layer-02{
  animation:secretWaveRight 2.4s ease-in-out infinite;
}

.secret-costume .secret-layer-03,
.secret-costume .secret-layer-04,
.secret-costume .secret-layer-05{
  animation:secretRibbon 2.6s ease-in-out infinite;
}

.secret-costume.celebrating{
  animation:
    bellCelebrate
    1.8s
    cubic-bezier(.2,.8,.25,1)
    both;
}

@keyframes secretFloat{

  0%,100%{
    transform:
      translateY(0)
      rotate(0deg);
  }

  50%{
    transform:
      translateY(-2px)
      rotate(.8deg);
  }

}

@keyframes secretWaveLeft{

  0%,100%{
    transform:
      translateX(0)
      rotate(0deg);
  }

  50%{
    transform:
      translateX(-2px)
      rotate(-2deg);
  }

}

@keyframes secretWaveRight{

  0%,100%{
    transform:
      translateX(0)
      rotate(0deg);
  }

  50%{
    transform:
      translateX(2px)
      rotate(2deg);
  }

}

@keyframes secretRibbon{

  0%,100%{
    transform:
      translateY(0)
      rotate(0deg);
  }

  50%{
    transform:
      translateY(2px)
      rotate(-2deg);
  }

}

</style>
</head>

<body>

<div class="bell-area">

  <div class="bubble">

    <small id="characterName">
      ベルちゃん
    </small>

    <span id="bellMessage">
      予定を確認してるよ！
    </span>

  </div>

  <div
    class="heart-container"
    id="heartContainer">
  </div>

  <img
    class="bell"
    src="bell.png"
    alt="ベルちゃん"
    id="bellImage"
  >

  <div
    id="secretCostume"
    class="secret-costume"
    aria-hidden="true">
  </div>

</div>

<script type="module">

/* =====================================================
   基本
===================================================== */

const message =
  document.getElementById(
    "bellMessage"
  );

const bellImage =
  document.getElementById(
    "bellImage"
  );

const characterName =
  document.getElementById(
    "characterName"
  );

const bubble =
  document.querySelector(
    ".bubble"
  );

const heartContainer =
  document.getElementById(
    "heartContainer"
  );

const secretCostume =
  document.getElementById(
    "secretCostume"
  );

const SECRET_COSTUME_IDS = {

  bell:[
    "secret-bell",
    "secret_bell_rare_costume"
  ],

  chime:[
    "secret-chime",
    "secret_chime_rare_costume"
  ]

};

const SECRET_BELL_LAYERS = [

  "costumes/bell-secret-base.png",

  "costumes/bell-secret-main.png",

  "costumes/bell-secret-layer-01.png",

  "costumes/bell-secret-layer-02.png",

  "costumes/bell-secret-layer-03.png",

  "costumes/bell-secret-layer-04.png",

  "costumes/bell-secret-layer-05.png"

];

/* =====================================================
   ★ シークレット衣装 7レイヤー位置設定 ★
   x：右へ動かすとプラス / 左へ動かすとマイナス
   y：下へ動かすとプラス / 上へ動かすとマイナス
   それぞれのレイヤーを個別に調整できます。
===================================================== */

const SECRET_LAYER_POSITIONS = [

  {x:-20,y:-10}, // 1. base
  {x:-15,y:30},  // 2. main
  {x:0,y:0},     // 3. layer-01
  {x:0,y:0},     // 4. layer-02
  {x:0,y:0},     // 5. layer-03
  {x:0,y:0},     // 6. layer-04
  {x:0,y:0}      // 7. layer-05

];

/* =====================================================
   ★ シークレット衣装 7レイヤー大きさ設定 ★
   width：横幅（100 = 通常）
   height：高さ（100 = 通常）
   scale：全体サイズ（1.00 = 通常）
   angle：角度（0 = 通常 / プラスで時計回り / マイナスで反時計回り）
   それぞれのレイヤーを個別に調整できます。
===================================================== */

const SECRET_LAYER_SIZES = [

  {width:100,height:100,scale:1.35,angle:-10}, // 1. base
  {width:100,height:100,scale:1.5,angle:0},  // 2. main
  {width:100,height:100,scale:1.00,angle:0},  // 3. layer-01
  {width:100,height:100,scale:1.00,angle:0},  // 4. layer-02
  {width:100,height:100,scale:1.00,angle:0},  // 5. layer-03
  {width:100,height:100,scale:1.00,angle:0},  // 6. layer-04
  {width:100,height:100,scale:1.00,angle:0}   // 7. layer-05

];

/* =====================================================
   ★ シークレット衣装 7レイヤー ON / OFF ★
   true  = 表示する
   false = 表示しない
   PNGファイル自体はcostumesフォルダに残しておいてOK。
===================================================== */

const SECRET_LAYER_ENABLED = [

  true,  // 1. base
  true,  // 2. main
  true,  // 3. layer-01
  false, // 4. layer-02
  false, // 5. layer-03
  false, // 6. layer-04
  false  // 7. layer-05

];

function isSecretCostumeId(
  id,
  character
){

  return !!id &&
    SECRET_COSTUME_IDS[character]?.includes(id);

}

function isSecretEquipped(
  character
){

  return isSecretCostumeId(
    equippedCostumes?.[character] || null,
    character
  );

}

let secretRenderToken=0;

/*
 * シークレット画像の周囲に残っている白・薄灰色・チェック柄系の
 * 背景だけを、画像の外周からたどって透明化する。
 * 衣装内部の白い部分は外周とつながっていなければ残す。
 */
async function prepareSecretLayer(
  src
){

  const image =
    new Image();

  image.src =
    src;

  await new Promise(
    (resolve,reject)=>{

      image.onload =
        resolve;

      image.onerror =
        reject;

    }
  );

  const width =
    image.naturalWidth;

  const height =
    image.naturalHeight;

  if(
    !width ||
    !height
  ){

    throw new Error(
      "シークレット画像のサイズを取得できません"
    );

  }

  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    width;

  canvas.height =
    height;

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );

  if(!ctx)return src;

  ctx.drawImage(
    image,
    0,
    0
  );

  const imageData =
    ctx.getImageData(
      0,
      0,
      width,
      height
    );

  const pixels =
    imageData.data;

  const visited =
    new Uint8Array(
      width*height
    );

  const queue =
    new Int32Array(
      width*height
    );

  let head=0;
  let tail=0;

  const isBackground =
    (pixelIndex)=>{

      const p =
        pixelIndex*4;

      const alpha =
        pixels[p+3];

      if(alpha===0)return true;

      const r =
        pixels[p];

      const g =
        pixels[p+1];

      const b =
        pixels[p+2];

      const max =
        Math.max(
          r,
          g,
          b
        );

      const min =
        Math.min(
          r,
          g,
          b
        );

      const chroma =
        max-min;

      /* 白〜薄い灰色の背景を対象にする */
      return (
        min>=215 &&
        chroma<=28
      );

    };

  const enqueue =
    (pixelIndex)=>{

      if(
        pixelIndex<0 ||
        pixelIndex>=width*height
      ){

        return;

      }

      if(
        visited[pixelIndex]
      ){

        return;

      }

      if(
        !isBackground(
          pixelIndex
        )
      ){

        return;

      }

      visited[pixelIndex]=1;

      queue[tail++]=
        pixelIndex;

    };

  /* 外周から背景領域を開始 */

  for(
    let x=0;
    x<width;
    x++
  ){

    enqueue(x);

    enqueue(
      (height-1)*width+x
    );

  }

  for(
    let y=1;
    y<height-1;
    y++
  ){

    enqueue(
      y*width
    );

    enqueue(
      y*width+(width-1)
    );

  }

  while(
    head<tail
  ){

    const index =
      queue[head++];

    const x =
      index%width;

    const y =
      Math.floor(
        index/width
      );

    if(x>0){

      enqueue(
        index-1
      );

    }

    if(x<width-1){

      enqueue(
        index+1
      );

    }

    if(y>0){

      enqueue(
        index-width
      );

    }

    if(y<height-1){

      enqueue(
        index+width
      );

    }

  }

  for(
    let i=0;
    i<visited.length;
    i++
  ){

    if(
      visited[i]
    ){

      pixels[
        i*4+3
      ]=0;

    }

  }

  ctx.putImageData(
    imageData,
    0,
    0
  );

  return canvas.toDataURL(
    "image/png"
  );

}

function renderSecretCostume(
  character
){

  if(!secretCostume)return;

  const renderToken =
    ++secretRenderToken;

  secretCostume.innerHTML="";

  secretCostume.classList.remove(
    "show",
    "celebrating"
  );

  secretCostume.setAttribute(
    "aria-hidden",
    "true"
  );

  /* 通常衣装ではベルちゃん本体をそのまま表示 */

  bellImage.style.visibility =
    "visible";

  bellImage.style.opacity =
    "1";

  /*
   * 現在レイヤー画像が用意されているのはベルちゃん
   */

  if(
    character!=="bell" ||
    !isSecretEquipped("bell")
  ){

    return;

  }

  let loadedCount=0;
  let failed=false;

  const enabledLayerCount =
    SECRET_BELL_LAYERS.filter(
      (_,index)=>
        SECRET_LAYER_ENABLED[index]===true
    ).length;

  if(
    enabledLayerCount===0
  ){

    bellImage.style.visibility =
      "visible";

    bellImage.style.opacity =
      "0";

    secretCostume.classList.add(
      "show"
    );

    secretCostume.setAttribute(
      "aria-hidden",
      "false"
    );

    return;

  }

  SECRET_BELL_LAYERS.forEach(
    (src,index)=>{

      if(
        SECRET_LAYER_ENABLED[index]!==true
      ){

        return;

      }

      /*
       * wrapperをレイヤーごとに作る。
       * サイズ・位置・角度はすべてこのwrapperで独立管理する。
       */
      const layerWrap =
        document.createElement(
          "div"
        );

      layerWrap.className =
        `secret-layer-wrap secret-layer-wrap-${index}`;

      layerWrap.style.position =
        "absolute";

      layerWrap.style.width =
        "100%";

      layerWrap.style.height =
        "100%";

      layerWrap.style.left =
        "0";

      layerWrap.style.top =
        "0";

      layerWrap.style.pointerEvents =
        "none";

      layerWrap.style.userSelect =
        "none";

      layerWrap.style.overflow =
        "visible";

      const img =
        document.createElement(
          "img"
        );

      img.alt="";
      img.draggable=false;

      img.className =
        `secret-layer secret-layer-${
          index===1
            ? "main"
            : String(index).padStart(2,"0")
        }`;

      /*
       * 必ず通常ベルちゃんと同じ座標系に固定
       */

      const layerPosition =
        SECRET_LAYER_POSITIONS[index] ||
        {
          x:0,
          y:0
        };

      const layerSize =
        SECRET_LAYER_SIZES[index] ||
        {
          width:100,
          height:100,
          scale:1,
          angle:0
        };

      /*
       * 横幅・高さ・全体サイズ・角度は個別指定。
       *
       * position の x/y はレイヤー本体の中心位置を基準にする。
       *
       * scale と angle はwrapperに適用するため、
       * レイヤー画像側のアニメーションと分離できます。
       */

      layerWrap.style.width =
        `${layerSize.width}%`;

      layerWrap.style.height =
        `${layerSize.height}%`;

      layerWrap.style.left =
  `${(100-layerSize.width)/2}%`;

layerWrap.style.top =
  `${(100-layerSize.height)/2}%`;

layerWrap.style.transform =
  `translate(${layerPosition.x}px, ${layerPosition.y}px) scale(${layerSize.scale}) rotate(${layerSize.angle}deg)`;
      layerWrap.style.transformOrigin =
        "center center";

      img.style.width =
        "100%";

      img.style.height =
        "100%";

      img.style.maxWidth =
        "none";

      img.style.maxHeight =
        "none";

      img.style.position =
        "absolute";

      img.style.left =
        "0";

      img.style.top =
        "0";

      img.style.objectFit =
        "contain";

      img.style.objectPosition =
        "center center";

      img.onload =
        ()=>{

          if(
            renderToken!==secretRenderToken
          ){

            return;

          }

          loadedCount++;

          if(
            loadedCount===
              enabledLayerCount &&
            !failed
          ){

            /*
             * シークレット衣装表示中は
             * 通常ベルちゃんを透明にする。
             *
             * opacity:0 にするだけなので、
             * 通常ベルちゃんのクリックや
             * アニメーション処理は維持される。
             */

            bellImage.style.visibility =
              "visible";

            bellImage.style.opacity =
              "0";

            secretCostume.classList.add(
              "show"
            );

            secretCostume.setAttribute(
              "aria-hidden",
              "false"
            );

          }

        };

      img.onerror =
        ()=>{

          if(
            renderToken!==secretRenderToken
          ){

            return;

          }

          failed=true;

          console.error(
            "シークレット衣装画像の読み込み失敗:",
            src
          );

          secretCostume.classList.remove(
            "show",
            "celebrating"
          );

          secretCostume.setAttribute(
            "aria-hidden",
            "true"
          );

          secretCostume.innerHTML="";

          bellImage.style.visibility =
            "visible";

          bellImage.style.opacity =
            "1";

        };

      layerWrap.appendChild(
        img
      );

      secretCostume.appendChild(
        layerWrap
      );

      /*
       * 背景透明化後の画像を設定
       */

      prepareSecretLayer(src)
        .then(
          preparedSrc=>{

            if(
              renderToken!==secretRenderToken
            ){

              return;

            }

            img.src =
              preparedSrc;

          }
        )
        .catch(
          error=>{

            if(
              renderToken!==secretRenderToken
            ){

              return;

            }

            console.error(
              "シークレット衣装画像の加工に失敗:",
              src,
              error
            );

            /*
             * 加工できない場合は元画像を表示
             */
            img.src =
              src;

          }
        );

    }
  );

}

/* =====================================================
   ★ テスト日付機能
   URLに ?testDate=2026-12-25 のように指定すると
   その日付として特殊服を判定する。
   指定しない場合は通常どおり今日の日付を使用。
===================================================== */

function getTestDate(){

  /* コード指定のテスト日付を最優先 */

  if(TEST_DATE){

    try{

      if(
        /^\d{4}-\d{2}-\d{2}$/.test(
          TEST_DATE
        )
      ){

        const testDate =
          new Date(
            `${TEST_DATE}T12:00:00`
          );

        if(
          !Number.isNaN(
            testDate.getTime()
          ) &&
          testDate.getFullYear() ===
            Number(
              TEST_DATE.slice(0,4)
            ) &&
          testDate.getMonth()+1 ===
            Number(
              TEST_DATE.slice(5,7)
            ) &&
          testDate.getDate() ===
            Number(
              TEST_DATE.slice(8,10)
            )
        ){

          return testDate;

        }

      }

    }catch(error){

      console.warn(
        "コード指定のテスト日付を読み込めませんでした",
        error
      );

    }

  }

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );

    const value =
      params.get(
        "testDate"
      );

    if(
      value &&
      /^\d{4}-\d{2}-\d{2}$/.test(
        value
      )
    ){

      const testDate =
        new Date(
          `${value}T12:00:00`
        );

      if(
        !Number.isNaN(
          testDate.getTime()
        ) &&
        testDate.getFullYear() ===
          Number(
            value.slice(0,4)
          ) &&
        testDate.getMonth()+1 ===
          Number(
            value.slice(5,7)
          ) &&
        testDate.getDate() ===
          Number(
            value.slice(8,10)
          )
      ){

        return testDate;

      }

    }

  }catch(error){

    console.warn(
      "テスト日付を読み込めませんでした",
      error
    );

  }

  return null;

}

/* =====================================================
   今日が特殊服の日か判定
===================================================== */

function getCostumeKey(
  date=getCurrentDate()
){

  const month =
    date.getMonth()+1;

  const day =
    date.getDate();

  /* ---------------------------------------------
     お正月
     1月1日〜1月5日
  --------------------------------------------- */

  if(
    month===1 &&
    day>=1 &&
    day<=5
  ){

    return "newyear";

  }

  /*
   * 1月6日〜1月31日は
   * 通常衣装のまま
   */

  /* ---------------------------------------------
     節分
  --------------------------------------------- */

  if(
    month===2 &&
    day===3
  ){

    return "setsubun";

  }

  /* ---------------------------------------------
     バレンタイン
  --------------------------------------------- */

  if(
    month===2 &&
    day===14
  ){

    return "valentine";

  }

  /* ---------------------------------------------
     ひな祭り
  --------------------------------------------- */

  if(
    month===3 &&
    day===3
  ){

    return "hinamatsuri";

  }

  /* ---------------------------------------------
     ホワイトデー
  --------------------------------------------- */

  if(
    month===3 &&
    day===14
  ){

    return "whiteday";

  }

  /* ---------------------------------------------
     こどもの日
  --------------------------------------------- */

  if(
    month===5 &&
    day===5
  ){

    return "kodomonohi";

  }

  /* ---------------------------------------------
     七夕
  --------------------------------------------- */

  if(
    month===7 &&
    day===7
  ){

    return "tanabata";

  }

  /* ---------------------------------------------
     十五夜
  --------------------------------------------- */

  const monthDay =
    `${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

  const jugoya =
    jugoyaDates[
      date.getFullYear()
    ];

  if(
    jugoya &&
    jugoya===monthDay
  ){

    return "tsukimi";

  }

  /* ---------------------------------------------
     ハロウィン
  --------------------------------------------- */

  if(
    month===10 &&
    day===31
  ){

    return "halloween";

  }

  /* ---------------------------------------------
     クリスマスイブ
  --------------------------------------------- */

  if(
    month===12 &&
    day===24
  ){

    return "christmaseve";

  }

  /* ---------------------------------------------
     クリスマス
  --------------------------------------------- */

  if(
    month===12 &&
    day===25
  ){

    return "christmas";

  }

  /* ---------------------------------------------
     大晦日
     → winter衣装
  --------------------------------------------- */

  if(
    month===12 &&
    day===31
  ){

    return "winter";

  }

  return null;

}

/* =====================================================
   今日のキャラクター画像を取得
===================================================== */

function getCharacterImage(
  character,
  date=getCurrentDate()
){

  const selected =
    character === "chime"
      ? "chime"
      : "bell";

  /* ---------------------------------------------
     ① シークレット衣装
     シークレットは最優先
  --------------------------------------------- */

  if(
    isSecretEquipped(
      selected
    )
  ){

    return characterImages[
      selected
    ].src;

  }

  /*
   * 衣装の優先順位
   *
   * 1. ユーザーが「着替える」で選んだ衣装
   * 2. イベント日の衣装
   * 3. 通常のベルちゃん
   *
   * イベント日は強制衣装ではありません。
   */

  /* ---------------------------------------------
     ② ユーザーが選択した衣装
  --------------------------------------------- */

  const equipped =
    equippedCostumes?.[selected] ||
    null;

  const equippedImage =
    getCostumeImageFromId(
      equipped,
      selected
    );

  if(equippedImage){

    return equippedImage;

  }

  /* ---------------------------------------------
     ③ イベント衣装
  --------------------------------------------- */

  const costumeKey =
    getCostumeKey(date);

  if(costumeKey){

    const override =
      eventCostumeOverrides?.[
        costumeKey
      ]?.[selected] ||
      null;

    if(override){

      const overrideImage =
        getCostumeImageFromId(
          override,
          selected
        );

      if(overrideImage){

        return overrideImage;

      }

    }

    if(
      costumeImages[
        selected
      ]?.[costumeKey]
    ){

      return costumeImages[
        selected
      ][costumeKey];

    }

  }

  /* ---------------------------------------------
     ④ 通常
  --------------------------------------------- */

  return characterImages[
    selected
  ].src;

}

function getCostumeImageFromId(
  costumeId,
  character
){

  if(!costumeId){

    return null;

  }

  if(
    costumeId ===
    "daily-costume-01"
  ){

    return "costumes/daily-costume-01.png";

  }

  if(
    costumeId ===
    "daily-costume-02"
  ){

    return "costumes/daily-costume-02.png";

  }

  if(
    costumeId.startsWith(
      "event_"
    )
  ){

    const suffix =
      character === "chime"
        ? "_chime"
        : "_bell";

    if(
      !costumeId.endsWith(
        suffix
      )
    ){

      return null;

    }

    let key =
      costumeId.slice(
        6,
        -suffix.length
      );

    if(
      key ===
      "newyearseve"
    ){

      key =
        "winter";

    }

    return (
      costumeImages
        ?.[character]
        ?.[key] ||
      null
    );

  }

  return null;

}

/* =====================================================
   キャラクター切り替え
===================================================== */

function setCharacter(
  character
){

  currentCharacter =
    character === "chime"
      ? "chime"
      : "bell";

  const data =
    characterImages[
      currentCharacter
    ];

  if(!data)return;

  /*
   * ★ここで特殊服を判定
   *
   * 特殊服画像が存在しない場合に
   * ブラウザの「？」表示にならないよう、
   * まず通常画像を確保してから特殊画像を読み込む。
   */

  const normalSrc =
    data.src;

  const costumeSrc =
    getCharacterImage(
      currentCharacter
    );

  bellImage.alt =
    data.name;

  bellImage.onerror =
    function(){

      /*
       * 読み込み失敗時は必ず通常画像へ戻す
       */

      if(
        this.src !==
        new URL(
          normalSrc,
          window.location.href
        ).href
      ){

        this.src =
          normalSrc;

      }

    };

  if(
    costumeSrc ===
    normalSrc
  ){

    bellImage.src =
      normalSrc;

  }else{

    const testImage =
      new Image();

    testImage.onload =
      function(){

        /*
         * 読み込み成功した特殊服だけ表示
         */

        bellImage.src =
          costumeSrc;

      };

    testImage.onerror =
      function(){

        /*
         * 特殊服がない場合は通常のベルちゃんを表示
         */

        bellImage.src =
          normalSrc;

      };

    testImage.src =
      costumeSrc;

  }

  if(
    currentCharacter ===
    "chime"
  ){

    bellImage.classList.add(
      "chime"
    );

  }else{

    bellImage.classList.remove(
      "chime"
    );

  }

  if(characterName){

    characterName.textContent =
      data.name;

  }

  renderSecretCostume(
    currentCharacter
  );

}

let lastCostumeDate="";

function getTodayKey(){

  const now =
    getCurrentDate();

  return `${
    now.getFullYear()
  }-${
    String(
      now.getMonth()+1
    ).padStart(2,"0")
  }-${

  }`;

function updateCostume(){

  const today =
    getTodayKey();

  if(
    today ===
    lastCostumeDate
  ){

    return;

  }

  lastCostumeDate =
    today;

  /*
   * この処理を開始した時点のキャラクターを保存。
   * 非同期の画像読み込み中にキャラクターが変わっても、
   * 古い画像が新しいキャラクターへ反映されないようにする。
   */

  const characterAtStart =
    currentCharacter;

  /*
   * キャラクターはそのまま。
   * 今日の特殊服だけ再判定。
   */

  const costumeImage =
    getCharacterImage(
      characterAtStart
    );

  const normalImage =
    characterImages[
      characterAtStart
    ].src;

  const normalUrl =
    new URL(
      normalImage,
      window.location.href
    ).href;

  const costumeUrl =
    new URL(
      costumeImage,
      window.location.href
    ).href;

  /*
   * シークレットの場合は
   * レイヤー側が表示を担当するので、
   * 通常画像を勝手にイベント衣装へ変更しない。
   */

  if(
    isSecretEquipped(
      characterAtStart
    )
  ){

    renderSecretCostume(
      characterAtStart
    );

    return;

  }

  /* 通常画像ならそのまま */

  if(
    costumeUrl ===
    normalUrl
  ){

    if(
      bellImage.src !==
      normalUrl
    ){

      bellImage.src =
        normalImage;

    }

    return;

  }

  /*
   * 特殊服画像は、読み込めた場合だけ切り替える
   */

  const testImage =
    new Image();

  testImage.onload =
    function(){

      if(
        lastCostumeDate === today &&
        currentCharacter ===
          characterAtStart
      ){

        bellImage.src =
          costumeImage;

      }

    };

  testImage.onerror =
    function(){

      /*
       * 特殊服が存在しない場合は通常画像を維持
       */

      if(
        currentCharacter ===
        characterAtStart
      ){

        bellImage.src =
          normalImage;

      }

    };

  testImage.src =
    costumeImage;

}

function setBellMessages(
  messages,
  preferred=null
){

  const cleaned = [
    ...new Set(
      (messages || [])
        .filter(
          v =>
            typeof v ===
              "string" &&
            v.trim()
        )
    )
  ];

  if(
    !cleaned.length
  ){

    return;

  }

  bellMessages =
    cleaned;

  showMessage(
    preferred &&
    cleaned.includes(
      preferred
    )
      ? preferred
      : pickRandom(
          cleaned
        )
  );

}

function buildBellMessages(
  schedules
){

  const now =
    getCurrentDate();

  const values =
    Object.values(
      schedules || {}
    )
    .filter(
      s =>
        s &&
        typeof s ===
          "object"
    );

  const all = [
    ...buildRegularMessages(
      values,
      now
    )
  ];

  try{

    const today =
      dateString(
        now
      );

    all.push(
      ...getClubBeforeStartMessages(
        values,
        today,
        now
      )
    );

  }catch(error){

    console.warn(
      "ベルちゃんの部活前メッセージを作成できませんでした",
      error
    );

  }

  try{

    const today =
      dateString(
        now
      );

    getEventSchedulesForDate(
      values,
      today
    ).forEach(
      event=>{

        all.push(
          `今日は${
            event.title ||
            (
              event.type ===
                "concert"
                ? "演奏会"
                : "イベント"
            )
          }だね！`
        );

      }
    );

  }catch(error){

    console.warn(
      "ベルちゃんの当日イベントメッセージを作成できませんでした",
      error
    );

  }

  try{

    const today =
      dateString(
        now
      );

    getUpcomingEvents(
      values,
      today
    ).forEach(
      event=>{

        all.push(
          `もうすぐ${

            (
              event.type ===
                "concert"
                ? "演奏会"
                : "イベント"
            )

        );

      }
    );

  }catch(error){

    console.warn(
      "ベルちゃんの予定メッセージを作成できませんでした",
      error
    );

  }

  return [
    ...new Set(
      all
    )
  ];

}

function receiveParentSchedules(
  schedules
){

  parentSchedules =
    schedules &&
    typeof schedules ===
      "object"
      ? schedules
      : {};

  setBellMessages(
    buildBellMessages(
      parentSchedules

          data.chime ||
          null

      };

      setCharacter(

      renderSecretCostume(
        currentCharacter
      );

      return;

    if(
      event.data.type ===
      "handbell-event-costume-override"
    ){

      eventCostumeOverrides =
        event.data.overrides &&
        typeof event.data.overrides ===
          "object"
          ? event.data.overrides
          : {};

      setCharacter(
        currentCharacter
      );

      return;

    }

    if(
      event.data.type ===
      "handbell-character"
    ){

      setCharacter(
        event.data.character
      );

      updateCostume();

      return;

    }

    if(
      event.data.type ===
      "handbell-schedules"
    ){

      receiveParentSchedules(
        event.data.schedules
      );

      return;

    }

  }

/* =====================================================
   日付・時間
===================================================== */

function pad(n){

  return String(
    n
  ).padStart(
    2,
    "0"
  );

}

function dateString(
  date=getCurrentDate()
){

  return `${
    date.getFullYear()
  }-${
    pad(
      date.getMonth()+1
    )
  }-${
    pad(
      date.getDate()
    )
  }`;

}

function monthString(
  date=getCurrentDate()
){

  return `${
    date.getFullYear()
  }-${
    pad(
      date.getMonth()+1
    )
  }`;

}

function timeToMinutes(
  value
){

  const match =
    String(
      value || ""
    )
    .match(
      /^(\d{1,2}):(\d{2})$/
    );

  if(!match){

    return null;

  }

  return (
    Number(match[1])*60 +
    Number(match[2])
  );

}

/* =====================================================
   挨拶
===================================================== */

function getGreeting(
  date=getCurrentDate()
){

  const hour =
    date.getHours();

  if(
    hour>=4 &&
    hour<10
  ){

    return "おはよう！";

  }

  if(
    hour>=10 &&
    hour<17
  ){

    return "こんにちは！";

  }

  return "こんばんは!";

}

function greetingMessage(
  text,
  date=getCurrentDate()
){

  return `${
    getGreeting(
      date
    )
  }${text}`;

}

function formatJapaneseTime(

    )
    .match(
      /^(\d{1,2}):(\d{2})$/
    );

  if(!match){

    return String(
      value || ""
    );

  }

  return `${
    Number(
      match[1]
    )
  }時${
    match[2]
  }分`;

}

function formatTimeRange(
  time
){

  const value =
    String(
      time || ""
    ).trim();

  if(
    !value ||
    value ===
      "終日"
  ){

    return "";

  }

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]\s*(\d{1,2}:\d{2})$/
    );

  if(!match){

    return value;

  }

  return `${
    formatJapaneseTime(
      match[1]
    )
  }〜${
    formatJapaneseTime(
      match[2]
    )
  }`;

}

function getStartTime(
  time
){

  const value =
    String(
      time || ""
    ).trim();

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]/
    );

  return match
    ? timeToMinutes(
        match[1]
      )
    : null;

}

/* =====================================================
   日付計算
===================================================== */

function getTomorrowString(
  date=getCurrentDate()
){

  const tomorrow =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()+1
    );

  return dateString(
    tomorrow
  );

}

function daysFromToday(
  dateStringValue,
  today=getCurrentDate()
){

  const target =
    new Date(
      `${dateStringValue}T00:00:00`
    );

  const base =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

  return Math.round(
    (
      target-base
    ) / 86400000
  );

}

function isUpcomingWithinDays(
  dateValue,
  today,
  days
){

  if(!dateValue){

    return false;

  }

  const diff =
    daysFromToday(
      dateValue,
      today
    );

  return (
    diff>0 &&
    diff<=days
  );

}

/* =====================================================
   スケジュール
===================================================== */

function getNormalSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      s.type ===
        "normal" &&
      s.date ===
        date
  );

}

function getEventSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      (
        s.type ===
          "concert" ||
        s.type ===
          "event"
      ) &&
      s.date ===
        date
  );

}

function getUpcomingEvents(
  values,
  today
){

  return values
    .filter(
      s =>
        s &&
        (
          s.type ===
            "concert" ||
          s.type ===
            "event"
        ) &&
        isUpcomingWithinDays(
          s.date,
          today,
          7
        )
    )
    .sort(
      (a,b)=>
        String(
          a.date
        )
        .localeCompare(
          String(
            b.date
          )
        )
    );

}

function getMonthlyClubCount(
  values,
  today
){

  const month =
    monthString(
      today
    );

  return values.filter(
    s =>
      s &&
      (
        s.type ===
          "normal" ||
        !s.type
      ) &&
      typeof s.date ===
        "string" &&
      s.date.startsWith(
        month
      )
  ).length;

}

/* =====================================================
   部活前メッセージ
===================================================== */

function getClubBeforeStartMessages(
  values,
  today,
  dateNow
){

  const todayNormal =
    getNormalSchedulesForDate(
      values,
      today
    )[0];

  if(
    !todayNormal
  ){

    return [];

  }

  const start =
    getStartTime(
      todayNormal.time
    );

  const nowMinutes =
    dateNow.getHours()*60 +
    dateNow.getMinutes();

  if(
    start===null ||
    nowMinutes>=start
  ){

    return [];

  }

  const range =
    formatTimeRange(
      todayNormal.time
    );

  const result=[];

  if(range){

    result.push(
      greetingMessage(
        `今日の部活は${range}だよ`,
        dateNow
      )
    );

  }

  result.push(

    greetingMessage(
      "今日の部活、頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日もみんなでハンドベル頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日の部活も楽しみだね！",
      dateNow
    ),

    greetingMessage(

      dateNow
    ),

    greetingMessage(
      "今日の部活も一緒に頑張ろうね！",
      dateNow
    )

  );

  return result;

}

/* =====================================================
   ランダム
===================================================== */

function pickRandom(
  list
){

  if(
    !list.length
  ){

    return "予定を確認してみてね！";

  }

  return list[
    Math.floor(
      Math.random()*
      list.length
    )
  ];

}

/* =====================================================
   メッセージ表示
===================================================== */

function showMessage(
  text
){

  message.textContent =
    text;

}

function changeBellMessage(){

  if(
    !bellMessages.length
  ){

    return;

  }

  let next =
    pickRandom(
      bellMessages
    );

  if(
    bellMessages.length>1 &&
    next ===
      message.textContent
  ){

    const other =
      bellMessages.filter(
        item =>
          item !==
            message.textContent
      );

    next =
      pickRandom(
        other
      );

  }

  showMessage(
    next
  );

}

/* =====================================================
   大量のハート
===================================================== */

function startHearts(){

  if(
    !heartContainer
  ){

    return;

  }

  const hearts=[];

  for(
    let i=0;
    i<14;
    i++
  ){

    hearts.push({

      startX:
        -55 +
        Math.random()*110,

      startY:
        -10 +
        Math.random()*25,

      endX:
        -130 +
        Math.random()*260,

      endY:
        -120 -
        Math.random()*150

    });

  }

  for(
    let i=0;
    i<10;
    i++
  ){

    hearts.push({

      startX:
        -35 -
        Math.random()*35,

      startY:
        -10 -
        Math.random()*35,

      endX:
        -100 -
        Math.random()*120,

      endY:
        -70 -
        Math.random()*120

    });

  }

  for(
    let i=0;
    i<10;
    i++
  ){

    hearts.push({

      startX:
        35 +
        Math.random()*35,

      startY:
        -10 -
        Math.random()*35,

      endX:
        100 +
        Math.random()*120,

      endY:
        -70 -
        Math.random()*120

    });

  }

  for(
    let i=12;
    i--;
  ){

    hearts.push({

      startX:
        -45 -
        Math.random()*20,

      startY:
        -40 +
        Math.random()*90,

      endX:
        -130 -
        Math.random()*140,

      endY:
        -70 +
        Math.random()*160

    });

  }

  for(
    let i=12;
    i--;
  ){

    hearts.push({

      startX:
        45 +
        Math.random()*20,

      startY:
        -40 +
        Math.random()*90,

      endX:
        130 +
        Math.random()*140,

      endY:
        -70 +
        Math.random()*160

    });

  }

  for(
    let i=8;
    i--;
  ){

    hearts.push({

      startX:
        -40 -
        Math.random()*25,

      startY:
        30 +
        Math.random()*25,

      endX:
        -100 -
        Math.random()*130,

      endY:
        50 +
        Math.random()*100

    });

  }

  for(
    let i=8;
    i--;
  ){

    hearts.push({

      startX:
        40 +
        Math.random()*25,

      startY:
        30 +
        Math.random()*25,

      endX:
        100 +
        Math.random()*130,

      endY:
        50 +
        Math.random()*100

    });

  }

  hearts.forEach(
    (data,index)=>{

      const heart =
        document.createElement(
          "span"
        );

      heart.className =
        "heart";

      heart.textContent =
        index % 4 === 0
          ? "♡"
          : "♥";

      heart.style.setProperty(
        "--start-x",
        `${data.startX}px`
      );

      heart.style.setProperty(
        "--start-y",
        `${data.startY}px`
      );

      heart.style.setProperty(
        "--end-x",
        `${data.endX}px`
      );

      heart.style.setProperty(
        "--end-y",
        `${data.endY}px`
      );

      const rotation =
        -60 +
        Math.random()*120;

      heart.style.setProperty(
        "--rotate",
        `${rotation}deg`
      );

      const size =
        11 +
        Math.random()*13;

      heart.style.fontSize =
        `${size}px`;

      const delay =
        Math.random()*350;

      heart.style.animationDelay =
        `${delay}ms`;

      heartContainer.appendChild(
        heart
      );

      heart.addEventListener(
        "animationend",
        ()=>{
          heart.remove();
        }
      );

    }
  );

}

/* =====================================================
   アニメーション中かどうか
===================================================== */

let isAnimating=false;

/* =====================================================
   キャラクターをクリック
===================================================== */

function celebrate(){

  if(
    isAnimating
  ){

    return;

  }

  isAnimating=true;

  bubble.classList.add(
    "bubble-hidden"
  );

  bellImage.classList.remove(
    "celebrating"
  );

  void bellImage.offsetWidth;

  bellImage.classList.add(
    "celebrating"
  );

  /*
   * シークレット衣装も
   * ベルちゃん本体と同じジャンプをする
   */

  if(
    secretCostume &&
    secretCostume.classList.contains(
      "show"
    )
  ){

    secretCostume.classList.remove(
      "celebrating"
    );

    void secretCostume.offsetWidth;

    secretCostume.classList.add(
      "celebrating"
    );

  }

  if(
    !isSecretEquipped(
      "bell"
    )
  ){

    setTimeout(
      ()=>{
        startHearts();
      },
      150
    );

    setTimeout(
      ()=>{
        startHearts();
      },
      950
    );

  }

}

/* =====================================================
   アニメーション終了
===================================================== */

bellImage.addEventListener(
  "animationend",
  event=>{

    if(
      event.animationName !==
      "bellCelebrate"
    ){

      return;

    }

    bellImage.classList.remove(
      "celebrating"
    );

    if(secretCostume){

      secretCostume.classList.remove(
        "celebrating"
      );

    }

    changeBellMessage();

    bubble.classList.remove(
      "bubble-hidden"
    );

    bubble.style.animation =
      "none";

    void bubble.offsetWidth;

    bubble.style.animation =
      "";

    isAnimating=false;

  }
);

bellImage.addEventListener(
