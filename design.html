<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ベルちゃん</title>

<style>

/* =====================================================
   共通設定
===================================================== */

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
}

.bell-area{
  position:absolute;
  width:220px;
  height:140px;
  right:0;
  bottom:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

/* =====================================================
   キャラクター共通
===================================================== */

.bell{
  position:absolute;
  max-width:62%;
  height:auto;

  border:none;
  outline:none;
  box-shadow:none;

  filter:none;

  cursor:pointer;
  user-select:none;

  transition:transform .15s ease;

  z-index:10;
}

.bell:active{
  transform:scale(.96);
}

/* =====================================================
   ベルちゃん
===================================================== */

body:not(.logged-in) .bell{
  width:85px;
  right:20px;
  bottom:12px;
}

body.logged-in .bell{
  width:90px;
  right:25px;
  bottom:0px;
}

/* =====================================================
   ★ チャイムくん専用設定 ★
===================================================== */

body:not(.logged-in) .bell.chime{
  width:80px;
  right:18px;
  bottom:10px;
}

body.logged-in .bell.chime{
  width:80px;
  right:18px;
  bottom:0px;
}

/* =====================================================
   ★ シークレット衣装・7レイヤー ★
===================================================== */

.secret-bell{
  position:absolute;

  width:90px;
  height:90px;

  right:25px;
  bottom:0px;

  display:none;

  cursor:pointer;
  user-select:none;

  z-index:10;

  transform-origin:center bottom;
}

.secret-bell.visible{
  display:block;
}

/*
 * シークレット衣装の各レイヤー
 *
 * 7枚すべて同じ1536×1536キャンバスなので、
 * 同じ場所に完全に重ねる。
 */

.secret-layer{
  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  object-fit:contain;

  border:none;
  outline:none;
  box-shadow:none;

  pointer-events:none;
  user-select:none;

  transform-origin:center center;
}

/* -----------------------------------------------------
   レイヤー順
----------------------------------------------------- */

.secret-layer.layer-base{
  z-index:10;
}

.secret-layer.layer-wide{
  z-index:20;
}

.secret-layer.layer-cloth-left{
  z-index:30;
}

.secret-layer.layer-cloth-right{
  z-index:40;
}

.secret-layer.layer-main{
  z-index:50;
}

.secret-layer.layer-ribbon{
  z-index:60;
}

.secret-layer.layer-ribbon-extra{
  z-index:70;
}

/* =====================================================
   ★ シークレット衣装・常時ひらひら ★
===================================================== */

/*
 * 後ろの大きな布
 */

.secret-layer.layer-wide{
  animation:
    secretWideFlutter
    3.4s
    ease-in-out
    infinite
    alternate;
}

/*
 * 左側の布
 */

.secret-layer.layer-cloth-left{
  animation:
    secretLeftFlutter
    2.45s
    ease-in-out
    infinite
    alternate;
}

/*
 * 右側の布
 */

.secret-layer.layer-cloth-right{
  animation:
    secretRightFlutter
    2.75s
    ease-in-out
    infinite
    alternate;
}

/*
 * リボン
 */

.secret-layer.layer-ribbon{
  animation:
    secretRibbonFlutter
    2.05s
    ease-in-out
    infinite
    alternate;
}

/*
 * リボン追加部分
 */

.secret-layer.layer-ribbon-extra{
  animation:
    secretRibbonExtraFlutter
    2.35s
    ease-in-out
    infinite
    alternate;
}

/* -----------------------------------------------------
   大きな布
----------------------------------------------------- */

@keyframes secretWideFlutter{

  0%{
    transform:
      translate(-1px,0px)
      rotate(-0.5deg);
  }

  25%{
    transform:
      translate(1px,1px)
      rotate(0.6deg);
  }

  50%{
    transform:
      translate(2px,-1px)
      rotate(1deg);
  }

  75%{
    transform:
      translate(-1px,1px)
      rotate(-0.8deg);
  }

  100%{
    transform:
      translate(-2px,-1px)
      rotate(-1.2deg);
  }

}

/* -----------------------------------------------------
   左側の布
----------------------------------------------------- */

@keyframes secretLeftFlutter{

  0%{
    transform:
      translate(0px,0px)
      rotate(-0.5deg);
  }

  25%{
    transform:
      translate(-2px,1px)
      rotate(-1.5deg);
  }

  50%{
    transform:
      translate(-4px,0px)
      rotate(-2.2deg);
  }

  75%{
    transform:
      translate(-2px,-1px)
      rotate(-0.8deg);
  }

  100%{
    transform:
      translate(1px,1px)
      rotate(1deg);
  }

}

/* -----------------------------------------------------
   右側の布
----------------------------------------------------- */

@keyframes secretRightFlutter{

  0%{
    transform:
      translate(0px,0px)
      rotate(0.5deg);
  }

  25%{
    transform:
      translate(2px,1px)
      rotate(1.3deg);
  }

  50%{
    transform:
      translate(4px,0px)
      rotate(2deg);
  }

  75%{
    transform:
      translate(2px,-1px)
      rotate(0.7deg);
  }

  100%{
    transform:
      translate(-1px,1px)
      rotate(-1deg);
  }

}

/* -----------------------------------------------------
   リボン
----------------------------------------------------- */

@keyframes secretRibbonFlutter{

  0%{
    transform:
      translate(0px,0px)
      rotate(-1deg);
  }

  25%{
    transform:
      translate(-1px,1px)
      rotate(1deg);
  }

  50%{
    transform:
      translate(1px,2px)
      rotate(2.5deg);
  }

  75%{
    transform:
      translate(2px,0px)
      rotate(0deg);
  }

  100%{
    transform:
      translate(-1px,-1px)
      rotate(-2deg);
  }

}

/* -----------------------------------------------------
   リボン追加部分
----------------------------------------------------- */

@keyframes secretRibbonExtraFlutter{

  0%{
    transform:
      translate(0px,0px)
      rotate(0deg);
  }

  25%{
    transform:
      translate(1px,1px)
      rotate(1.5deg);
  }

  50%{
    transform:
      translate(2px,2px)
      rotate(3deg);
  }

  75%{
    transform:
      translate(-1px,1px)
      rotate(-1deg);
  }

  100%{
    transform:
      translate(-2px,-1px)
      rotate(-2deg);
  }

}

/* =====================================================
   ★ シークレット衣装の喜びアニメーション
===================================================== */

.secret-bell.celebrating{

  animation:
    bellCelebrate
    1.8s
    cubic-bezier(.2,.8,.25,1)
    both;

}

/* =====================================================
   吹き出し
===================================================== */

.bubble{
  position:absolute;

  max-width:calc(100vw - 8px);

  background:#fff;

  border:2px solid #d9e5ed;
  border-radius:18px;

  padding:7px 8px;

  box-shadow:none;

  font-size:10px;
  line-height:1.55;

  animation:
    bubbleAppear
    .55s
    cubic-bezier(.2,.9,.25,1.2)
    both;

  z-index:30;
}

.bubble small{
  display:block;

  color:#84939d;

  font-size:8px;

  margin-bottom:2px;
}

/* =====================================================
   アニメーション中は吹き出しを消す
===================================================== */

.bubble.bubble-hidden{
  visibility:hidden;
  opacity:0;
  pointer-events:none;
}

/* =====================================================
   ログイン前 吹き出し
===================================================== */

body:not(.logged-in) .bubble{
  min-width:105px;
  width:176px;
  max-width:198px;
  box-sizing:border-box;
  right:4px;
  bottom:92px;
}

body:not(.logged-in) .bubble:after{
  content:"";

  position:absolute;

  width:12px;
  height:12px;

  right:20px;
  bottom:-7px;

  background:#fff;

  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;

  transform:rotate(45deg);
}

/* =====================================================
   ログイン後 吹き出し
===================================================== */

body.logged-in .bubble{
  min-width:105px;
  width:176px;
  max-width:198px;
  box-sizing:border-box;
  right:6px;
  bottom:88px;
}

body.logged-in .bubble:after{
  content:"";

  position:absolute;

  width:12px;
  height:12px;

  right:20px;
  bottom:-7px;

  background:#fff;

  border-top:0;
  border-right:2px solid #d9e5ed;
  border-bottom:2px solid #d9e5ed;

  transform:rotate(45deg);
}

/* =====================================================
   吹き出し登場
===================================================== */

@keyframes bubbleAppear{

  from{
    opacity:0;

    transform:
      scale(.9)
      translateY(7px);
  }

  to{
    opacity:1;

    transform:
      scale(1)
      translateY(0);
  }

}

/* =====================================================
   ハートを出す場所
===================================================== */

.heart-container{
  position:absolute;

  left:50%;
  top:50%;

  width:0;
  height:0;

  pointer-events:none;

  z-index:20;

  overflow:visible;
}

/* =====================================================
   ハート
===================================================== */

.heart{
  position:absolute;

  left:0;
  top:0;

  color:#ff7eb9;

  font-size:18px;

  line-height:1;

  opacity:0;

  transform:
    translate(
      var(--start-x),
      var(--start-y)
    )
    scale(.4);

  animation:
    heartFly
    1.8s
    cubic-bezier(.2,.75,.25,1)
    forwards;
}

/* =====================================================
   ハートが飛び散る
===================================================== */

@keyframes heartFly{

  0%{
    opacity:0;

    transform:
      translate(
        var(--start-x),
        var(--start-y)
      )
      scale(.3)
      rotate(0deg);
  }

  12%{
    opacity:1;
  }

  45%{
    opacity:1;
  }

  100%{
    opacity:0;

    transform:
      translate(
        var(--end-x),
        var(--end-y)
      )
      scale(1)
      rotate(var(--rotate));
  }

}

/* =====================================================
   キャラクター喜びアニメーション
===================================================== */

.bell.celebrating{

  animation:
    bellCelebrate
    1.8s
    cubic-bezier(.2,.8,.25,1)
    both;

}

/* =====================================================
   2回ジャンプ
===================================================== */

@keyframes bellCelebrate{

  0%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }

  12%{
    transform:
      translateY(-18px)
      rotate(-8deg)
      scale(1.04);
  }

  24%{
    transform:
      translateY(-25px)
      rotate(8deg)
      scale(1.05);
  }

  38%{
    transform:
      translateY(0)
      rotate(-4deg)
      scale(1);
  }

  45%{
    transform:
      translateY(-6px)
      rotate(3deg)
      scale(1.02);
  }

  57%{
    transform:
      translateY(-22px)
      rotate(-9deg)
      scale(1.05);
  }

  69%{
    transform:
      translateY(-30px)
      rotate(9deg)
      scale(1.06);
  }

  83%{
    transform:
      translateY(0)
      rotate(-3deg)
      scale(1);
  }

  92%{
    transform:
      translateY(-3px)
      rotate(2deg)
      scale(1.01);
  }

  100%{
    transform:
      translateY(0)
      rotate(0deg)
      scale(1);
  }

}

</style>
</head>

<script type="module">

/* =====================================================

const message =

  );

const bellImage =

  );

const secretBell =
  document.getElementById(
    "secretBell"
  );

const characterName =
  document.getElementById(
    "characterName"
  );

const bubble =

  );

const heartContainer =

/* =====================================================
   キャラクター設定
===================================================== */

let currentCharacter="bell";

let equippedCostumes={
  bell:null,

};

let eventCostumeOverrides={};

/* =====================================================
   ★ シークレット衣装設定
===================================================== */

/*
 * 今回登録するシークレット衣装ID
 *
 * Bell側：
 * secret-bell
 *
 * Chime側は今後追加できるように
 * secret-chime も予約しておく。
 */

const SECRET_COSTUME_IDS={

  bell:"secret-bell",

  chime:"secret-chime"

};

/*

 *
 * チャイムくんのシークレット衣装素材を追加したら、
 * ここに同じ形式で追加できる。
 */

const secretBellLayerImages=[

/*
 * シークレット衣装の読み込み競合を防ぐための番号。
 */

let secretRenderToken=0;

/* =====================================================

const characterImages={

  },

/* =====================================================

const costumeImages={

      "costumes/bell-newyear.png",

    setsubun:
      "costumes/bell-setsubun.png",

    valentine:

/* =====================================================
   ★ コードからテスト日付を変更できます
   例："2026-12-25" → 2026年12月25日として動作
   通常の日付に戻す場合は null にしてください
===================================================== */

const TEST_DATE = "2026-12-25";

/* =====================================================
   十五夜の日
   handbell.htmlの元々の設定に合わせる
===================================================== */

const jugoyaDates={

  2026:"09-25",
  2027:"09-15",
  2028:"10-03",
  2029:"09-22",
  2030:"09-12",
  2031:"10-01",
  2032:"09-19",
  2033:"09-08",
  2034:"09-27",
  2035:"09-16",
  2036:"10-04"

};

/* =====================================================
   ★ テスト日付機能
===================================================== */

function getTestDate(){

  /* コードで指定したテスト日付を最優先 */
  if(TEST_DATE){

    try{

      if(
        /^\d{4}-\d{2}-\d{2}$/.test(
          TEST_DATE
        )
      ){

        const testDate =
          new Date(
            `${TEST_DATE}T12:00:00`
          );

        if(
          !Number.isNaN(
            testDate.getTime()
          ) &&
          testDate.getFullYear() ===
            Number(
              TEST_DATE.slice(0,4)
            ) &&
          testDate.getMonth()+1 ===
            Number(
              TEST_DATE.slice(5,7)
            ) &&
          testDate.getDate() ===
            Number(
              TEST_DATE.slice(8,10)
            )
        ){

          return testDate;

        }

      }

    }catch(error){

      console.warn(
        "コード指定のテスト日付を読み込めませんでした",
        error
      );

    }

  }

  try{

    const params =
      new URLSearchParams(
        window.location.search
      );

    const value =
      params.get("testDate");

    if(
      value &&
      /^\d{4}-\d{2}-\d{2}$/.test(
        value
      )
    ){

      const testDate =
        new Date(
          `${value}T12:00:00`
        );

      if(
        !Number.isNaN(
          testDate.getTime()
        ) &&
        testDate.getFullYear() ===
          Number(
            value.slice(0,4)
          ) &&
        testDate.getMonth()+1 ===
          Number(
            value.slice(5,7)
          ) &&
        testDate.getDate() ===
          Number(
            value.slice(8,10)
          )
      ){

        return testDate;

      }

    }

  }catch(error){

    console.warn(
      "テスト日付を読み込めませんでした",
      error
    );

  }

  return null;

}

function getCurrentDate(){

  return getTestDate() || new Date();

}

/* =====================================================
   今日が特殊服の日か判定
===================================================== */

function getCostumeKey(
  date=getCurrentDate()
){

  const month =
    date.getMonth()+1;

  const day =
    date.getDate();

  /* ---------------------------------------------
     お正月
     1月1日〜1月5日
  --------------------------------------------- */

  if(
    month===1 &&
    day>=1 &&
    day<=5
  ){

    return "newyear";

  }

  /* ---------------------------------------------
     節分
  --------------------------------------------- */

  if(
    month===2 &&
    day===3
  ){

    return "setsubun";

  }

  /* ---------------------------------------------
     バレンタイン
  --------------------------------------------- */

  if(
    month===2 &&
    day===14
  ){

    return "valentine";

  }

  /* ---------------------------------------------
     ひな祭り
  --------------------------------------------- */

  if(
    month===3 &&
    day===3
  ){

    return "hinamatsuri";

  }

  /* ---------------------------------------------
     ホワイトデー
  --------------------------------------------- */

  if(
    month===3 &&
    day===14
  ){

    return "whiteday";

  }

  /* ---------------------------------------------
     こどもの日
  --------------------------------------------- */

  if(
    month===5 &&
    day===5
  ){

    return "kodomonohi";

  }

  /* ---------------------------------------------
     七夕
  --------------------------------------------- */

  if(
    month===7 &&
    day===7
  ){

    return "tanabata";

  }

  /* ---------------------------------------------
     十五夜
  --------------------------------------------- */

  const monthDay =
    `${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

  const jugoya =
    jugoyaDates[
      date.getFullYear()
    ];

  if(
    jugoya &&
    jugoya===monthDay
  ){

    return "tsukimi";

  }

  /* ---------------------------------------------
     ハロウィン
  --------------------------------------------- */

  if(
    month===10 &&
    day===31
  ){

    return "halloween";

  }

  /* ---------------------------------------------
     クリスマスイブ
  --------------------------------------------- */

  if(
    month===12 &&
    day===24
  ){

    return "christmaseve";

  }

  /* ---------------------------------------------
     クリスマス
  --------------------------------------------- */

  if(
    month===12 &&
    day===25
  ){

    return "christmas";

  }

  /* ---------------------------------------------
     大晦日
     → winter衣装
  --------------------------------------------- */

  if(
    month===12 &&
    day===31
  ){

    return "winter";

  }

  return null;

}

/* =====================================================
   ★ シークレット衣装判定
===================================================== */

function isSecretCostumeId(
  costumeId,
  character
){

  return (
    !!costumeId &&
    costumeId ===
      SECRET_COSTUME_IDS[
        character
      ]
  );

}

/* =====================================================
   ★ シークレット衣装を表示
===================================================== */

function showSecretBell(){

  /*
   * ベルちゃん以外では表示しない。
   */

  if(
    currentCharacter !== "bell"
  ){

    hideSecretBell();

    return;

  }

  const token =
    ++secretRenderToken;

  /*
   * 7枚すべて読み込めることを確認してから表示。
   *
   * 途中で1枚だけ失敗して
   * 「？」や中途半端な衣装になるのを防ぐ。
   */

  Promise.all(

    secretBellLayerImages.map(
      src =>
        new Promise(
          resolve=>{

            const image =
              new Image();

            image.onload=()=>{
              resolve(true);
            };

            image.onerror=()=>{
              resolve(false);
            };

            image.src=src;

          }
        )
    )

  ).then(
    results=>{

      /*
       * 途中でキャラクターが
       * 切り替わっていたら何もしない。
       */

      if(
        token !==
        secretRenderToken
      ){

        return;

      }

      /*
       * 全部読み込めなかった場合は
       * 通常ベルちゃんへ戻す。
       */

      if(
        !results.every(
          value=>value===true
        )
      ){

        hideSecretBell();

        bellImage.style.display =
          "";

        return;

      }

      /*
       * シークレット表示
       */

      bellImage.style.display =
        "none";

      secretBell.classList.add(
        "visible"
      );

    }
  );

}

/* =====================================================
   ★ シークレット衣装を非表示
===================================================== */

function hideSecretBell(){

  /*
   * 現在進行中の読み込みを無効化
   */

  secretRenderToken++;

  secretBell.classList.remove(
    "visible"
  );

  secretBell.classList.remove(
    "celebrating"
  );

  bellImage.style.display =
    "";

}

/* =====================================================
   今日表示する衣装状態を取得
===================================================== */

function getCharacterDisplayState(
  character,
  date=getCurrentDate()
){

  const selected =
    character === "chime"
      ? "chime"
      : "bell";

  const costumeKey =
    getCostumeKey(date);

  /*
   * ---------------------------------------------------
   * ① イベント日の手動衣装
   * ---------------------------------------------------
   */

  if(costumeKey){

    const override =
      eventCostumeOverrides?.[
        costumeKey
      ]?.[
        selected
      ] || null;

    if(override){

      /*
       * イベント中に手動で
       * シークレットを指定した場合。
       *
       * ただし現在はイベント衣装の通常画像を優先する。
       * シークレットは通常日で装備している場合に表示。
       */

      if(
        isSecretCostumeId(
          override,
          selected
        )
      ){

        return {
          type:"secret",
          id:override
        };

      }

      const overrideImage =
        getCostumeImageFromId(
          override,
          selected
        );

      if(overrideImage){

        return {
          type:"image",
          src:overrideImage
        };

      }

    }

    /*
     * -------------------------------------------------
     * ② 通常のイベント衣装
     * -------------------------------------------------
     */

    if(
      costumeImages[
        selected
      ]?.[
        costumeKey
      ]
    ){

      return {
        type:"image",
        src:
          costumeImages[
            selected
          ][
            costumeKey
          ]
      };

    }

  }

  /*
   * ---------------------------------------------------
   * ③ 装備中の衣装
   * ---------------------------------------------------
   */

  const equipped =
    equippedCostumes?.[
      selected
    ] || null;

  if(
    isSecretCostumeId(
      equipped,
      selected
    )
  ){

    return {
      type:"secret",
      id:equipped
    };

  }

  const equippedImage =
    getCostumeImageFromId(
      equipped,
      selected
    );

  if(equippedImage){

    return {
      type:"image",
      src:equippedImage
    };

  }

  /*
   * ---------------------------------------------------
   * ④ 通常キャラクター
   * ---------------------------------------------------
   */

  return {
    type:"normal",
    src:
      characterImages[
        selected
      ].src
  };

}

/* =====================================================
   今日のキャラクター画像を取得
===================================================== */

function getCharacterImage(
  character,
  date=getCurrentDate()
){

  const state =
    getCharacterDisplayState(
      character,

    );

  if(
    state.type === "secret"
  ){

  }

}

/* =====================================================
   衣装IDから画像を取得
===================================================== */

function getCostumeImageFromId(
  costumeId,
  character
){

  if(!costumeId){

    return null;

  }

  /* ---------------------------------------------------
     毎日ログイン衣装
  --------------------------------------------------- */

  if(
    costumeId ===
    "daily-costume-01"
  ){

    return "costumes/daily-costume-01.png";

  }

  if(
    costumeId ===
    "daily-costume-02"
  ){

    return "costumes/daily-costume-02.png";

  }

  /* ---------------------------------------------------
     シークレット衣装
     
     ※シークレットは通常の1枚画像ではなく、
       7レイヤーで表示するのでここではnull。
  --------------------------------------------------- */

  if(
    isSecretCostumeId(
      costumeId,
      character
    )
  ){

    return null;

  }

  /* ---------------------------------------------------
     イベント衣装
  --------------------------------------------------- */

  if(
    costumeId.startsWith(
      "event_"
    )
  ){

    const suffix =
      character === "chime"
        ? "_chime"
        : "_bell";

    if(
      !costumeId.endsWith(
        suffix
      )
    ){

      return null;

    }

    let key =
      costumeId.slice(
        6,
        -suffix.length
      );

    if(
      key ===
      "newyearseve"
    ){

      key =
        "winter";

    }

    return (
      costumeImages?.[
        character
      ]?.[
        key
      ] ||
      null
    );

  }

  return null;

}

/* =====================================================
   キャラクター切り替え
===================================================== */

function setCharacter(
  character
){

  currentCharacter =
    character === "chime"
      ? "chime"
      : "bell";

  const data =
    characterImages[
      currentCharacter
    ];

  if(!data)return;

  /*
   * シークレット衣装をいったん停止。
   * 通常キャラやイベント衣装へ切り替える場合に
   * 前のシークレット衣装が残らないようにする。
   */

  hideSecretBell();

  /*
   * 今日表示する衣装状態を取得
   */

  const displayState =
    getCharacterDisplayState(
      currentCharacter
    );

  bellImage.alt =
    data.name;

  /*
   * ---------------------------------------------------
   * シークレット衣装
   * ---------------------------------------------------
   */

  if(
    displayState.type ===
    "secret"
  ){

    /*
     * 現在はベルちゃん用の
     * 7レイヤー素材のみ実装。
     */

    if(
      currentCharacter ===
      "bell" &&
      displayState.id ===
        SECRET_COSTUME_IDS.bell
    ){

      showSecretBell();

    }else{

      /*
       * チャイムくんのシークレット素材が
       * まだない場合は通常画像。
       */

      bellImage.src =
        data.src;

      bellImage.style.display =
        "";

    }

  }

  /*
   * ---------------------------------------------------
   * 通常画像 / イベント衣装 / 毎日衣装
   * ---------------------------------------------------
   */

  else{

    const normalSrc =
      data.src;

    const costumeSrc =
      displayState.src;

    bellImage.style.display =
      "";

    bellImage.onerror =
      function(){

        /*
         * 読み込み失敗時は必ず通常画像へ戻す。
         */

        if(
          this.src !==
          new URL(
            normalSrc,
            window.location.href
          ).href
        ){

          this.src =
            normalSrc;

        }

      };

    if(
      costumeSrc ===
      normalSrc
    ){

      bellImage.src =
        normalSrc;

    }else{

      /*
       * 特殊服画像は、
       * 読み込めた場合だけ表示。
       */

      const testImage =
        new Image();

      testImage.onload =
        function(){

          /*
           * キャラクターが変わっていないことを確認。
           */

          if(
            currentCharacter ===
            character
          ){

            bellImage.src =
              costumeSrc;

          }

        };

      testImage.onerror =
        function(){

          bellImage.src =
            normalSrc;

        };

      testImage.src =
        costumeSrc;

    }

  }

  /*
   * ---------------------------------------------------
   * チャイムくん用サイズ
   * ---------------------------------------------------
   */

  if(
    currentCharacter ===
    "chime"
  ){

    bellImage.classList.add(
      "chime"
    );

  }else{

    bellImage.classList.remove(
      "chime"
    );

  }

  if(characterName){

    characterName.textContent =
      data.name;

  }

}

        )
    )
  ];

  );

function buildBellMessages(
  schedules
){

  const now =
    getCurrentDate();

  const values =
    Object.values(
      schedules || {}
    )
    .filter(
      s =>
        s &&
        typeof s === "object"
    );

  const all=[
    ...buildRegularMessages(

      now
    )
  ];

  try{

    const today =
      dateString(now);

    all.push(
      ...getClubBeforeStartMessages(
        values,
        today,
        now
      )
    );

  }catch(error){

      "ベルちゃんの部活前メッセージを作成できませんでした",
      error
    );

      values,

    ).forEach(

                : "イベント"
            )
          }だね！`
        );

      }
    );

  }catch(error){

    console.warn(
      "ベルちゃんの当日イベントメッセージを作成できませんでした",
      error
    );

  }

  try{

    ).forEach(

                : "イベント"
            )

        );

      }
    );

  }catch(error){

    console.warn(
      "ベルちゃんの予定メッセージを作成できませんでした",
      error
    );

  }

  return [
    ...new Set(all)
  ];

}

function receiveParentSchedules(
  schedules
){

  parentSchedules =
    schedules &&
    typeof schedules === "object"
      ? schedules
      : {};

  setBellMessages(
    buildBellMessages(
      parentSchedules
    )
  );

}

window.addEventListener(
  "message",
  event=>{

    if(!event.data)return;

    /* -----------------------------------------------
       装備衣装
    ----------------------------------------------- */

    if(
      event.data.type ===
      "handbell-equipped-costume"
    ){

      const data =
        event.data.equippedCostume ||
        {};

      equippedCostumes={

        bell:
          data.bell ||
          null,

        chime:
          data.chime ||
          null

      };

      setCharacter(
        currentCharacter
      );

      return;

    }

    /* -----------------------------------------------
       イベント衣装の手動変更
    ----------------------------------------------- */

    if(
      event.data.type ===
      "handbell-event-costume-override"
    ){

      eventCostumeOverrides =
        event.data.overrides &&
        typeof event.data.overrides ===
          "object"
          ? event.data.overrides
          : {};

      setCharacter(
        currentCharacter
      );

      return;

    }

    /* -----------------------------------------------
       キャラクター変更
    ----------------------------------------------- */

    if(
      event.data.type ===
      "handbell-character"
    ){

      setCharacter(
        event.data.character
      );

      updateCostume();

      return;

    }

    /* -----------------------------------------------
       スケジュール
    ----------------------------------------------- */

    if(
      event.data.type ===
      "handbell-schedules"
    ){

      receiveParentSchedules(
        event.data.schedules
      );

      return;

    }

  }
);

/* =====================================================
   日付・時間
===================================================== */

function pad(n){

  return String(n)
    .padStart(2,"0");

}

function dateString(
  date=getCurrentDate()
){

  return `${
    date.getFullYear()
  }-${
    pad(date.getMonth()+1)
  }-${
    pad(date.getDate())
  }`;

}

function monthString(
  date=getCurrentDate()
){

  return `${
    date.getFullYear()
  }-${
    pad(date.getMonth()+1)
  }`;

}

function timeToMinutes(
  value
){

  const match =
    String(value || "")
      .match(
        /^(\d{1,2}):(\d{2})$/
      );

  if(!match)return null;

  return (
    Number(match[1])*60 +
    Number(match[2])
  );

}

/* =====================================================
   挨拶
===================================================== */

function getGreeting(
  date=getCurrentDate()
){

  const hour =
    date.getHours();

  if(
    hour>=4 &&
    hour<10
  ){

    return "おはよう！";

  }

  if(
    hour>=10 &&
    hour<17
  ){

    return "こんにちは！";

  }

  return "こんばんは!";

}

function greetingMessage(
  text,
  date=getCurrentDate()
){

  return `${
    getGreeting(date)
  }${text}`;

}

/* =====================================================
   時刻表示
===================================================== */

function formatJapaneseTime(
  value
){

  const match =
    String(value || "")
      .match(
        /^(\d{1,2}):(\d{2})$/
      );

  if(!match){

    return String(
      value || ""
    );

  }

  return `${
    Number(match[1])
  }時${
    match[2]
  }分`;

}

function formatTimeRange(
  time
){

  const value =
    String(time || "")
      .trim();

  if(
    !value ||
    value==="終日"
  ){

    return "";

  }

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]\s*(\d{1,2}:\d{2})$/
    );

  if(!match){

    return value;

  }

  return `${
    formatJapaneseTime(match[1])
  }〜${
    formatJapaneseTime(match[2])
  }`;

}

function getStartTime(
  time
){

  const value =
    String(time || "")
      .trim();

  const match =
    value.match(
      /^(\d{1,2}:\d{2})\s*[〜~\-－]/
    );

  return match
    ? timeToMinutes(match[1])
    : null;

}

/* =====================================================
   日付計算
===================================================== */

function getTomorrowString(
  date=getCurrentDate()
){

  const tomorrow =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()+1
    );

  return dateString(
    tomorrow
  );

}

function daysFromToday(
  dateStringValue,
  today=getCurrentDate()
){

  const target =
    new Date(
      `${dateStringValue}T00:00:00`
    );

  const base =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );

  return Math.round(
    (
      target-base
    ) / 86400000
  );

}

function isUpcomingWithinDays(
  dateValue,
  today,
  days
){

  if(!dateValue)return false;

  const diff =
    daysFromToday(
      dateValue,
      today
    );

  return (
    diff>0 &&
    diff<=days
  );

}

/* =====================================================
   スケジュール
===================================================== */

function getNormalSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      s.type==="normal" &&
      s.date===date
  );

}

function getEventSchedulesForDate(
  values,
  date
){

  return values.filter(
    s =>
      s &&
      (
        s.type==="concert" ||
        s.type==="event"
      ) &&
      s.date===date
  );

}

function getUpcomingEvents(
  values,
  today
){

  return values
    .filter(
      s =>
        s &&
        (
          s.type==="concert" ||
          s.type==="event"
        ) &&
        isUpcomingWithinDays(
          s.date,
          today,
          7
        )
    )
    .sort(
      (a,b)=>
        String(a.date)
          .localeCompare(
            String(b.date)
          )
    );

}

function getMonthlyClubCount(
  values,
  today
){

  const month =
    monthString(today);

  return values.filter(
    s =>
      s &&
      (
        s.type==="normal" ||
        !s.type
      ) &&
      typeof s.date === "string" &&
      s.date.startsWith(month)
  ).length;

}

/* =====================================================
   部活前メッセージ
===================================================== */

function getClubBeforeStartMessages(
  values,
  today,
  dateNow
){

  const todayNormal =
    getNormalSchedulesForDate(
      values,
      today
    )[0];

  if(!todayNormal)return [];

  const start =
    getStartTime(
      todayNormal.time
    );

    dateNow.getHours()*60 +
    dateNow.getMinutes();

  if(
    start===null ||
    nowMinutes>=start
  ){

    return [];

  }

  const range =
    formatTimeRange(
      todayNormal.time
    );

  const result=[];

  if(range){

    result.push(
      greetingMessage(
        `今日の部活は${range}だよ`,
        dateNow
      )
    );

  }

  result.push(

    greetingMessage(
      "今日の部活、頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日もみんなでハンドベル頑張ろうね！",
      dateNow
    ),

    greetingMessage(
      "今日の部活も楽しみだね！",
      dateNow
    ),

    greetingMessage(
      "今日はどんな曲を練習するのかな？",
      dateNow
    ),

    greetingMessage(
      "今日の部活も一緒に頑張ろうね！",
      dateNow
    )

  );

  return result;

}

/* =====================================================
   ランダム
===================================================== */

function pickRandom(
  list
){

  if(!list.length){

    return "予定を確認してみてね！";

  }

  return list[
    Math.floor(
      Math.random()*list.length
    )
  ];

}

/* =====================================================
   メッセージ表示
===================================================== */

function showMessage(
  text
){

  message.textContent =
    text;

}

function changeBellMessage(){

  if(!bellMessages.length)return;

  let next =
    pickRandom(
      bellMessages
    );

  if(
    bellMessages.length>1 &&
    next===message.textContent
  ){

    const other =
      bellMessages.filter(
        item =>
          item !==
          message.textContent
      );

    next =
      pickRandom(other);

  }

  showMessage(next);

}

/* =====================================================
   大量のハート
===================================================== */

function startHearts(){

  if(!heartContainer)return;

  const hearts=[];

  for(let i=0;i<14;i++){

    hearts.push({

      startX:
        -55 +
        Math.random()*110,

      startY:
        -10 +
        Math.random()*25,

      endX:
        -130 +
        Math.random()*260,

      endY:
        -120 -
        Math.random()*150

    });

  }

  for(let i=0;i<10;i++){

    hearts.push({

      startX:
        -35 -
        Math.random()*35,

      startY:
        -10 -
        Math.random()*35,

      endX:
        -100 -
        Math.random()*120,

      endY:
        -70 -
        Math.random()*120

    });

  }

  for(let i=0;i<10;i++){

    hearts.push({

      startX:
        35 +
        Math.random()*35,

      startY:
        -10 -
        Math.random()*35,

      endX:
        100 +
        Math.random()*120,

        -70 -
        Math.random()*120

    });

  }

  for(let i=12;i--;){

    hearts.push({

        Math.random()*20,

      startY:
        -40 +
        Math.random()*90,

      endX:
        -130 -
        Math.random()*140,

      endY:
        -70 +
        Math.random()*160

    });

  }

  for(let i=12;i--;){

    hearts.push({

      startX:
        45 +
        Math.random()*20,

      startY:
        -40 +
        Math.random()*90,

      endX:
        130 +
        Math.random()*140,

      endY:
        -70 +
        Math.random()*160

    });

  }

  for(let i=8;i--;){

    hearts.push({

      startX:
        -40 -
        Math.random()*25,

      startY:
        30 +
        Math.random()*25,

      endX:
        -100 -
        Math.random()*130,

      endY:
        50 +
        Math.random()*100

    });

  }

  for(let i=8;i--;){

    hearts.push({

      startX:
        40 +
        Math.random()*25,

      startY:
        30 +
        Math.random()*25,

      endX:
        100 +
        Math.random()*130,

      endY:
        50 +
        Math.random()*100

    });

  }

  hearts.forEach(
    (data,index)=>{

      const heart =
        document.createElement(
          "span"
        );

      heart.className =
        "heart";

      heart.textContent =
        index % 4 === 0
          ? "♡"
          : "♥";

      heart.style.setProperty(
        "--start-x",
        `${data.startX}px`
      );

      heart.style.setProperty(
        "--start-y",
        `${data.startY}px`
      );

      heart.style.setProperty(
        "--end-x",
        `${data.endX}px`
      );

      heart.style.setProperty(
        "--end-y",
        `${data.endY}px`
      );

      const rotation =
        -60 +
        Math.random()*120;

      heart.style.setProperty(
        "--rotate",
        `${rotation}deg`
      );

      const size =
        11 +
        Math.random()*13;

      heart.style.fontSize =
        `${size}px`;

      const delay =
        Math.random()*350;

      heart.style.animationDelay =
        `${delay}ms`;

      heartContainer.appendChild(
        heart
      );

      heart.addEventListener(
        "animationend",
        ()=>{
          heart.remove();
        }
      );

    }
  );

}

/* =====================================================
   アニメーション中かどうか
===================================================== */

let isAnimating=false;

/* =====================================================
   ★ 現在の喜びアニメーション対象
===================================================== */

function getCelebrationTarget(){

  if(
    secretBell.classList.contains(
      "visible"
    )
  ){

    return secretBell;

  }

  return bellImage;

}

/* =====================================================
   キャラクターをクリック
===================================================== */

function celebrate(){

  if(isAnimating)return;

  isAnimating=true;

  bubble.classList.add(
    "bubble-hidden"
  );

  const target =
    getCelebrationTarget();

  /*
   * 通常ベルちゃん
   */

  bellImage.classList.remove(
    "celebrating"
  );

  /*
   * シークレットベルちゃん
   */

  secretBell.classList.remove(
    "celebrating"
  );

  /*
   * アニメーションを強制リセット
   */

  void target.offsetWidth;

  /*
   * 喜びアニメーション開始
   */

  target.classList.add(
    "celebrating"
  );

  /*
   * 1回目のハート
   */

  setTimeout(
    ()=>{
      startHearts();
    },
    150
  );

  /*
   * 2回目のハート
   */

  setTimeout(
    ()=>{
      startHearts();
    },
    950
  );

}

/* =====================================================
   アニメーション終了
===================================================== */

function finishCelebration(
  event
){

  /*
   * 子レイヤーのひらひらアニメーションが
   * animationendを発生させても無視する。
   */

  if(
    event.target !==
      bellImage &&
    event.target !==
      secretBell
  ){

    return;

  }

  if(
    event.animationName !==
    "bellCelebrate"
  ){

    return;

  }

  bellImage.classList.remove(
    "celebrating"
  );

  secretBell.classList.remove(
    "celebrating"
  );

  changeBellMessage();

  bubble.classList.remove(
    "bubble-hidden"
  );

  bubble.style.animation="none";

  void bubble.offsetWidth;

  bubble.style.animation="";

  isAnimating=false;

}

bellImage.addEventListener(
  "animationend",
  finishCelebration
);

secretBell.addEventListener(
  "animationend",
  finishCelebration
);
