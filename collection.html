<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>着替える</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:#f6f8fa;
  color:#26343d;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

body{
  padding:18px 14px 30px;
}

.page{
  width:min(760px,100%);
  margin:0 auto;
}

.card{
  background:#fff;
  border:1px solid #e1e8ed;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 18px rgba(30,55,70,.06);
  margin-bottom:16px;
}

h1{
  margin:4px 0 8px;
  font-size:24px;
}

h2{
  margin:0 0 8px;
  font-size:20px;
}

p{
  margin:0 0 14px;
}

.small{
  color:#71808a;
  font-size:13px;
  line-height:1.6;
}

/* =====================================================
   キャラクター選択
===================================================== */

#characterSelect{
  display:block;
}

.character-choice{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px;
}

.character-button{
  width:100%;
  min-height:150px;
  padding:18px 12px;
  border:2px solid #e1e8ed;
  border-radius:18px;
  background:#fff;
  color:#26343d;
  cursor:pointer;
  transition:
    border-color .15s ease,
    transform .15s ease,
    box-shadow .15s ease;
}

.character-button:active{
  transform:scale(.98);
}

.character-button:hover{
  border-color:#8fb5d5;
  box-shadow:0 4px 14px rgba(50,100,140,.08);
}

.character-icon{
  font-size:42px;
  margin-bottom:8px;
}

.character-name{
  font-size:16px;
  font-weight:700;
}

/* =====================================================
   衣装画面
===================================================== */

#wardrobe{
  display:none;
}

.wardrobe-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.wardrobe-title{
  margin:0;
}

.change-character-button{
  width:auto;
  white-space:nowrap;
  padding:9px 12px;
  font-size:13px;
  background:#fff;
  color:#43545e;
  border:1px solid #d8e1e7;
}

.costume-category{
  margin-top:20px;
}

.costume-category-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 10px;
  font-size:17px;
}

.costume-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.costume-card{
  position:relative;
  border:2px solid #e1e8ed;
  border-radius:16px;
  background:#fff;
  padding:10px;
  text-align:center;
  cursor:pointer;
  transition:
    border-color .15s ease,
    transform .15s ease,
    box-shadow .15s ease;
}

.costume-card:active{
  transform:scale(.98);
}

.costume-card.selected{
  border-color:#5b9bd5;
  box-shadow:0 0 0 3px rgba(91,155,213,.14);
}

.costume-card img{
  display:block;
  width:100%;
  height:150px;
  object-fit:contain;
  margin:0 auto 8px;
}

.costume-name{
  font-size:14px;
  font-weight:600;
  line-height:1.4;
}

.costume-type-badge{
  position:absolute;
  top:8px;
  left:8px;
  padding:4px 7px;
  border-radius:999px;
  background:#8d72c7;
  color:#fff;
  font-size:10px;
  font-weight:700;
}

.costume-type-badge.daily{
  background:#63a56f;
}

.selected-badge{
  position:absolute;
  top:8px;
  right:8px;
  padding:4px 7px;
  border-radius:999px;
  background:#5b9bd5;
  color:#fff;
  font-size:11px;
  font-weight:700;
}

.empty-message{
  padding:12px;
  border-radius:12px;
  background:#f5f7f9;
  color:#71808a;
  font-size:13px;
  line-height:1.5;
}

/* =====================================================
   ボタン
===================================================== */

.actions{
  display:none;
  position:sticky;
  bottom:10px;
  z-index:5;
  background:rgba(246,248,250,.94);
  padding-top:8px;
}

button{
  width:100%;
  border:none;
  border-radius:12px;
  padding:13px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#3f7fb8;
  color:#fff;
}

.secondary{
  background:#fff;
  color:#43545e;
  border:1px solid #d8e1e7;
  margin-top:9px;
}

button:disabled{
  opacity:.55;
  cursor:default;
}

#message{
  min-height:20px;
  margin-top:10px;
  text-align:center;
  font-size:13px;
}

#message.error{
  color:#c84c4c;
}

/* =====================================================
   スマホ
===================================================== */

@media(max-width:480px){

  .character-choice{
    grid-template-columns:1fr 1fr;
  }

  .character-button{
    min-height:135px;
  }

  .character-icon{
    font-size:36px;
  }

  .costume-grid{
    grid-template-columns:1fr 1fr;
  }

  .costume-card img{
    height:125px;
  }

  body{
    padding:14px 10px 26px;
  }

  .card{
    padding:14px;
  }

  .wardrobe-header{
    align-items:flex-start;
  }

  .change-character-button{
    font-size:12px;
    padding:8px 10px;
  }

}


.image-lightbox{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(20,24,35,.86);pointer-events:auto;}
.image-lightbox.show{display:flex;}
.image-lightbox img{display:block;max-width:96vw;max-height:88vh;object-fit:contain;background:transparent;}
.image-lightbox-close{position:absolute;right:14px;top:12px;border:0;border-radius:999px;width:44px;height:44px;font-size:28px;background:#fff;color:#222;cursor:pointer;}
.costume-card img{cursor:pointer;}

</style>
</head>

<body>
<div id="imageLightbox" class="image-lightbox" aria-hidden="true" role="dialog" aria-label="画像を拡大"><button type="button" class="image-lightbox-close" aria-label="閉じる">×</button><img id="imageLightboxImg" alt="拡大画像"></div>

<div class="page">

  <!-- =================================================
       キャラクター選択
  ================================================== -->

  <div id="characterSelect">

    <div class="card">

      <h1>👕 着替える</h1>

      <p class="small">
        どちらのキャラクターを着替えますか？
      </p>

      <div class="character-choice">

        <button
          type="button"
          class="character-button"
          id="bellChoice"
        >
          <div class="character-icon">
            🔔
          </div>

          <div class="character-name">
            ベルちゃん
          </div>
        </button>

        <button
          type="button"
          class="character-button"
          id="chimeChoice"
        >
          <div class="character-icon">
            🎵
          </div>

          <div class="character-name">
            チャイムくん
          </div>
        </button>

      </div>

    </div>

  </div>


  <!-- =================================================
       衣装一覧
  ================================================== -->

  <div id="wardrobe">

    <div class="card">

      <div class="wardrobe-header">

        <h1
          id="wardrobeTitle"
          class="wardrobe-title"
        >
          🔔 ベルちゃんの衣装
        </h1>

        <button
          type="button"
          id="changeCharacterButton"
          class="change-character-button"
        >
          キャラを変更
        </button>

      </div>


      <!-- =========================
           ノーマル衣装
      ========================== -->

      <div class="costume-category">

        <h2 class="costume-category-title">
          🙂 ノーマル衣装
        </h2>

        <div
          id="normalCostumes"
          class="costume-grid"
        ></div>

      </div>


      <!-- =========================
           イベント衣装
      ========================== -->

      <div class="costume-category">

        <h2 class="costume-category-title">
          🎉 イベント衣装
        </h2>

        <div
          id="eventCostumes"
          class="costume-grid"
        ></div>

      </div>


      <!-- =========================
           シークレット衣装
      ========================== -->

      <div class="costume-category">
        <h2 class="costume-category-title">🌙 シークレット衣装</h2>
        <div id="secretCostumes" class="costume-grid"></div>
      </div>

      <!-- =========================
           毎日衣装
      ========================== -->

      <div class="costume-category">

        <h2 class="costume-category-title">
          🎁 毎日衣装
        </h2>

        <div
          id="dailyCostumes"
          class="costume-grid"
        ></div>

      </div>

    </div>

  </div>


  <!-- =================================================
       操作
  ================================================== -->

  <div
    class="actions"
    id="actions"
  >

    <button
      id="saveButton"
      class="primary"
      type="button"
      disabled
    >
      この衣装に着替える
    </button>

    <button
      id="backButton"
      class="secondary"
      type="button"
    >
      ← ホームに戻る
    </button>

    <div id="message"></div>

  </div>

</div>


<script type="module">

/* =====================================================
   Firebase
===================================================== */

import{
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import{
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import{
  getDatabase,
  ref,
  get,
  update
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",

  authDomain:
    "seikyo-handbell-club.firebaseapp.com",

  databaseURL:
    "https://seikyo-handbell-club-default-rtdb.firebaseio.com",

  projectId:
    "seikyo-handbell-club",

  storageBucket:
    "seikyo-handbell-club.firebasestorage.app",

  messagingSenderId:
    "55435007971",

  appId:
    "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

setPersistence(
  auth,
  browserLocalPersistence
).catch(
  error =>
    console.error(
      "認証状態の保存設定エラー:",
      error
    )
);

const db =
  getDatabase(app);


/* =====================================================
   イベント衣装
===================================================== */

const eventCostumeDefinitions = [

  [
    "newyear",
    "お正月",
    "bell-newyear.png",
    "chime-newyear.png"
  ],

  [
    "setsubun",
    "節分",
    "bell-setsubun.png",
    "chime-setsubun.png"
  ],

  [
    "valentine",
    "バレンタイン",
    "bell-valentine.png",
    "chime-valentine.png"
  ],

  [
    "hinamatsuri",
    "ひな祭り",
    "bell-hinamatsuri.png",
    "chime-hinamatsuri.png"
  ],

  [
    "whiteday",
    "ホワイトデー",
    "bell-whiteday.png",
    "chime-whiteday.png"
  ],

  [
    "kodomonohi",
    "こどもの日",
    "bell-kodomonohi.png",
    "chime-kodomonohi.png"
  ],

  [
    "tanabata",
    "七夕",
    "bell-tanabata.png",
    "chime-tanabata.png"
  ],

  [
    "tsukimi",
    "十五夜",
    "bell-tsukimi.png",
    "chime-tsukimi.png"
  ],

  [
    "halloween",
    "ハロウィン",
    "bell-halloween.png",
    "chime-halloween.png"
  ],

  [
    "christmaseve",
    "クリスマスイブ",
    "bell-christmaseve.png",
    "chime-christmaseve.png"
  ],

  [
    "christmas",
    "クリスマス",
    "bell-christmas.png",
    "chime-christmas.png"
  ],

  [
    "winter",
    "大晦日",
    "bell-winter.png",
    "chime-winter.png"
  ]

];


/* =====================================================
   毎日衣装
===================================================== */

const dailyCostumeDefinitions = Array.from({length:54},(_,index)=>{
  const number = String(index+1).padStart(2,"0");
  return {
    id:`daily-costume-${number}`,
    name:`ベルちゃん・毎日衣装 ${number}`,
    src:`costumes/daily-costume-${number}.webp`
  };
});


/* =====================================================
   現在の状態
===================================================== */

let currentUser = null;

let acquiredCollection = {};

let dailyCostumes = {

  bell:{},

  chime:{}

};

let equippedCostume = {

  bell:null,

  chime:null

};

let selectedCostume = {

  bell:null,

  chime:null

};

let selectedCharacter = null;


/* =====================================================
   要素
===================================================== */

const characterSelect =
  document.getElementById(
    "characterSelect"
  );

const wardrobe =
  document.getElementById(
    "wardrobe"
  );

const actions =
  document.getElementById(
    "actions"
  );

const bellChoice =
  document.getElementById(
    "bellChoice"
  );

const chimeChoice =
  document.getElementById(
    "chimeChoice"
  );

const wardrobeTitle =
  document.getElementById(
    "wardrobeTitle"
  );

const changeCharacterButton =
  document.getElementById(
    "changeCharacterButton"
  );

const normalCostumesContainer =
  document.getElementById(
    "normalCostumes"
  );

const eventCostumes =
  document.getElementById(
    "eventCostumes"
  );

const dailyCostumesContainer =
  document.getElementById(
    "dailyCostumes"
  );

const secretCostumesContainer =
  document.getElementById("secretCostumes");

const saveButton =
  document.getElementById(
    "saveButton"
  );

const backButton =
  document.getElementById(
    "backButton"
  );

const message =
  document.getElementById(
    "message"
  );


/* =====================================================
   メッセージ
===================================================== */

function showMessage(
  text,
  error=false
){

  message.textContent =
    text;

  message.classList.toggle(
    "error",
    error
  );

}


/* =====================================================
   キャラクター選択
===================================================== */

function openCharacter(
  character
){

  selectedCharacter =
    character === "chime"
      ? "chime"
      : "bell";

  characterSelect.style.display =
    "none";

  wardrobe.style.display =
    "block";

  actions.style.display =
    "block";

  wardrobeTitle.textContent =
    selectedCharacter === "bell"
      ? "🔔 ベルちゃんの衣装"
      : "🎵 チャイムくんの衣装";

  showMessage("");

  renderWardrobe();

}


/* =====================================================
   キャラクター選択画面へ戻る
===================================================== */

function backToCharacterSelect(){

  selectedCharacter =
    null;

  wardrobe.style.display =
    "none";

  actions.style.display =
    "none";

  characterSelect.style.display =
    "block";

  showMessage("");

}


/* =====================================================
   イベント衣装ID
===================================================== */

function getEventCostumeId(
  key,
  character
){

  return `event_${key}_${character}`;

}


/* =====================================================
   イベント衣装一覧
===================================================== */

function getEventCostumes(
  character
){

  return eventCostumeDefinitions.map(
    ([key,name,bellFile,chimeFile])=>({

      id:
        getEventCostumeId(
          key,
          character
        ),

      name:

        character === "bell"

          ? `ベルちゃん・${name}`

          : `チャイムくん・${name}`,

      src:

        character === "bell"

          ? `costumes/${bellFile}`

          : `costumes/${chimeFile}`

    })
  );

}


/* =====================================================
   取得済みイベント衣装
===================================================== */

function isEventCostumeAcquired(
  costumeId
){

  return !!(
    acquiredCollection &&
    acquiredCollection[costumeId]
  );

}


/* =====================================================
   取得済み毎日衣装
===================================================== */

function isDailyCostumeAcquired(
  character,
  costumeId
){

  return !!(
    dailyCostumes &&
    dailyCostumes[character] &&
    dailyCostumes[character][costumeId]
  );

}


/* =====================================================
   衣装カード作成
===================================================== */

/* 衣装選択ではタップで画像を拡大せず、衣装カードの選択を優先する */
function createCostumeCard(
  character,
  costume,
  type
){

  const card =
    document.createElement(
      "button"
    );

  card.type =
    "button";

  card.className =
    "costume-card";

  if(
    selectedCostume[character] ===
    costume.id
  ){

    card.classList.add(
      "selected"
    );

  }


  const image =
    document.createElement(
      "img"
    );

  image.src =
    costume.src;
  image.loading = "lazy";
  image.decoding = "async";
  image.alt =
    costume.name;


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "costume-name";

  name.textContent =
    costume.name;


  card.appendChild(
    image
  );

  card.appendChild(
    name
  );


  const typeBadge =
    document.createElement(
      "span"
    );

  typeBadge.className =
    type === "daily"
      ? "costume-type-badge daily"
      : "costume-type-badge";

  typeBadge.textContent =
    type === "daily"
      ? "毎日"
      : type === "normal"
        ? "ノーマル"
        : "イベント";

  card.appendChild(
    typeBadge
  );


  if(
    selectedCostume[character] ===
    costume.id
  ){

    const selectedBadge =
      document.createElement(
        "span"
      );

    selectedBadge.className =
      "selected-badge";

    selectedBadge.textContent =
      "選択中";

    card.appendChild(
      selectedBadge
    );

  }


  card.addEventListener(
    "click",
    ()=>{

      selectedCostume[
        character
      ] = costume.id;

      renderWardrobe();

    }
  );


  return card;

}


/* =====================================================
   空表示
===================================================== */

function createEmptyMessage(
  text
){

  const empty =
    document.createElement(
      "div"
    );

  empty.className =
    "empty-message";

  empty.textContent =
    text;

  return empty;

}


/* =====================================================
   衣装一覧表示
===================================================== */

function renderWardrobe(){

  if(!selectedCharacter)
    return;


  normalCostumesContainer.innerHTML =
    "";

  eventCostumes.innerHTML =
    "";

  dailyCostumesContainer.innerHTML =
    "";

  secretCostumesContainer.innerHTML =
    "";


  const character =
    selectedCharacter;

  const normalCostume = {
    id: "normal",
    name: character === "bell" ? "ベルちゃん・ノーマル" : "チャイムくん・ノーマル",
    src: character === "bell" ? "bell.png" : "chime.png"
  };
  normalCostumesContainer.appendChild(
    createCostumeCard(character, normalCostume, "normal")
  );


  /* ===================================================
     イベント衣装
  =================================================== */

  const eventList =
    getEventCostumes(
      character
    ).filter(
      costume =>
        isEventCostumeAcquired(
          costume.id
        )
    );


  if(
    eventList.length === 0
  ){

    eventCostumes.appendChild(
      createEmptyMessage(
        "まだ取得済みのイベント衣装がありません。"
      )
    );

  }else{

    eventList.forEach(
      costume=>{

        eventCostumes.appendChild(
          createCostumeCard(
            character,
            costume,
            "event"
          )
        );

      }
    );

  }


  /* ===================================================
     シークレット衣装
  =================================================== */
  const secretId = character === "bell"
    ? "secret_bell_rare_costume"
    : "secret_chime_rare_costume";
  const secretCostume = {
    id: secretId,
    name: character === "bell" ? "ベルちゃん・シークレット衣装" : "チャイムくん・シークレット衣装",
    src: character === "bell" ? "costumes/bell-secret-transparent.png" : "costumes/chime-secret-transparent.png"
  };
  if (acquiredCollection && acquiredCollection[secretId]) {
    secretCostumesContainer.appendChild(
      createCostumeCard(character, secretCostume, "secret")
    );
  } else {
    secretCostumesContainer.appendChild(
      createEmptyMessage("まだ取得済みのシークレット衣装がありません。")
    );
  }

  /* ===================================================
     毎日衣装
  =================================================== */

  const dailyList = character === "bell"
    ? dailyCostumeDefinitions.filter(costume => isDailyCostumeAcquired(character,costume.id))
    : [];


  if(
    dailyList.length === 0
  ){

    dailyCostumesContainer.appendChild(
      createEmptyMessage(
        "まだ取得済みの毎日衣装がありません。"
      )
    );

  }else{

    dailyList.forEach(
      costume=>{

        dailyCostumesContainer.appendChild(
          createCostumeCard(
            character,
            costume,
            "daily"
          )
        );

      }
    );

  }


  saveButton.disabled =
    !currentUser ||
    !selectedCharacter ||
    !selectedCostume[
      selectedCharacter
    ];

}


/* =====================================================
   Firebaseから部員データ取得
===================================================== */

async function loadMemberData(){

  if(!currentUser)
    return false;


  try{

    const memberRef =
      ref(
        db,
        `members/${currentUser.uid}`
      );


    const snap =
      await get(
        memberRef
      );


    if(!snap.exists()){

      showMessage(
        "部員情報を取得できませんでした。",
        true
      );

      return false;

    }


    const data =
      snap.val() || {};


    /* ================================================
       コレクション
       イベント衣装はここを見る
    ================================================= */

    acquiredCollection =
      data.collection || {};


    /* ================================================
       毎日衣装
       イベント衣装とは完全に別管理
    ================================================= */

    const daily =
      data.dailyCostumes || {};


    dailyCostumes = {

      bell:
        daily.bell &&
        typeof daily.bell === "object"

          ? daily.bell

          : {},

      chime:
        daily.chime &&
        typeof daily.chime === "object"

          ? daily.chime

          : {}

    };


    /* ================================================
       現在装備している衣装
    ================================================= */

    const saved =
      data.equippedCostume || {};


    equippedCostume = {

      bell:
        saved.bell || null,

      chime:
        saved.chime || null

    };


    selectedCostume = {

      bell:
        equippedCostume.bell || "normal",

      chime:
        equippedCostume.chime || "normal"

    };


    return true;


  }catch(error){

    console.error(
      "着替え設定の読み込みエラー:",
      error
    );

    showMessage(
      "衣装情報を読み込めませんでした。",
      true
    );

    return false;

  }

}


/* =====================================================
   衣装保存
===================================================== */

async function saveCostume(){

  if(
    !currentUser ||
    !selectedCharacter
  ){

    return;

  }


  const selectedId =
    selectedCostume[
      selectedCharacter
    ];

  /* normal を明示保存し、イベント日でも通常衣装に戻せるようにする */
  const costumeId = selectedId;


  if(!costumeId){

    showMessage(
      "衣装を選択してください。",
      true
    );

    return;

  }


  saveButton.disabled =
    true;


  showMessage(
    "衣装を保存しています……"
  );


  try{

    const updates = {

      [`members/${currentUser.uid}/equippedCostume/${selectedCharacter}`]:
        costumeId

    };


    /*
     * equippedCostumeの選択中キャラクターだけを更新。
     *
     * collection
     * dailyCostumes
     * profile
     * その他の部員データ
     *
     * は上書きしない。
     */

    await update(
      ref(db),
      updates
    );


    equippedCostume[
      selectedCharacter
    ] =
      costumeId;

    showMessage(
      "衣装を保存しました！"
    );

    saveButton.disabled = false;
    renderWardrobe();

    if(window.parent !== window){
      window.parent.postMessage({type:"handbell-costume-saved"}, "*");
    }


  }catch(error){

    console.error(
      "衣装保存エラー:",
      error
    );


    showMessage(
      "衣装を保存できませんでした。",
      true
    );


    saveButton.disabled =
      false;

  }

}


/* =====================================================
   ボタン
===================================================== */

bellChoice.addEventListener(
  "click",
  ()=>{
    openCharacter(
      "bell"
    );
  }
);


chimeChoice.addEventListener(
  "click",
  ()=>{
    openCharacter(
      "chime"
    );
  }
);


changeCharacterButton.addEventListener(
  "click",
  backToCharacterSelect
);


backButton.addEventListener(
  "click",
  ()=>{
    if(window.parent !== window){
      window.parent.postMessage({type:"handbell-close-costume"}, "*");
    }else{
      location.href = "handbell.html";
    }
  }
);


saveButton.addEventListener(
  "click",
  saveCostume
);


/* =====================================================
   認証
===================================================== */

onAuthStateChanged(
  auth,
  async user=>{

    currentUser =
      user;


    if(!user){

      showMessage(
        "ログインが必要です。",
        true
      );

      saveButton.disabled =
        true;

      return;

    }


    const loaded =
      await loadMemberData();


    if(!loaded){

      saveButton.disabled =
        true;

      return;

    }


    /*
     * ログイン直後は
     * キャラクター選択画面のまま。
     */

    characterSelect.style.display =
      "block";

    wardrobe.style.display =
      "none";

    actions.style.display =
      "none";

  }
);

</script>
