<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>コレクション｜清教学園ハンドベル部</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#fff;
  color:#333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
}

body{
  padding:20px 14px 40px;
}

h1{
  margin:0 0 24px;
  text-align:center;
  font-size:22px;
  font-weight:800;
}

h2{
  margin:30px 0 14px;
  font-size:18px;
  font-weight:800;
}

.count{
  text-align:center;
  margin:-12px 0 22px;
  font-size:13px;
  color:#666;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.card{
  min-width:0;
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.image-wrap{
  width:100%;
  aspect-ratio:1 / 1;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.image-wrap.clickable{
  cursor:pointer;
}

.image-wrap img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.image-wrap.unknown{
  cursor:default;
}

.name{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:8px 6px 9px;
  text-align:center;
  font-size:11px;
  font-weight:700;
  line-height:1.35;
  color:#333;
  background:#fff;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.empty{
  grid-column:1 / -1;
  text-align:center;
  padding:25px 10px;
  color:#999;
  font-size:13px;
}

/* =====================================================
   通常画像拡大オーバーレイ
===================================================== */

#collectionImageOverlay{
  position:fixed;
  inset:0;
  z-index:999999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:60px 18px 30px;
  background:rgba(0,0,0,.82);
}

#collectionImageOverlay.show{
  display:flex;
}

#collectionImageOverlay img{
  display:block;
  max-width:100%;
  max-height:85vh;
  width:auto;
  height:auto;
  object-fit:contain;
  border-radius:8px;
}

/* =====================================================
   衣装画像オーバーレイ
===================================================== */

#costumeOverlay{
  position:fixed;
  inset:0;
  z-index:1000000;
  display:none;
  background:#000;
}

#costumeOverlay.show{
  display:block;
}

#costumeOverlay img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}

/* =====================================================
   閉じるボタン
===================================================== */

.overlay-close{
  position:fixed;
  top:12px;
  right:12px;
  z-index:1000002;

  border:1px solid rgba(255,255,255,.65);
  background:rgba(255,255,255,.16);
  color:#fff;

  padding:6px 11px;
  border-radius:6px;

  font-size:12px;
  font-weight:500;

  cursor:pointer;

  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

.overlay-close:active{
  background:rgba(255,255,255,.28);
}

/* =====================================================
   スマホ
===================================================== */

@media(max-width:480px){

  body{
    padding:16px 10px 35px;
  }

  h1{
    font-size:20px;
  }

  h2{
    font-size:17px;
  }

  .grid{
    gap:9px;
  }

  .name{
    font-size:10px;
    min-height:38px;
    padding:7px 4px 8px;
  }

}

</style>
</head>

<body>

<h1>コレクション</h1>

<div id="count" class="count">
  取得数：0 / 0
</div>

<h2>月替わり画像</h2>
<div id="monthlyCollectionGrid" class="grid"></div>

<h2>イベント画像・衣装</h2>
<div id="eventCollectionGrid" class="grid"></div>

<h2>シークレット</h2>
<div id="secretCollectionGrid" class="grid"></div>


<!-- =====================================================
     通常画像拡大
===================================================== -->

<div id="collectionImageOverlay">

  <button
    id="collectionImageClose"
    class="overlay-close"
    type="button"
  >
    閉じる
  </button>

  <img
    id="collectionImageOverlayImg"
    src=""
    alt=""
  >

</div>


<!-- =====================================================
     衣装画像全画面
===================================================== -->

<div id="costumeOverlay">

  <button
    id="costumeClose"
    class="overlay-close"
    type="button"
  >
    閉じる
  </button>

  <img
    id="costumeOverlayImg"
    src=""
    alt=""
  >

</div>


<script type="module">

/* =====================================================
   Firebase
===================================================== */

import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  get
} from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================================
   Firebase設定
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",

  authDomain:
    "seikyo-handbell-club.firebaseapp.com",

  databaseURL:
    "https://seikyo-handbell-club-default-rtdb.firebaseio.com",

  projectId:
    "seikyo-handbell-club",

  storageBucket:
    "seikyo-handbell-club.firebasestorage.app",

  messagingSenderId:
    "55435007971",

  appId:
    "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"

};


/* =====================================================
   Firebase初期化
===================================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/* =====================================================
   月替わり画像
===================================================== */

const monthlyImageFiles = {

  1:"january.jpg.PNG",
  2:"february.jpg.PNG",
  3:"march.jpg.PNG",
  4:"april.jpg.PNG",
  5:"may.jpg.PNG",
  6:"june.jpg.PNG",
  7:"july.jpg.PNG",
  8:"august.jpg.PNG",
  9:"september.jpg.PNG",
  10:"october.jpg.PNG",
  11:"november.jpg.PNG",
  12:"december.jpg.PNG"

};


/* =====================================================
   イベント画像
===================================================== */

const eventImageFiles = {

  "newyear":
    "01-01 newyear.jpg.PNG",

  "setsubun":
    "02-03 setsubun.jpg.PNG",

  "valentine":
    "02-14 valentine.jpg.PNG",

  "hinamatsuri":
    "03-03 hinamatsuri.jpg.PNG",

  "whiteday":
    "03-14 whiteday.jpg.PNG",

  "kodomonohi":
    "05-05 childrensday.jpg.PNG",

  "tanabata":
    "07-07 tanabata.jpg.PNG",

  "tsukimi":
    "09-25 jugoya.jpg.PNG",

  "halloween":
    "10-31 halloween.jpg.PNG",

  "christmaseve":
    "12-24 christmas_eve.jpg.PNG",

  "christmas":
    "12-25 christmas.jpg.PNG",

  "newyearseve":
    "12-31 newyears_eve.jpg.PNG"

};


/* =====================================================
   イベント定義
===================================================== */

const eventDefinitions = [

  {
    key:"newyear",
    name:"お正月",
    date:"01-01"
  },

  {
    key:"setsubun",
    name:"節分",
    date:"02-03"
  },

  {
    key:"valentine",
    name:"バレンタイン",
    date:"02-14"
  },

  {
    key:"hinamatsuri",
    name:"ひな祭り",
    date:"03-03"
  },

  {
    key:"whiteday",
    name:"ホワイトデー",
    date:"03-14"
  },

  {
    key:"kodomonohi",
    name:"こどもの日",
    date:"05-05"
  },

  {
    key:"tanabata",
    name:"七夕",
    date:"07-07"
  },

  {
    key:"tsukimi",
    name:"十五夜",
    date:"09-25"
  },

  {
    key:"halloween",
    name:"ハロウィン",
    date:"10-31"
  },

  {
    key:"christmaseve",
    name:"クリスマスイブ",
    date:"12-24"
  },

  {
    key:"christmas",
    name:"クリスマス",
    date:"12-25"
  },

  {
    key:"newyearseve",
    name:"大晦日",
    date:"12-31"
  }

];


/* =====================================================
   月替わりコレクション
===================================================== */

const monthlyItems =
  Array.from(
    {length:12},
    (_,i)=>({

      id:`monthly_${i+1}`,

      name:`${i+1}月`,

      src:
        `images/monthly/${monthlyImageFiles[i+1]}`,

      type:"normal"

    })
  );


/* =====================================================
   イベントコレクション
===================================================== */

const eventItems = [];


for(const event of eventDefinitions){

  const key = event.key;

  const name = event.name;

  const file = eventImageFiles[key];


  /* ---------------------------------------------------
     イベント画像
  --------------------------------------------------- */

  eventItems.push({

    id:`event_${key}_image`,

    name:name,

    src:
      `images/events/${file}`,

    type:"normal"

  });


  /* ---------------------------------------------------
     衣装ファイル名
  --------------------------------------------------- */

  let costumeFile = key;

  if(key === "christmas"){

    costumeFile = "Christmas";

  }

  if(key === "newyearseve"){

    costumeFile = "winter";

  }


  /* ---------------------------------------------------
     ベルちゃん衣装
  --------------------------------------------------- */

  eventItems.push({

    id:`event_${key}_bell`,

    name:`ベルちゃん・${name}`,

    src:
      `costumes/bell-${costumeFile}.png`,

    type:"costume"

  });


  /* ---------------------------------------------------
     チャイムくん衣装
  --------------------------------------------------- */

  eventItems.push({

    id:`event_${key}_chime`,

    name:`チャイムくん・${name}`,

    src:
      `costumes/chime-${costumeFile}.png`,

    type:"costume"

  });

}


/* =====================================================
   シークレット
===================================================== */

const secretItems = [

  {
    id:"secret_rare_image",

    unknownName:"シークレット画像",

    name:"レア画像（0.15%）",

    src:"images/lucky/rare.PNG.PNG",

    type:"normal"
  },

  {
    id:"secret_ultra_rare_image",

    unknownName:"シークレット画像",

    name:"激レア画像（0.05%）",

    src:"images/lucky/ultra_rare.PNG.PNG",

    type:"normal"
  },

  {
    id:"secret_bell_rare_costume",

    unknownName:"シークレット衣装",

    name:"ベルちゃん・レア衣装（0.25%）",

    src:"costumes/bell-rare.png",

    type:"costume"
  },

  {
    id:"secret_chime_rare_costume",

    unknownName:"シークレット衣装",

    name:"チャイムくん・レア衣装（0.25%）",

    src:"costumes/chime-rare.png",

    type:"costume"
  }

];


/* =====================================================
   全コレクション
===================================================== */

const allItems = [

  ...monthlyItems,

  ...eventItems,

  ...secretItems

];


/* =====================================================
   DOM
===================================================== */

const monthlyGrid =
  document.getElementById(
    "monthlyCollectionGrid"
  );

const eventGrid =
  document.getElementById(
    "eventCollectionGrid"
  );

const secretGrid =
  document.getElementById(
    "secretCollectionGrid"
  );

const countElement =
  document.getElementById("count");


/* =====================================================
   タップ処理
===================================================== */

let lastTouchTime = 0;


function attachTap(element, callback){

  element.addEventListener(
    "touchend",
    function(event){

      event.preventDefault();

      lastTouchTime = Date.now();

      callback(event);

    },
    {
      passive:false
    }
  );


  element.addEventListener(
    "click",
    function(event){

      if(Date.now() - lastTouchTime < 500){

        return;

      }

      callback(event);

    }
  );

}


/* =====================================================
   通常画像を開く
===================================================== */

function openCollectionImage(src){

  const overlay =
    document.getElementById(
      "collectionImageOverlay"
    );

  const image =
    document.getElementById(
      "collectionImageOverlayImg"
    );

  image.src = src;

  overlay.classList.add("show");

  document.body.style.overflow = "hidden";

}


/* =====================================================
   通常画像を閉じる
===================================================== */

function closeCollectionImage(){

  const overlay =
    document.getElementById(
      "collectionImageOverlay"
    );

  const image =
    document.getElementById(
      "collectionImageOverlayImg"
    );

  overlay.classList.remove("show");

  image.src = "";

  document.body.style.overflow = "";

}


/* =====================================================
   衣装画像を開く
===================================================== */

function openCostume(src){

  const overlay =
    document.getElementById(
      "costumeOverlay"
    );

  const image =
    document.getElementById(
      "costumeOverlayImg"
    );

  image.src = src;

  overlay.classList.add("show");

  document.body.style.overflow = "hidden";

}


/* =====================================================
   衣装画像を閉じる
===================================================== */

function closeCostume(){

  const overlay =
    document.getElementById(
      "costumeOverlay"
    );

  const image =
    document.getElementById(
      "costumeOverlayImg"
    );

  overlay.classList.remove("show");

  image.src = "";

  document.body.style.overflow = "";

}


/* =====================================================
   カード描画
===================================================== */

function renderGrid(
  grid,
  items,
  collection
){

  grid.innerHTML = "";


  if(items.length === 0){

    const empty =
      document.createElement("div");

    empty.className = "empty";

    empty.textContent =
      "コレクションはありません。";

    grid.appendChild(empty);

    return;

  }


  for(const item of items){

    const card =
      document.createElement("div");

    card.className = "card";


    /* =================================================
       ★重要
       Firebaseには true ではなく
       { acquiredAt: ... } が保存されるため
       !!collection[item.id] で判定する
    ================================================= */

    const acquired =
      !!collection[item.id];


    const imageWrap =
      document.createElement("div");

    imageWrap.className =
      "image-wrap";


    const image =
      document.createElement("img");


    /* -------------------------------------------------
       取得済み
    ------------------------------------------------- */

    if(acquired){

      image.src = item.src;

      image.alt = item.name;

      imageWrap.classList.add("clickable");


      /* -----------------------------------------------
         通常画像
      ----------------------------------------------- */

      if(item.type === "normal"){

        attachTap(
          imageWrap,
          function(){

            openCollectionImage(item.src);

          }
        );

      }


      /* -----------------------------------------------
         衣装画像
      ----------------------------------------------- */

      if(item.type === "costume"){

        attachTap(
          imageWrap,
          function(){

            openCostume(item.src);

          }
        );

      }

    }


    /* -------------------------------------------------
       未取得
    ------------------------------------------------- */

    else{

      image.src =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="300"
            height="300"
            viewBox="0 0 300 300"
          >

            <rect
              width="300"
              height="300"
              fill="#f5f5f5"
            />

            <text
              x="150"
              y="155"
              text-anchor="middle"
              font-size="32"
              fill="#999"
              font-family="sans-serif"
            >
              ？？？
            </text>

          </svg>

        `);

      image.alt =
        item.unknownName ||
        "？？？";

      imageWrap.classList.add("unknown");

    }


    imageWrap.appendChild(image);


    /* =================================================
       名前
    ================================================= */

    const name =
      document.createElement("div");

    name.className = "name";


    if(acquired){

      name.textContent = item.name;

    }
    else{

      name.textContent =
        item.unknownName ||
        "？？？";

    }


    card.appendChild(imageWrap);

    card.appendChild(name);

    grid.appendChild(card);

  }

}


/* =====================================================
   Firebaseからコレクション取得
===================================================== */

async function loadCollection(user){

  try{

    const collectionRef =
      ref(
        db,
        `members/${user.uid}/collection`
      );


    const snapshot =
      await get(collectionRef);


    const collection =
      snapshot.exists()
        ? snapshot.val()
        : {};


    /* =================================================
       ★重要
       Firebaseの保存形式に合わせて
       !!collection[item.id] を使用
    ================================================= */

    const acquiredCount =
      allItems.filter(
        item => !!collection[item.id]
      ).length;


    countElement.textContent =
      `取得数：${acquiredCount} / ${allItems.length}`;


    renderGrid(
      monthlyGrid,
      monthlyItems,
      collection
    );


    renderGrid(
      eventGrid,
      eventItems,
      collection
    );


    renderGrid(
      secretGrid,
      secretItems,
      collection
    );


  }
  catch(error){

    console.error(
      "コレクション取得エラー:",
      error
    );


    countElement.textContent =
      "コレクションを取得できませんでした。";


    monthlyGrid.innerHTML = "";

    eventGrid.innerHTML = "";

    secretGrid.innerHTML = "";


    const errorText =
      document.createElement("div");

    errorText.className = "empty";

    errorText.textContent =
      "コレクションの読み込みに失敗しました。";


    monthlyGrid.appendChild(errorText);

  }

}


/* =====================================================
   ログイン状態
===================================================== */

onAuthStateChanged(
  auth,
  function(user){

    if(!user){

      countElement.textContent =
        "ログインしてください。";

      monthlyGrid.innerHTML = "";

      eventGrid.innerHTML = "";

      secretGrid.innerHTML = "";


      const message =
        document.createElement("div");

      message.className = "empty";

      message.textContent =
        "コレクションを見るにはログインが必要です。";


      monthlyGrid.appendChild(message);

      return;

    }


    loadCollection(user);

  }
);


/* =====================================================
   閉じるボタン
===================================================== */

attachTap(
  document.getElementById(
    "collectionImageClose"
  ),
  function(){

    closeCollectionImage();

  }
);


attachTap(
  document.getElementById(
    "costumeClose"
  ),
  function(){

    closeCostume();

  }
);


/* =====================================================
   Escキー
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key !== "Escape"){

      return;

    }


    closeCollectionImage();

    closeCostume();

  }
);

</script>

</body>
</html>
