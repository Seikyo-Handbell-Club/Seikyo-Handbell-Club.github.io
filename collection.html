<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>コレクション｜清教学園ハンドベル部</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
  background:#f5f7fb;
  color:#20242a
}
main{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:18px
}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 2px 12px #0000000b
}
h1{
  margin:0 0 4px;
  font-size:22px
}
.subtitle{
  color:#66717e;
  font-size:12px;
  margin-bottom:18px
}
.back-button{
  border:0;
  border-radius:12px;
  padding:10px 13px;
  background:#eef3fb;
  color:#333;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  margin-bottom:14px
}
.section{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid #e7eaf0
}
.section:first-of-type{
  border-top:0;
  padding-top:0
}
.section h2{
  margin:0 0 12px;
  font-size:18px
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px
}
.item{
  min-width:0;
  border:1px solid #e1e6ee;
  border-radius:14px;
  overflow:hidden;
  background:#fff
}
.image-wrap{
  width:100%;
  aspect-ratio:1/1;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}
.image-wrap img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block
}
.image-wrap.clickable{
  cursor:pointer
}
.unknown{
  color:#fff;
  font-size:25px;
  font-weight:800;
  letter-spacing:2px
}
.name{
  padding:8px 6px 9px;
  text-align:center;
  font-size:11px;
  font-weight:700;
  line-height:1.35;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  overflow-wrap:anywhere;
  word-break:break-word
}
.status{
  color:#66717e;
  font-size:12px;
  margin:0 0 14px
}
.error{
  color:#9b1c1c;
  background:#fff0f0;
  border-radius:10px;
  padding:12px;
  display:none
}

/* =====================================================
   通常画像拡大
===================================================== */

#collectionImageOverlay{
  position:fixed;
  inset:0;
  z-index:999999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:55px 16px 20px;
  background:rgba(0,0,0,.82)
}

#collectionImageOverlay.show{
  display:flex
}

#collectionImageOverlay img{
  max-width:100%;
  max-height:88vh;
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
  border-radius:8px
}

/* =====================================================
   衣装画像全画面
===================================================== */

#costumeOverlay{
  position:fixed;
  inset:0;
  z-index:1000000;
  display:none;
  background:#000
}

#costumeOverlay.show{
  display:block
}

#costumeOverlay img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block
}

/* =====================================================
   閉じるボタン
===================================================== */

.overlay-close{
  position:fixed;
  top:12px;
  right:12px;
  z-index:1000002;
  border:1px solid rgba(255,255,255,.65);
  border-radius:6px;
  padding:6px 11px;
  background:rgba(255,255,255,.16);
  color:#fff;
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px)
}

.overlay-close:active{
  background:rgba(255,255,255,.28)
}

@media(max-width:700px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:480px){
  main{padding:12px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<main>
  <div class="card">

    <button
      class="back-button"
      type="button"
      onclick="backToHome()"
    >
      ← 部活動欠席連絡に戻る
    </button>

    <h1>コレクション</h1>

    <div class="subtitle">
      清教学園ハンドベル部
    </div>

    <p id="status" class="status">
      コレクションを読み込んでいます…
    </p>

    <div id="error" class="error"></div>

    <section class="section">
      <h2>月替わり画像</h2>
      <div id="monthlyGrid" class="grid"></div>
    </section>

    <section class="section">
      <h2>イベント画像</h2>
      <div id="eventGrid" class="grid"></div>
    </section>

    <section class="section">
      <h2>シークレット</h2>
      <div id="secretGrid" class="grid"></div>
    </section>

  </div>
</main>


<!-- =====================================================
     通常画像拡大オーバーレイ
===================================================== -->

<div id="collectionImageOverlay">

  <button
    id="collectionImageClose"
    class="overlay-close"
    type="button"
  >
    閉じる
  </button>

  <img
    id="collectionImageOverlayImg"
    src=""
    alt=""
  >

</div>


<!-- =====================================================
     衣装画像オーバーレイ
===================================================== -->

<div id="costumeOverlay">

  <button
    id="costumeClose"
    class="overlay-close"
    type="button"
  >
    閉じる
  </button>

  <img
    id="costumeOverlayImg"
    src=""
    alt=""
  >

</div>


<script type="module">

import{
  initializeApp
}from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import{
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
}from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import{
  getDatabase,
  ref,
  get
}from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =====================================================
   Firebase設定
===================================================== */

const firebaseConfig={

  apiKey:
  "AIzaSyAK9yRsSLSfYpLSyluzwRyI22Zp32KeMSA",

  authDomain:
  "seikyo-handbell-club.firebaseapp.com",

  databaseURL:
  "https://seikyo-handbell-club-default-rtdb.firebaseio.com",

  projectId:
  "seikyo-handbell-club",

  storageBucket:
  "seikyo-handbell-club.firebasestorage.app",

  messagingSenderId:
  "55435007971",

  appId:
  "1:55435007971:web:25f5c3b9dcd4324bc3f2d6"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getDatabase(app);


setPersistence(
  auth,
  browserLocalPersistence
).catch(
  e=>console.error(
    "認証状態の保存設定エラー:",
    e
  )
);


/* =====================================================
   月替わり画像
===================================================== */

const monthlyImageFiles={

  1:"january.jpg.PNG",
  2:"february.jpg.PNG",
  3:"march.jpg.PNG",
  4:"april.jpg.PNG",
  5:"may.jpg.PNG",
  6:"june.jpg.PNG",
  7:"july.jpg.PNG",
  8:"august.jpg.PNG",
  9:"september.jpg.PNG",
  10:"october.jpg.PNG",
  11:"november.jpg.PNG",
  12:"december.jpg.PNG"

};


/* =====================================================
   レアイメージ
===================================================== */

const luckyImageFiles={

  rare:
  "rare.PNG.PNG",

  ultraRare:
  "ultra_rare.PNG.PNG"

};


/* =====================================================
   レア衣装
===================================================== */

const rareCostumeFiles={

  bell:
  "bell-rare.jpg",

  chime:
  "chime-rare.jpg"

};


/* =====================================================
   イベント画像
===================================================== */

const eventImageFiles={

  "01-01":
  "newyear.jpg.PNG",

  "02-03":
  "setsubun.jpg.PNG",

  "02-14":
  "valentine.jpg.PNG",

  "03-03":
  "hinamatsuri.jpg.PNG",

  "03-14":
  "whiteday.jpg.PNG",

  "05-05":
  "childrensday.jpg.PNG",

  "07-07":
  "tanabata.jpg.PNG",

  "09-25":
  "jugoya.jpg.PNG",

  "10-31":
  "halloween.jpg.PNG",

  "12-24":
  "christmas_eve.jpg.PNG",

  "12-25":
  "christmas.jpg.PNG",

  "12-31":
  "newyears_eve.jpg.PNG"

};


/* =====================================================
   十五夜
===================================================== */

const jugoyaDates={

  2026:"09-25",
  2027:"09-15",
  2028:"10-03",
  2029:"09-22",
  2030:"09-12",
  2031:"10-01",
  2032:"09-19",
  2033:"09-08",
  2034:"09-27",
  2035:"09-16",
  2036:"10-04"

};


/* =====================================================
   イベント定義
===================================================== */

const eventDefinitions=[

  ["newyear","お正月","01-01"],

  ["setsubun","節分","02-03"],

  ["valentine","バレンタイン","02-14"],

  ["hinamatsuri","ひな祭り","03-03"],

  ["whiteday","ホワイトデー","03-14"],

  ["kodomonohi","こどもの日","05-05"],

  ["tanabata","七夕","07-07"],

  ["tsukimi","十五夜","09-25"],

  ["halloween","ハロウィン","10-31"],

  ["christmaseve","クリスマスイブ","12-24"],

  ["christmas","クリスマス","12-25"],

  ["newyearseve","大晦日","12-31"]

];


/* =====================================================
   月替わりアイテム
===================================================== */

const monthlyItems=
Array.from(
  {length:12},
  (_,i)=>({

    id:
    `monthly_${i+1}`,

    name:
    `${i+1}月`,

    src:
    `images/monthly/${monthlyImageFiles[i+1]}`,

    type:
    "normal"

  })
);


/* =====================================================
   イベントアイテム
===================================================== */

const eventItems=[];


eventDefinitions.forEach(
  ([key,name,md])=>{

    const file=
    eventImageFiles[md];


    /* -------------------------------------------------
       イベント画像
    ------------------------------------------------- */

    eventItems.push({

      id:
      `event_${key}_image`,

      name:
      `${name}`,

      src:
      `images/events/${file}`,

      type:
      "normal"

    });


    /* -------------------------------------------------
       衣装ファイル名
    ------------------------------------------------- */

    let costume=key;


    if(
      key==="newyearseve"
    ){

      costume="winter";

    }


    if(
      key==="christmas"
    ){

      costume="christmas";

    }


    /* -------------------------------------------------
       ベルちゃん
    ------------------------------------------------- */

    eventItems.push({

      id:
      `event_${key}_bell`,

      name:
      `ベルちゃん・${name}`,

      src:
      `costumes/bell-${costume}.png`,

      type:
      "costume"

    });


    /* -------------------------------------------------
       チャイムくん
    ------------------------------------------------- */

    eventItems.push({

      id:
      `event_${key}_chime`,

      name:
      `チャイムくん・${name}`,

      src:
      `costumes/chime-${costume}.png`,

      type:
      "costume"

    });

  }
);


/* =====================================================
   シークレット
===================================================== */

const secretItems=[

  {
    id:
    "secret_rare_image",

    unknownName:
    "シークレット画像",

    name:
    "レア画像（0.15%）",

    src:
    `images/lucky/${luckyImageFiles.rare}`,

    type:
    "normal"

  },

  {
    id:
    "secret_ultra_rare_image",

    unknownName:
    "シークレット画像",

    name:
    "激レア画像（0.05%）",

    src:
    `images/lucky/${luckyImageFiles.ultraRare}`,

    type:
    "normal"

  },

  {
    id:
    "secret_bell_rare_costume",

    unknownName:
    "シークレット衣装",

    name:
    "ベルちゃん・レア衣装（0.25%）",

    src:
    `costumes/${rareCostumeFiles.bell}`,

    type:
    "costume"

  },

  {
    id:
    "secret_chime_rare_costume",

    unknownName:
    "シークレット衣装",

    name:
    "チャイムくん・レア衣装（0.25%）",

    src:
    `costumes/${rareCostumeFiles.chime}`,

    type:
    "costume"

  }

];


/* =====================================================
   全アイテム
===================================================== */

const allItems=[

  ...monthlyItems,

  ...eventItems,

  ...secretItems

];


/* =====================================================
   DOM取得
===================================================== */

function $(id){

  return document.getElementById(id);

}


/* =====================================================
   通常画像拡大
===================================================== */

function openCollectionImage(src){

  const overlay=
  $("collectionImageOverlay");

  const image=
  $("collectionImageOverlayImg");


  image.src=src;

  overlay.classList.add("show");

  document.body.style.overflow="hidden";

}


function closeCollectionImage(){

  const overlay=
  $("collectionImageOverlay");

  const image=
  $("collectionImageOverlayImg");


  overlay.classList.remove("show");

  image.src="";

  document.body.style.overflow="";

}


/* =====================================================
   衣装画像全画面
===================================================== */

function openCostume(src){

  const overlay=
  $("costumeOverlay");

  const image=
  $("costumeOverlayImg");


  image.src=src;

  overlay.classList.add("show");

  document.body.style.overflow="hidden";

}


function closeCostume(){

  const overlay=
  $("costumeOverlay");

  const image=
  $("costumeOverlayImg");


  overlay.classList.remove("show");

  image.src="";

  document.body.style.overflow="";

}


/* =====================================================
   タップ処理
===================================================== */

let lastTouchTime=0;


function attachTap(
  element,
  callback
){

  element.addEventListener(
    "touchend",
    event=>{

      event.preventDefault();

      lastTouchTime=
      Date.now();

      callback(event);

    },
    {
      passive:false
    }
  );


  element.addEventListener(
    "click",
    event=>{

      if(
        Date.now()-lastTouchTime<500
      ){

        return;

      }

      callback(event);

    }
  );

}


/* =====================================================
   コレクション描画
===================================================== */

function renderGrid(
  elementId,
  items,
  collection
){

  const grid=$(elementId);

  grid.innerHTML="";


  items.forEach(
    item=>{

      /*
       * ★ここが今回の重要修正
       *
       * Firebaseには
       *
       * {
       *   acquiredAt: Date.now()
       * }
       *
       * の形で保存されるため、
       * === true では判定しない。
       */

      const acquired=
      !!collection[item.id];


      const card=
      document.createElement("div");

      card.className="item";


      const imageWrap=
      document.createElement("div");

      imageWrap.className=
      "image-wrap";


      /* =================================================
         取得済み
      ================================================= */

      if(acquired){

        const img=
        document.createElement("img");

        img.src=
        item.src;

        img.alt=
        item.name;

        img.loading=
        "lazy";


        imageWrap.appendChild(img);


        imageWrap.classList.add(
          "clickable"
        );


        /* -----------------------------------------------
           通常画像
        ----------------------------------------------- */

        if(
          item.type==="normal"
        ){

          attachTap(
            imageWrap,
            ()=>{
              openCollectionImage(
                item.src
              );
            }
          );

        }


        /* -----------------------------------------------
           衣装画像
        ----------------------------------------------- */

        if(
          item.type==="costume"
        ){

          attachTap(
            imageWrap,
            ()=>{
              openCostume(
                item.src
              );
            }
          );

        }

      }


      /* =================================================
         未取得
      ================================================= */

      else{

        const unknown=
        document.createElement("div");

        unknown.className=
        "unknown";

        unknown.textContent=
        "？？？";


        imageWrap.appendChild(
          unknown
        );

        /*
         * 未取得の場合は
         * タップイベントを設定しない。
         */

      }


      /* =================================================
         名前
      ================================================= */

      const name=
      document.createElement("div");

      name.className=
      "name";


      name.textContent=
      acquired
        ? item.name
        : (
            item.unknownName ||
            "？？？"
          );


      card.appendChild(
        imageWrap
      );

      card.appendChild(
        name
      );

      grid.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   ホームへ戻る
===================================================== */

function backToHome(){

  location.href=
  "handbell.html";

}


window.backToHome=
backToHome;


/* =====================================================
   ログイン状態
===================================================== */

onAuthStateChanged(
  auth,
  async user=>{

    if(!user){

      $("status").textContent=
      "ログインしてください。";

      setTimeout(
        ()=>{
          location.href=
          "handbell.html";
        },
        900
      );

      return;

    }


    try{

      const snap=
      await get(
        ref(
          db,
          `members/${user.uid}/collection`
        )
      );


      const collection=
      snap.exists() &&
      snap.val() &&
      typeof snap.val()==="object"

        ? snap.val()

        : {};


      /* =================================================
         コレクション表示
      ================================================= */

      renderGrid(
        "monthlyGrid",
        monthlyItems,
        collection
      );


      renderGrid(
        "eventGrid",
        eventItems,
        collection
      );


      renderGrid(
        "secretGrid",
        secretItems,
        collection
      );


      /* =================================================
         ★取得数も同じ判定にする
      ================================================= */

      const total=
      allItems.length;


      const acquired=
      allItems.filter(
        item=>!!collection[item.id]
      ).length;


      $("status").textContent=
      `取得数：${acquired} / ${total}`;

    }


    catch(e){

      console.error(
        "コレクション読み込みエラー:",
        e
      );


      $("error").style.display=
      "block";


      $("error").textContent=
      "コレクションを読み込めませんでした。もう一度開いてみてください。";


      $("status").textContent=
      "";

    }

  }
);


/* =====================================================
   閉じるボタン
===================================================== */

attachTap(
  $("collectionImageClose"),
  ()=>{
    closeCollectionImage();
  }
);


attachTap(
  $("costumeClose"),
  ()=>{
    closeCostume();
  }
);


/* =====================================================
   Escキー
===================================================== */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key!=="Escape"
    ){

      return;

    }


    closeCollectionImage();

    closeCostume();

  }
);

</script>
</body>
</html>
